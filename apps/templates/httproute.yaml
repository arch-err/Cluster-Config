{{- range .Values.apps }}
{{- $name := .name }}
{{- $namespace := default .name .namespace }}
{{- $gatewayEnabled := default true (dig "gateway" "enabled" true .) }}
{{- $gatewayClass := default $.Values.defaults.gateway.class (dig "gateway" "class" "" .) }}
{{- $gatewayHostname := default (printf "%s%s" .name $.Values.defaults.gateway.domainSuffix) (dig "gateway" "hostname" "" .) }}
{{- if $gatewayEnabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
spec:
  parentRefs:
    - name: {{ $gatewayClass }}
      namespace: gateway-system
  hostnames:
    - {{ $gatewayHostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $name }}
          port: 80
{{- end }}
{{- end }}
