{{- range .Values.apps }}
{{- $name := .name }}
{{- $namespace := default .name .namespace }}
{{- $chartName := default .name .chart.name }}
{{- $gatewayEnabled := default true (dig "gateway" "enabled" true .) }}
{{- $gatewayClass := default $.Values.defaults.gateway.class (dig "gateway" "class" "" .) }}
{{- $gatewayHostname := default (printf "%s%s" .name $.Values.defaults.gateway.domainSuffix) (dig "gateway" "hostname" "" .) }}
{{- $tlsSecret := default $.Values.defaults.gateway.tls.secretName (dig "gateway" "tls" "secretName" "" .) }}
{{- $ssoEnabled := default $.Values.defaults.sso.enabled (dig "sso" "enabled" true .) }}
{{- $ssoPolicy := default $.Values.defaults.sso.policy (dig "sso" "policy" "" .) }}
{{- $homepageEnabled := default $.Values.defaults.homepage.enabled (dig "homepage" "enabled" true .) }}
{{- $homepageName := default ($name | title) (dig "homepage" "name" "" .) }}
{{- $homepageGroup := default ($namespace | title) (dig "homepage" "group" "" .) }}
{{- $homepageIcon := default (printf "%s.png" $name) (dig "homepage" "icon" "" .) }}
{{- $valuesPath := dig "chart" "valuesPath" "" . }}
{{- $hasValues := dig "values" true . }}
{{- $hasSecrets := dig "secrets" "enabled" false . }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # Git repo reference for values
    - repoURL: https://github.com/{{ $.Values.sourceRepo }}.git
      targetRevision: {{ $.Values.sourceRepoBranch }}
      ref: repo

    # Helm chart source
    - repoURL: {{ .chart.url }}
      targetRevision: {{ .chart.version }}
      chart: {{ $chartName }}
      helm:
        valueFiles:
          {{- if $hasValues }}
          - $repo/values/{{ $name }}.yaml
          {{- end }}
          {{- if $hasSecrets }}
          - secrets+age-import:///helm-secrets-private-keys/age.agekey?$repo/secrets/{{ $name }}.yaml
          {{- end }}

        valuesObject:
          {{- if $valuesPath }}
          {{ $valuesPath }}:
          {{- end }}
          {{- if and $gatewayEnabled $homepageEnabled }}
            {{- if $valuesPath }}
            ingress:
            {{- else }}
          ingress:
            {{- end }}
              annotations:
                gethomepage.dev/enabled: "true"
                gethomepage.dev/name: {{ $homepageName | quote }}
                gethomepage.dev/group: {{ $homepageGroup | quote }}
                gethomepage.dev/icon: {{ $homepageIcon | quote }}
                {{- if dig "homepage" "description" "" . }}
                gethomepage.dev/description: {{ .homepage.description | quote }}
                {{- end }}
                {{- if dig "homepage" "siteMonitor" "" . }}
                gethomepage.dev/siteMonitor: {{ .homepage.siteMonitor | quote }}
                {{- end }}
          {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    {{- if dig "privileged" false . }}
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
