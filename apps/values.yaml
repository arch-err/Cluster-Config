# Application Catalog
# Single source of truth for all apps

sourceRepo: arch-err/Cluster-Config
sourceRepoBranch: v2

# ══════════════════════════════════════════════════════════════════════════════
# DEFAULTS - Applied to all apps unless overridden
# ══════════════════════════════════════════════════════════════════════════════
defaults:
  gateway:
    class: internal
    domainSuffix: .home
    tls:
      secretName: wildcard-home-tls
  sso:
    enabled: true
    provider: keycloak
    realm: home
    policy: one_factor
  storage:
    class: kadalu.replica2
    accessMode: ReadWriteOnce
  monitoring:
    gatus:
      enabled: true
      interval: 60s
      conditions:
        - "[STATUS] == 200"
  homepage:
    enabled: true

# ══════════════════════════════════════════════════════════════════════════════
# SMART DEFAULTS (applied by template):
#   - namespace: defaults to .name
#   - chart.name: defaults to .name
#   - gateway.hostname: defaults to <name><domainSuffix>
#   - homepage.name: defaults to titlecase of .name
#   - homepage.icon: defaults to <name>.png
#   - homepage.group: defaults to titlecase of .namespace
# ══════════════════════════════════════════════════════════════════════════════

apps: []
