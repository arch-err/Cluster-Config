# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
clusterName: cluster
talosVersion: v1.12.4
kubernetesVersion: v1.34.0
endpoint: https://10.10.10.170:6443

allowSchedulingOnControlPlanes: true

patches:
  # Disable kube-proxy (Cilium replaces it)
  - |-
    cluster:
      proxy:
        disabled: true

  # No CNI - Cilium installed separately
  - |-
    cluster:
      network:
        cni:
          name: none

  # Kubelet certificate rotation
  - |-
    machine:
      kubelet:
        extraArgs:
          rotate-server-certificates: "true"

  # User namespaces for rootless containers. Talos defaults
  # user.max_user_namespaces=0 (rootless container support off); setting >0
  # enables it. 15000 matches Ubuntu's default — plenty for our workloads.
  # Enables OCP-portable rootless-container patterns (no privileged dind,
  # no SYS_ADMIN) should any future workload need them.
  - |-
    machine:
      sysctls:
        user.max_user_namespaces: "15000"

controlPlane:
  patches:
    # Talos VIP for API HA
    - |-
      machine:
        network:
          interfaces:
            - interface: enp1s0
              dhcp: true
              vip:
                ip: 10.10.10.170

    # etcd metrics exposure
    - |-
      cluster:
        etcd:
          extraArgs:
            listen-metrics-urls: http://0.0.0.0:2381
          advertisedSubnets:
            - 10.10.10.0/24

    # Pod Security Standards - restricted
    - |-
      cluster:
        apiServer:
          admissionControl:
            - name: PodSecurity
              configuration:
                apiVersion: pod-security.admission.config.k8s.io/v1alpha1
                kind: PodSecurityConfiguration
                defaults:
                  enforce: "restricted"
                  enforce-version: "latest"
                  audit: "restricted"
                  audit-version: "latest"
                  warn: "restricted"
                  warn-version: "latest"
                exemptions:
                  namespaces:
                    - cilium
                    - kadalu
                    - homeassistant
                    - matrix

    # Controller manager metrics
    - |-
      cluster:
        controllerManager:
          extraArgs:
            bind-address: 0.0.0.0

    # Scheduler metrics
    - |-
      cluster:
        scheduler:
          extraArgs:
            bind-address: 0.0.0.0

nodes:
  - hostname: NODE-1
    ipAddress: 10.10.10.171
    controlPlane: true
    installDisk: /dev/nvme0n1

  - hostname: NODE-2
    ipAddress: 10.10.10.172
    controlPlane: true
    installDisk: /dev/nvme0n1
    patches:
      # Disk B is dedicated to node-local bulk storage. Match its persistent
      # enclosure identity so a changing /dev/sdX name cannot select another disk.
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: bulk
        volumeType: partition
        provisioning:
          diskSelector:
            match: "'/dev/disk/by-id/usb-TOSHIBA_EXTERNAL_USB_20231113009381F-0:0' in disk.symlinks"
          minSize: 3TB
          grow: true
        filesystem:
          type: xfs

  - hostname: NODE-3
    ipAddress: 10.10.10.173
    controlPlane: true
    installDisk: /dev/nvme0n1
