# Infrastructure configuration
sourceRepo: arch-err/Cluster-Config
sourceRepoBranch: v2

# Cluster settings
cluster:
  apiServer: 192.168.1.70
  apiPort: 6443

# Gateway settings
gateway:
  internal:
    ip: 192.168.1.200
    domain: home
    tlsSecret: wildcard-home-tls
  external:
    ip: 192.168.1.201
    domain: yourdomain.com  # Change this
    tlsSecret: external-tls

# Infrastructure components
components:
  # ArgoCD - deployed first, manages everything else
  - name: argocd
    namespace: argocd
    chart:
      url: https://argoproj.github.io/argo-helm
      name: argo-cd
      version: 7.7.x
    values: true

  # Cilium - CNI and Gateway API
  - name: cilium
    namespace: kube-system
    chart:
      url: https://helm.cilium.io
      name: cilium
      version: 1.16.x
    values: true

  # cert-manager - certificate management
  - name: cert-manager
    namespace: cert-manager
    chart:
      url: https://charts.jetstack.io
      name: cert-manager
      version: 1.16.x
    values: true
    # Install CRDs
    extraArgs:
      - --set installCRDs=true

  # Keycloak - SSO (disabled until helm-secrets is configured)
  # - name: keycloak
  #   namespace: keycloak
  #   chart:
  #     url: https://charts.bitnami.com/bitnami
  #     name: keycloak
  #     version: 24.x
  #   values: true
  #   secrets: true

# External services - proxied to Docker host via Traefik (TLS passthrough)
external:
  dockerHost: 192.168.1.60
  passthroughIP: 192.168.1.202  # Separate IP for passthrough gateway
  services:
    - name: homeassistant
      hostname: homeassistant.home
    - name: vault
      hostname: vault.home
    - name: ntfy
      hostname: ntfy.home
    - name: happy-api
      hostname: happy.home
    - name: happy-app
      hostname: app.happy.home
    - name: claude-notify
      hostname: claude-notify.home
