# Certificate Issuers and Wildcard Certificates
# The root CA secret (home-root-ca) is pre-provisioned from SOPS-encrypted secrets/
# This ensures the same CA is used across cluster rebuilds
---
# CA Issuer using the pre-existing root CA secret
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: home-ca
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ca:
    secretName: home-root-ca
---
# Wildcard certificate for *.home
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-home
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.gateway.internal.tlsSecret }}
  duration: 8760h     # 1 year
  renewBefore: 720h   # 30 days
  commonName: "*.{{ .Values.gateway.internal.domain }}"
  dnsNames:
    - "*.{{ .Values.gateway.internal.domain }}"
    - "{{ .Values.gateway.internal.domain }}"
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
