# External Services - Proxy to Docker host via Traefik (TLS Passthrough)
---
apiVersion: v1
kind: Namespace
metadata:
  name: external
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Service pointing to Docker host's Traefik
apiVersion: v1
kind: Service
metadata:
  name: docker-traefik
  namespace: external
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
# EndpointSlice for the Docker host
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: docker-traefik-external
  namespace: external
  labels:
    kubernetes.io/service-name: docker-traefik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
addressType: IPv4
endpoints:
  - addresses:
      - {{ .Values.external.dockerHost }}
ports:
  - name: https
    port: 443
    protocol: TCP
---
# Passthrough Gateway for external services (separate from internal gateway)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: passthrough
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.external.passthroughIP }}
  listeners:
{{- range .Values.external.services }}
    - name: {{ .name }}
      port: 443
      protocol: TLS
      hostname: {{ .hostname }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
---
# TLSRoutes for each external service (passthrough to Traefik)
{{- range .Values.external.services }}
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ .name }}
  namespace: external
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: passthrough
      namespace: gateway-system
      sectionName: {{ .name }}
  hostnames:
    - {{ .hostname }}
  rules:
    - backendRefs:
        - name: docker-traefik
          port: 443
---
{{- end }}
