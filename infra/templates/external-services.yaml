# External Services - Proxy to Docker host via Traefik
---
apiVersion: v1
kind: Namespace
metadata:
  name: external
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Service pointing to Docker host's Traefik
apiVersion: v1
kind: Service
metadata:
  name: docker-traefik
  namespace: external
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
# EndpointSlice for the Docker host (newer API, not excluded by ArgoCD)
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: docker-traefik-external
  namespace: external
  labels:
    kubernetes.io/service-name: docker-traefik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
addressType: IPv4
endpoints:
  - addresses:
      - {{ .Values.external.dockerHost }}
ports:
  - name: https
    port: 443
    protocol: TCP
---
# HTTPRoutes for each external service
{{- range .Values.external.services }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  namespace: external
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: internal
      namespace: gateway-system
  hostnames:
    - "{{ .hostname }}"
  rules:
    - backendRefs:
        - name: docker-traefik
          port: 443
---
{{- end }}
