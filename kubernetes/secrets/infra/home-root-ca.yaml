# Home Root CA - SOPS encrypted
# This SopsSecret creates the home-root-ca Secret in cert-manager namespace
# Used by the ClusterIssuer to sign certificates
#
# To create/update:
#   1. Replace tls.crt and tls.key with actual PEM content
#   2. Encrypt: sops -e -i kubernetes/secrets/infra/home-root-ca.yaml
#
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
  name: home-root-ca
  namespace: cert-manager
spec:
  secretTemplates:
    - name: home-root-ca
      type: kubernetes.io/tls
      stringData:
        tls.crt: |
          -----BEGIN CERTIFICATE-----
          REPLACE_WITH_ROOT_CA_CERTIFICATE
          -----END CERTIFICATE-----
        tls.key: |
          -----BEGIN RSA PRIVATE KEY-----
          REPLACE_WITH_ROOT_CA_PRIVATE_KEY
          -----END RSA PRIVATE KEY-----
