{{- if .Values.extras.genericDevicePlugin }}
{{- $gdp := .Values.extras.genericDevicePlugin }}
---
# squat/generic-device-plugin. Runs in kube-system (system ns — no PSS
# enforcement, so a privileged pod is permitted without labeling a new ns).
# nodeSelector pins it to the one node physically holding the ConBee dongle,
# so only that node advertises devic.es/zigbee and the privileged surface is
# a single pod on a single node. It scans /dev (privileged + hostPath) and
# registers the matched device with the kubelet device-plugin socket.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: generic-device-plugin
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      # Pin to the node with the dongle — only this node has the ConBee, so
      # only this node should run the (privileged) plugin.
      nodeSelector:
        kubernetes.io/hostname: {{ $gdp.node | default "node-1" }}
      tolerations:
        - operator: "Exists"
          effect: "NoExecute"
        - operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: generic-device-plugin
          image: {{ $gdp.image | default "ghcr.io/squat/generic-device-plugin:0.2.0" }}
          args:
            - --device
            - |
              name: zigbee
              groups:
                - paths:
                    - path: {{ $gdp.deviceGlob | default "/dev/serial/by-id/usb-dresden_elektronik_ingenieurtechnik_GmbH_ConBee_II_DE2694940-if00" }}
                      mountPath: {{ $gdp.deviceGlob | default "/dev/serial/by-id/usb-dresden_elektronik_ingenieurtechnik_GmbH_ConBee_II_DE2694940-if00" }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 10Mi
            limits:
              cpu: 50m
              memory: 20Mi
          # Privileged + /dev hostPath: needed to scan the host device tree and
          # hand the char device to the kubelet. This is THE authorized
          # privileged surface — confined to this DaemonSet on node-1 only.
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
{{- end }}
