{{- if .Values.extras.localGitMux }}
{{- $mux := .Values.extras.localGitMux }}
{{- $config := tpl $mux.haproxyConfig . }}
apiVersion: v1
kind: Namespace
metadata:
  name: local-git-mux
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-git-mux
  namespace: local-git-mux
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  haproxy.cfg: |
{{ $config | indent 4 }}
---
# The VIP is intentionally reachable only from the trusted LAN. Public DNS
# continues to point at Cloudflare, while local split DNS points git.3rr.dev
# here so destination port can select the HTTPS or SSH path.
apiVersion: v1
kind: Service
metadata:
  name: local-git-mux
  namespace: local-git-mux
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    lbipam.cilium.io/ips: {{ $mux.ip | quote }}
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  loadBalancerSourceRanges:
{{ toYaml $mux.trustedCIDRs | indent 4 }}
  selector:
    app.kubernetes.io/name: local-git-mux
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: ssh
      port: 22
      targetPort: ssh
      protocol: TCP
---
# This policy is present before the Deployment wave. The Cilium policy below
# adds only the three required egress paths; policy allows are additive.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-git-mux-default-deny
  namespace: local-git-mux
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: local-git-mux
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
{{- range $mux.trustedCIDRs }}
        - ipBlock:
            cidr: {{ . }}
{{- end }}
      ports:
        - port: 8443
          protocol: TCP
        - port: 2222
          protocol: TCP
        - port: 8404
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: local-git-mux-egress
  namespace: local-git-mux
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: local-git-mux
  # With externalTrafficPolicy=Cluster, cross-node LoadBalancer traffic reaches
  # the selected backend with the forwarding node identity. The Service source
  # ranges have already checked the original client before this hop.
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
            - port: "2222"
              protocol: TCP
            - port: "8404"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: forgejo-ssh.forgejo.svc.cluster.local
    - toCIDR:
{{- range $mux.publicResolvers }}
        - {{ .address }}/32
{{- end }}
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: {{ $mux.publicHostname | quote }}
    - toFQDNs:
        - matchName: {{ $mux.publicHostname | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Cilium evaluates the translated endpoint port, not Service port 22.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: forgejo
            k8s:app.kubernetes.io/name: forgejo
      toPorts:
        - ports:
            - port: "2222"
              protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-git-mux
  namespace: local-git-mux
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: local-git-mux
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-git-mux
        app.kubernetes.io/component: local-access
      annotations:
        checksum/config: {{ $config | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: local-git-mux
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: haproxy
          image: haproxy:3.2.23-alpine@sha256:6343ce34a132a5dceaa24767d739df2bd519f8f7c1079ae39e4821334e8eb42e
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8404
            - name: https
              containerPort: 8443
            - name: ssh
              containerPort: 2222
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: local-git-mux
{{- end }}
