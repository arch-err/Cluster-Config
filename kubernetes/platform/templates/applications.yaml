{{- $root := . -}}
{{- range .Values.components }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: {{ .syncWave | default "0" | quote }}
spec:
  project: default
  sources:
    # Values from Git repo
    - repoURL: {{ $root.Values.repoURL }}
      targetRevision: {{ $root.Values.targetRevision }}
      ref: repo
    # Helm chart
    - repoURL: {{ .chart.repo }}
      targetRevision: {{ .chart.version | default "*" | quote }}
      chart: {{ .chart.name }}
      helm:
        valueFiles:
          - $repo/{{ $root.Values.valuesPath }}/{{ .name }}.yaml
        {{- if .extraArgs }}
        parameters:
          {{- range .extraArgs }}
          - name: {{ (split "=" .)._0 }}
            value: {{ (split "=" .)._1 | quote }}
          {{- end }}
        {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .namespace | default .name }}

  # Ignore API-server-defaulted fields on Gateway API resources so children
  # don't perma-OutOfSync when cilium adds defaults (group/kind/weight, etc.).
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /spec
    - group: gateway.networking.k8s.io
      kind: TLSRoute
      jsonPointers:
        - /spec
    - group: gateway.networking.k8s.io
      kind: ReferenceGrant
      jsonPointers:
        - /spec
    # MaxUnavailableStatefulSet is alpha + disabled in talos default feature
    # gates → apiserver silently drops the field, charts that set it (e.g.
    # anza-labs/pocket-id) are perma-OutOfSync. Ignore until the gate goes
    # beta/GA upstream.
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/updateStrategy/rollingUpdate/maxUnavailable
    # Ignore fields owned by k8s server defaulters (kube-controller-manager,
    # kubelet, cilium-operator-generic, etc.) — argocd otherwise flags them
    # as OutOfSync because helm-rendered manifests don't include defaults
    # the apiserver fills in (e.g. StatefulSet volumes:null vs server-set
    # default empty array). Restricts argocd's diff to fields argocd itself
    # owns. Verified 2026-05-07 against pocket-id sts, paperless-ngx-postgresql,
    # immich-server: managers in play are kube-controller-manager,
    # kubelet (pods), cilium-operator-generic (HTTPRoute), kubectl-rollout
    # (post-helm-values restart pattern). Fixes pocket-id phantom OutOfSync
    # after the maxUnavailable fix wasn't enough.
    - group: "*"
      kind: "*"
      managedFieldsManagers:
        - kube-controller-manager
        - kubelet
        - cilium-operator-generic
        - kubectl-rollout

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      # Argo CD cannot scope Application-level prune/delete guards to only
      # Namespace resources. Default generated child apps to confirmation-gated
      # destructive cleanup so critical resources such as Namespaces are never
      # automatically pruned or deleted by an app sync/app deletion.
      - Prune=confirm
      - Delete=confirm
{{- end }}
