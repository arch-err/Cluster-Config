{{/*
Extra resources for infrastructure (gateways, cert-issuers, external services)
Only rendered when extras.* is enabled in values
*/}}

{{- if .Values.extras }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* SOPS SECRETS OPERATOR                                                       */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.sopsSecretsOperator }}
---
# sops-secrets-operator namespace with privileged PodSecurity
apiVersion: v1
kind: Namespace
metadata:
  name: sops-secrets-operator
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* GATEWAY SYSTEM                                                              */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.gateways }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
---
# L2 Announcement Policy
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  interfaces:
    - ^eth[0-9]+
    - ^en[a-z0-9]+
  loadBalancerIPs: true
  externalIPs: true
---
# LoadBalancer IP Pool
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: default-pool
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  blocks:
    - start: {{ .Values.gateway.pool.start }}
      stop: {{ .Values.gateway.pool.stop }}
---
# ReferenceGrant for cert access
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-certs
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway-system
  to:
    - group: ""
      kind: Secret
{{- if .Values.gateway.infra }}
---
# Infra Gateway (*.infra.home) with TLS termination + passthrough for external services
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: infra
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.gateway.infra.ip }}
  listeners:
    # HTTPS listener for TLS termination (wildcard)
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.{{ .Values.gateway.infra.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.infra.tlsSecret }}
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
{{- if .Values.extras.externalServices }}
    # TLS passthrough listeners for external services (SNI-based routing)
{{- range .Values.external.services }}
    - name: passthrough-{{ .name }}
      port: 443
      protocol: TLS
      hostname: {{ .hostname }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.gateway.apps }}
---
# Apps Gateway (*.apps.home) with TLS termination
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: apps
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.gateway.apps.ip }}
  listeners:
    # HTTPS listener for TLS termination (wildcard)
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.{{ .Values.gateway.apps.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.apps.tlsSecret }}
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
    # TLS passthrough listeners (SNI-routed, share port 443 with the terminate listener)
{{- range .Values.gateway.apps.passthroughs }}
    - name: passthrough-{{ .name }}
      port: 443
      protocol: TLS
      hostname: {{ .hostname }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* CERT ISSUERS                                                                */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.certIssuers }}
---
# CA Issuer using pre-existing root CA secret
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: home-ca
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ca:
    secretName: home-root-ca
{{- if .Values.gateway.infra }}
---
# Wildcard certificate for *.infra.home
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-infra-home
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.gateway.infra.tlsSecret }}
  duration: 8760h
  renewBefore: 720h
  commonName: "*.{{ .Values.gateway.infra.domain }}"
  dnsNames:
    - "*.{{ .Values.gateway.infra.domain }}"
    - "{{ .Values.gateway.infra.domain }}"
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
{{- end }}
{{- if .Values.gateway.apps }}
---
# Wildcard certificate for *.apps.home
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-apps-home
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.gateway.apps.tlsSecret }}
  duration: 8760h
  renewBefore: 720h
  commonName: "*.{{ .Values.gateway.apps.domain }}"
  dnsNames:
    - "*.{{ .Values.gateway.apps.domain }}"
    - "{{ .Values.gateway.apps.domain }}"
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* EXTERNAL SERVICES (TLS Passthrough to Docker host)                         */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.externalServices }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: external
---
# Service pointing to Docker host
apiVersion: v1
kind: Service
metadata:
  name: docker-traefik
  namespace: external
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
# EndpointSlice for Docker host
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: docker-traefik-external
  namespace: external
  labels:
    kubernetes.io/service-name: docker-traefik
addressType: IPv4
endpoints:
  - addresses:
      - {{ .Values.external.dockerHost }}
ports:
  - name: https
    port: 443
    protocol: TCP
---
# TLSRoutes for external services (passthrough via infra gateway)
{{- range .Values.external.services }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ .name }}
  namespace: external
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: infra
      namespace: gateway-system
      sectionName: passthrough-{{ .name }}
  hostnames:
    - {{ .hostname }}
  rules:
    - backendRefs:
        - name: docker-traefik
          port: 443
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* AUTHENTIK SSO                                                              */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.authentik }}
---
# Authentik namespace with baseline PSS
apiVersion: v1
kind: Namespace
metadata:
  name: authentik
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "8"
{{- if .Values.extras.authentik.blueprints }}
---
# Authentik blueprints for declarative SSO configuration
# Uses !Env tags to read client_id/secret from environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "9"
data:
  home-assistant.yaml: |
    version: 1
    metadata:
      name: Home Assistant SSO
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # OAuth2 Provider for Home Assistant
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-homeassistant
        identifiers:
          name: homeassistant
        state: present
        attrs:
          name: homeassistant
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          client_type: confidential
          client_id: !Env AUTHENTIK_HA_CLIENT_ID
          client_secret: !Env AUTHENTIK_HA_CLIENT_SECRET
          redirect_uris:
            - url: "https://homeassistant.apps.home/auth/openid/callback"
              matching_mode: strict
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Application for Home Assistant
      - model: authentik_core.application
        id: app-homeassistant
        identifiers:
          slug: homeassistant
        state: present
        attrs:
          name: Home Assistant
          slug: homeassistant
          provider: !KeyOf provider-homeassistant
          policy_engine_mode: any
          meta_launch_url: "https://homeassistant.apps.home"
          meta_icon: "https://homeassistant.apps.home/static/icons/favicon-192x192.png"
  argocd.yaml: |
    version: 1
    metadata:
      name: ArgoCD SSO
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # Admin group for ArgoCD
      - model: authentik_core.group
        id: group-argocd-admins
        identifiers:
          name: ArgoCD Admins
        state: present
        attrs:
          name: ArgoCD Admins
      # OAuth2 Provider for ArgoCD (via Dex)
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-argocd
        identifiers:
          name: argocd
        state: present
        attrs:
          name: argocd
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          client_type: confidential
          client_id: !Env AUTHENTIK_ARGOCD_CLIENT_ID
          client_secret: !Env AUTHENTIK_ARGOCD_CLIENT_SECRET
          redirect_uris:
            - url: "https://argocd.infra.home/api/dex/callback"
              matching_mode: strict
            - url: "http://localhost:8085/auth/callback"
              matching_mode: strict
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Application for ArgoCD
      - model: authentik_core.application
        id: app-argocd
        identifiers:
          slug: argocd
        state: present
        attrs:
          name: ArgoCD
          slug: argocd
          provider: !KeyOf provider-argocd
          policy_engine_mode: any
          meta_launch_url: "https://argocd.infra.home"
          meta_icon: "https://argo-cd.readthedocs.io/en/stable/assets/logo.png"
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* PAPERLESS-NGX (namespace baseline-PSS for paperless image + bitnami subs) */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if index .Values.extras "paperless-ngx" }}
---
# paperless-ngx namespace — baseline PSS. The paperless image's supervisord
# starts as root then drops to the paperless user, and the bundled bitnami
# postgres/redis subcharts have init paths that don't pass restricted PSS.
apiVersion: v1
kind: Namespace
metadata:
  name: paperless-ngx
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* STIRLING-PDF (namespace baseline-PSS for image's root-init entrypoint)     */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if index .Values.extras "stirling-pdf" }}
---
# stirling-pdf namespace — baseline PSS. The image's entrypoint runs as root
# to set up tessdata and /usr/local/bin/diagnostics symlinks before dropping
# to uid 1000 internally; restricted PSS rejects that root-init step.
apiVersion: v1
kind: Namespace
metadata:
  name: stirling-pdf
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* ARR STACK — split-architecture                                              */}}
{{/* `arr` ns (baseline PSS): prowlarr + readarr + future *arr apps              */}}
{{/* `qbittorrent` ns (privileged PSS): qBit+gluetun (NET_ADMIN) + media PVCs    */}}
{{/*                                  + NFS-server bridging volumes into arr ns. */}}
{{/* Cross-ns sharing: qbittorrent ns owns two RWX kadalu PVCs (media-library    */}}
{{/* + media-downloads). A small nfs-server Deployment exports both, and arr     */}}
{{/* ns has matching NFS-backed PVs claimed by readarr — same backing data,     */}}
{{/* hardlinks work within each pod's view (single NFS export per mount).        */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.arr }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: arr
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# qbittorrent namespace — privileged PSS. Required because gluetun adds
# NET_ADMIN (baseline rejects). Explicitly authorized by user; only this ns
# carries privileged in the apps tree. Blast-radius reduction: qBit's WebUI
# is exposed only via the infra gateway (LAN-privileged devices only),
# never via apps gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: qbittorrent
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# media-downloads — qBit drops finished torrents here, readarr (cross-ns via
# NFS) post-processes into media-library. Owned by qbittorrent ns.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-downloads
  namespace: qbittorrent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.extras.arr.downloadsSize | default "200Gi" }}
---
# media-library — canonical media root. Subdirs by category: audiobooks/,
# books/, etc. Future ABS migrates to read from here. Owned by qbittorrent ns.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: qbittorrent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.extras.arr.librarySize | default "1500Gi" }}
---
# nfs-server bridge — mounts both kadalu RWX PVCs and exports them so the
# `arr` namespace (which can't mount them directly across ns) can consume
# the same backing data via NFS PVs. Single replica (Recreate) — one writer
# pod that re-exports the kadalu mounts.
#
# Image runs nfsd in-pod and needs CAP_SYS_ADMIN, hence privileged ns.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: qbittorrent
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      labels:
        app: nfs-server
    spec:
      containers:
        - name: nfs-server
          image: itsthenetwork/nfs-server-alpine:12
          ports:
            - { name: nfs,    containerPort: 2049, protocol: TCP }
            - { name: mountd, containerPort: 32767, protocol: TCP }
            - { name: rpcbind, containerPort: 111, protocol: TCP }
          env:
            # Single export root with both subdirs visible. We bind-mount the
            # PVCs into /exports/{downloads,library} below, then export /exports
            # so a single NFS mount in arr ns sees both as /downloads and
            # /library, preserving same-filesystem hardlinks across them.
            - name: SHARED_DIRECTORY
              value: /exports
          securityContext:
            privileged: true
          volumeMounts:
            - { name: downloads, mountPath: /exports/downloads }
            - { name: library,   mountPath: /exports/library }
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads
        - name: library
          persistentVolumeClaim:
            claimName: media-library
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: qbittorrent
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Fixed ClusterIP — NFS PVs reference this directly because kubelet (which
  # performs the NFS mount on Talos host) does NOT resolve *.svc.cluster.local.
  # Stable IP > DNS for cross-ns NFS PVs. Picked free of the cluster service
  # range (10.96.0.0/12).
  clusterIP: 10.111.111.111
  selector:
    app: nfs-server
  ports:
    - { name: nfs,     port: 2049,  targetPort: 2049,  protocol: TCP }
    - { name: mountd,  port: 32767, targetPort: 32767, protocol: TCP }
    - { name: rpcbind, port: 111,   targetPort: 111,   protocol: TCP }
---
# arr-ns side: static NFS PV + PVC for /downloads. Backed by the nfs-server
# Service in qbittorrent ns. Single export → hardlink-safe within the mount.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: arr-media-downloads
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  capacity:
    storage: {{ .Values.extras.arr.downloadsSize | default "200Gi" }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""   # static, no SC
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=2
  nfs:
    server: 10.111.111.111
    path: /
  # The NFS server exports only /exports root (pseudo-fs); both PVs mount the
  # pseudo-root and the consumer pod uses volumeMounts.subPath to land in
  # the right subdir (library/ or downloads/).
  claimRef:
    name: media-downloads
    namespace: arr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-downloads
  namespace: arr
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ .Values.extras.arr.downloadsSize | default "200Gi" }}
  volumeName: arr-media-downloads
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: arr-media-library
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  capacity:
    storage: {{ .Values.extras.arr.librarySize | default "1500Gi" }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=2
  nfs:
    server: 10.111.111.111
    path: /
  claimRef:
    name: media-library
    namespace: arr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: arr
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ .Values.extras.arr.librarySize | default "1500Gi" }}
  volumeName: arr-media-library
# ──────────────────────────────────────────────────────────────────────────
# Future NetworkPolicy stub (commented) — tighten arr ↔ qbittorrent traffic
# to only what's needed. Today there's no NP enforcement so default-allow
# applies. Uncomment + apply when ready to harden.
#
# ---
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
# metadata:
#   name: allow-arr-to-qbittorrent
