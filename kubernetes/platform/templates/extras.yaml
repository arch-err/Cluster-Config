{{/*     `kadalu.replica2-retain` gives the dynamically-provisioned PV a       */}}
{{/*     Retain reclaim by default (per docs/pvc-reclaim-policy.md).           */}}
{{/* NOTE: Samba's config.yml (carries J's SMB password) is NOT rendered      */}}
{{/* here — it lives as a SopsSecret at kubernetes/secrets/apps/samba-       */}}
{{/* config.yaml so the password stays encrypted. The Samba release mounts   */}}
{{/* that Secret at /data/config.yml.                                         */}}
{{/* History: replaced the filebrowser-quantum + samba combo on 2026-05-28.   */}}
{{/* Quantum dropped entirely; samba now standalone in its own ns + PVC.     */}}
