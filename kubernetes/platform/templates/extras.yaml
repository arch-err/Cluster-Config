{{/*
Extra resources for infrastructure (gateways, cert-issuers, external services)
Only rendered when extras.* is enabled in values
*/}}

{{- if .Values.extras }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* SOPS SECRETS OPERATOR                                                       */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.sopsSecretsOperator }}
---
# sops-secrets-operator namespace with privileged PodSecurity
apiVersion: v1
kind: Namespace
metadata:
  name: sops-secrets-operator
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* GATEWAY SYSTEM                                                              */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.gateways }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
---
# L2 Announcement Policy
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  interfaces:
    - ^eth[0-9]+
    - ^en[a-z0-9]+
  loadBalancerIPs: true
  externalIPs: true
---
# LoadBalancer IP Pool
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: default-pool
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  blocks:
    - start: {{ .Values.gateway.pool.start }}
      stop: {{ .Values.gateway.pool.stop }}
---
# ReferenceGrant for cert access
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-certs
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway-system
  to:
    - group: ""
      kind: Secret
{{- if .Values.gateway.infra }}
---
# Infra Gateway (*.infra.home) with TLS termination + passthrough for external services
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: infra
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.gateway.infra.ip }}
  listeners:
    # HTTPS listener for TLS termination (wildcard)
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.{{ .Values.gateway.infra.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.infra.tlsSecret }}
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
{{- if .Values.extras.externalServices }}
    # TLS passthrough listeners for external services (SNI-based routing)
{{- range .Values.external.services }}
    - name: passthrough-{{ .name }}
      port: 443
      protocol: TLS
      hostname: {{ .hostname }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.gateway.apps }}
---
# Apps Gateway (*.apps.home) with TLS termination
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: apps
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.gateway.apps.ip }}
  listeners:
    # HTTPS listener for TLS termination (wildcard)
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.{{ .Values.gateway.apps.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.apps.tlsSecret }}
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
    # TLS passthrough listeners (SNI-routed, share port 443 with the terminate listener)
{{- range .Values.gateway.apps.passthroughs }}
    - name: passthrough-{{ .name }}
      port: 443
      protocol: TLS
      hostname: {{ .hostname }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* CERT ISSUERS                                                                */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.certIssuers }}
---
# CA Issuer using pre-existing root CA secret
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: home-ca
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ca:
    secretName: home-root-ca
{{- if .Values.gateway.infra }}
---
# Wildcard certificate for *.infra.home
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-infra-home
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.gateway.infra.tlsSecret }}
  duration: 8760h
  renewBefore: 720h
  commonName: "*.{{ .Values.gateway.infra.domain }}"
  dnsNames:
    - "*.{{ .Values.gateway.infra.domain }}"
    - "{{ .Values.gateway.infra.domain }}"
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
{{- end }}
{{- if .Values.gateway.apps }}
---
# Wildcard certificate for *.apps.home
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-apps-home
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.gateway.apps.tlsSecret }}
  duration: 8760h
  renewBefore: 720h
  commonName: "*.{{ .Values.gateway.apps.domain }}"
  dnsNames:
    - "*.{{ .Values.gateway.apps.domain }}"
    - "{{ .Values.gateway.apps.domain }}"
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* TRUST-MANAGER BUNDLE (broadcast home-ca to all namespaces)                  */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/*
  Sources the home-ca root CA (managed by cert-manager via the home-ca
  ClusterIssuer's CA secret `home-root-ca` in cert-manager ns) and renders
  it into a ConfigMap named `home-ca-bundle` (key: `ca.crt`) in every
  namespace. Apps mount this CM to trust home-ca-signed certificates for
  in-cluster HTTPS to *.apps.home / *.infra.home.

  Source uses key `tls.crt` from the cert-manager-managed Secret — that's
  the root CA cert that signs the wildcard gateway certs. The trust-manager
  upstream warning about tls.crt-vs-ca.crt only applies if the secret
  contains an issued leaf cert; here the Secret IS the root CA (selfSigned
  → CA, then wraps as ClusterIssuer.ca.secretName).
*/}}
{{- if .Values.extras.trustManagerBundle }}
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: home-ca-bundle
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sources:
    - secret:
        name: home-root-ca
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector: {}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* EXTERNAL SERVICES (TLS Passthrough to Docker host)                         */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.externalServices }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: external
---
# Service pointing to Docker host
apiVersion: v1
kind: Service
metadata:
  name: docker-traefik
  namespace: external
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
# EndpointSlice for Docker host
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: docker-traefik-external
  namespace: external
  labels:
    kubernetes.io/service-name: docker-traefik
addressType: IPv4
endpoints:
  - addresses:
      - {{ .Values.external.dockerHost }}
ports:
  - name: https
    port: 443
    protocol: TCP
---
# TLSRoutes for external services (passthrough via infra gateway)
{{- range .Values.external.services }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ .name }}
  namespace: external
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: infra
      namespace: gateway-system
      sectionName: passthrough-{{ .name }}
  hostnames:
    - {{ .hostname }}
  rules:
    - backendRefs:
        - name: docker-traefik
          port: 443
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* PAPERLESS-NGX (namespace baseline-PSS for paperless image + bitnami subs) */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if index .Values.extras "paperless-ngx" }}
---
# paperless-ngx namespace — baseline PSS. The paperless image's supervisord
# starts as root then drops to the paperless user, and the bundled bitnami
# postgres/redis subcharts have init paths that don't pass restricted PSS.
apiVersion: v1
kind: Namespace
metadata:
  name: paperless-ngx
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* STIRLING-PDF (namespace baseline-PSS for image's root-init entrypoint)     */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if index .Values.extras "stirling-pdf" }}
---
# stirling-pdf namespace — baseline PSS. The image's entrypoint runs as root
# to set up tessdata and /usr/local/bin/diagnostics symlinks before dropping
# to uid 1000 internally; restricted PSS rejects that root-init step.
apiVersion: v1
kind: Namespace
metadata:
  name: stirling-pdf
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* ARR STACK — split-architecture                                              */}}
{{/* `arr` ns (baseline PSS): prowlarr + readarr + future *arr apps              */}}
{{/* `qbittorrent` ns (privileged PSS): qBit+gluetun (NET_ADMIN, authorized)     */}}
{{/*                                                                              */}}
{{/* Cross-ns sharing: TWO statically-provisioned kadalu CSI PVs per shared      */}}
{{/* volume (one bound in each ns), both pointing at the same kadalu subvol      */}}
{{/* path. Kadalu's CSI driver mounts the subvol in any pod whose PVC binds      */}}
{{/* such a PV — verified at runtime that two PVs sharing one subvol-path mount  */}}
{{/* the same backing data, with full RWX semantics + hardlinks across subdirs.  */}}
{{/* (NFS bridge approach failed — Talos has no in-kernel nfsd module.)          */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.arr }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: arr
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# qbittorrent namespace — privileged PSS. Required because gluetun adds
# NET_ADMIN (baseline rejects). Explicitly authorized by user; only this ns
# carries privileged in the apps tree. Blast-radius reduction: qBit's WebUI
# is exposed only via the infra gateway (LAN-privileged devices only),
# never via apps gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: qbittorrent
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# prowlarr namespace — privileged PSS. Same rationale as qbittorrent: gluetun
# sidecar holds NET_ADMIN to manage the wg interface, which baseline rejects.
# Prowlarr's outbound indexer scrapes leak the user's home IP otherwise (verified
# 85.24.223.140 / Bahnhof SE pre-fix). VPN'd egress + FIREWALL=on killswitch
# means a tunnel failure fails closed (no leak). arr-oauth2-prowlarr lives in
# this ns too so the OIDC-client Secret rendered by the platform chart's
# oidc-bootstrap is reachable in-namespace (and HTTPRoute backendRef stays
# same-ns, no ReferenceGrant needed).
apiVersion: v1
kind: Namespace
metadata:
  name: prowlarr
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- $kadaluCommon := dict "fstype" "xfs" "hostvol" "replica2" "pvtype" "subvol" "single_pv_per_pool" "False" "type" "Replica2" -}}
{{- range $vol := list (dict "name" "media-downloads" "size" (.Values.extras.arr.downloadsSize | default "200Gi") "subvol" "subvol/ar/dl/media-downloads") (dict "name" "media-library" "size" (.Values.extras.arr.librarySize | default "1500Gi") "subvol" "subvol/ar/lb/media-library") }}
{{- range $ns := list "qbittorrent" "arr" }}
---
# {{ $vol.name }} — static kadalu PV claimed in {{ $ns }} ns. Both ns's PVs
# point at the SAME subvol path, giving cross-ns access to the same backing
# data. Hardlinks work within the mount (single subvol = single fs).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $ns }}-{{ $vol.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  capacity:
    storage: {{ $vol.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: kadalu
    volumeHandle: {{ $ns }}-{{ $vol.name }}
    volumeAttributes:
      fstype: xfs
      hostvol: replica2
      path: {{ $vol.subvol }}
      pvtype: subvol
      single_pv_per_pool: "False"
      type: Replica2
  claimRef:
    name: {{ $vol.name }}
    namespace: {{ $ns }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $vol.name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ $vol.size }}
  volumeName: {{ $ns }}-{{ $vol.name }}
{{- end }}
{{- end }}
# ──────────────────────────────────────────────────────────────────────────
# Future NetworkPolicy stub (commented) — tighten arr ↔ qbittorrent traffic
# to only what's needed. Today there's no NP enforcement so default-allow
# applies. Uncomment + apply when ready to harden.
#
# ---
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
# metadata:
#   name: allow-arr-to-qbittorrent
#   namespace: qbittorrent
# spec:
#   podSelector:
#     matchLabels:
#       app.kubernetes.io/name: qbittorrent
#   policyTypes: [Ingress]
#   ingress:
#     - from:
#         - namespaceSelector:
#             matchLabels:
#               kubernetes.io/metadata.name: arr
#       ports:
#         - { protocol: TCP, port: 8080 }
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* AUDIOBOOKSHELF-V2 (parallel green/blue release w/ media-library mount)     */}}
{{/* Renders:                                                                    */}}
{{/*   - audiobookshelf-v2 namespace (default restricted PSS, like the existing  */}}
{{/*     audiobookshelf ns)                                                      */}}
{{/*   - third twin-PV/PVC for `media-library` in audiobookshelf-v2 ns,          */}}
{{/*     pointing at the SAME kadalu subvol path the arr stack uses              */}}
{{/*     (subvol/ar/lb/media-library). RWX semantics + hardlinks intact.         */}}
{{/*   - declarative OIDC seed Job: /init → /login → PATCH /api/auth-settings.   */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if index .Values.extras "audiobookshelf-v2" }}
{{- $absV2 := index .Values.extras "audiobookshelf-v2" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: audiobookshelf-v2
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# media-library — third static kadalu PV/PVC pair pointing at the SAME subvol
# path the arr stack's twin PVs use (extras.arr → subvol/ar/lb/media-library).
# Cross-ns sharing via parallel kadalu PVs on one subvol; verified by extras.arr.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: audiobookshelf-v2-media-library
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  capacity:
    storage: {{ $absV2.librarySize | default "1500Gi" }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: kadalu
    volumeHandle: audiobookshelf-v2-media-library
    volumeAttributes:
      fstype: xfs
      hostvol: replica2
      path: subvol/ar/lb/media-library
      pvtype: subvol
      single_pv_per_pool: "False"
      type: Replica2
  claimRef:
    name: media-library
    namespace: audiobookshelf-v2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: audiobookshelf-v2
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ $absV2.librarySize | default "1500Gi" }}
  volumeName: audiobookshelf-v2-media-library
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* KADALU STORAGE                                                             */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.kadalu }}
---
# Kadalu namespace with privileged PodSecurity (required for storage operations)
apiVersion: v1
kind: Namespace
metadata:
  name: kadalu
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# ClusterRole extension for kadalu-operator to patch StorageClasses
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kadalu-operator-patch
  annotations:
    argocd.argoproj.io/sync-wave: "6"
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kadalu-operator-patch
  annotations:
    argocd.argoproj.io/sync-wave: "6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kadalu-operator-patch
subjects:
  - kind: ServiceAccount
    name: kadalu-operator
    namespace: kadalu
---
# Kadalu Replica2 storage with tiebreaker
# - node-1: /dev/sda (4TB external)
# - node-2: /dev/sda (4TB external)
# - node-3: tiebreaker (thin arbiter)
apiVersion: kadalu-operator.storage/v1alpha1
kind: KadaluStorage
metadata:
  name: replica2
  namespace: kadalu
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  type: Replica2
  storage:
    - node: {{ .Values.kadalu.nodes.primary }}
      device: {{ .Values.kadalu.device }}
    - node: {{ .Values.kadalu.nodes.secondary }}
      device: {{ .Values.kadalu.device }}
  tiebreaker:
    node: {{ .Values.kadalu.nodes.tiebreaker }}
    path: /var/lib/kadalu/tiebreaker
    port: 24007
---
# StorageClass for kadalu.replica2 (set as default)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kadalu.replica2
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    argocd.argoproj.io/sync-wave: "7"
provisioner: kadalu
parameters:
  storage_name: replica2
  single_pv_per_pool: "False"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* MONITORING                                                                 */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.monitoring }}
---
# Monitoring namespace with privileged PodSecurity
# (required for alloy hostPath log scraping + node-exporter hostNetwork/hostPID)
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* HUBBLE BASIC-AUTH PROXY                                                    */}}
{{/* Tiny caddy in front of hubble-ui to keep LAN drive-by attackers out.       */}}
{{/* htpasswd bcrypt hash comes from SopsSecret `hubble-auth` in kube-system.   */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.hubbleAuth }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-auth-caddyfile
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
data:
  Caddyfile: |
    {
      auto_https off
      admin off
    }
    :8080 {
      basicauth * {
        admin {env.BASIC_AUTH_HASH}
      }
      reverse_proxy hubble-ui:80
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubble-auth
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hubble-auth
  template:
    metadata:
      labels:
        app: hubble-auth
    spec:
      containers:
        - name: caddy
          image: caddy:2.8.4-alpine
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BASIC_AUTH_HASH
              valueFrom:
                secretKeyRef:
                  name: hubble-auth
                  key: BASIC_AUTH_HASH
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              # Caddy binary has cap_net_bind_service+ep file caps; dropping
              # ALL trips the loader with "operation not permitted". Keep
              # NET_BIND_SERVICE so the binary can exec; we listen on :8080.
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: caddyfile
          configMap:
            name: hubble-auth-caddyfile
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hubble-auth
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  selector:
    app: hubble-auth
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* IMMICH (namespace + library PVC + postgres + postgres PVC)                 */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.immich }}
---
# Immich namespace — baseline PSS so postgres init container can chown the
# kadalu-mounted PVC. fsGroup alone doesn't suffice on kadalu volumes.
apiVersion: v1
kind: Namespace
metadata:
  name: immich
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Library PVC — main upload store. Chart requires existingClaim.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.extras.immich.librarySize | default "200Gi" }}
---
# Postgres data PVC — vectorchord/pgvector store
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.extras.immich.postgresSize | default "20Gi" }}
---
# Postgres Service
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: immich-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# Postgres Deployment — uses the immich-app vectorchord-tuned image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        # kadalu PVCs initialize as root-owned. Postgres needs uid 999 to own
        # the data dir + the dir mode 0700. fsGroup alone isn't enough.
        - name: chown-pgdata
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/postgresql/data/pgdata
              chown -R 999:999 /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data/pgdata
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-postgres
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* BOOKINFO — namespace + postgres + nginx-tls cert + nginx config             */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/*                                                                             */}}
{{/* Self-hosted readarr metadata mirror (blampe/rreading-glasses).              */}}
{{/* See kubernetes/values/infra/bookinfo.yaml for the full architecture writeup. */}}
{{/*                                                                             */}}
{{/* Renders, in this ns:                                                        */}}
{{/*   - Namespace `bookinfo` (default restricted PSS — image is non-root-clean) */}}
{{/*   - Postgres PVC + Service + Deployment (rreading-glasses cache backend)    */}}
{{/*   - cert-manager Certificate `bookinfo-api-tls` with CN/SAN api.bookinfo.club*/}}
{{/*     issued by ClusterIssuer `home-ca` — rendered into Secret of same name   */}}
{{/*   - ConfigMap `bookinfo-nginx` with the nginx server block that terminates  */}}
{{/*     TLS for api.bookinfo.club and proxies to localhost:8788                 */}}
{{/*                                                                             */}}
{{/* Gated on `.Values.extras.bookinfo` and `.Values.gateway.infra` (only render */}}
{{/* in the infra-side platform render — bookinfo lives on infra.yaml).          */}}
{{- if and .Values.extras.bookinfo .Values.gateway.infra }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: bookinfo
  labels:
    # Baseline PSS — postgres init container chowns /var/lib/postgresql/data
    # as root (kadalu PVCs initialize root-owned, fsGroup alone doesn't suffice).
    # Mirrors the immich-postgres pattern. Pre-authorized per the
    # `feedback_pss_baseline_authorized.md` memory.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Postgres data PVC — rreading-glasses cache; small (~few GB max).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookinfo-postgres
  namespace: bookinfo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.extras.bookinfo.postgresSize | default "5Gi" }}
---
# Postgres Service
apiVersion: v1
kind: Service
metadata:
  name: bookinfo-postgres
  namespace: bookinfo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: bookinfo-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# Postgres Deployment — bog-standard official postgres:17 (matches upstream
# rreading-glasses compose file).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookinfo-postgres
  namespace: bookinfo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bookinfo-postgres
  template:
    metadata:
      labels:
        app: bookinfo-postgres
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        # kadalu PVCs initialize as root-owned. Postgres needs uid 999 to own
        # the data dir + dir mode 0700. fsGroup alone isn't sufficient on
        # kadalu volumes (mirrors the immich-postgres pattern).
        - name: chown-pgdata
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/postgresql/data/pgdata
              chown -R 999:999 /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data/pgdata
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:17
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: bookinfo
            - name: POSTGRES_DB
              value: bookinfo
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookinfo-db
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bookinfo", "-d", "bookinfo"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "bookinfo", "-d", "bookinfo"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bookinfo-postgres
---
# cert-manager Certificate — issued by home-ca ClusterIssuer with SAN
# `api.bookinfo.club` so the nginx-tls sidecar in the bookinfo pod can
# present a valid cert to readarr's hardcoded outbound `https://api.bookinfo.club/`.
# CoreDNS rewrites that hostname to bookinfo-tls.bookinfo.svc.cluster.local
# (see Corefile below). Readarr trusts home-ca via mounted home-ca-bundle.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bookinfo-api-tls
  namespace: bookinfo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: bookinfo-api-tls
  duration: 8760h
  renewBefore: 720h
  commonName: api.bookinfo.club
  dnsNames:
    - api.bookinfo.club
    # Belt-and-suspenders: also valid for the in-cluster service FQDN, in
    # case some future caller uses the canonical svc DNS name directly.
    - bookinfo-tls.bookinfo.svc.cluster.local
    - bookinfo-tls.bookinfo.svc
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
---
# nginx config for the bookinfo-tls sidecar. Listens on :8443 with the
# home-ca-issued cert and proxies to localhost:8788 (rreading-glasses).
# readOnlyRootFilesystem on the sidecar requires emptyDirs at /var/cache/nginx
# and /var/run (provided by the values file's persistence: blocks).
#
# `proxy_set_header Host api.bookinfo.club` overrides the chart-default Host
# header so rreading-glasses (which inspects the inbound Host on some routes)
# sees what readarr would have sent natively.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookinfo-nginx
  namespace: bookinfo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  default.conf: |
    server {
        listen 8443 ssl;
        server_name api.bookinfo.club;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Long timeouts — readarr sometimes does deep author lookups.
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Default body size cap (1m) is too small for some scraped responses.
        client_max_body_size 16m;

        location / {
            proxy_pass http://127.0.0.1:8788;
            proxy_set_header Host              api.bookinfo.club;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* COREDNS — *.apps.home / *.infra.home in-cluster resolution                  */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/*                                                                             */}}
{{/* Talos lays the coredns ConfigMap down at bootstrap and never re-reconciles  */}}
{{/* (the live cm carries no app.kubernetes.io/managed-by label). We take        */}}
{{/* ownership here so the *.apps.home / *.infra.home resolution survives Talos  */}}
{{/* rebuilds and stops drifting via kubectl edit.                               */}}
{{/*                                                                             */}}
{{/* Pattern: CoreDNS `template` plugin matches any <svc>.apps.home / .infra.home*/}}
{{/* and synthesizes an A record pointing at the matching gateway IP. Future     */}}
{{/* hostnames work automatically — no per-app cm edit. The legacy `hosts {}`    */}}
{{/* block is kept as belt-and-suspenders during transition; remove it once the  */}}
{{/* template plugin is verified. See manual/coredns/README.md.                  */}}
{{/*                                                                             */}}
{{/* Gated on `.Values.gateway.infra` so this only renders in the infra-side     */}}
{{/* render of the platform chart (apps.yaml has no gateway.infra).              */}}
{{- if .Values.gateway.infra }}
---
# CoreDNS Corefile — owned by GitOps, not Talos.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    # CoreDNS hot-reloads on cm change (the `reload` plugin); no pod restart needed.
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        # api.bookinfo.club is hardcoded in readarr's binary. The upstream
        # has been dead since ~2024; we self-host blampe/rreading-glasses in
        # the `bookinfo` ns and rewrite the hostname to its in-cluster
        # ClusterIP service. The nginx-tls sidecar there serves a home-ca-
        # issued cert with SAN=api.bookinfo.club, and readarr trusts home-ca
        # via the mounted home-ca-bundle ConfigMap (see values/apps/readarr.yaml).
        #
        # `rewrite name exact` rewrites the question, kubernetes plugin
        # answers it from in-cluster DNS, then by default rewrites the
        # response question back to api.bookinfo.club so the client sees
        # what it asked for.
        rewrite name exact api.bookinfo.club bookinfo-tls.bookinfo.svc.cluster.local

        # Synthesize A records for any *.apps.home host → apps gateway.
        # `fallthrough` lets non-matching queries (AAAA, NS, etc.) continue
        # down the plugin chain so unrelated lookups aren't broken.
        template ANY A apps.home {
            match ^[^.]+\.apps\.home\.$
            answer "{{ "{{ .Name }}" }} 60 IN A {{ .Values.gateway.apps.ip }}"
            fallthrough
        }

        # Same for *.infra.home → infra gateway.
        template ANY A infra.home {
            match ^[^.]+\.infra\.home\.$
            answer "{{ "{{ .Name }}" }} 60 IN A {{ .Values.gateway.infra.ip }}"
            fallthrough
        }

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . 1.1.1.1 8.8.8.8 {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
{{- end }}

{{- end }}
