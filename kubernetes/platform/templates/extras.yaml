# Postgres Deployment — uses the immich-app vectorchord-tuned image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        # kadalu PVCs initialize as root-owned. Postgres needs uid 999 to own
        # the data dir + the dir mode 0700. fsGroup alone isn't enough.
        - name: chown-pgdata
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/postgresql/data/pgdata
              chown -R 999:999 /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data/pgdata
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-postgres
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* COREDNS — *.apps.home / *.infra.home in-cluster resolution                  */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/*                                                                             */}}
{{/* Talos lays the coredns ConfigMap down at bootstrap and never re-reconciles  */}}
{{/* (the live cm carries no app.kubernetes.io/managed-by label). We take        */}}
{{/* ownership here so the *.apps.home / *.infra.home resolution survives Talos  */}}
{{/* rebuilds and stops drifting via kubectl edit.                               */}}
{{/*                                                                             */}}
{{/* Pattern: CoreDNS `template` plugin matches any <svc>.apps.home / .infra.home*/}}
{{/* and synthesizes an A record pointing at the matching gateway IP. Future     */}}
{{/* hostnames work automatically — no per-app cm edit. The legacy `hosts {}`    */}}
{{/* block is kept as belt-and-suspenders during transition; remove it once the  */}}
{{/* template plugin is verified. See manual/coredns/README.md.                  */}}
{{/*                                                                             */}}
{{/* Gated on `.Values.gateway.infra` so this only renders in the infra-side     */}}
{{/* render of the platform chart (apps.yaml has no gateway.infra).              */}}
{{- if .Values.gateway.infra }}
---
# CoreDNS Corefile — owned by GitOps, not Talos.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    # CoreDNS hot-reloads on cm change (the `reload` plugin); no pod restart needed.
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        # Synthesize A records for any *.apps.home host → apps gateway.
        # `fallthrough` lets non-matching queries (AAAA, NS, etc.) continue
        # down the plugin chain so unrelated lookups aren't broken.
        template ANY A apps.home {
            match ^[^.]+\.apps\.home\.$
            answer "{{ "{{ .Name }}" }} 60 IN A {{ .Values.gateway.apps.ip }}"
            fallthrough
        }
        # AAAA: respond NOERROR-empty for *.apps.home so strict resolvers
        # (musl getaddrinfo, JVM InetAddress) don't trip on a NXDOMAIN
        # from the upstream forwarder while the A query succeeds.
        template ANY AAAA apps.home {
            match ^[^.]+\.apps\.home\.$
            rcode NOERROR
        }

        # Same for *.infra.home → infra gateway.
        template ANY A infra.home {
            match ^[^.]+\.infra\.home\.$
            answer "{{ "{{ .Name }}" }} 60 IN A {{ .Values.gateway.infra.ip }}"
            fallthrough
        }
        template ANY AAAA infra.home {
            match ^[^.]+\.infra\.home\.$
            rcode NOERROR
        }

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . 1.1.1.1 8.8.8.8 {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
{{- end }}

{{- end }}
