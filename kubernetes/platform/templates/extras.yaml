{{/*
Extra resources for infrastructure (gateways, cert-issuers, external services)
Only rendered when extras.* is enabled in values
*/}}

{{- if .Values.extras }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* SOPS SECRETS OPERATOR                                                       */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.sopsSecretsOperator }}
---
# sops-secrets-operator namespace with privileged PodSecurity
apiVersion: v1
kind: Namespace
metadata:
  name: sops-secrets-operator
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* GATEWAY SYSTEM                                                              */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.gateways }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
---
# L2 Announcement Policy
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  interfaces:
    - ^eth[0-9]+
    - ^en[a-z0-9]+
  loadBalancerIPs: true
  externalIPs: true
---
# LoadBalancer IP Pool
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: default-pool
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  blocks:
    - start: {{ .Values.gateway.pool.start }}
      stop: {{ .Values.gateway.pool.stop }}
---
# ReferenceGrant for cert access
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-certs
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway-system
  to:
    - group: ""
      kind: Secret
{{- if .Values.gateway.infra }}
---
# Infra Gateway (*.infra.home) with TLS termination + passthrough for external services
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: infra
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.gateway.infra.ip }}
  listeners:
    # HTTPS listener for TLS termination (wildcard)
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.{{ .Values.gateway.infra.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.infra.tlsSecret }}
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
{{- if .Values.extras.externalServices }}
    # TLS passthrough listeners for external services (SNI-based routing)
{{- range .Values.external.services }}
    - name: passthrough-{{ .name }}
      port: 443
      protocol: TLS
      hostname: {{ .hostname }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.gateway.apps }}
---
# Apps Gateway (*.apps.home) with TLS termination
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: apps
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.gateway.apps.ip }}
  listeners:
    # HTTPS listener for TLS termination (wildcard)
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.{{ .Values.gateway.apps.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.apps.tlsSecret }}
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
    # TLS passthrough listeners (SNI-routed, share port 443 with the terminate listener)
{{- range .Values.gateway.apps.passthroughs }}
    - name: passthrough-{{ .name }}
      port: 443
      protocol: TLS
      hostname: {{ .hostname }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* CERT ISSUERS                                                                */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.certIssuers }}
---
# CA Issuer using pre-existing root CA secret
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: home-ca
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ca:
    secretName: home-root-ca
{{- if .Values.gateway.infra }}
---
# Wildcard certificate for *.infra.home
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-infra-home
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.gateway.infra.tlsSecret }}
  duration: 8760h
  renewBefore: 720h
  commonName: "*.{{ .Values.gateway.infra.domain }}"
  dnsNames:
    - "*.{{ .Values.gateway.infra.domain }}"
    - "{{ .Values.gateway.infra.domain }}"
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
{{- end }}
{{- if .Values.gateway.apps }}
---
# Wildcard certificate for *.apps.home
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-apps-home
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.gateway.apps.tlsSecret }}
  duration: 8760h
  renewBefore: 720h
  commonName: "*.{{ .Values.gateway.apps.domain }}"
  dnsNames:
    - "*.{{ .Values.gateway.apps.domain }}"
    - "{{ .Values.gateway.apps.domain }}"
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* TRUST-MANAGER BUNDLE (broadcast home-ca to all namespaces)                  */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/*
  Sources the home-ca root CA (managed by cert-manager via the home-ca
  ClusterIssuer's CA secret `home-root-ca` in cert-manager ns) and renders
  it into a ConfigMap named `home-ca-bundle` (key: `ca.crt`) in every
  namespace. Apps mount this CM to trust home-ca-signed certificates for
  in-cluster HTTPS to *.apps.home / *.infra.home.

  Source uses key `tls.crt` from the cert-manager-managed Secret — that's
  the root CA cert that signs the wildcard gateway certs. The trust-manager
  upstream warning about tls.crt-vs-ca.crt only applies if the secret
  contains an issued leaf cert; here the Secret IS the root CA (selfSigned
  → CA, then wraps as ClusterIssuer.ca.secretName).
*/}}
{{- if .Values.extras.trustManagerBundle }}
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: home-ca-bundle
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sources:
    - secret:
        name: home-root-ca
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector: {}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* EXTERNAL SERVICES (TLS Passthrough to Docker host)                         */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.externalServices }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: external
---
# Service pointing to Docker host
apiVersion: v1
kind: Service
metadata:
  name: docker-traefik
  namespace: external
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
# EndpointSlice for Docker host
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: docker-traefik-external
  namespace: external
  labels:
    kubernetes.io/service-name: docker-traefik
addressType: IPv4
endpoints:
  - addresses:
      - {{ .Values.external.dockerHost }}
ports:
  - name: https
    port: 443
    protocol: TCP
---
# TLSRoutes for external services (passthrough via infra gateway)
{{- range .Values.external.services }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ .name }}
  namespace: external
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: infra
      namespace: gateway-system
      sectionName: passthrough-{{ .name }}
  hostnames:
    - {{ .hostname }}
  rules:
    - backendRefs:
        - name: docker-traefik
          port: 443
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* PAPERLESS-NGX (namespace baseline-PSS for paperless image + bitnami subs) */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if index .Values.extras "paperless-ngx" }}
---
# paperless-ngx namespace — baseline PSS. The paperless image's supervisord
# starts as root then drops to the paperless user, and the bundled bitnami
# postgres/redis subcharts have init paths that don't pass restricted PSS.
apiVersion: v1
kind: Namespace
metadata:
  name: paperless-ngx
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* STIRLING-PDF (namespace baseline-PSS for image's root-init entrypoint)     */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if index .Values.extras "stirling-pdf" }}
---
# stirling-pdf namespace — baseline PSS. The image's entrypoint runs as root
# to set up tessdata and /usr/local/bin/diagnostics symlinks before dropping
# to uid 1000 internally; restricted PSS rejects that root-init step.
apiVersion: v1
kind: Namespace
metadata:
  name: stirling-pdf
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* CALIBRE-WEB (namespace baseline-PSS for linuxserver s6-overlay image)      */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if index .Values.extras "calibre-web" }}
---
# calibre-web namespace — baseline PSS. CWA image is linuxserver-style
# s6-overlay (starts as root, drops to PUID:PGID via s6-applyuidgid which
# needs SETUID/SETGID/CHOWN). Restricted PSS rejects that init flow; same
# trade-off as prowlarr/readarr. oauth2-calibre-web sidecar release lives
# in this same ns so the OIDC-client Secret + HTTPRoute backendRef are
# co-located.
apiVersion: v1
kind: Namespace
metadata:
  name: calibre-web
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* BOOKLORE (namespace + bridged calibre-library PV/PVC + MariaDB)             */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* Renders, in this ns:                                                        */}}
{{/*   - booklore namespace (baseline PSS — booklore image uses su-exec to       */}}
{{/*     drop from root to USER_ID:GROUP_ID; same trade as calibre-web)          */}}
{{/*   - Static kadalu PV `booklore-calibre-library` (RWX, Retain) pointing at   */}}
{{/*     the EXACT same subvol path the calibre-web `calibre-library` PVC binds  */}}
{{/*     to (subvol/bc/1c/pvc-152292a5-bf6b-4235-bb85-04f864b1c7d1). Kadalu      */}}
{{/*     supports multi-PV-per-subvol (see arr media-library twin pattern at     */}}
{{/*     L505-580 of this file, and ABS-v2 twin at L582-647). NO destruction of  */}}
{{/*     calibre-web's existing PVC — this is a parallel bridge.                 */}}
{{/*   - Bound PVC `booklore-calibre-library` in booklore ns.                    */}}
{{/*   - MariaDB PVC + Service + Deployment (booklore's metadata DB — Spring     */}}
{{/*     Boot + Hibernate w/ JDBC, no sqlite fallback). Mirrors the immich-      */}}
{{/*     postgres pattern (chown init container + non-root mariadb runtime).     */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.booklore }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: booklore
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Bridged kadalu PV — points at the same subvol the calibre-web
# `calibre-library` PVC is bound to. Kadalu's static CSI accepts multiple
# PVs per subvol so this co-exists with the dynamically-provisioned PV
# already attached to calibre-web. RWX so the same backing data can be
# read by both apps' pods on any node.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: booklore-calibre-library
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  capacity:
    storage: {{ .Values.extras.booklore.librarySize | default "50Gi" }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: kadalu
    volumeHandle: booklore-calibre-library
    volumeAttributes:
      fstype: xfs
      hostvol: replica2
      path: {{ .Values.extras.booklore.calibreLibrarySubvolPath | default "subvol/bc/1c/pvc-152292a5-bf6b-4235-bb85-04f864b1c7d1" }}
      pvtype: subvol
      single_pv_per_pool: "False"
      type: Replica2
  claimRef:
    name: booklore-calibre-library
    namespace: booklore
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booklore-calibre-library
  namespace: booklore
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ .Values.extras.booklore.librarySize | default "50Gi" }}
  volumeName: booklore-calibre-library
---
# Booklore app-data PVC — booklore's own state (settings, processed files;
# the metadata DB lives in MariaDB below, not here). CRITICAL — Retain SC.
# Pre-rendered here instead of chart-provisioned because bjw-s app-template
# v4.6.2's persistence schema rejects storageClassName at top level.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booklore-data
  namespace: booklore
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: kadalu.replica2-retain
  resources:
    requests:
      storage: {{ .Values.extras.booklore.dataSize | default "2Gi" }}
---
# MariaDB data PVC — booklore's metadata store. CRITICAL-tier (catalog
# state + smart-shelf rules + per-user reading progress). Retain SC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booklore-mariadb
  namespace: booklore
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: kadalu.replica2-retain
  resources:
    requests:
      storage: {{ .Values.extras.booklore.mariadbSize | default "5Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: booklore-mariadb
  namespace: booklore
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: booklore-mariadb
  ports:
    - name: mariadb
      port: 3306
      targetPort: 3306
---
# MariaDB Deployment — mirrors immich-postgres pattern: chown init container
# (kadalu PVCs come root-owned; fsGroup alone isn't enough for mariadb's
# strict dir-mode checks) + non-root mariadb runtime (uid 999 per mariadb
# Dockerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booklore-mariadb
  namespace: booklore
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: booklore-mariadb
  template:
    metadata:
      labels:
        app: booklore-mariadb
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        - name: chown-data
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/mysql
              chown -R 999:999 /var/lib/mysql
              chmod 700 /var/lib/mysql
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      containers:
        - name: mariadb
          image: docker.io/library/mariadb:11.4.5
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: mariadb
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: booklore
            - name: MARIADB_USER
              value: booklore
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: booklore-db
                  key: DB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: booklore-db
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          # First-boot mariadb-install-db on kadalu storage takes ~2-3 min.
          # `healthcheck.sh --connect` requires an unauthenticated `mysql`
          # user, which MariaDB 11.4 no longer creates by default → use a
          # tcpSocket probe (mariadbd binds 3306 only after init finishes).
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: booklore-mariadb
---
# media-library — additional static kadalu PV/PVC pair pointing at the SAME
# subvol path the arr stack / audiobookshelf-v2 / metube / jellyfin /
# navidrome twin PVs use (extras.arr → subvol/ar/lb/media-library). Kadalu
# supports multi-PV-per-subvol; this is just one more sibling. Booklore
# mounts it with subPath=books-j and subPath=books-e (see
# values/apps/booklore.yaml) so per-user ebook folders land under the same
# tree ABS already uses for audiobooks.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: booklore-media-library
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  capacity:
    storage: {{ .Values.extras.booklore.mediaLibrarySize | default "1500Gi" }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: kadalu
    volumeHandle: booklore-media-library
    volumeAttributes:
      fstype: xfs
      hostvol: replica2
      path: subvol/ar/lb/media-library
      pvtype: subvol
      single_pv_per_pool: "False"
      type: Replica2
  claimRef:
    name: booklore-media-library
    namespace: booklore
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booklore-media-library
  namespace: booklore
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ .Values.extras.booklore.mediaLibrarySize | default "1500Gi" }}
  volumeName: booklore-media-library
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* HOME-ASSISTANT (namespace baseline-PSS for HA's s6-overlay /init as root)  */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if index .Values.extras "home-assistant" }}
---
# home-assistant namespace — baseline PSS. Official HA image
# (ghcr.io/home-assistant/home-assistant) uses s6-overlay; /init starts as
# root and supervises the HA python process. Restricted PSS rejects the
# root-init flow. oauth2-home-assistant sidecar release lives in this same
# ns so the OIDC-client Secret + HTTPRoute backendRef are co-located.
#
# When the user later wants USB dongles / hostNetwork (multicast/SSDP), flip
# this to privileged PSS — the labels swap is the trade-acknowledging step
# before the values-file delta lands.
apiVersion: v1
kind: Namespace
metadata:
  name: home-assistant
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* QBITTORRENT (privileged PSS) + shared media kadalu PVs                       */}}
{{/* `qbittorrent` ns (privileged PSS): qBit+gluetun (NET_ADMIN, authorized).     */}}
{{/* The unused *arr stack (prowlarr/readarr/etc.) was removed 2026-05-29; the    */}}
{{/* gating value is still named `extras.arr` for the shared media PV sizing.     */}}
{{/*                                                                              */}}
{{/* Cross-ns sharing: statically-provisioned kadalu CSI PVs for the shared      */}}
{{/* media-downloads / media-library volumes, bound in the qbittorrent ns and    */}}
{{/* (via their own twin PVs) by the media apps, all pointing at the same        */}}
{{/* kadalu subvol path. Kadalu's CSI driver mounts the subvol in any pod whose  */}}
{{/* PVC binds such a PV — verified at runtime that PVs sharing one subvol-path  */}}
{{/* mount the same backing data, with full RWX semantics + hardlinks.           */}}
{{/* (NFS bridge approach failed — Talos has no in-kernel nfsd module.)          */}}
