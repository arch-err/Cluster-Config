{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* HUBBLE BASIC-AUTH PROXY                                                    */}}
{{/* Tiny caddy in front of hubble-ui to keep LAN drive-by attackers out.       */}}
{{/* htpasswd bcrypt hash comes from SopsSecret `hubble-auth` in kube-system.   */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.hubbleAuth }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-auth-caddyfile
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
data:
  Caddyfile: |
    {
      auto_https off
      admin off
    }
    :8080 {
      basicauth * {
        admin {env.BASIC_AUTH_HASH}
      }
      reverse_proxy hubble-ui:80
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubble-auth
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hubble-auth
  template:
    metadata:
      labels:
        app: hubble-auth
    spec:
      containers:
        - name: caddy
          image: caddy:2.8.4-alpine
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BASIC_AUTH_HASH
              valueFrom:
                secretKeyRef:
                  name: hubble-auth
                  key: BASIC_AUTH_HASH
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              # Caddy binary has cap_net_bind_service+ep file caps; dropping
              # ALL trips the loader with "operation not permitted". Keep
              # NET_BIND_SERVICE so the binary can exec; we listen on :8080.
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: caddyfile
          configMap:
            name: hubble-auth-caddyfile
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hubble-auth
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  selector:
    app: hubble-auth
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* IMMICH (namespace + library PVC + postgres + postgres PVC)                 */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.immich }}
---
# Immich namespace — baseline PSS so postgres init container can chown the
# kadalu-mounted PVC. fsGroup alone doesn't suffice on kadalu volumes.
apiVersion: v1
kind: Namespace
metadata:
  name: immich
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Library PVC — main upload store. Chart requires existingClaim.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.extras.immich.librarySize | default "200Gi" }}
---
# Postgres data PVC — vectorchord/pgvector store
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.extras.immich.postgresSize | default "20Gi" }}
---
# Postgres Service
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: immich-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# Postgres Deployment — uses the immich-app vectorchord-tuned image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        # kadalu PVCs initialize as root-owned. Postgres needs uid 999 to own
        # the data dir + the dir mode 0700. fsGroup alone isn't enough.
        - name: chown-pgdata
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/postgresql/data/pgdata
              chown -R 999:999 /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data/pgdata
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-postgres
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* COREDNS — *.apps.home / *.infra.home in-cluster resolution                  */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/*                                                                             */}}
{{/* Talos lays the coredns ConfigMap down at bootstrap and never re-reconciles  */}}
{{/* (the live cm carries no app.kubernetes.io/managed-by label). We take        */}}
{{/* ownership here so the *.apps.home / *.infra.home resolution survives Talos  */}}
{{/* rebuilds and stops drifting via kubectl edit.                               */}}
{{/*                                                                             */}}
{{/* Pattern: CoreDNS `template` plugin matches any <svc>.apps.home / .infra.home*/}}
{{/* and synthesizes an A record pointing at the matching gateway IP. Future     */}}
{{/* hostnames work automatically — no per-app cm edit. The legacy `hosts {}`    */}}
{{/* block is kept as belt-and-suspenders during transition; remove it once the  */}}
{{/* template plugin is verified. See manual/coredns/README.md.                  */}}
{{/*                                                                             */}}
{{/* Gated on `.Values.gateway.infra` so this only renders in the infra-side     */}}
{{/* render of the platform chart (apps.yaml has no gateway.infra).              */}}
{{- if .Values.gateway.infra }}
---
# CoreDNS Corefile — owned by GitOps, not Talos.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    # CoreDNS hot-reloads on cm change (the `reload` plugin); no pod restart needed.
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        # Synthesize A records for any *.apps.home host → apps gateway.
        # `fallthrough` lets non-matching queries (AAAA, NS, etc.) continue
        # down the plugin chain so unrelated lookups aren't broken.
        template ANY A apps.home {
            match ^[^.]+\.apps\.home\.$
            answer "{{ "{{ .Name }}" }} 60 IN A {{ .Values.gateway.apps.ip }}"
            fallthrough
        }

        # Same for *.infra.home → infra gateway.
        template ANY A infra.home {
            match ^[^.]+\.infra\.home\.$
            answer "{{ "{{ .Name }}" }} 60 IN A {{ .Values.gateway.infra.ip }}"
            fallthrough
        }

        # Belt-and-suspenders during transition. Kept identical to the live
        # kubectl-edit drift so cutover is a no-op. Remove post-merge once
        # the template plugins are verified — see manual/coredns/README.md.
        hosts {
            {{ .Values.gateway.apps.ip }} authentik.apps.home homeassistant.apps.home auth.apps.home
            {{ .Values.gateway.infra.ip }} argocd.infra.home hubble.infra.home grafana.infra.home
            fallthrough
        }

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . 1.1.1.1 8.8.8.8 {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
{{- end }}

{{- end }}
