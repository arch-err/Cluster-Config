{{/*
Extra resources for infrastructure (gateways, cert-issuers, external services)
Only rendered when extras.* is enabled in values
*/}}

{{- if .Values.extras }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* SOPS SECRETS OPERATOR                                                       */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.sopsSecretsOperator }}
---
# sops-secrets-operator namespace with privileged PodSecurity
apiVersion: v1
kind: Namespace
metadata:
  name: sops-secrets-operator
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* GATEWAY SYSTEM                                                              */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.gateways }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
---
# L2 Announcement Policy
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  interfaces:
    - ^eth[0-9]+
    - ^en[a-z0-9]+
  loadBalancerIPs: true
  externalIPs: true
---
# LoadBalancer IP Pool
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: default-pool
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  blocks:
    - start: {{ .Values.gateway.pool.start }}
      stop: {{ .Values.gateway.pool.stop }}
---
# ReferenceGrant for cert access
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-certs
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway-system
  to:
    - group: ""
      kind: Secret
{{- if .Values.gateway.infra }}
---
# Infra Gateway (*.infra.home) with TLS termination + passthrough for external services
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: infra
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.gateway.infra.ip }}
  listeners:
    # HTTPS listener for TLS termination (wildcard)
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.{{ .Values.gateway.infra.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.infra.tlsSecret }}
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
{{- if .Values.extras.externalServices }}
    # TLS passthrough listeners for external services (SNI-based routing)
{{- range .Values.external.services }}
    - name: passthrough-{{ .name }}
      port: 443
      protocol: TLS
      hostname: {{ .hostname }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.gateway.apps }}
---
# Apps Gateway (*.apps.home) with TLS termination
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: apps
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.gateway.apps.ip }}
  listeners:
    # HTTPS listener for TLS termination (wildcard)
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.{{ .Values.gateway.apps.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.apps.tlsSecret }}
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
    # TLS passthrough listeners (SNI-routed, share port 443 with the terminate listener)
{{- range .Values.gateway.apps.passthroughs }}
    - name: passthrough-{{ .name }}
      port: 443
      protocol: TLS
      hostname: {{ .hostname }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* CERT ISSUERS                                                                */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.certIssuers }}
---
# CA Issuer using pre-existing root CA secret
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: home-ca
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ca:
    secretName: home-root-ca
{{- if .Values.gateway.infra }}
---
# Wildcard certificate for *.infra.home
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-infra-home
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.gateway.infra.tlsSecret }}
  duration: 8760h
  renewBefore: 720h
  commonName: "*.{{ .Values.gateway.infra.domain }}"
  dnsNames:
    - "*.{{ .Values.gateway.infra.domain }}"
    - "{{ .Values.gateway.infra.domain }}"
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
{{- end }}
{{- if .Values.gateway.apps }}
---
# Wildcard certificate for *.apps.home
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-apps-home
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.gateway.apps.tlsSecret }}
  duration: 8760h
  renewBefore: 720h
  commonName: "*.{{ .Values.gateway.apps.domain }}"
  dnsNames:
    - "*.{{ .Values.gateway.apps.domain }}"
    - "{{ .Values.gateway.apps.domain }}"
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* EXTERNAL SERVICES (TLS Passthrough to Docker host)                         */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.externalServices }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: external
---
# Service pointing to Docker host
apiVersion: v1
kind: Service
metadata:
  name: docker-traefik
  namespace: external
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
# EndpointSlice for Docker host
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: docker-traefik-external
  namespace: external
  labels:
    kubernetes.io/service-name: docker-traefik
addressType: IPv4
endpoints:
  - addresses:
      - {{ .Values.external.dockerHost }}
ports:
  - name: https
    port: 443
    protocol: TCP
---
# TLSRoutes for external services (passthrough via infra gateway)
{{- range .Values.external.services }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ .name }}
  namespace: external
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: infra
      namespace: gateway-system
      sectionName: passthrough-{{ .name }}
  hostnames:
    - {{ .hostname }}
  rules:
    - backendRefs:
        - name: docker-traefik
          port: 443
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* AUTHENTIK SSO                                                              */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.authentik }}
---
# Authentik namespace with baseline PSS
apiVersion: v1
kind: Namespace
metadata:
  name: authentik
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "8"
---
# Authentik blueprints for declarative SSO configuration
# Uses !Env tags to read client_id/secret from environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "9"
data:
  home-assistant.yaml: |
    version: 1
    metadata:
      name: Home Assistant SSO
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # OAuth2 Provider for Home Assistant
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-homeassistant
        identifiers:
          name: homeassistant
        state: present
        attrs:
          name: homeassistant
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          client_type: confidential
          client_id: !Env AUTHENTIK_HA_CLIENT_ID
          client_secret: !Env AUTHENTIK_HA_CLIENT_SECRET
          redirect_uris:
            - url: "https://homeassistant.apps.home/auth/openid/callback"
              matching_mode: strict
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Application for Home Assistant
      - model: authentik_core.application
        id: app-homeassistant
        identifiers:
          slug: homeassistant
        state: present
        attrs:
          name: Home Assistant
          slug: homeassistant
          provider: !KeyOf provider-homeassistant
          policy_engine_mode: any
          meta_launch_url: "https://homeassistant.apps.home"
          meta_icon: "https://homeassistant.apps.home/static/icons/favicon-192x192.png"
  argocd.yaml: |
    version: 1
    metadata:
      name: ArgoCD SSO
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # Admin group for ArgoCD
      - model: authentik_core.group
        id: group-argocd-admins
        identifiers:
          name: ArgoCD Admins
        state: present
        attrs:
          name: ArgoCD Admins
      # OAuth2 Provider for ArgoCD (via Dex)
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-argocd
        identifiers:
          name: argocd
        state: present
        attrs:
          name: argocd
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          client_type: confidential
          client_id: !Env AUTHENTIK_ARGOCD_CLIENT_ID
          client_secret: !Env AUTHENTIK_ARGOCD_CLIENT_SECRET
          redirect_uris:
            - url: "https://argocd.infra.home/api/dex/callback"
              matching_mode: strict
            - url: "http://localhost:8085/auth/callback"
              matching_mode: strict
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Application for ArgoCD
      - model: authentik_core.application
        id: app-argocd
        identifiers:
          slug: argocd
        state: present
        attrs:
          name: ArgoCD
          slug: argocd
          provider: !KeyOf provider-argocd
          policy_engine_mode: any
          meta_launch_url: "https://argocd.infra.home"
          meta_icon: "https://argo-cd.readthedocs.io/en/stable/assets/logo.png"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* KADALU STORAGE                                                             */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.kadalu }}
---
# Kadalu namespace with privileged PodSecurity (required for storage operations)
apiVersion: v1
kind: Namespace
metadata:
  name: kadalu
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# ClusterRole extension for kadalu-operator to patch StorageClasses
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kadalu-operator-patch
  annotations:
    argocd.argoproj.io/sync-wave: "6"
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kadalu-operator-patch
  annotations:
    argocd.argoproj.io/sync-wave: "6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kadalu-operator-patch
subjects:
  - kind: ServiceAccount
    name: kadalu-operator
    namespace: kadalu
---
# Kadalu Replica2 storage with tiebreaker
# - node-1: /dev/sda (4TB external)
# - node-2: /dev/sda (4TB external)
# - node-3: tiebreaker (thin arbiter)
apiVersion: kadalu-operator.storage/v1alpha1
kind: KadaluStorage
metadata:
  name: replica2
  namespace: kadalu
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  type: Replica2
  storage:
    - node: {{ .Values.kadalu.nodes.primary }}
      device: {{ .Values.kadalu.device }}
    - node: {{ .Values.kadalu.nodes.secondary }}
      device: {{ .Values.kadalu.device }}
  tiebreaker:
    node: {{ .Values.kadalu.nodes.tiebreaker }}
    path: /var/lib/kadalu/tiebreaker
    port: 24007
---
# StorageClass for kadalu.replica2 (set as default)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kadalu.replica2
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    argocd.argoproj.io/sync-wave: "7"
provisioner: kadalu
parameters:
  storage_name: replica2
  single_pv_per_pool: "False"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
{{- end }}

