#     matchLabels:
#       app.kubernetes.io/name: qbittorrent
#   policyTypes: [Ingress]
#   ingress:
#     - from:
#         - namespaceSelector:
#             matchLabels:
#               kubernetes.io/metadata.name: arr
#       ports:
#         - { protocol: TCP, port: 8080 }
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* KADALU STORAGE                                                             */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.kadalu }}
---
# Kadalu namespace with privileged PodSecurity (required for storage operations)
apiVersion: v1
kind: Namespace
metadata:
  name: kadalu
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# ClusterRole extension for kadalu-operator to patch StorageClasses
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kadalu-operator-patch
  annotations:
    argocd.argoproj.io/sync-wave: "6"
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kadalu-operator-patch
  annotations:
    argocd.argoproj.io/sync-wave: "6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kadalu-operator-patch
subjects:
  - kind: ServiceAccount
    name: kadalu-operator
    namespace: kadalu
---
# Kadalu Replica2 storage with tiebreaker
# - node-1: /dev/sda (4TB external)
# - node-2: /dev/sda (4TB external)
# - node-3: tiebreaker (thin arbiter)
apiVersion: kadalu-operator.storage/v1alpha1
kind: KadaluStorage
metadata:
  name: replica2
  namespace: kadalu
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  type: Replica2
  storage:
    - node: {{ .Values.kadalu.nodes.primary }}
      device: {{ .Values.kadalu.device }}
    - node: {{ .Values.kadalu.nodes.secondary }}
      device: {{ .Values.kadalu.device }}
  tiebreaker:
    node: {{ .Values.kadalu.nodes.tiebreaker }}
    path: /var/lib/kadalu/tiebreaker
    port: 24007
---
# StorageClass for kadalu.replica2 (set as default)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kadalu.replica2
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    argocd.argoproj.io/sync-wave: "7"
provisioner: kadalu
parameters:
  storage_name: replica2
  single_pv_per_pool: "False"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* MONITORING                                                                 */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.monitoring }}
---
# Monitoring namespace with privileged PodSecurity
# (required for alloy hostPath log scraping + node-exporter hostNetwork/hostPID)
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* HUBBLE BASIC-AUTH PROXY                                                    */}}
{{/* Tiny caddy in front of hubble-ui to keep LAN drive-by attackers out.       */}}
{{/* htpasswd bcrypt hash comes from SopsSecret `hubble-auth` in kube-system.   */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.hubbleAuth }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-auth-caddyfile
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
data:
  Caddyfile: |
    {
      auto_https off
      admin off
    }
    :8080 {
      basicauth * {
        admin {env.BASIC_AUTH_HASH}
      }
      reverse_proxy hubble-ui:80
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubble-auth
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hubble-auth
  template:
    metadata:
      labels:
        app: hubble-auth
    spec:
      containers:
        - name: caddy
          image: caddy:2.8.4-alpine
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BASIC_AUTH_HASH
              valueFrom:
                secretKeyRef:
                  name: hubble-auth
                  key: BASIC_AUTH_HASH
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              # Caddy binary has cap_net_bind_service+ep file caps; dropping
              # ALL trips the loader with "operation not permitted". Keep
              # NET_BIND_SERVICE so the binary can exec; we listen on :8080.
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: caddyfile
          configMap:
            name: hubble-auth-caddyfile
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hubble-auth
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  selector:
    app: hubble-auth
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* IMMICH (namespace + library PVC + postgres + postgres PVC)                 */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.immich }}
---
# Immich namespace — baseline PSS so postgres init container can chown the
# kadalu-mounted PVC. fsGroup alone doesn't suffice on kadalu volumes.
apiVersion: v1
kind: Namespace
metadata:
  name: immich
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Library PVC — main upload store. Chart requires existingClaim.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.extras.immich.librarySize | default "200Gi" }}
---
# Postgres data PVC — vectorchord/pgvector store
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.extras.immich.postgresSize | default "20Gi" }}
---
# Postgres Service
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: immich-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# Postgres Deployment — uses the immich-app vectorchord-tuned image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        # kadalu PVCs initialize as root-owned. Postgres needs uid 999 to own
        # the data dir + the dir mode 0700. fsGroup alone isn't enough.
        - name: chown-pgdata
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/postgresql/data/pgdata
              chown -R 999:999 /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data/pgdata
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-postgres
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
{{- end }}

{{- end }}
