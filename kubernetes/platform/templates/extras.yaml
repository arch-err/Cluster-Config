{{/*
Extra resources for infrastructure (gateways, cert-issuers, external services)
Only rendered when extras.* is enabled in values
*/}}

{{- if .Values.extras }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* SOPS SECRETS OPERATOR                                                       */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.sopsSecretsOperator }}
---
# sops-secrets-operator namespace with privileged PodSecurity
apiVersion: v1
kind: Namespace
metadata:
  name: sops-secrets-operator
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* GATEWAY SYSTEM                                                              */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.gateways }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
---
# L2 Announcement Policy
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  interfaces:
    - ^eth[0-9]+
    - ^en[a-z0-9]+
  loadBalancerIPs: true
  externalIPs: true
---
# LoadBalancer IP Pool
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: default-pool
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  blocks:
    - start: {{ .Values.gateway.pool.start }}
      stop: {{ .Values.gateway.pool.stop }}
---
# ReferenceGrant for cert access
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-certs
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway-system
  to:
    - group: ""
      kind: Secret
---
# Internal Gateway (*.home) with TLS termination + passthrough for external services
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.gateway.internal.ip }}
  listeners:
    # HTTPS listener for TLS termination (wildcard)
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.{{ .Values.gateway.internal.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.internal.tlsSecret }}
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
{{- if .Values.extras.externalServices }}
    # TLS passthrough listeners for external services (SNI-based routing)
{{- range .Values.external.services }}
    - name: passthrough-{{ .name }}
      port: 443
      protocol: TLS
      hostname: {{ .hostname }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* CERT ISSUERS                                                                */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.certIssuers }}
---
# CA Issuer using pre-existing root CA secret
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: home-ca
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ca:
    secretName: home-root-ca
---
# Wildcard certificate for *.home
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-home
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.gateway.internal.tlsSecret }}
  duration: 8760h
  renewBefore: 720h
  commonName: "*.{{ .Values.gateway.internal.domain }}"
  dnsNames:
    - "*.{{ .Values.gateway.internal.domain }}"
    - "{{ .Values.gateway.internal.domain }}"
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* EXTERNAL SERVICES (TLS Passthrough to Docker host)                         */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.externalServices }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: external
---
# Service pointing to Docker host
apiVersion: v1
kind: Service
metadata:
  name: docker-traefik
  namespace: external
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
# EndpointSlice for Docker host
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: docker-traefik-external
  namespace: external
  labels:
    kubernetes.io/service-name: docker-traefik
addressType: IPv4
endpoints:
  - addresses:
      - {{ .Values.external.dockerHost }}
ports:
  - name: https
    port: 443
    protocol: TCP
---
# TLSRoutes for external services (passthrough via internal gateway)
{{- range .Values.external.services }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ .name }}
  namespace: external
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: internal
      namespace: gateway-system
      sectionName: passthrough-{{ .name }}
  hostnames:
    - {{ .hostname }}
  rules:
    - backendRefs:
        - name: docker-traefik
          port: 443
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* KADALU STORAGE                                                             */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.kadalu }}
---
# Kadalu namespace with privileged PodSecurity (required for storage operations)
apiVersion: v1
kind: Namespace
metadata:
  name: kadalu
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Kadalu Replica2 storage with tiebreaker
# - node-1: /dev/sda (4TB external)
# - node-2: /dev/sda (4TB external)
# - node-3: tiebreaker (thin arbiter)
apiVersion: kadalu-operator.storage/v1alpha1
kind: KadaluStorage
metadata:
  name: replica2
  namespace: kadalu
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  type: Replica2
  storage:
    - node: {{ .Values.kadalu.nodes.primary }}
      device: {{ .Values.kadalu.device }}
    - node: {{ .Values.kadalu.nodes.secondary }}
      device: {{ .Values.kadalu.device }}
  tiebreaker:
    node: {{ .Values.kadalu.nodes.tiebreaker }}
    path: /var/lib/kadalu/tiebreaker
    port: 24007
---
# StorageClass for kadalu.replica2 (set as default)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kadalu.replica2
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    argocd.argoproj.io/sync-wave: "7"
provisioner: kadalu
parameters:
  storage_name: replica2
  single_pv_per_pool: "False"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
{{- end }}

{{- end }}
