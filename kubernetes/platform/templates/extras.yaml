{{/*
Extra resources for infrastructure (gateways, cert-issuers, external services)
Only rendered when extras.* is enabled in values
*/}}

{{- if .Values.extras }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* SOPS SECRETS OPERATOR                                                       */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.sopsSecretsOperator }}
---
# sops-secrets-operator namespace with privileged PodSecurity
apiVersion: v1
kind: Namespace
metadata:
  name: sops-secrets-operator
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* GATEWAY SYSTEM                                                              */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.gateways }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
---
# L2 Announcement Policy
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  interfaces:
    - ^eth[0-9]+
    - ^en[a-z0-9]+
  loadBalancerIPs: true
  externalIPs: true
---
# LoadBalancer IP Pool
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: default-pool
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  blocks:
    - start: {{ .Values.gateway.pool.start }}
      stop: {{ .Values.gateway.pool.stop }}
---
# ReferenceGrant for cert access
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-certs
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway-system
  to:
    - group: ""
      kind: Secret
{{- if .Values.gateway.infra }}
---
# Infra Gateway (*.infra.home) with TLS termination + passthrough for external services
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: infra
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.gateway.infra.ip }}
  listeners:
    # HTTPS listener for TLS termination (wildcard)
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.{{ .Values.gateway.infra.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.infra.tlsSecret }}
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
{{- if .Values.extras.externalServices }}
    # TLS passthrough listeners for external services (SNI-based routing)
{{- range .Values.external.services }}
    - name: passthrough-{{ .name }}
      port: 443
      protocol: TLS
      hostname: {{ .hostname }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.gateway.apps }}
---
# Apps Gateway (*.apps.home) with TLS termination
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: apps
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.gateway.apps.ip }}
  listeners:
    # HTTPS listener for TLS termination (wildcard)
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.{{ .Values.gateway.apps.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.apps.tlsSecret }}
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
    # TLS passthrough listeners (SNI-routed, share port 443 with the terminate listener)
{{- range .Values.gateway.apps.passthroughs }}
    - name: passthrough-{{ .name }}
      port: 443
      protocol: TLS
      hostname: {{ .hostname }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* CERT ISSUERS                                                                */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.certIssuers }}
---
# CA Issuer using pre-existing root CA secret
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: home-ca
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ca:
    secretName: home-root-ca
{{- if .Values.gateway.infra }}
---
# Wildcard certificate for *.infra.home
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-infra-home
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.gateway.infra.tlsSecret }}
  duration: 8760h
  renewBefore: 720h
  commonName: "*.{{ .Values.gateway.infra.domain }}"
  dnsNames:
    - "*.{{ .Values.gateway.infra.domain }}"
    - "{{ .Values.gateway.infra.domain }}"
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
{{- end }}
{{- if .Values.gateway.apps }}
---
# Wildcard certificate for *.apps.home
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-apps-home
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.gateway.apps.tlsSecret }}
  duration: 8760h
  renewBefore: 720h
  commonName: "*.{{ .Values.gateway.apps.domain }}"
  dnsNames:
    - "*.{{ .Values.gateway.apps.domain }}"
    - "{{ .Values.gateway.apps.domain }}"
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* TRUST-MANAGER BUNDLE (broadcast home-ca to all namespaces)                  */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/*
  Sources the home-ca root CA (managed by cert-manager via the home-ca
  ClusterIssuer's CA secret `home-root-ca` in cert-manager ns) and renders
  it into a ConfigMap named `home-ca-bundle` (key: `ca.crt`) in every
  namespace. Apps mount this CM to trust home-ca-signed certificates for
  in-cluster HTTPS to *.apps.home / *.infra.home.

  Source uses key `tls.crt` from the cert-manager-managed Secret — that's
  the root CA cert that signs the wildcard gateway certs. The trust-manager
  upstream warning about tls.crt-vs-ca.crt only applies if the secret
  contains an issued leaf cert; here the Secret IS the root CA (selfSigned
  → CA, then wraps as ClusterIssuer.ca.secretName).
*/}}
{{- if .Values.extras.trustManagerBundle }}
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: home-ca-bundle
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sources:
    - secret:
        name: home-root-ca
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector: {}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* EXTERNAL SERVICES (TLS Passthrough to Docker host)                         */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.externalServices }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: external
---
# Service pointing to Docker host
apiVersion: v1
kind: Service
metadata:
  name: docker-traefik
  namespace: external
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
# EndpointSlice for Docker host
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: docker-traefik-external
  namespace: external
  labels:
    kubernetes.io/service-name: docker-traefik
addressType: IPv4
endpoints:
  - addresses:
      - {{ .Values.external.dockerHost }}
ports:
  - name: https
    port: 443
    protocol: TCP
---
# TLSRoutes for external services (passthrough via infra gateway)
{{- range .Values.external.services }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ .name }}
  namespace: external
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: infra
      namespace: gateway-system
      sectionName: passthrough-{{ .name }}
  hostnames:
    - {{ .hostname }}
  rules:
    - backendRefs:
        - name: docker-traefik
          port: 443
{{- end }}
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* PAPERLESS-NGX (namespace baseline-PSS for paperless image + bitnami subs) */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if index .Values.extras "paperless-ngx" }}
---
# paperless-ngx namespace — baseline PSS. The paperless image's supervisord
# starts as root then drops to the paperless user, and the bundled bitnami
# postgres/redis subcharts have init paths that don't pass restricted PSS.
apiVersion: v1
kind: Namespace
metadata:
  name: paperless-ngx
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* STIRLING-PDF (namespace baseline-PSS for image's root-init entrypoint)     */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if index .Values.extras "stirling-pdf" }}
---
# stirling-pdf namespace — baseline PSS. The image's entrypoint runs as root
# to set up tessdata and /usr/local/bin/diagnostics symlinks before dropping
# to uid 1000 internally; restricted PSS rejects that root-init step.
apiVersion: v1
kind: Namespace
metadata:
  name: stirling-pdf
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* ARR STACK — split-architecture                                              */}}
{{/* `arr` ns (baseline PSS): prowlarr + readarr + future *arr apps              */}}
{{/* `qbittorrent` ns (privileged PSS): qBit+gluetun (NET_ADMIN, authorized)     */}}
{{/*                                                                              */}}
{{/* Cross-ns sharing: TWO statically-provisioned kadalu CSI PVs per shared      */}}
{{/* volume (one bound in each ns), both pointing at the same kadalu subvol      */}}
{{/* path. Kadalu's CSI driver mounts the subvol in any pod whose PVC binds      */}}
{{/* such a PV — verified at runtime that two PVs sharing one subvol-path mount  */}}
{{/* the same backing data, with full RWX semantics + hardlinks across subdirs.  */}}
{{/* (NFS bridge approach failed — Talos has no in-kernel nfsd module.)          */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.arr }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: arr
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# qbittorrent namespace — privileged PSS. Required because gluetun adds
# NET_ADMIN (baseline rejects). Explicitly authorized by user; only this ns
# carries privileged in the apps tree. Blast-radius reduction: qBit's WebUI
# is exposed only via the infra gateway (LAN-privileged devices only),
# never via apps gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: qbittorrent
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- $kadaluCommon := dict "fstype" "xfs" "hostvol" "replica2" "pvtype" "subvol" "single_pv_per_pool" "False" "type" "Replica2" -}}
{{- range $vol := list (dict "name" "media-downloads" "size" (.Values.extras.arr.downloadsSize | default "200Gi") "subvol" "subvol/ar/dl/media-downloads") (dict "name" "media-library" "size" (.Values.extras.arr.librarySize | default "1500Gi") "subvol" "subvol/ar/lb/media-library") }}
{{- range $ns := list "qbittorrent" "arr" }}
---
# {{ $vol.name }} — static kadalu PV claimed in {{ $ns }} ns. Both ns's PVs
# point at the SAME subvol path, giving cross-ns access to the same backing
# data. Hardlinks work within the mount (single subvol = single fs).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $ns }}-{{ $vol.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  capacity:
    storage: {{ $vol.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: kadalu
    volumeHandle: {{ $ns }}-{{ $vol.name }}
    volumeAttributes:
      fstype: xfs
      hostvol: replica2
      path: {{ $vol.subvol }}
      pvtype: subvol
      single_pv_per_pool: "False"
      type: Replica2
  claimRef:
    name: {{ $vol.name }}
    namespace: {{ $ns }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $vol.name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ $vol.size }}
  volumeName: {{ $ns }}-{{ $vol.name }}
{{- end }}
{{- end }}
# ──────────────────────────────────────────────────────────────────────────
# Future NetworkPolicy stub (commented) — tighten arr ↔ qbittorrent traffic
# to only what's needed. Today there's no NP enforcement so default-allow
# applies. Uncomment + apply when ready to harden.
#
# ---
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
# metadata:
#   name: allow-arr-to-qbittorrent
#   namespace: qbittorrent
# spec:
#   podSelector:
#     matchLabels:
#       app.kubernetes.io/name: qbittorrent
#   policyTypes: [Ingress]
#   ingress:
#     - from:
#         - namespaceSelector:
#             matchLabels:
#               kubernetes.io/metadata.name: arr
#       ports:
#         - { protocol: TCP, port: 8080 }
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* AUDIOBOOKSHELF-V2 (parallel green/blue release w/ media-library mount)     */}}
{{/* Renders:                                                                    */}}
{{/*   - audiobookshelf-v2 namespace (default restricted PSS, like the existing  */}}
{{/*     audiobookshelf ns)                                                      */}}
{{/*   - third twin-PV/PVC for `media-library` in audiobookshelf-v2 ns,          */}}
{{/*     pointing at the SAME kadalu subvol path the arr stack uses              */}}
{{/*     (subvol/ar/lb/media-library). RWX semantics + hardlinks intact.         */}}
{{/*   - declarative OIDC seed Job: /init → /login → PATCH /api/auth-settings.   */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if index .Values.extras "audiobookshelf-v2" }}
{{- $absV2 := index .Values.extras "audiobookshelf-v2" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: audiobookshelf-v2
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# media-library — third static kadalu PV/PVC pair pointing at the SAME subvol
# path the arr stack's twin PVs use (extras.arr → subvol/ar/lb/media-library).
# Cross-ns sharing via parallel kadalu PVs on one subvol; verified by extras.arr.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: audiobookshelf-v2-media-library
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  capacity:
    storage: {{ $absV2.librarySize | default "1500Gi" }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: kadalu
    volumeHandle: audiobookshelf-v2-media-library
    volumeAttributes:
      fstype: xfs
      hostvol: replica2
      path: subvol/ar/lb/media-library
      pvtype: subvol
      single_pv_per_pool: "False"
      type: Replica2
  claimRef:
    name: media-library
    namespace: audiobookshelf-v2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: audiobookshelf-v2
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ $absV2.librarySize | default "1500Gi" }}
  volumeName: audiobookshelf-v2-media-library
---
# ─────────── OIDC seed Job — fully declarative ABS OIDC bootstrap ───────────
# Audiobookshelf has no env/config-file path for OIDC, but exposes:
#   POST /api/init             — create initial root user (only if none exists)
#   POST /login                — username/password → Bearer accessToken
#   PATCH /api/auth-settings   — admin-only, takes the authOpenID* fields
# This Job runs all three idempotently. On re-runs (subsequent ArgoCD syncs):
#   /init returns 500 → swallow it (root already exists, expected)
#   /login + PATCH still run → OIDC settings reconciled to declared spec
# Inputs:
#   - audiobookshelf-v2-admin SopsSecret  (ABS_ADMIN_USERNAME / ABS_ADMIN_PASSWORD)
#   - audiobookshelf-v2-oidc-client Secret (from oidc-bootstrap, has client_id/secret/issuer_url)
# The Job lives in audiobookshelf-v2 ns so it can read both Secrets directly,
# and it polls the in-cluster ABS service rather than going through the gateway.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audiobookshelf-v2-oidc-seed
  namespace: audiobookshelf-v2
  annotations:
    argocd.argoproj.io/sync-wave: "5"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: audiobookshelf-v2-oidc-seed
  namespace: audiobookshelf-v2
  annotations:
    argocd.argoproj.io/sync-wave: "5"
data:
  seed.sh: |
    #!/usr/bin/env bash
    # Audiobookshelf OIDC bootstrap — see header comments in extras.yaml.
    set -euo pipefail

    : "${ABS_BASE_URL:?required}"
    : "${ABS_ADMIN_USERNAME:?required}"
    : "${ABS_ADMIN_PASSWORD:?required}"
    : "${OIDC_CLIENT_ID:?required}"
    : "${OIDC_CLIENT_SECRET:?required}"
    : "${OIDC_ISSUER_URL:?required}"

    echo "[abs-oidc-seed] waiting for ABS to be ready at ${ABS_BASE_URL}"
    for i in $(seq 1 60); do
      if curl -fsS -m 5 "${ABS_BASE_URL}/status" >/dev/null 2>&1; then
        echo "[abs-oidc-seed] ABS up"
        break
      fi
      sleep 5
      [ "$i" = "60" ] && { echo "[abs-oidc-seed] timeout waiting for ABS" >&2; exit 1; }
    done

    # 1. /init — idempotent. 200 on first run; 500 if root user already exists.
    echo "[abs-oidc-seed] POST /init (idempotent — 500 if root already exists)"
    init_body=$(jq -n \
      --arg u "$ABS_ADMIN_USERNAME" \
      --arg p "$ABS_ADMIN_PASSWORD" \
      '{newRoot: {username: $u, password: $p}}')
    init_code=$(curl -sS -o /tmp/init.out -w '%{http_code}' \
      -X POST -H 'Content-Type: application/json' \
      --data "$init_body" "${ABS_BASE_URL}/init" || true)
    echo "[abs-oidc-seed] /init → ${init_code}"
    if [ "$init_code" != "200" ] && [ "$init_code" != "500" ]; then
      echo "[abs-oidc-seed] /init unexpected status ${init_code}:" >&2
      cat /tmp/init.out >&2 || true
      exit 1
    fi

    # 2. /login — get a Bearer token. x-return-tokens:true puts accessToken in body.
    echo "[abs-oidc-seed] POST /login"
    login_body=$(jq -n \
      --arg u "$ABS_ADMIN_USERNAME" \
      --arg p "$ABS_ADMIN_PASSWORD" \
      '{username: $u, password: $p}')
    login_code=$(curl -sS -o /tmp/login.json -w '%{http_code}' \
      -X POST -H 'Content-Type: application/json' -H 'x-return-tokens: true' \
      --data "$login_body" "${ABS_BASE_URL}/login")
    if [ "$login_code" != "200" ]; then
      echo "[abs-oidc-seed] /login failed (${login_code}):" >&2
      cat /tmp/login.json >&2 || true
      exit 1
    fi
    TOKEN=$(jq -r '.user.accessToken // .accessToken // empty' < /tmp/login.json)
    if [ -z "$TOKEN" ]; then
      echo "[abs-oidc-seed] no accessToken in login response" >&2
      cat /tmp/login.json >&2 || true
      exit 1
    fi

    # 3. PATCH /api/auth-settings — push the OIDC config.
    # SPLIT-URL pattern (canonical workaround for the home-ca trust gap, same
    # as grafana per state/last-session.md):
    #   - authOpenIDIssuerURL = public issuer (must match `iss` claim in tokens)
    #   - authOpenIDAuthorizationURL = public (browser-facing redirect)
    #   - authOpenIDTokenURL / UserInfoURL / JwksURL = in-cluster pocket-id svc
    #     (server-to-server back-channel — bypasses TLS-to-auth.apps.home)
    # The chart has no extraVolumes hook so we can't inject the home-ca-bundle
    # CM as NODE_EXTRA_CA_CERTS; back-channel-via-svc is the gap-bridge until
    # the chart grows extraVolumes (or we switch ABS to a chart that supports
    # it). Tracked as open thread #5 in state/last-session.md.
    PUBLIC_ISS="$OIDC_ISSUER_URL"
    INTERNAL_BASE="http://pocket-id.pocket-id.svc.cluster.local"
    echo "[abs-oidc-seed] PATCH /api/auth-settings (split-URL: public issuer + internal back-channel)"
    auth_body=$(jq -n \
      --arg iss "$PUBLIC_ISS" \
      --arg int "$INTERNAL_BASE" \
      --arg cid "$OIDC_CLIENT_ID" \
      --arg cse "$OIDC_CLIENT_SECRET" \
      '{
        authActiveAuthMethods: ["local","openid"],
        authOpenIDIssuerURL: $iss,
        authOpenIDAuthorizationURL: ($iss + "/authorize"),
        authOpenIDTokenURL: ($int + "/api/oidc/token"),
        authOpenIDUserInfoURL: ($int + "/api/oidc/userinfo"),
        authOpenIDJwksURL: ($int + "/.well-known/jwks.json"),
        authOpenIDLogoutURL: "",
        authOpenIDClientID: $cid,
        authOpenIDClientSecret: $cse,
        authOpenIDTokenSigningAlgorithm: "RS256",
        authOpenIDButtonText: "Login with pocket-id",
        authOpenIDAutoLaunch: false,
        authOpenIDAutoRegister: true,
        authOpenIDMatchExistingBy: "email",
        authOpenIDMobileRedirectURIs: ["audiobookshelf://oauth"]
      }')
    patch_code=$(curl -sS -o /tmp/auth.out -w '%{http_code}' \
      -X PATCH -H 'Content-Type: application/json' \
      -H "Authorization: Bearer ${TOKEN}" \
      --data "$auth_body" "${ABS_BASE_URL}/api/auth-settings")
    if [ "$patch_code" != "200" ]; then
      echo "[abs-oidc-seed] PATCH /api/auth-settings failed (${patch_code}):" >&2
      cat /tmp/auth.out >&2 || true
      exit 1
    fi
    echo "[abs-oidc-seed] done — ABS OIDC configured against ${OIDC_ISSUER_URL}"
---
apiVersion: batch/v1
kind: Job
metadata:
  # Static name — Job is idempotent on re-runs. ArgoCD's Replace=true on
  # spec drift will recreate. ttlSecondsAfterFinished cleans up after success.
  name: audiobookshelf-v2-oidc-seed
  namespace: audiobookshelf-v2
  annotations:
    argocd.argoproj.io/sync-wave: "12"  # after oidc-bootstrap (wave 11) settles
    argocd.argoproj.io/sync-options: Replace=true,SkipDryRunOnMissingResource=true
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 10  # ABS pod may take a while to come up on first sync
  template:
    spec:
      serviceAccountName: audiobookshelf-v2-oidc-seed
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: docker.io/alpine/k8s:1.32.0@sha256:4c28b0f0c6accfa07fa449493ea936291e4ff1270500571d73f75bb406676c3b
          command: ["/bin/bash", "/scripts/seed.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: ABS_BASE_URL
              # In-cluster service DNS — chart names svc after release name.
              value: "http://audiobookshelf-v2.audiobookshelf-v2.svc.cluster.local:8080"
            - name: ABS_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: audiobookshelf-v2-admin
                  key: ABS_ADMIN_USERNAME
            - name: ABS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audiobookshelf-v2-admin
                  key: ABS_ADMIN_PASSWORD
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: audiobookshelf-v2-oidc-client
                  key: client_id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: audiobookshelf-v2-oidc-client
                  key: client_secret
            - name: OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: audiobookshelf-v2-oidc-client
                  key: issuer_url
            - name: HOME
              value: /home/nonroot
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/nonroot
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: audiobookshelf-v2-oidc-seed
            defaultMode: 0755
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: home
          emptyDir:
            sizeLimit: 16Mi
{{- end }}

{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{/* KADALU STORAGE                                                             */}}
{{/* ══════════════════════════════════════════════════════════════════════════ */}}
{{- if .Values.extras.kadalu }}
---
# Kadalu namespace with privileged PodSecurity (required for storage operations)
apiVersion: v1
kind: Namespace
metadata:
  name: kadalu
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# ClusterRole extension for kadalu-operator to patch StorageClasses
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kadalu-operator-patch
  annotations:
    argocd.argoproj.io/sync-wave: "6"
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kadalu-operator-patch
  annotations:
    argocd.argoproj.io/sync-wave: "6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kadalu-operator-patch
subjects:
  - kind: ServiceAccount
    name: kadalu-operator
    namespace: kadalu
---
# Kadalu Replica2 storage with tiebreaker
# - node-1: /dev/sda (4TB external)
# - node-2: /dev/sda (4TB external)
# - node-3: tiebreaker (thin arbiter)
apiVersion: kadalu-operator.storage/v1alpha1
kind: KadaluStorage
metadata:
  name: replica2
  namespace: kadalu
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  type: Replica2
  storage:
    - node: {{ .Values.kadalu.nodes.primary }}
      device: {{ .Values.kadalu.device }}
    - node: {{ .Values.kadalu.nodes.secondary }}
      device: {{ .Values.kadalu.device }}
  tiebreaker:
    node: {{ .Values.kadalu.nodes.tiebreaker }}
    path: /var/lib/kadalu/tiebreaker
    port: 24007
---
# StorageClass for kadalu.replica2 (set as default)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kadalu.replica2
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    argocd.argoproj.io/sync-wave: "7"
provisioner: kadalu
parameters:
  storage_name: replica2
  single_pv_per_pool: "False"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
{{- end }}

