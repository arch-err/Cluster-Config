{{- /*
══════════════════════════════════════════════════════════════════════════════
FORGEJO ADMIN-TOKEN BOOTSTRAP — declarative API-token mint for provider-gitea
══════════════════════════════════════════════════════════════════════════════

Phase 3.5 of the forgejo deployment plan (kubernetes/manual/forgejo/PLAN.md).

Part A (admin user creation) is handled by the codeberg/forgejo chart's
`gitea.admin.existingSecret` knob (set in values/apps/forgejo.yaml against
the `forgejo-admin-bootstrap` SopsSecret). On first pod boot the chart's
configure-gitea init container runs `forgejo admin user create` and the
`cluster-bootstrap` user materialises with `IsAdmin: true`. THIS template
does NOT handle user creation — it ONLY mints the API token that
provider-gitea (phase 4) will consume.

For every component with `forgejoAdmin.enabled: true`, this template renders:

  - In `<component-ns>` (forgejo's ns):
      * ServiceAccount   `forgejo-admin-bootstrap-<app>`
      * ConfigMap        `forgejo-admin-bootstrap-<app>` (the bash script)
      * Job              `forgejo-admin-bootstrap-<app>-<hash>` — talks to
                         forgejo's REST API (via in-cluster service), mints
                         a token named `crossplane`, then upserts a Secret
                         in `tokenSecretNamespace` with key `token`.

  - In `<tokenSecretNamespace>` (e.g. crossplane-system):
      * Role             `forgejo-admin-bootstrap-<app>` (write only the one Secret)
      * RoleBinding      `forgejo-admin-bootstrap-<app>` (binds the cross-ns SA)

The Job name embeds a sha256 hash of the inputs so ArgoCD recreates it
whenever the spec changes (idempotent re-run). `ttlSecondsAfterFinished`
auto-cleans the completed Job.

Idempotency contract: if a token named `crossplane` already exists on
forgejo's side AND the target Secret in `<tokenSecretNamespace>` carries
a non-empty `token` key, the Job exits 0 without re-minting. If forgejo
has the token but the Secret is missing/empty, the Job deletes the
forgejo-side token and re-mints (you can't read back an existing token's
plaintext — forgejo only returns the token sha at create time).

══════════════════════════════════════════════════════════════════════════════
*/}}
{{- range $component := .Values.components }}
{{- if and $component.forgejoAdmin $component.forgejoAdmin.enabled }}
{{- $app := $component.name }}
{{- $appNs := $component.namespace | default $component.name }}
{{- $adminUser := default "cluster-bootstrap" $component.forgejoAdmin.username }}
{{- $adminEmail := default (printf "%s@apps.home" $adminUser) $component.forgejoAdmin.email }}
{{- $pwSecret := default "forgejo-admin-bootstrap" $component.forgejoAdmin.passwordSecret }}
{{- $tokenSecret := default "forgejo-admin-token" $component.forgejoAdmin.tokenSecretName }}
{{- $tokenNs := default "crossplane-system" $component.forgejoAdmin.tokenSecretNamespace }}
{{- $tokenName := default "crossplane" $component.forgejoAdmin.tokenName }}
{{- /* in-cluster service URL — forgejo http service in the app ns */}}
{{- $forgejoUrl := default (printf "http://forgejo-http.%s.svc:3000" $appNs) $component.forgejoAdmin.forgejoUrl }}
{{- /* hash inputs so the Job is recreated when the spec changes */}}
{{- $specBlob := printf "%s|%s|%s|%s|%s|%s|%s|%s" $app $appNs $adminUser $adminEmail $pwSecret $tokenSecret $tokenNs $tokenName }}
{{- $specHash := $specBlob | sha256sum | trunc 10 }}
---
# ─────────── ServiceAccount (lives in forgejo's ns) ───────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-admin-bootstrap-{{ $app }}
  namespace: {{ $appNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/managed-by: platform-chart
    app.kubernetes.io/component: forgejo-admin-bootstrap
    forgejo-admin-bootstrap/app: {{ $app | quote }}
---
# ─────────── Cross-ns RBAC (Role + Binding in tokenNs) ───────────
# Tightest possible: only the one Secret, only the verbs we need.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-admin-bootstrap-{{ $app }}
  namespace: {{ $tokenNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/managed-by: platform-chart
    app.kubernetes.io/component: forgejo-admin-bootstrap
    forgejo-admin-bootstrap/app: {{ $app | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $tokenSecret | quote }}]
    verbs: ["get", "update", "patch"]
  # `create` cannot use resourceNames (admission rejects it) — narrow by scope:
  # SA only has Role in this single ns, on the secrets resource.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-admin-bootstrap-{{ $app }}
  namespace: {{ $tokenNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/managed-by: platform-chart
    app.kubernetes.io/component: forgejo-admin-bootstrap
    forgejo-admin-bootstrap/app: {{ $app | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-admin-bootstrap-{{ $app }}
subjects:
  - kind: ServiceAccount
    name: forgejo-admin-bootstrap-{{ $app }}
    namespace: {{ $appNs }}
---
# ─────────── Bootstrap script (ConfigMap in forgejo's ns) ───────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-admin-bootstrap-{{ $app }}
  namespace: {{ $appNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/managed-by: platform-chart
    app.kubernetes.io/component: forgejo-admin-bootstrap
    forgejo-admin-bootstrap/app: {{ $app | quote }}
data:
  bootstrap.sh: |
    #!/usr/bin/env bash
    # Idempotent forgejo API-token mint. Exits non-zero on any error so
    # backoffLimit retries with exponential backoff.
    set -euo pipefail

    : "${FORGEJO_URL:?required}"
    : "${ADMIN_USER:?required}"
    : "${ADMIN_PASSWORD:?required}"
    : "${TOKEN_NAME:?required}"
    : "${TOKEN_SECRET_NAME:?required}"
    : "${TOKEN_SECRET_NS:?required}"

    echo "[forgejo-admin-bootstrap] forgejo=${FORGEJO_URL} user=${ADMIN_USER} token=${TOKEN_NAME} -> ${TOKEN_SECRET_NS}/${TOKEN_SECRET_NAME}"

    api() {
      # api <method> <path> [json-body-file]
      local method="$1" path="$2" body="${3:-}"
      local args=(-sS -o /tmp/resp.json -w '%{http_code}')
      args+=(-X "$method" -u "${ADMIN_USER}:${ADMIN_PASSWORD}")
      if [ -n "$body" ]; then
        args+=(-H 'Content-Type: application/json' --data "@$body")
      fi
      curl "${args[@]}" "${FORGEJO_URL}${path}"
    }

    # 1. Wait for forgejo /api/v1/version → 200 (≤120s).
    echo "[forgejo-admin-bootstrap] waiting for forgejo to be ready..."
    for i in $(seq 1 60); do
      code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' "${FORGEJO_URL}/api/v1/version" || echo "000")
      if [ "$code" = "200" ]; then
        echo "[forgejo-admin-bootstrap] forgejo ready (version: $(jq -r .version < /tmp/resp.json))"
        break
      fi
      echo "[forgejo-admin-bootstrap] /api/v1/version → ${code}, retry ${i}/60..."
      sleep 2
    done
    if [ "$code" != "200" ]; then
      echo "[forgejo-admin-bootstrap] forgejo never became ready" >&2
      exit 1
    fi

    # 2. Wait for the admin user to exist (chart's configure-gitea init
    #    creates it on pod boot; with passwordMode=keepUpdated the password
    #    matches our SOPS-stored value). Auth check doubles as user existence.
    echo "[forgejo-admin-bootstrap] verifying admin user ${ADMIN_USER}..."
    for i in $(seq 1 30); do
      code=$(api GET "/api/v1/user")
      if [ "$code" = "200" ]; then
        actual_user=$(jq -r .login < /tmp/resp.json)
        if [ "$actual_user" = "$ADMIN_USER" ]; then
          echo "[forgejo-admin-bootstrap] authenticated as ${actual_user}"
          break
        fi
        echo "[forgejo-admin-bootstrap] /api/v1/user returned ${actual_user}, expected ${ADMIN_USER}" >&2
        exit 1
      fi
      echo "[forgejo-admin-bootstrap] /api/v1/user → ${code}, retry ${i}/30..."
      sleep 2
    done
    if [ "$code" != "200" ]; then
      echo "[forgejo-admin-bootstrap] admin auth never succeeded (last code ${code}):" >&2
      cat /tmp/resp.json >&2 || true
      exit 1
    fi

    # 3. Check existing target Secret. If a token value is already there AND
    #    a forgejo-side token of the same name exists, treat as steady-state
    #    and exit 0 (idempotent).
    EXISTING_K8S_TOKEN=""
    if kubectl -n "$TOKEN_SECRET_NS" get secret "$TOKEN_SECRET_NAME" -o jsonpath='{.data.token}' >/dev/null 2>&1; then
      EXISTING_K8S_TOKEN=$(kubectl -n "$TOKEN_SECRET_NS" get secret "$TOKEN_SECRET_NAME" \
        -o jsonpath='{.data.token}' | base64 -d || true)
    fi

    # 4. List forgejo-side tokens.
    code=$(api GET "/api/v1/users/${ADMIN_USER}/tokens")
    if [ "$code" != "200" ]; then
      echo "[forgejo-admin-bootstrap] GET tokens failed (${code}):" >&2
      cat /tmp/resp.json >&2 || true
      exit 1
    fi
    EXISTING_TOKEN_ID=$(jq -r --arg n "$TOKEN_NAME" '.[] | select(.name == $n) | .id' < /tmp/resp.json | head -1)

    if [ -n "$EXISTING_TOKEN_ID" ] && [ -n "$EXISTING_K8S_TOKEN" ]; then
      echo "[forgejo-admin-bootstrap] forgejo token ${TOKEN_NAME} (id=${EXISTING_TOKEN_ID}) exists AND ${TOKEN_SECRET_NS}/${TOKEN_SECRET_NAME}.token is non-empty — nothing to do."
      exit 0
    fi

    # 5. Diverged state: drop the forgejo-side token if any (we can't read its
    #    plaintext back), then mint fresh.
    if [ -n "$EXISTING_TOKEN_ID" ]; then
      echo "[forgejo-admin-bootstrap] forgejo token exists but k8s Secret missing/empty — deleting forgejo-side token to re-mint"
      del_code=$(api DELETE "/api/v1/users/${ADMIN_USER}/tokens/${TOKEN_NAME}")
      if [ "$del_code" != "204" ] && [ "$del_code" != "404" ]; then
        echo "[forgejo-admin-bootstrap] DELETE token failed (${del_code}):" >&2
        cat /tmp/resp.json >&2 || true
        exit 1
      fi
    fi

    echo "[forgejo-admin-bootstrap] minting fresh token ${TOKEN_NAME}..."
    # scopes: forgejo token scopes are coarse "all" plus finer-grained. For a
    # crossplane provider managing orgs/repos/webhooks the "all" scope (admin
    # equivalent) is required — verified against forgejo swagger @ v15.0.2:
    # scopes accept "all" or fine-grained "read:user", "write:repository", etc.
    # We pass a single "all" entry. Note: forgejo returns the token's plaintext
    # at creation time ONLY (the `sha1` field) — must capture it now.
    jq -n --arg name "$TOKEN_NAME" '{name: $name, scopes: ["all"]}' > /tmp/create.json
    post_code=$(api POST "/api/v1/users/${ADMIN_USER}/tokens" /tmp/create.json)
    if [ "$post_code" != "201" ] && [ "$post_code" != "200" ]; then
      echo "[forgejo-admin-bootstrap] POST token failed (${post_code}):" >&2
      cat /tmp/resp.json >&2 || true
      exit 1
    fi
    TOKEN_VALUE=$(jq -r '.sha1' < /tmp/resp.json)
    if [ -z "$TOKEN_VALUE" ] || [ "$TOKEN_VALUE" = "null" ]; then
      echo "[forgejo-admin-bootstrap] empty token in response" >&2
      cat /tmp/resp.json >&2 || true
      exit 1
    fi

    # 6. Apply the Secret in tokenNs.
    {
      printf '%s\n' \
        "apiVersion: v1" \
        "kind: Secret" \
        "metadata:" \
        "  name: ${TOKEN_SECRET_NAME}" \
        "  namespace: ${TOKEN_SECRET_NS}" \
        "  labels:" \
        "    app.kubernetes.io/managed-by: platform-chart" \
        "    app.kubernetes.io/component: forgejo-admin-bootstrap" \
        "    forgejo-admin-bootstrap/app: ${TOKEN_NAME}" \
        "type: Opaque" \
        "stringData:" \
        "  token: \"${TOKEN_VALUE}\"" \
        "  username: \"${ADMIN_USER}\"" \
        "  forgejo-url: \"${FORGEJO_PUBLIC_URL}\""
    } > /tmp/secret.yaml
    kubectl apply -f /tmp/secret.yaml

    echo "[forgejo-admin-bootstrap] done — ${TOKEN_SECRET_NS}/${TOKEN_SECRET_NAME} populated"
---
# ─────────── Job (in forgejo's ns) ───────────
# Job name embeds a hash of the inputs → ArgoCD recreates it on changes,
# leaves it untouched on no-op syncs. ttlSecondsAfterFinished cleans up
# completed Jobs after 10 min.
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-admin-bootstrap-{{ $app }}-{{ $specHash }}
  namespace: {{ $appNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "11"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/managed-by: platform-chart
    app.kubernetes.io/component: forgejo-admin-bootstrap
    forgejo-admin-bootstrap/app: {{ $app | quote }}
    forgejo-admin-bootstrap/spec-hash: {{ $specHash | quote }}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: platform-chart
        app.kubernetes.io/component: forgejo-admin-bootstrap
        forgejo-admin-bootstrap/app: {{ $app | quote }}
    spec:
      serviceAccountName: forgejo-admin-bootstrap-{{ $app }}
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: docker.io/alpine/k8s:1.32.0@sha256:4c28b0f0c6accfa07fa449493ea936291e4ff1270500571d73f75bb406676c3b
          command: ["/bin/bash", "/scripts/bootstrap.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: FORGEJO_URL
              value: {{ $forgejoUrl | quote }}
            - name: FORGEJO_PUBLIC_URL
              value: "https://git.apps.home"
            - name: ADMIN_USER
              value: {{ $adminUser | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pwSecret | quote }}
                  # SOPS secret carries both `ADMIN_PASSWORD` (historical) and
                  # `password` (chart-expected). Use ADMIN_PASSWORD to stay
                  # explicit about the consumer.
                  key: ADMIN_PASSWORD
            - name: TOKEN_NAME
              value: {{ $tokenName | quote }}
            - name: TOKEN_SECRET_NAME
              value: {{ $tokenSecret | quote }}
            - name: TOKEN_SECRET_NS
              value: {{ $tokenNs | quote }}
            - name: HOME
              value: /home/nonroot
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/nonroot
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: forgejo-admin-bootstrap-{{ $app }}
            defaultMode: 0755
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: home
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
{{- end }}
