{{- /*
══════════════════════════════════════════════════════════════════════════════
FORGEJO RUNNER-TOKEN BOOTSTRAP — mint runner registration token

Phase 6 of the forgejo deployment plan (kubernetes/manual/forgejo/PLAN.md).

Mirrors the shape of templates/forgejo-admin-bootstrap.yaml. For every
component with `forgejoRunner.enabled: true`, this template renders:

  - In `<component-ns>` (the runner's ns — `forgejo-runner`):
      * ServiceAccount   `forgejo-runner-bootstrap-<app>`
      * ConfigMap        `forgejo-runner-bootstrap-<app>` (the bash script)
      * Role             `forgejo-runner-bootstrap-<app>` (write only the
                         one Secret in this ns)
      * RoleBinding      `forgejo-runner-bootstrap-<app>`
      * Job              `forgejo-runner-bootstrap-<app>-<hash>` —
                         token-auths to forgejo's admin API as the admin
                         token in `adminTokenRef`, calls
                         POST /api/v1/admin/runners/registration-token,
                         writes the returned `token` field into Secret
                         `<tokenSecretName>` (default `forgejo-runner-token`).

Idempotence: if the target Secret already carries a non-empty `token` key,
the Job exits 0 without touching forgejo (the registration-token endpoint
is a global token that doesn't get consumed-on-use, but re-minting on
every sync is noise we don't need). To force re-mint, `kubectl delete
secret -n forgejo-runner forgejo-runner-token` and let ArgoCD re-create.

The Job name embeds a sha256 hash of the inputs so ArgoCD recreates it
when the spec changes. ttlSecondsAfterFinished auto-cleans.
══════════════════════════════════════════════════════════════════════════════
*/}}
{{- range $component := .Values.components }}
{{- if and $component.forgejoRunner $component.forgejoRunner.enabled }}
{{- $app := $component.name }}
{{- $appNs := $component.namespace | default $component.name }}
{{- $tokenSecret := default "forgejo-runner-token" $component.forgejoRunner.tokenSecretName }}
{{- $adminRef := $component.forgejoRunner.adminTokenRef | default (dict) }}
{{- $adminNs := default "crossplane-system" $adminRef.namespace }}
{{- $adminName := default "forgejo-admin-token" $adminRef.name }}
{{- $adminKey := default "token" $adminRef.key }}
{{- $forgejoUrl := default "http://forgejo-http.forgejo.svc:3000" $component.forgejoRunner.forgejoURL }}
{{- $specBlob := printf "%s|%s|%s|%s|%s|%s|%s" $app $appNs $tokenSecret $adminNs $adminName $adminKey $forgejoUrl }}
{{- $specHash := $specBlob | sha256sum | trunc 10 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-runner-bootstrap-{{ $app }}
  namespace: {{ $appNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/managed-by: platform-chart
    app.kubernetes.io/component: forgejo-runner-bootstrap
    forgejo-runner-bootstrap/app: {{ $app | quote }}
---
# Role: read the admin-token Secret in adminNs is NOT granted via this
# Role — instead the bootstrap Job mounts the admin-token Secret directly
# as an env var via secretKeyRef (RBAC isn't involved in env-var Secret
# resolution; kubelet handles it). The Role here only covers writing the
# target Secret in this ns.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-runner-bootstrap-{{ $app }}
  namespace: {{ $appNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/managed-by: platform-chart
    app.kubernetes.io/component: forgejo-runner-bootstrap
    forgejo-runner-bootstrap/app: {{ $app | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $tokenSecret | quote }}]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-runner-bootstrap-{{ $app }}
  namespace: {{ $appNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/managed-by: platform-chart
    app.kubernetes.io/component: forgejo-runner-bootstrap
    forgejo-runner-bootstrap/app: {{ $app | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-runner-bootstrap-{{ $app }}
subjects:
  - kind: ServiceAccount
    name: forgejo-runner-bootstrap-{{ $app }}
    namespace: {{ $appNs }}
---
# Bootstrap requires the admin Secret to be readable from this ns. Mirror
# (replicate) it via a tiny init step? No — k8s Secrets are ns-scoped and
# direct cross-ns env-var refs aren't allowed. The clean path is the
# (existing) forgejo-admin-bootstrap Job's pattern of running IN the ns
# that holds the source Secret. We invert: bootstrap Job runs in this ns,
# and the admin-token Secret needs to be made available here. Easiest +
# narrowest: an extra Role+Binding in adminNs that lets THIS SA `get` the
# one named Secret, and the script reads it via `kubectl get`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-runner-bootstrap-{{ $app }}-admin-token-reader
  namespace: {{ $adminNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/managed-by: platform-chart
    app.kubernetes.io/component: forgejo-runner-bootstrap
    forgejo-runner-bootstrap/app: {{ $app | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $adminName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-runner-bootstrap-{{ $app }}-admin-token-reader
  namespace: {{ $adminNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/managed-by: platform-chart
    app.kubernetes.io/component: forgejo-runner-bootstrap
    forgejo-runner-bootstrap/app: {{ $app | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-runner-bootstrap-{{ $app }}-admin-token-reader
subjects:
  - kind: ServiceAccount
    name: forgejo-runner-bootstrap-{{ $app }}
    namespace: {{ $appNs }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-bootstrap-{{ $app }}
  namespace: {{ $appNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/managed-by: platform-chart
    app.kubernetes.io/component: forgejo-runner-bootstrap
    forgejo-runner-bootstrap/app: {{ $app | quote }}
data:
  bootstrap.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${FORGEJO_URL:?required}"
    : "${ADMIN_TOKEN_NS:?required}"
    : "${ADMIN_TOKEN_NAME:?required}"
    : "${ADMIN_TOKEN_KEY:?required}"
    : "${TOKEN_SECRET_NAME:?required}"
    : "${TOKEN_SECRET_NS:?required}"

    echo "[forgejo-runner-bootstrap] forgejo=${FORGEJO_URL} -> ${TOKEN_SECRET_NS}/${TOKEN_SECRET_NAME}"

    # 1. Idempotent short-circuit: if target Secret has a non-empty `token`,
    #    treat as steady-state. (registration-token is global, re-minting on
    #    every sync would churn the Secret needlessly.)
    EXISTING=""
    if kubectl -n "$TOKEN_SECRET_NS" get secret "$TOKEN_SECRET_NAME" \
        -o jsonpath='{.data.token}' >/dev/null 2>&1; then
      EXISTING=$(kubectl -n "$TOKEN_SECRET_NS" get secret "$TOKEN_SECRET_NAME" \
        -o jsonpath='{.data.token}' | base64 -d || true)
    fi
    if [ -n "$EXISTING" ]; then
      echo "[forgejo-runner-bootstrap] ${TOKEN_SECRET_NS}/${TOKEN_SECRET_NAME}.token is non-empty — nothing to do."
      exit 0
    fi

    # 2. Fetch the admin API token from the (foreign) ns via kubectl.
    ADMIN_TOKEN=$(kubectl -n "$ADMIN_TOKEN_NS" get secret "$ADMIN_TOKEN_NAME" \
      -o jsonpath="{.data.${ADMIN_TOKEN_KEY}}" | base64 -d)
    if [ -z "$ADMIN_TOKEN" ]; then
      echo "[forgejo-runner-bootstrap] empty admin token in ${ADMIN_TOKEN_NS}/${ADMIN_TOKEN_NAME}.${ADMIN_TOKEN_KEY}" >&2
      exit 1
    fi

    # 3. Wait for forgejo readiness via the (authenticated) version probe.
    echo "[forgejo-runner-bootstrap] waiting for forgejo..."
    for i in $(seq 1 60); do
      code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
        -H "Authorization: token ${ADMIN_TOKEN}" \
        "${FORGEJO_URL}/api/v1/version" || echo "000")
      if [ "$code" = "200" ]; then
        echo "[forgejo-runner-bootstrap] forgejo ready ($(jq -r .version < /tmp/resp.json))"
        break
      fi
      echo "[forgejo-runner-bootstrap] /api/v1/version → ${code}, retry ${i}/60..."
      sleep 2
    done
    if [ "$code" != "200" ]; then
      echo "[forgejo-runner-bootstrap] forgejo never ready (last ${code})" >&2
      cat /tmp/resp.json >&2 || true
      exit 1
    fi

    # 4. Mint registration token. Per forgejo swagger, the admin
    #    runners/registration-token endpoint is an authenticated GET that
    #    returns {"token": "..."}. (POST also works in newer minors.)
    echo "[forgejo-runner-bootstrap] minting registration token..."
    code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
      -H "Authorization: token ${ADMIN_TOKEN}" \
      "${FORGEJO_URL}/api/v1/admin/runners/registration-token")
    if [ "$code" != "200" ]; then
      echo "[forgejo-runner-bootstrap] registration-token GET failed (${code}):" >&2
      cat /tmp/resp.json >&2 || true
      exit 1
    fi
    TOKEN_VALUE=$(jq -r '.token' < /tmp/resp.json)
    if [ -z "$TOKEN_VALUE" ] || [ "$TOKEN_VALUE" = "null" ]; then
      echo "[forgejo-runner-bootstrap] empty token in response" >&2
      cat /tmp/resp.json >&2
      exit 1
    fi

    # 5. Apply the Secret.
    {
      printf '%s\n' \
        "apiVersion: v1" \
        "kind: Secret" \
        "metadata:" \
        "  name: ${TOKEN_SECRET_NAME}" \
        "  namespace: ${TOKEN_SECRET_NS}" \
        "  labels:" \
        "    app.kubernetes.io/managed-by: platform-chart" \
        "    app.kubernetes.io/component: forgejo-runner-bootstrap" \
        "type: Opaque" \
        "stringData:" \
        "  token: \"${TOKEN_VALUE}\"" \
        "  forgejo-url: \"${FORGEJO_URL}\""
    } > /tmp/secret.yaml
    kubectl apply -f /tmp/secret.yaml

    echo "[forgejo-runner-bootstrap] done — ${TOKEN_SECRET_NS}/${TOKEN_SECRET_NAME} populated"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-runner-bootstrap-{{ $app }}-{{ $specHash }}
  namespace: {{ $appNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "11"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/managed-by: platform-chart
    app.kubernetes.io/component: forgejo-runner-bootstrap
    forgejo-runner-bootstrap/app: {{ $app | quote }}
    forgejo-runner-bootstrap/spec-hash: {{ $specHash | quote }}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: platform-chart
        app.kubernetes.io/component: forgejo-runner-bootstrap
        forgejo-runner-bootstrap/app: {{ $app | quote }}
    spec:
      serviceAccountName: forgejo-runner-bootstrap-{{ $app }}
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: docker.io/alpine/k8s:1.32.0@sha256:4c28b0f0c6accfa07fa449493ea936291e4ff1270500571d73f75bb406676c3b
          command: ["/bin/bash", "/scripts/bootstrap.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: FORGEJO_URL
              value: {{ $forgejoUrl | quote }}
            - name: ADMIN_TOKEN_NS
              value: {{ $adminNs | quote }}
            - name: ADMIN_TOKEN_NAME
              value: {{ $adminName | quote }}
            - name: ADMIN_TOKEN_KEY
              value: {{ $adminKey | quote }}
            - name: TOKEN_SECRET_NAME
              value: {{ $tokenSecret | quote }}
            - name: TOKEN_SECRET_NS
              value: {{ $appNs | quote }}
            - name: HOME
              value: /home/nonroot
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/nonroot
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: forgejo-runner-bootstrap-{{ $app }}
            defaultMode: 0755
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: home
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
{{- end }}
