{{- range $.Values.components }}
{{- if .route }}
{{- $name := .name }}
{{- $routeName := .route.name | default .name }}
{{- $isApps := eq (.route.gateway | default "internal") "apps" }}
{{- /* Compute whether this route should appear on the gethomepage dashboard.
       - dashboard omitted (nil)  → default-SHOW on every gateway (apps + infra)
       - dashboard: false         → always hide
       - dashboard: true          → always show with auto-derived name/icon
       - dashboard: { ... }       → show unless `enabled: false`; map fields override defaults
       Each gateway's homepage filters via `gethomepage.dev/instance` so apps
       homepage shows apps-gateway routes, infra homepage shows infra-gateway
       routes — auto-discovery, no per-app opt-in. */ -}}
{{- $dash := .route.dashboard }}
{{- $dashKind := kindOf $dash }}
{{- $show := false }}
{{- if eq $dashKind "invalid" }}
  {{- $show = $isApps }}
{{- else if eq $dashKind "bool" }}
  {{- $show = $dash }}
{{- else if eq $dashKind "map" }}
  {{- if hasKey $dash "enabled" }}
    {{- $show = (index $dash "enabled") }}
  {{- else }}
    {{- $show = true }}
  {{- end }}
{{- end }}
{{- $dashName := "" }}
{{- $dashIcon := "" }}
{{- $dashGroup := "" }}
{{- $dashDesc := "" }}
{{- if eq $dashKind "map" }}
  {{- $dashName = default "" (index $dash "name") }}
  {{- $dashIcon = default "" (index $dash "icon") }}
  {{- $dashGroup = default "" (index $dash "group") }}
  {{- $dashDesc = default "" (index $dash "description") }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $routeName }}
  namespace: {{ .namespace | default .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    {{- if $show }}
    {{- $defaultSiteMonitor := printf "https://%s" .route.hostname }}
    {{- $hasSiteMonitor := and (eq $dashKind "map") (hasKey ($dash | default dict) "siteMonitor") }}
    {{- $siteMonitorVal := ternary (index $dash "siteMonitor") $defaultSiteMonitor $hasSiteMonitor }}
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: {{ ternary ($name | title) $dashName (eq $dashName "") | quote }}
    gethomepage.dev/icon: {{ ternary (printf "%s.svg" $name) $dashIcon (eq $dashIcon "") | quote }}
    # instance: derived from gateway. Apps homepage (instanceName: apps) shows only
    # routes with this matching its instanceName; same for infra. Routes without an
    # instance annotation are visible on every homepage.
    gethomepage.dev/instance: {{ .route.gateway | default "internal" | quote }}
    {{- if ne (printf "%v" $siteMonitorVal) "false" }}
    # siteMonitor: HTTP-ping URL for the status dot. Defaults to https://<hostname>;
    # override with `dashboard.siteMonitor: <url>`; opt out with `dashboard.siteMonitor: false`.
    gethomepage.dev/siteMonitor: {{ $siteMonitorVal | quote }}
    {{- end }}
    {{- if ne $dashGroup "" }}
    gethomepage.dev/group: {{ $dashGroup | quote }}
    {{- end }}
    {{- if ne $dashDesc "" }}
    gethomepage.dev/description: {{ $dashDesc | quote }}
    {{- end }}
    {{- end }}
{{- with .route.annotations }}
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  parentRefs:
    - name: {{ .route.gateway | default "internal" }}
      namespace: gateway-system
  hostnames:
    - {{ .route.hostname | quote }}
  rules:
{{- /* grpc: optional opt-in. When `route.grpc: true` is set, prepend rules that
       match gRPC-web content-types and route them to a separate (h2c-tagged) port.
       MUST come before the catch-all because Cilium's envoy translator preserves
       rule order and uses first-match — a sibling GRPCRoute with `prefix: /` loses
       to an HTTPRoute with `prefix: /` listed first. The grpcPort backend should
       be a Service port whose `appProtocol: kubernetes.io/h2c` (requires
       `enableAppProtocol: true` in cilium values), so envoy speaks HTTP/2 cleartext
       upstream. Without h2c, argocd-server's HTTP mux (not gRPC mux) handles
       the request and 404s with `grpc-message: 404 page not found`.
       Three rules cover the canonical grpc-web content-types in use today. */ -}}
{{- if .route.grpc }}
{{- $grpcSvc := .route.service | default .name }}
{{- $grpcPort := .route.grpcPort | default .route.port | default 80 }}
    - matches:
        - headers:
            - name: content-type
              value: application/grpc-web+proto
      backendRefs:
        - name: {{ $grpcSvc }}
          port: {{ $grpcPort }}
    - matches:
        - headers:
            - name: content-type
              value: application/grpc-web
      backendRefs:
        - name: {{ $grpcSvc }}
          port: {{ $grpcPort }}
    - matches:
        - headers:
            - name: content-type
              value: application/grpc-web-text
      backendRefs:
        - name: {{ $grpcSvc }}
          port: {{ $grpcPort }}
{{- end }}
{{- /* timeout: optional opt-in. Sets spec.rules[].timeouts.request to override
       the gateway's default request timeout (Cilium/Envoy default is too short
       for large uploads). Only `request` is supported here — not `backendRequest`. */ -}}
{{- if .route.rules }}
{{- range .route.rules }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path }}
{{- if $.route.timeout }}
      timeouts:
        request: {{ $.route.timeout | quote }}
{{- end }}
      backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
{{- end }}
{{- else }}
    -
{{- if .route.timeout }}
      timeouts:
        request: {{ .route.timeout | quote }}
{{- end }}
      backendRefs:
        - name: {{ .route.service | default .name }}
          port: {{ .route.port | default 80 }}
{{- end }}
{{- end }}
{{- end }}
