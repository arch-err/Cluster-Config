{{- if .Values.extras.trustManagerBundle }}
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: home-ca-bundle
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sources:
    - secret:
        name: home-root-ca
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector: {}
{{- end }}
