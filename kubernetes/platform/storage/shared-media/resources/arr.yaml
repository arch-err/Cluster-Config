{{- if .Values.extras.arr }}
---
# qbittorrent namespace — privileged PSS. Required because gluetun adds
# NET_ADMIN (baseline rejects). Explicitly authorized by user; only this ns
# carries privileged in the apps tree. Blast-radius reduction: qBit's WebUI
# is exposed only via the infra gateway (LAN-privileged devices only),
# never via apps gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: qbittorrent
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- $kadaluCommon := dict "fstype" "xfs" "hostvol" "replica2" "pvtype" "subvol" "single_pv_per_pool" "False" "type" "Replica2" -}}
{{- range $vol := list (dict "name" "media-downloads" "size" (.Values.extras.arr.downloadsSize | default "200Gi") "subvol" "subvol/ar/dl/media-downloads") (dict "name" "media-library" "size" (.Values.extras.arr.librarySize | default "1500Gi") "subvol" "subvol/ar/lb/media-library") }}
{{- range $ns := list "qbittorrent" }}
---
# {{ $vol.name }} — static kadalu PV claimed in {{ $ns }} ns. Points at a
# shared subvol path also mounted by the media apps (audiobookshelf-v2,
# jellyfin, navidrome, metube) via their own twin PVs, giving cross-ns
# access to the same backing data. Hardlinks work within the mount
# (single subvol = single fs).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $ns }}-{{ $vol.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  capacity:
    storage: {{ $vol.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: kadalu
    volumeHandle: {{ $ns }}-{{ $vol.name }}
    volumeAttributes:
      fstype: xfs
      hostvol: replica2
      path: {{ $vol.subvol }}
      pvtype: subvol
      single_pv_per_pool: "False"
      type: Replica2
  claimRef:
    name: {{ $vol.name }}
    namespace: {{ $ns }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $vol.name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ $vol.size }}
  volumeName: {{ $ns }}-{{ $vol.name }}
{{- end }}
{{- end }}
