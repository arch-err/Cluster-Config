# local-path-provisioner — dynamic node-local hostPath PVCs.
#
# Used for workloads where live SQLite/document IO must not sit on network
# storage. Volumes are persistent across normal node reboot but remain tied to
# the node selected at provisioning time. The chart owns the disposable
# `local-path` class; resources/storageclass-retain.yaml exposes the same
# provisioner with Retain semantics for valuable node-local data. Neither class
# is replicated, so back up workload data separately.

storageClass:
  create: true
  name: local-path
  provisionerName: rancher.io/local-path
  defaultClass: false
  defaultVolumeType: hostPath
  reclaimPolicy: Delete
  volumeBindingMode: WaitForFirstConsumer

nodePathMap:
  - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
    paths:
      - /opt/local-path-provisioner

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

configmap:
  name: local-path-config
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod:
    name: helper-pod
    priorityClassName: system-node-critical
