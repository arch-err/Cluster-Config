{{- if .Values.extras.kadalu }}
---
# Kadalu namespace with privileged PodSecurity (required for storage operations)
apiVersion: v1
kind: Namespace
metadata:
  name: kadalu
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# ClusterRole extension for kadalu-operator to patch StorageClasses
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kadalu-operator-patch
  annotations:
    argocd.argoproj.io/sync-wave: "6"
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kadalu-operator-patch
  annotations:
    argocd.argoproj.io/sync-wave: "6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kadalu-operator-patch
subjects:
  - kind: ServiceAccount
    name: kadalu-operator
    namespace: kadalu
---
# Kadalu Replica2 storage with tiebreaker
# - node-1: /dev/sda (4TB external)
# - node-2: /dev/sda (4TB external)
# - node-3: tiebreaker (thin arbiter)
apiVersion: kadalu-operator.storage/v1alpha1
kind: KadaluStorage
metadata:
  name: replica2
  namespace: kadalu
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  type: Replica2
  storage:
    - node: {{ .Values.kadalu.nodes.primary }}
      device: {{ .Values.kadalu.device }}
    - node: {{ .Values.kadalu.nodes.secondary }}
      device: {{ .Values.kadalu.device }}
  tiebreaker:
    node: {{ .Values.kadalu.nodes.tiebreaker }}
    path: /var/lib/kadalu/tiebreaker
    port: 24007
---
# StorageClass for kadalu.replica2 (set as default)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kadalu.replica2
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    argocd.argoproj.io/sync-wave: "7"
provisioner: kadalu
parameters:
  storage_name: replica2
  single_pv_per_pool: "False"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
---
# StorageClass for kadalu.replica2-retain — sibling SC for CRITICAL/VALUABLE PVCs
# Same backing storage as kadalu.replica2; only difference is reclaimPolicy.
# New apps holding user data must opt in via `storageClassName: kadalu.replica2-retain`.
# See docs/pvc-reclaim-policy.md.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kadalu.replica2-retain
  annotations:
    argocd.argoproj.io/sync-wave: "7"
provisioner: kadalu
parameters:
  storage_name: replica2
  single_pv_per_pool: "False"
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
{{- end }}
