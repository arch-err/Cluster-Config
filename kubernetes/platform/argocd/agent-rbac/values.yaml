# Read-only cluster inventory access for external automation.
# No secrets, no exec/attach/portforward, no mutation verbs.

serviceAccount:
  readonly:
    enabled: true
    forceRename: readonly

rbac:
  roles:
    readonly:
      type: ClusterRole
      forceRename: hermes-agent-readonly
      annotations:
        infra.home/display-name: Hermes Agent
      rules:
        # Core resources, deliberately excluding secrets and token creation.
        - apiGroups: [""]
          resources:
            - bindings
            - componentstatuses
            - configmaps
            - endpoints
            - events
            - limitranges
            - namespaces
            - nodes
            - persistentvolumeclaims
            - persistentvolumes
            - pods
            - pods/log
            - podtemplates
            - replicationcontrollers
            - resourcequotas
            - serviceaccounts
            - services
          verbs: [get, list, watch]

        # Built-in Kubernetes APIs.
        - apiGroups:
            - admissionregistration.k8s.io
            - apiextensions.k8s.io
            - apiregistration.k8s.io
            - apps
            - autoscaling
            - batch
            - certificates.k8s.io
            - coordination.k8s.io
            - discovery.k8s.io
            - events.k8s.io
            - flowcontrol.apiserver.k8s.io
            - networking.k8s.io
            - node.k8s.io
            - policy
            - rbac.authorization.k8s.io
            - scheduling.k8s.io
            - storage.k8s.io
          resources: ["*"]
          verbs: [get, list, watch]

        # Cluster CRDs currently used by this repository.
        - apiGroups:
            - argoproj.io
            - cert-manager.io
            - cilium.io
            - gateway.networking.k8s.io
            - isindir.github.com
            - kadalu-operator.storage
            - postgresql.cnpg.io
            - trust.cert-manager.io
          resources: ["*"]
          verbs: [get, list, watch]

        # API discovery and health endpoints only.
        - nonResourceURLs:
            - /api
            - /api/*
            - /apis
            - /apis/*
            - /healthz
            - /livez
            - /readyz
            - /version
          verbs: [get]

  bindings:
    readonly:
      type: ClusterRoleBinding
      forceRename: hermes-agent-readonly
      annotations:
        infra.home/display-name: Hermes Agent
      roleRef:
        identifier: readonly
      subjects:
        - identifier: readonly
