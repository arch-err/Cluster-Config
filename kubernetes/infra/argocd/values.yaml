# ArgoCD Helm values
# Single instance for home lab

# Global settings
global:
  # Use cluster domain
  domain: argocd.local

# Server configuration
server:
  replicas: 1
  # Insecure mode (no TLS termination in ArgoCD - use ingress/LB for TLS)
  extraArgs:
    - --insecure
  # Service type
  service:
    type: ClusterIP

# Repo server
repoServer:
  replicas: 1

# Application controller
controller:
  replicas: 1

# Redis (single instance)
redis:
  enabled: true

# Redis HA (disabled for home lab)
redis-ha:
  enabled: false

# Dex (SSO - disabled for now)
dex:
  enabled: false

# Notifications (disabled for now)
notifications:
  enabled: false

# ApplicationSet controller
applicationSet:
  enabled: true
  replicas: 1

# Configs
configs:
  # Don't create default admin password secret (let Helm create it)
  secret:
    createSecret: true
  # Repository credentials (add your Git repos here)
  repositories: {}
  # Example:
  # repositories:
  #   cluster-config:
  #     url: https://github.com/arch-err/Cluster-Config
  #     type: git
