# Cilium L2 Announcement Policy and LoadBalancer IP Pool
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: ""
  interfaces:
    - ^enp.*
    - ^eth[0-9]+
  externalIPs: true
  loadBalancerIPs: true
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: default
spec:
  blocks:
    - start: "192.168.1.200"
      stop: "192.168.1.254"
