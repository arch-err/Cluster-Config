# Cilium Helm values for Talos Linux
# Optimized for 3-node control plane cluster with kube-proxy replacement

# Kubernetes API server (use VIP)
k8sServiceHost: 192.168.1.70
k8sServicePort: 6443

# Enable kube-proxy replacement
kubeProxyReplacement: true

# IPAM configuration
ipam:
  mode: kubernetes

# Talos-specific cgroup configuration
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Security context for Talos
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# L2 announcements for LoadBalancer services
l2announcements:
  enabled: true

# External IPs support
externalIPs:
  enabled: true

# Operator configuration
operator:
  replicas: 1

# Hubble observability (optional - enable for debugging)
hubble:
  enabled: false
  relay:
    enabled: false
  ui:
    enabled: false

# Rollout configuration
rollOutCiliumPods: true
priorityClassName: system-node-critical
