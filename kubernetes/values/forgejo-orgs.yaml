# ══════════════════════════════════════════════════════════════════════════════
# FORGEJO ORGS-AS-CODE — declarative org/repo/webhook/collaborator schema
# ══════════════════════════════════════════════════════════════════════════════
#
# Sibling values overlay consumed by the apps Application's helm.valueFiles
# (alongside kubernetes/apps.yaml). Walked by
# kubernetes/platform/templates/forgejo-orgs.yaml to emit one Crossplane
# managed-resource per item, reconciled into real forgejo state via
# provider-gitea (installed in crossplane-system; ProviderConfig `default`
# pointed at https://git.apps.home, see kubernetes/values/infra/provider-gitea.yaml).
#
# ──────────────────────────────────────────────────────────────────────────
# PROVIDER CRD INVENTORY — provider-gitea v0.6.0-final
# ──────────────────────────────────────────────────────────────────────────
# Verified live against the cluster on 2026-05-20 via
# `kubectl get crd | grep gitea.crossplane.io`. Resource kinds this overlay
# emits → CRDs and scope:
#
#   organization.gitea.crossplane.io/v1alpha1          Organization            (Namespaced)
#   repository.gitea.crossplane.io/v1alpha1            Repository              (Namespaced)
#   webhook.gitea.crossplane.io/v1alpha1               Webhook                 (Cluster-scoped)
#   repositorycollaborator.gitea.crossplane.io/v1alpha1 RepositoryCollaborator (Cluster-scoped)
#
# Other CRDs available at this provider version (not emitted by this overlay
# yet — add follow-up shapes as needed):
#   adminusers, branchprotections, deploykeys, githooks, issues, labels,
#   organizationmembers, organizationsecrets, organizationsettings,
#   pullrequests, releases, repositorykeys, repositorysecrets, teams,
#   users, userkeys, actions
#
# ──────────────────────────────────────────────────────────────────────────
# SCHEMA
# ──────────────────────────────────────────────────────────────────────────
#
#   organizations:
#     - name:         <string, required>   # forgejo org login (= spec.forProvider.username)
#       visibility:   <public|limited|private, default: private>
#       description:  <string, default: "">
#       website:      <string, default: "">
#       fullName:     <string, default: "">
#       location:     <string, default: "">
#       repoAdminChangeTeamAccess: <bool, default: false>
#       repositories:
#         - name:            <string, required>
#           private:         <bool, default: true>
#           defaultBranch:   <string, default: "main">
#           description:     <string, default: "">
#           website:         <string, default: "">
#           autoInit:        <bool, default: true>   # so defaultBranch actually exists on create
#           hasIssues:       <bool, default: true>
#           hasWiki:         <bool, default: false>
#           hasPullRequests: <bool, default: true>
#           hasActions:      <bool, default: true>
#           hasPackages:     <bool, default: true>
#           hasProjects:     <bool, default: false>
#           hasReleases:     <bool, default: true>
#           allowMergeCommits:             <bool, default: true>
#           allowSquashMerge:              <bool, default: true>
#           allowRebase:                   <bool, default: true>
#           allowRebaseExplicit:           <bool, default: true>
#           allowRebaseUpdate:             <bool, default: true>
#           defaultDeleteBranchAfterMerge: <bool, default: true>
#           defaultMergeStyle:             <string, default: "merge">
#           archived:                      <bool, default: false>
#           template:                      <bool, default: false>
#           trustModel:                    <string, default: "default">
#           gitignores:                    <string, default: "">   # comma-sep, only on create
#           license:                       <string, default: "">   # name, only on create
#           readme:                        <string, default: "">   # template, only on create
#           issueLabels:                   <string, default: "">   # template, only on create
#           mirror:                        # see KNOWN LIMITATIONS below
#             enabled: false
#             cloneAddr: ""
#             interval: "24h"
#             credentialsSecret: ""
#           webhooks:
#             - url:             <string, required>
#               type:            <string, default: "gitea">      # gitea|slack|discord|telegram|...
#               contentType:     <json|form, default: "json">
#               events:          <[string], default: ["push"]>   # push, pull_request, issues, release, ...
#               active:          <bool, default: true>
#               sslVerification: <bool, default: true>
#               branchFilter:    <string, default: "">
#               # secret:        <string, default: "">  # webhook signing secret (plaintext field on the CR)
#           collaborators:
#             - user:       <string, required>      # existing forgejo username
#               permission: <read|write|admin, required>
#
# ──────────────────────────────────────────────────────────────────────────
# KNOWN LIMITATIONS / GAPS in provider-gitea v0.6.0-final
# ──────────────────────────────────────────────────────────────────────────
#
# 1. NO MIRROR SUPPORT on the Repository CRD. v0.6.0-final's
#    Repository.spec.forProvider does NOT expose any mirror/cloneAddr/
#    pullMirror fields (verified by enumerating the live CRD's openAPISchema
#    on 2026-05-20). Setting `mirror.enabled: true` on an entry is therefore
#    a NO-OP for v1 — the schema slot is reserved so future entries don't
#    need re-shaping when upstream lands mirror reconciliation. To mirror a
#    repo for now: create the Repository here (empty shell) THEN use the
#    forgejo UI's "Migrate repository" → "From URL with mirror" flow as a
#    one-time manual step. Captured in PLAN.md's open questions.
#
# 2. WEBHOOK SECRET is a plaintext field on Webhook.spec.forProvider.secret —
#    there is no `secretRef:` indirection. If you need a real webhook signing
#    secret, either (a) accept plaintext in the values file (NOT recommended
#    for sensitive secrets), (b) leave it blank and patch via UI/API post-
#    apply, or (c) wait for an upstream change. The schema slot is reserved
#    but COMMENTED OUT in the template until this is resolved.
#
# 3. REPOSITORYCOLLABORATOR + USER ORDERING. RepositoryCollaborator
#    references `spec.forProvider.username` — that user must already exist
#    in forgejo (provisioned via pocket-id OIDC first login, or hand-created
#    via the admin UI). Crossplane will leave the MR in `False/ReconcileError`
#    state until the user exists, then reconcile cleanly. Document the
#    collaborator user provisioning step out-of-band; no `dependsOn` mechanism
#    is wired in the template (provider-gitea has no User MR for OIDC-backed
#    users, only AdminUser for password-auth users).
#
# 4. SCOPE QUIRK. Organization + Repository MRs are NAMESPACED CRDs; Webhook
#    + RepositoryCollaborator MRs are CLUSTER-SCOPED CRDs (verified live).
#    The template lands all the namespaced ones in `crossplane-system` and
#    omits the namespace field on the cluster-scoped ones. Don't change this
#    without re-verifying.
#
# ──────────────────────────────────────────────────────────────────────────
# HOW TO ADD A NEW ORG / REPO
# ──────────────────────────────────────────────────────────────────────────
#
# Append an entry under `organizations:` in this file, commit + push to v2,
# ArgoCD picks up the new MRs, provider-gitea reconciles them into forgejo.
# Two worked examples (commented; uncomment + edit to use):
#
#   organizations:
#     # Minimal org with one private repo, no webhooks, no collaborators:
#     # - name: arch-err
#     #   visibility: private
#     #   description: "personal projects"
#     #   repositories:
#     #     - name: example-repo
#     #       private: true
#     #       description: "example repo"
#     #       defaultBranch: main
#
#     # Full-shape org with one repo, one webhook, one collaborator:
#     # - name: arch-err-mirrors
#     #   visibility: private
#     #   description: "read-only mirrors of upstream github repos"
#     #   repositories:
#     #     - name: some-upstream
#     #       private: true
#     #       description: "mirror of github.com/upstream/some-upstream"
#     #       defaultBranch: main
#     #       # mirror config slot — see KNOWN LIMITATIONS #1; not reconciled
#     #       # by v0.6.0-final but reserved for future provider releases.
#     #       mirror:
#     #         enabled: true
#     #         cloneAddr: "https://github.com/upstream/some-upstream"
#     #         interval: "24h"
#     #         credentialsSecret: ""    # name of Secret w/ username/password keys (FUTURE)
#     #       webhooks:
#     #         - url: https://hookshot.apps.home/webhook/forgejo
#     #           type: gitea
#     #           contentType: json
#     #           events: [push, release]
#     #           active: true
#     #       collaborators:
#     #         - user: cluster-bootstrap
#     #           permission: admin
#
# ══════════════════════════════════════════════════════════════════════════════

organizations: []
