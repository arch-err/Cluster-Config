# arr-oauth2-readarr — chart: oauth2-proxy/oauth2-proxy v10.4.3
# Sibling of arr-oauth2-prowlarr — same cookie/client config but fronts
# readarr instead. Reuses the OIDC client `arr-oauth2-prowlarr-oidc-client`
# (registered by the prowlarr sibling's oidc:* block in apps.yaml — its
# callbackUrls include BOTH prowlarr.apps.home/oauth2/callback AND
# readarr.apps.home/oauth2/callback). NO oidc:* block in this component;
# we just consume the existing Secret in the shared `arr` namespace.
#
# See arr-oauth2-prowlarr.yaml for the rationale on cookie domain, SSO,
# /api/ bypass, External auth, and the cookie-secret DRIFT.

fullnameOverride: oauth2-readarr

image:
  tag: "v7.15.2"

proxyVarsAsSecrets: false

config:
  clientID: ""
  clientSecret: ""
  cookieSecret: ""
  emailDomains: ["*"]

extraArgs:
  - --provider=oidc
  - --provider-display-name=Pocket ID
  - --skip-provider-button=true
  - --code-challenge-method=S256
  - --skip-oidc-discovery=false
  - --http-address=0.0.0.0:4180
  - --reverse-proxy=true
  - --real-client-ip-header=X-Forwarded-For
  # Single upstream — readarr in-cluster service.
  - --upstream=http://readarr.arr.svc.cluster.local:8787
  - --cookie-domain=.apps.home
  - --cookie-secure=true
  - --cookie-samesite=lax
  # MUST match sibling for SSO across .apps.home subdomains.
  - --cookie-name=_arr_oauth2_proxy
  - --allowed-group=apps-users
  - --allowed-group=Administrators
  - --skip-auth-route=^/api/
  - --pass-user-headers=true
  - --set-xauthrequest=true
  - --pass-access-token=false
  - --email-domain=*
  - --provider-ca-file=/etc/ssl/home-ca/ca.crt

# Reuse the prowlarr sibling's bootstrap Secret — same OIDC client. Both
# components live in the `arr` ns so cross-ns access isn't an issue.
extraEnv:
  - name: OAUTH2_PROXY_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: arr-oauth2-prowlarr-oidc-client
        key: client_id
  - name: OAUTH2_PROXY_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: arr-oauth2-prowlarr-oidc-client
        key: client_secret
  - name: OAUTH2_PROXY_OIDC_ISSUER_URL
    valueFrom:
      secretKeyRef:
        name: arr-oauth2-prowlarr-oidc-client
        key: issuer_url
  # MUST be byte-for-byte identical to the sibling literal — cookies are
  # HMAC-signed with this; mismatch breaks SSO across releases.
  - name: OAUTH2_PROXY_COOKIE_SECRET
    value: "Kp8Q+aEK75iIu4DjNeYxqr6DtxtxUC2k"

extraVolumes:
  - name: home-ca
    configMap:
      name: home-ca-bundle
extraVolumeMounts:
  - name: home-ca
    mountPath: /etc/ssl/home-ca
    readOnly: true

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi

replicaCount: 1

podDisruptionBudget:
  enabled: false

gatewayApi:
  enabled: false
ingress:
  enabled: false
