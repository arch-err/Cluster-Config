# arr-oauth2-readarr — chart: oauth2-proxy/oauth2-proxy v10.4.3
# Sibling of arr-oauth2-prowlarr — same chart, distinct OIDC client.
# Consumes `readarr-oidc-client` (rendered by the readarr Application's
# oidc:* block in apps.yaml; pocket-id client id=`readarr`, restricted to
# apps_users + administrators at the IDP level on top of the oauth2-proxy
# --allowed-group flags below).
#
# See arr-oauth2-prowlarr.yaml for the rationale on /api/ bypass and External
# auth. Cookie secret sourced from SopsSecret `arr-oauth2-readarr-cookie` in
# the arr ns (kubernetes/secrets/apps/arr-oauth2-readarr-cookie.yaml).

fullnameOverride: oauth2-readarr

image:
  tag: "v7.15.2"

proxyVarsAsSecrets: false

config:
  clientID: ""
  clientSecret: ""
  cookieSecret: ""
  emailDomains: ["*"]

extraArgs:
  - --provider=oidc
  - --provider-display-name=Pocket ID
  - --skip-provider-button=true
  - --code-challenge-method=S256
  - --insecure-oidc-allow-unverified-email=true
  - --skip-oidc-discovery=false
  - --http-address=0.0.0.0:4180
  - --reverse-proxy=true
  - --real-client-ip-header=X-Forwarded-For
  # Single upstream — readarr in-cluster service.
  - --upstream=http://readarr.arr.svc.cluster.local:8787
  - --cookie-domain=readarr.apps.home
  - --cookie-secure=true
  - --cookie-samesite=lax
  # Distinct cookie name from sibling — clients are now per-app, no SSO.
  - --cookie-name=_readarr_oauth2_proxy
  - --allowed-group=apps_users
  - --allowed-group=administrators
  - --skip-auth-route=^/api/
  - --pass-user-headers=true
  - --set-xauthrequest=true
  - --pass-access-token=false
  - --email-domain=*
  - --provider-ca-file=/etc/ssl/home-ca/ca.crt

# Bootstrap Secret rendered by the readarr Application's oidc:* block.
extraEnv:
  - name: OAUTH2_PROXY_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: readarr-oidc-client
        key: client_id
  - name: OAUTH2_PROXY_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: readarr-oidc-client
        key: client_secret
  - name: OAUTH2_PROXY_OIDC_ISSUER_URL
    valueFrom:
      secretKeyRef:
        name: readarr-oidc-client
        key: issuer_url
  # No-SSO setup — distinct cookie secret from prowlarr sibling. From
  # SopsSecret `arr-oauth2-readarr-cookie` (same ns).
  - name: OAUTH2_PROXY_COOKIE_SECRET
    valueFrom:
      secretKeyRef:
        name: arr-oauth2-readarr-cookie
        key: cookie-secret

extraVolumes:
  - name: home-ca
    configMap:
      name: home-ca-bundle
extraVolumeMounts:
  - name: home-ca
    mountPath: /etc/ssl/home-ca
    readOnly: true

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi

replicaCount: 1

podDisruptionBudget:
  enabled: false

gatewayApi:
  enabled: false
ingress:
  enabled: false
