# paperless-ngx — chart: gabe565/paperless-ngx v0.24.1
# https://artifacthub.io/packages/helm/gabe565/paperless-ngx
#
# PILOT install — play-with-it deploy. NOT prod.
# Future prod work (per user): shared volumes for external file-manager,
# proper backups, SMTP, possibly external pg/redis. None of that here.
#
# Bundled bitnami postgres + redis subcharts (no persistence — emptyDir).
# Pilot data loss on pod restart is acceptable; will be reconfigured for prod.
#
# Bootstrap superuser + django secret_key + redis password come from the
# `paperless-ngx-secrets` SopsSecret (kubernetes/secrets/apps/paperless-ngx-secrets.yaml).
# Postgres password is generated by the bitnami subchart into its own Secret;
# we don't manage it (pilot-only, pg data is emptyDir anyway).
#
# OIDC: pocket-id via django-allauth's openid_connect provider. The bootstrap
# Secret `paperless-ngx-oidc-client` (auto-rendered by platform's
# oidc-bootstrap Job — see oidc:* block in apps.yaml) supplies client_id,
# client_secret, issuer_url. Paperless reads OIDC config from
# PAPERLESS_SOCIALACCOUNT_PROVIDERS, a literal JSON string parsed at django
# startup — there's no _FILE / placeholder mechanism. We render it at
# container start with envsubst over a configMap-mounted template
# (/etc/oidc-config/providers.json) using OIDC_CLIENT_ID etc. injected from
# the bootstrap secret. The home-ca trust bundle is mounted from the cluster-
# wide `home-ca-bundle` ConfigMap (broadcast by trust-manager) and pointed at
# via REQUESTS_CA_BUNDLE so paperless trusts auth.apps.home for OIDC
# discovery + token + userinfo calls.

image:
  tag: "2.14.7"

# Bitnami pulled images from docker.io/bitnami/* in 2025; we use the
# bitnamilegacy mirror for the bundled subcharts. Bitnami's NOTES.txt aborts
# rendering unless we explicitly opt-in via this flag.
global:
  security:
    allowInsecureImages: true

# Disable chart's built-in ingress — platform chart owns HTTPRoute.
ingress:
  main:
    enabled: false

# Wrap the upstream entrypoint (/sbin/docker-entrypoint.sh, CMD
# /usr/local/bin/paperless_cmd.sh) so we can render the OIDC providers JSON
# from the mounted template at container start. envsubst ships in the
# paperless image (gettext apt pkg).
command: ["/bin/sh", "-c"]
args:
  - |
    set -eu
    export PAPERLESS_SOCIALACCOUNT_PROVIDERS=$(envsubst < /etc/oidc-config/providers.json)
    exec /sbin/docker-entrypoint.sh /usr/local/bin/paperless_cmd.sh

# Paperless env. Bootstrap admin + secret key wired via envFrom from sops secret.
env:
  TZ: UTC
  PAPERLESS_TIME_ZONE: UTC
  PAPERLESS_OCR_LANGUAGE: eng
  # Comma-separated allowed CSRF / hosts. Wildcard for pilot (LAN-only via gateway).
  PAPERLESS_URL: "https://paperless.apps.home"
  PAPERLESS_CSRF_TRUSTED_ORIGINS: "https://paperless.apps.home"
  PAPERLESS_ALLOWED_HOSTS: "*"
  # Register django-allauth's OIDC provider as an installed django app.
  PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
  # Trust home-ca for OIDC HTTPS calls (auth.apps.home). Python requests +
  # urllib3 honor REQUESTS_CA_BUNDLE; that covers all of paperless's outbound
  # OIDC traffic.
  REQUESTS_CA_BUNDLE: /etc/ssl/home-ca/ca.crt
  # OIDC_* vars consumed by the entrypoint envsubst against
  # /etc/oidc-config/providers.json. issuer_url == https://auth.apps.home
  # (set by the platform oidc-bootstrap Job).
  OIDC_CLIENT_ID:
    valueFrom:
      secretKeyRef:
        name: paperless-ngx-oidc-client
        key: client_id
  OIDC_CLIENT_SECRET:
    valueFrom:
      secretKeyRef:
        name: paperless-ngx-oidc-client
        key: client_secret
  OIDC_ISSUER_URL:
    valueFrom:
      secretKeyRef:
        name: paperless-ngx-oidc-client
        key: issuer_url

envFrom:
  - secretRef:
      name: paperless-ngx-secrets

# ConfigMaps rendered by the chart and mounted via persistence below. The
# providers.json template uses ${VAR} envsubst syntax so the wrapper command
# can substitute the bootstrap-secret values at start. discovery-only — we
# set `server_url` (issuer) only; allauth fetches authorize/token/userinfo
# from /.well-known/openid-configuration. Provider id is `pocket-id`, which
# is the path segment in the callback URL registered with the OIDC client:
#   https://paperless.apps.home/accounts/oidc/pocket-id/login/callback/
configMaps:
  oidc-config:
    enabled: true
    data:
      providers.json: |
        {
          "openid_connect": {
            "APPS": [
              {
                "provider_id": "pocket-id",
                "name": "Pocket ID",
                "client_id": "${OIDC_CLIENT_ID}",
                "secret": "${OIDC_CLIENT_SECRET}",
                "settings": {
                  "server_url": "${OIDC_ISSUER_URL}",
                  "token_auth_method": "client_secret_post"
                }
              }
            ],
            "SCOPE": ["openid", "profile", "email", "groups"],
            "EMAIL_AUTHENTICATION": true
          }
        }

# Persistence — modest pilot sizes on kadalu.replica2 (default storageClass).
# We extend the chart's data/media/consume/export entries with two read-only
# volumes for the OIDC providers template + the home-ca trust bundle.
persistence:
  data:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi
  media:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
  consume:
    enabled: true
    accessMode: ReadWriteOnce
    size: 2Gi
  export:
    enabled: true
    accessMode: ReadWriteOnce
    size: 2Gi
  # OIDC providers JSON template (rendered above as configMaps.oidc-config).
  oidc-config:
    enabled: true
    type: configMap
    name: paperless-ngx-oidc-config  # chart prefixes release name; this matches.
    mountPath: /etc/oidc-config
    readOnly: true
  # home-ca trust bundle (broadcast by trust-manager into every ns).
  home-ca:
    enabled: true
    type: configMap
    name: home-ca-bundle
    mountPath: /etc/ssl/home-ca
    readOnly: true

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 2Gi

# Bundled bitnami postgres — pilot only, NO persistence (emptyDir).
# Avoids kadalu chown init headache; data wipes on pod restart, fine for pilot.
# Bitnami pulled their tagged images from docker.io/bitnami/* (Aug 2025); use
# bitnamilegacy mirror with a pinned debian-12 r-tag.
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.2.0-debian-12-r9
  auth:
    database: paperless
    # No `username:` override → chart's `paperless` deploy connects as the
    # `postgres` superuser using auto-generated postgresPassword. Pilot only;
    # for prod we'd add a dedicated `paperless` user with its own password.
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

# Bundled bitnami redis — pilot only, NO persistence (emptyDir).
redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.4.2-debian-12-r9
  auth:
    enabled: true
  master:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  replica:
    replicaCount: 0
