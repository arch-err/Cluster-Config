# paperless-ngx — chart: gabe565/paperless-ngx v0.24.1
# https://artifacthub.io/packages/helm/gabe565/paperless-ngx
#
# PILOT install — play-with-it deploy. NOT prod.
# Future prod work (per user): shared volumes for external file-manager,
# proper backups, SMTP, possibly external pg/redis. None of that here.
#
# Bundled bitnami postgres + redis subcharts (no persistence — emptyDir).
# Pilot data loss on pod restart is acceptable; will be reconfigured for prod.
#
# Bootstrap superuser + django secret_key + redis password come from the
# `paperless-ngx-secrets` SopsSecret (kubernetes/secrets/apps/paperless-ngx-secrets.yaml).
# Postgres password is generated by the bitnami subchart into its own Secret;
# we don't manage it (pilot-only, pg data is emptyDir anyway).

image:
  tag: "2.14.7"

# Disable chart's built-in ingress — platform chart owns HTTPRoute.
ingress:
  main:
    enabled: false

# Paperless env. Bootstrap admin + secret key wired via envFrom from sops secret.
env:
  TZ: UTC
  PAPERLESS_TIME_ZONE: UTC
  PAPERLESS_OCR_LANGUAGE: eng
  # Comma-separated allowed CSRF / hosts. Wildcard for pilot (LAN-only via gateway).
  PAPERLESS_URL: "https://paperless.apps.home"
  PAPERLESS_CSRF_TRUSTED_ORIGINS: "https://paperless.apps.home"
  PAPERLESS_ALLOWED_HOSTS: "*"

envFrom:
  - secretRef:
      name: paperless-ngx-secrets

# Persistence — modest pilot sizes on kadalu.replica2 (default storageClass).
persistence:
  data:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi
  media:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
  consume:
    enabled: true
    accessMode: ReadWriteOnce
    size: 2Gi
  export:
    enabled: true
    accessMode: ReadWriteOnce
    size: 2Gi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 2Gi

# Bundled bitnami postgres — pilot only, NO persistence (emptyDir).
# Avoids kadalu chown init headache; data wipes on pod restart, fine for pilot.
# Bitnami pulled their tagged images from docker.io/bitnami/* (Aug 2025); use
# bitnamilegacy mirror with a pinned debian-12 r-tag.
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.2.0-debian-12-r9
  auth:
    database: paperless
    username: paperless
    # postgresPassword auto-generated by the chart; chart wires it into
    # PAPERLESS_DBPASS automatically via the `paperless-postgresql` Secret.
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

# Bundled bitnami redis — pilot only, NO persistence (emptyDir).
redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.4.2-debian-12-r9
  auth:
    enabled: true
  master:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  replica:
    replicaCount: 0
