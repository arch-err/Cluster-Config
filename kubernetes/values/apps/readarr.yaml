# readarr — chart: bjw-s/app-template v4.6.2 (generic container wrapper)
# Book / audiobook manager — fork of Sonarr. Watches wanted-list, queries
# Prowlarr for releases, sends torrents to qBittorrent, post-processes finished
# downloads into /library.
# Upstream: https://wiki.servarr.com/readarr  Image: linuxserver/readarr (develop).
#
# Mounts:
#   /config        — own RWO PVC (sqlite + settings)
#   /downloads     — kadalu RWX PVC `media-downloads` (shared subvol w/ qbittorrent ns)
#   /library       — kadalu RWX PVC `media-library` (shared subvol w/ qbittorrent ns)
# Cross-ns sharing via two static kadalu PVs per subvol — see platform extras.
# Hardlinks within each mount work natively (single fs per mount).
# Lives in the `arr` namespace.

controllers:
  main:
    strategy: Recreate
    containers:
      app:
        image:
          # readarr only ships :develop / :nightly (see linuxserver docs).
          # Pinned to a specific dated develop tag for reproducibility.
          repository: lscr.io/linuxserver/readarr
          tag: "develop-version-0.4.18.2805"
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: "Europe/Amsterdam"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8787
              initialDelaySeconds: 30
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8787
              initialDelaySeconds: 10
              periodSeconds: 15
          startup:
            enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        # linuxserver s6-overlay starts as root, uses s6-applyuidgid to drop to
        # PUID:PGID. Dropping ALL caps removes SETUID/SETGID and breaks the
        # privilege drop. Baseline PSS allows the default cap set, leave it.
        securityContext:
          allowPrivilegeEscalation: false

service:
  main:
    controller: main
    ports:
      http:
        port: 8787
        targetPort: 8787

persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      main:
        app:
          - path: /config
  # Both PVCs are static kadalu PVs sharing subvol paths with qbittorrent ns
  # (see platform extras). Same backing data, hardlink-safe within each mount.
  downloads:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-downloads
    advancedMounts:
      main:
        app:
          - path: /downloads
  library:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-library
    advancedMounts:
      main:
        app:
          - path: /library
