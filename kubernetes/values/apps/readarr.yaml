# readarr — chart: bjw-s/app-template v4.6.2 (generic container wrapper)
# Book / audiobook manager — fork of Sonarr. Watches wanted-list, queries
# Prowlarr for releases, sends torrents to qBittorrent, post-processes finished
# downloads into /library.
# Upstream: https://github.com/Faustvii/Readarr  (community fork — original
# Servarr Readarr was retired). The fork is the canonical drop-in for use
# with rreading-glasses metadata: it points at api.bookinfo.pro by default
# and uses the route shape that rreading-glasses actually serves
# (`/book/bulk`, `/search`, `/author/{id}`, …). The original
# linuxserver/readarr image POSTs `/v1/book/bulk`, which doesn't exist on
# rreading-glasses → falls through to its swagger UI handler →  HTTP 200
# with HTML body → readarr fails to parse with the catch-all error
# "Unable to communicate with ReadarrAPI, returning status code: OK".
#
# Mounts:
#   /config        — own RWO PVC (sqlite + settings)
#   /downloads     — kadalu RWX PVC `media-downloads` (shared subvol w/ qbittorrent ns)
#   /library       — kadalu RWX PVC `media-library` (shared subvol w/ qbittorrent ns)
# Cross-ns sharing via two static kadalu PVs per subvol — see platform extras.
# Hardlinks within each mount work natively (single fs per mount).
# Lives in the `arr` namespace.
#
# Metadata mirror: Faustvii's binary defaults to https://api.bookinfo.pro/.
# We self-host blampe/rreading-glasses in the `bookinfo` ns and intercept
# both api.bookinfo.pro and the legacy api.bookinfo.club via four pieces:
#   1. CoreDNS rewrites api.bookinfo.pro (and api.bookinfo.club, kept as a
#      legacy fallback) → bookinfo-tls.bookinfo.svc.cluster.local
#      (see platform/templates/extras.yaml Corefile).
#   2. The bookinfo pod's nginx-tls sidecar serves a home-ca-issued cert
#      with SANs api.bookinfo.pro + api.bookinfo.club (cert-manager
#      Certificate `bookinfo-api-tls`).
#   3. This file mounts the cluster-broadcast home-ca-bundle and points .NET
#      at the merged trust file via SSL_CERT_FILE (init container + emptyDir).
# Result: zero readarr-side configuration changes, transparent over the wire.

controllers:
  main:
    strategy: Recreate
    # ─────────────────────────────────────────────────────────────────────
    # ca-bundle initContainer — merges home-ca-bundle into a writable CA
    # bundle and exposes it to the main readarr container via SSL_CERT_FILE.
    #
    # WHY: readarr's outbound HTTPS (notably to https://api.bookinfo.pro/,
    # which we self-host on the cluster — see kubernetes/values/infra/bookinfo.yaml
    # for the full architecture) hits a home-ca-signed cert. The Faustvii
    # alpine + .NET runtime trusts the alpine system CA bundle by default
    # (no public CAs => OK for goodreads scraping path, which goes server-side
    # FROM rreading-glasses, not from readarr). To trust home-ca *and* keep
    # public CAs working for any direct readarr→internet TLS, we concat the
    # alpine bundle with home-ca's ca.crt into an emptyDir and point .NET at
    # the merged file via SSL_CERT_FILE. .NET 5+ on Linux respects
    # SSL_CERT_FILE / SSL_CERT_DIR (OpenSSL semantics).
    initContainers:
      ca-bundle:
        image:
          repository: docker.io/library/alpine
          tag: "3.20"
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            cat /etc/ssl/certs/ca-certificates.crt /home-ca/ca.crt \
              > /merged-ca/ca-bundle.crt
            echo "[ca-bundle] wrote /merged-ca/ca-bundle.crt ($(wc -l < /merged-ca/ca-bundle.crt) lines)"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop: [ALL]
    containers:
      app:
        image:
          # Faustvii community fork of Readarr — the only fork we should be
          # using long-term (the original Servarr Readarr is archived).
          # Backwards-compatible with existing /config sqlite DBs and the
          # linuxserver layout — confirmed by the upstream FORKS table.
          # Pinned to a release tag (not :latest) for reproducibility.
          repository: ghcr.io/faustvii/readarr
          tag: "0.9.1"
        env:
          # Faustvii image runs as `nobody` by default; we override the
          # securityContext below to uid 1000 to keep PVC ownership stable
          # with the previous linuxserver image. No PUID/PGID/TZ env — the
          # Faustvii entrypoint is a direct exec of /app/bin/Readarr (no
          # s6-overlay), TZ comes from /etc/timezone via tzdata in image.
          TZ: "Europe/Amsterdam"
          # Trust home-ca for outbound HTTPS — needed for the in-cluster
          # api.bookinfo.pro (rreading-glasses w/ home-ca-issued cert).
          # SSL_CERT_FILE points at the init-container-built merged bundle
          # (alpine system CAs + home-ca). .NET on Linux honors this env var.
          SSL_CERT_FILE: /merged-ca/ca-bundle.crt
          # Override config.xml's ApiKey (.NET IOptions binding picks up
          # READARR__AUTH__APIKEY → config.Auth.ApiKey). Lets us declare the
          # API key via SopsSecret so configarr / prowlarr-bootstrap CronJobs
          # know it without scraping the live config.xml.
          READARR__AUTH__APIKEY:
            valueFrom:
              secretKeyRef:
                name: arr-api-keys
                key: readarr_apikey
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8787
              initialDelaySeconds: 30
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8787
              initialDelaySeconds: 10
              periodSeconds: 15
          startup:
            enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        # Faustvii image is non-root-clean (Dockerfile USER nobody:nogroup,
        # entrypoint is a direct catatonit exec, no s6-overlay). Restricted
        # PSS friendly. Lock down explicitly. We pin uid/gid to 1000 (matches
        # the legacy linuxserver PUID:PGID we ran with previously) so the
        # existing /config PVC + the shared kadalu /downloads + /library
        # PVCs (also written by qbittorrent under uid 1000) all keep working
        # without a chown migration step.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false   # Readarr writes to /tmp + /config
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault

# fsGroup so the writable /config PVC mounts are owned 1000:1000 on first
# attach (idempotent on subsequent attaches via OnRootMismatch).
defaultPodOptions:
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  main:
    controller: main
    ports:
      http:
        port: 8787
        targetPort: 8787

# RECLAIM: PVs patched to Retain on 2026-05-17 — see docs/pvc-reclaim-policy.md
persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      main:
        app:
          - path: /config
  # Both PVCs are static kadalu PVs sharing subvol paths with qbittorrent ns
  # (see platform extras). Same backing data, hardlink-safe within each mount.
  downloads:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-downloads
    advancedMounts:
      main:
        app:
          - path: /downloads
  library:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-library
    advancedMounts:
      main:
        app:
          - path: /library
  # home-ca trust bundle (broadcast by trust-manager into every ns as a CM
  # named home-ca-bundle, key ca.crt). Read-only mount; consumed by the
  # ca-bundle init container which concats it onto the alpine system bundle.
  home-ca:
    enabled: true
    type: configMap
    name: home-ca-bundle
    advancedMounts:
      main:
        ca-bundle:
          - path: /home-ca
            readOnly: true
  # emptyDir holding the merged CA bundle the init container produces.
  # Mounted at /merged-ca on both containers; main app reads via SSL_CERT_FILE.
  merged-ca:
    type: emptyDir
    advancedMounts:
      main:
        ca-bundle:
          - path: /merged-ca
        app:
          - path: /merged-ca
