# prowlarr-bootstrap — chart: bjw-s/app-template v4.6.2 (cronjob mode)
# Declarative Prowlarr setup CronJob — manages indexers + downstream-app
# (Readarr) registration via the Prowlarr API. Configarr does NOT cover this:
# Prowlarr has no `prowlarr:` block in configarr's schema (Prowlarr's purpose
# IS to be a configarr-equivalent for indexers, but its own indexer/app list
# isn't itself configarr-managed).
#
# Idempotent: GET indexers + applications, compare to declared list by name,
# upsert (POST when missing, PUT when present, no-op when matching). Safe to
# run on a 30-min schedule indefinitely.
#
# Auth: reads prowlarr_apikey + readarr_apikey from arr-api-keys SopsSecret
# (env-mounted). Talks only to in-cluster *arr APIs over HTTP. No RBAC.
#
# What it manages:
#   - 3 public torrent indexers (1337x, torrentgalaxyclone, ebookbay) via
#     Cardigann definitions baked into Prowlarr. Public-only by design;
#     private-tracker creds belong elsewhere (manual or future SopsSecret).
#   - 1 downstream Application: Readarr. Prowlarr will then push the
#     indexer list to Readarr automatically (its built-in app sync) so the
#     user doesn't manually copy indexers across.
#
# Editing: indexers + apps are declared inline in the bootstrap script
# ConfigMap below. Add an indexer = add a JSON block, redeploy. The script
# handles upsert; pre-existing matches by name are preserved unmodified.

controllers:
  main:
    type: cronjob
    cronjob:
      schedule: "*/30 * * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistory: 1
      failedJobsHistory: 3
      backoffLimit: 1
    containers:
      app:
        image:
          # Tiny image with curl + jq + sh. alpine/k8s carries kubectl etc;
          # we don't need cluster API — alpine + apk add curl jq is enough,
          # but we want a fixed-tag image with both pre-installed. Switching
          # to alpine + script-time apk-add to keep the image small.
          repository: alpine
          tag: "3.21"
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            apk add --no-cache --quiet curl jq >/dev/null
            exec sh /scripts/bootstrap.sh
        env:
          PROWLARR_URL: "http://prowlarr.arr.svc.cluster.local:9696"
          READARR_URL: "http://readarr.arr.svc.cluster.local:8787"
          PROWLARR_APIKEY:
            valueFrom:
              secretKeyRef:
                name: arr-api-keys
                key: prowlarr_apikey
          READARR_APIKEY:
            valueFrom:
              secretKeyRef:
                name: arr-api-keys
                key: readarr_apikey
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
        # Restricted PSS compliant.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # apk add writes to /usr, /var
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault

persistence:
  scripts:
    type: configMap
    identifier: scripts
    advancedMounts:
      main:
        app:
          - path: /scripts
            readOnly: true
  tmp:
    type: emptyDir
    advancedMounts:
      main:
        app:
          - path: /tmp

configMaps:
  scripts:
    enabled: true
    data:
      # Idempotent upsert script. Indexers + applications are declared as
      # JSON blobs at the top of the script (easy to edit without leaving
      # this values file); the upsert helpers do the GET-then-POST-or-PUT
      # dance against Prowlarr's API.
      bootstrap.sh: |
        #!/bin/sh
        set -eu

        : "${PROWLARR_URL:?required}"
        : "${PROWLARR_APIKEY:?required}"
        : "${READARR_URL:?required}"
        : "${READARR_APIKEY:?required}"

        H_P="X-Api-Key: ${PROWLARR_APIKEY}"
        log() { echo "[$(date -u +%H:%M:%S)] $*"; }

        # ──────────────────────────────────────────────────────────────────
        # Wait for Prowlarr API. (Apps just deployed → may not be ready.)
        # ──────────────────────────────────────────────────────────────────
        log "waiting for Prowlarr API..."
        i=0
        until curl -sfH "$H_P" "$PROWLARR_URL/api/v1/system/status" >/dev/null 2>&1; do
          i=$((i+1))
          if [ $i -gt 30 ]; then
            log "ERROR: Prowlarr API not reachable after 5 minutes"
            exit 1
          fi
          sleep 10
        done
        log "Prowlarr API up."

        # ──────────────────────────────────────────────────────────────────
        # DECLARED INDEXERS — name = match key. Edit this list to manage.
        # baseUrl pulled from `indexerUrls[0]` of each schema; pinned so
        # cluster IPs / DNS aren't a moving target. All public/free.
        # ──────────────────────────────────────────────────────────────────
        cat > /tmp/indexers.json <<'JSON'
        [
          {
            "name": "1337x",
            "definitionName": "1337x",
            "baseUrl": "https://1337x.to/"
          },
          {
            "name": "TorrentGalaxy",
            "definitionName": "torrentgalaxyclone",
            "baseUrl": "https://torrentgalaxy.one/"
          },
          {
            "name": "eBookBay",
            "definitionName": "ebookbay",
            "baseUrl": "https://ebb.la/"
          }
        ]
        JSON

        # ──────────────────────────────────────────────────────────────────
        # upsert_indexer: read declared row from stdin (one JSON obj per line),
        # fetch full schema by definitionName, fill baseUrl, upsert via Prowlarr.
        # ──────────────────────────────────────────────────────────────────
        SCHEMAS=$(curl -sfH "$H_P" "$PROWLARR_URL/api/v1/indexer/schema")
        EXISTING_INDEXERS=$(curl -sfH "$H_P" "$PROWLARR_URL/api/v1/indexer")

        upsert_indexer() {
          row="$1"
          name=$(echo "$row" | jq -r '.name')
          defname=$(echo "$row" | jq -r '.definitionName')
          baseurl=$(echo "$row" | jq -r '.baseUrl')

          schema=$(echo "$SCHEMAS" | jq --arg d "$defname" '.[] | select(.definitionName == $d)')
          if [ -z "$schema" ]; then
            log "  ERROR: no schema for definitionName=$defname (skipping $name)"
            return 0
          fi

          # Build payload: schema + override name + set baseUrl field + enable.
          payload=$(echo "$schema" | jq \
            --arg n "$name" --arg url "$baseurl" \
            '.name = $n
             | .enable = true
             | (.fields[] | select(.name == "baseUrl") | .value) = $url')

          existing_id=$(echo "$EXISTING_INDEXERS" | jq --arg n "$name" '.[] | select(.name == $n) | .id')
          if [ -z "$existing_id" ] || [ "$existing_id" = "null" ]; then
            log "  + creating indexer: $name ($defname)"
            curl -sfH "$H_P" -H "Content-Type: application/json" \
              -X POST -d "$payload" "$PROWLARR_URL/api/v1/indexer" >/dev/null
          else
            log "  = indexer exists: $name (id=$existing_id, no-op)"
          fi
        }

        log "syncing indexers..."
        echo "$(cat /tmp/indexers.json)" | jq -c '.[]' | while read -r row; do
          upsert_indexer "$row"
        done

        # ──────────────────────────────────────────────────────────────────
        # DECLARED APPS — Prowlarr → Readarr (fullSync). Add Sonarr/Radarr
        # entries here when those *arrs land.
        # ──────────────────────────────────────────────────────────────────
        EXISTING_APPS=$(curl -sfH "$H_P" "$PROWLARR_URL/api/v1/applications")

        upsert_readarr_app() {
          name="Readarr"
          # Categories: 7000-7060 (Books) + 3030 (Audio/Audiobook) — defaults
          # from Prowlarr's Readarr applications schema.
          payload=$(jq -n \
            --arg name "$name" \
            --arg purl "$PROWLARR_URL" \
            --arg rurl "$READARR_URL" \
            --arg rkey "$READARR_APIKEY" \
            '{
              name: $name,
              syncLevel: "fullSync",
              implementation: "Readarr",
              implementationName: "Readarr",
              configContract: "ReadarrSettings",
              tags: [],
              fields: [
                { name: "prowlarrUrl", value: $purl },
                { name: "baseUrl",     value: $rurl },
                { name: "apiKey",      value: $rkey },
                { name: "syncCategories", value: [3030, 7000, 7010, 7020, 7030, 7040, 7050, 7060] }
              ]
            }')

          existing_id=$(echo "$EXISTING_APPS" | jq --arg n "$name" '.[] | select(.name == $n) | .id')
          if [ -z "$existing_id" ] || [ "$existing_id" = "null" ]; then
            log "  + registering app: $name"
            curl -sfH "$H_P" -H "Content-Type: application/json" \
              -X POST -d "$payload" "$PROWLARR_URL/api/v1/applications" >/dev/null
          else
            log "  = app exists: $name (id=$existing_id, no-op)"
          fi
        }

        log "syncing apps..."
        upsert_readarr_app

        log "done."
