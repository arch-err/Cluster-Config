# arr-oauth2-prowlarr — chart: oauth2-proxy/oauth2-proxy v10.4.3
# OAuth2 forward-auth proxy fronting prowlarr (arr ns). One of two sibling
# oauth2-proxy releases (the other fronts readarr); both share a single
# pocket-id OIDC client `arr-oauth2-prowlarr` (registered via the platform
# oidc-bootstrap Job — see oidc:* block in apps.yaml). The shared cookie
# domain `.apps.home` + matching cookie-secret + matching client_id makes
# the session usable across all *.apps.home arr subdomains (one login →
# SSO across prowlarr/readarr).
#
# AUTH BYPASS for /api/* — *arr APIs (used by mobile apps like LunaSea and
# cross-arr sync between prowlarr↔readarr) authenticate via X-Api-Key
# header. We skip oauth2-proxy on /api/* so those flows keep working;
# prowlarr/readarr enforce X-Api-Key themselves on those paths.
#
# AUTHENTICATION-METHOD = External: each *arr's config.xml must be set to
# "External" (Settings → General → Authentication = External) via the UI
# AFTER the oauth2-proxy is fronting it. This skips the *arr's own login
# form and trusts the X-Forwarded-User header set by oauth2-proxy.
#
# COOKIE SECRET DRIFT: cookieSecret below is a generated literal — should
# be migrated into a SopsSecret and referenced via existingSecret. Flagged
# in the report. SAME literal used in arr-oauth2-readarr.yaml; if rotated
# both must be updated together.

fullnameOverride: oauth2-prowlarr

image:
  tag: "v7.15.2"

# We supply OIDC creds via extraEnv (from the platform-bootstrap Secret) and
# the cookie-secret via extraEnv too. Disable the chart's auto-rendered
# secret + auto-env injection; everything comes through extraEnv below.
proxyVarsAsSecrets: false

config:
  # Avoid the chart attempting to populate its own Secret with placeholder
  # client/cookie values — we don't reference it.
  clientID: ""
  clientSecret: ""
  cookieSecret: ""
  # Don't render the legacy oauth2_proxy.cfg from the auto-generated path;
  # we drive everything via flags in extraArgs. emailDomains kept permissive.
  emailDomains: ["*"]

# All oauth2-proxy flags. List-form (NOT a map) so we can repeat keys if
# needed and keep ordering deterministic in the rendered Deployment args.
extraArgs:
  - --provider=oidc
  - --provider-display-name=Pocket ID
  # Skip oauth2-proxy's "Sign in with Pocket ID" page — auto-redirect to OIDC.
  - --skip-provider-button=true
  # Pocket-id has pkceEnabled=true on the registered client; oauth2-proxy
  # must send a code_verifier or token exchange returns "Invalid code verifier".
  - --code-challenge-method=S256
  # Pocket-id doesn't set `email_verified: true` in id_tokens; oauth2-proxy
  # rejects unverified emails by default. Safe to skip — passkey auth at
  # pocket-id is itself the verification gate.
  - --insecure-oidc-allow-unverified-email=true
  # Discovery URL — chart-derived from $OAUTH2_PROXY_OIDC_ISSUER_URL via
  # extraEnv (issuer_url == https://auth.apps.home, set by bootstrap).
  - --skip-oidc-discovery=false
  # Required HTTP listener; defaults are http=4180, https=4443. We use http
  # only (gateway terminates TLS upstream of us).
  - --http-address=0.0.0.0:4180
  - --reverse-proxy=true
  # Trust X-Forwarded-* from cilium gateway (which is the only ingress).
  - --real-client-ip-header=X-Forwarded-For
  # Single upstream — prowlarr in-cluster service.
  - --upstream=http://prowlarr.arr.svc.cluster.local:9696
  # Cookie shared across *.apps.home for SSO between arr-oauth2-* releases.
  - --cookie-domain=.apps.home
  - --cookie-secure=true
  - --cookie-samesite=lax
  # Match the sibling release's cookie name so the same cookie validates on
  # both. Without this, each release defaults to its own release-name cookie
  # and SSO fails.
  - --cookie-name=_arr_oauth2_proxy
  # Allow any pocket-id user with one of these groups. Aligns with the
  # apps-users / Administrators tier from grafana/immich precedent.
  - --allowed-group=apps_users
  - --allowed-group=administrators
  # Bypass auth on *arr API paths (mobile apps, cross-arr API). *arr enforces
  # X-Api-Key on these paths itself.
  - --skip-auth-route=^/api/
  # Pass the authenticated identity downstream so *arr sees `External` auth.
  - --pass-user-headers=true
  - --set-xauthrequest=true
  - --pass-access-token=false
  # Email domain wildcard — pocket-id supplies whatever the user's email is.
  - --email-domain=*
  # Use the home-ca trust bundle so back-channel calls to auth.apps.home
  # (discovery, token, userinfo) verify cleanly. Mounted via extraVolumes.
  - --provider-ca-file=/etc/ssl/home-ca/ca.crt

# Inject OIDC creds + cookie secret. CLIENT_ID/SECRET come from the
# platform-bootstrap Secret `arr-oauth2-prowlarr-oidc-client`. ISSUER_URL is
# also in that Secret. cookie secret is a literal here (DRIFT — should be
# SOPS'd; see file header).
extraEnv:
  - name: OAUTH2_PROXY_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: arr-oauth2-prowlarr-oidc-client
        key: client_id
  - name: OAUTH2_PROXY_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: arr-oauth2-prowlarr-oidc-client
        key: client_secret
  - name: OAUTH2_PROXY_OIDC_ISSUER_URL
    valueFrom:
      secretKeyRef:
        name: arr-oauth2-prowlarr-oidc-client
        key: issuer_url
  # COOKIE SECRET LITERAL — see file header DRIFT note. 32-char raw string.
  - name: OAUTH2_PROXY_COOKIE_SECRET
    value: "Kp8Q+aEK75iIu4DjNeYxqr6DtxtxUC2k"

# Mount cluster-wide home-ca trust bundle (broadcast by trust-manager into
# every ns). oauth2-proxy is a Go binary; SSL_CERT_FILE / system trust
# wouldn't help with Go's default cert pool — we instead point oauth2-proxy
# at this CA via --provider-ca-file (set above).
extraVolumes:
  - name: home-ca
    configMap:
      name: home-ca-bundle
extraVolumeMounts:
  - name: home-ca
    mountPath: /etc/ssl/home-ca
    readOnly: true

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi

# Single replica is fine — prowlarr is single-user/low-traffic. Avoids
# session-state coordination across pods (oauth2-proxy uses cookie-only
# session by default, but PDB still wants minAvailable=1).
replicaCount: 1

podDisruptionBudget:
  enabled: false

# We don't use the chart's HTTPRoute — platform chart owns that.
gatewayApi:
  enabled: false
ingress:
  enabled: false
