# prowlarr — chart: bjw-s/app-template v4.6.2 (generic container wrapper)
# Universal indexer manager/proxy that aggregates trackers and feeds *arr apps.
# Upstream: https://wiki.servarr.com/prowlarr  Image: linuxserver/prowlarr.
#
# Single container, single PVC for /config (sqlite + settings).
# Lives in the shared `arr` namespace (baseline PSS — see extras.arr in apps.yaml)
# alongside readarr + qbittorrent+gluetun.

controllers:
  main:
    strategy: Recreate          # sqlite on RWO PVC
    containers:
      app:
        image:
          # linuxserver tags are <upstream>-ls<build>; bare "1.39.4" doesn't exist.
          repository: lscr.io/linuxserver/prowlarr
          tag: "2.3.5.5327-ls144"
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: "Europe/Amsterdam"
          # Override config.xml's ApiKey (.NET IOptions binding picks up
          # PROWLARR__AUTH__APIKEY → config.Auth.ApiKey). Lets us declare the
          # API key via SopsSecret so configarr / prowlarr-bootstrap CronJobs
          # know it without scraping the live config.xml.
          PROWLARR__AUTH__APIKEY:
            valueFrom:
              secretKeyRef:
                name: arr-api-keys
                key: prowlarr_apikey
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 9696
              initialDelaySeconds: 30
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 9696
              initialDelaySeconds: 10
              periodSeconds: 15
          startup:
            enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        # linuxserver s6-overlay starts as root, uses s6-applyuidgid to drop to
        # PUID:PGID. Dropping ALL caps removes SETUID/SETGID and breaks the
        # privilege drop. Baseline PSS allows the default cap set, leave it.
        securityContext:
          allowPrivilegeEscalation: false

service:
  main:
    controller: main
    ports:
      http:
        port: 9696
        targetPort: 9696

persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      main:
        app:
          - path: /config
