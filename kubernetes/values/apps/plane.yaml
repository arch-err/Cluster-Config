# Plane CE configuration
# Project management for S.T.A.R. Labs

# Pin version — never use 'stable'
planeVersion: "v2.4.0"

# Disable built-in ingress — we use Gateway API via platform chart
ingress:
  enabled: false

# Storage class for all PVCs
postgres:
  storageClass: kadalu.replica2

redis:
  storageClass: kadalu.replica2

minio:
  storageClass: kadalu.replica2

rabbitmq:
  storageClass: kadalu.replica2

# Local infrastructure services
services:
  postgres:
    local_setup: true
    volumeSize: 5Gi
  redis:
    local_setup: true
    image: valkey/valkey:7.2.11-alpine
    volumeSize: 500Mi
  rabbitmq:
    local_setup: true
  minio:
    local_setup: true
    volumeSize: 5Gi

# Environment
env:
  pgdb_username: plane
  pgdb_name: plane
  docstore_bucket: uploads
  doc_upload_size_limit: "5242880"
