# Matrix Synapse — S.T.A.R. Labs Comms
# Chart: halkeye/synapse

# Scale down workers for homelab use
replicaCounts:
  master: 1
  generic_worker: 0
  federation_sender: 0

# Disable chart ingress — Gateway API handles TLS
ingress:
  enabled: false

# Pod security context (restricted PSS compliant)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 991
  runAsGroup: 991
  fsGroup: 991
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 991
  seccompProfile:
    type: RuntimeDefault

# Skip extra python modules — they require root for pip/apt
extra_python_modules: []

# Persistence for Synapse data
persistence:
  enabled: true
  storageClassName: kadalu.replica2
  accessModes:
    - ReadWriteOnce
  size: 5Gi

# Database — use Bitnami PostgreSQL subchart
database:
  mode: postgresql
  host: matrix-postgresql
  port: 5432
  name: synapse
  username: synapse
  password: speed-force-9000

postgresql:
  enabled: true
  image:
    tag: 16-debian-12
  auth:
    username: synapse
    password: speed-force-9000
    database: synapse
  primary:
    persistence:
      enabled: true
      storageClass: kadalu.replica2
      size: 5Gi
    podSecurityContext:
      enabled: true
      fsGroup: 1001
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

# Redis
redis:
  enabled: true
  image:
    tag: 7-debian-12
  auth:
    password: riches-jarring-acts
  master:
    podSecurityContext:
      enabled: true
      fsGroup: 1001
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  replica:
    podSecurityContext:
      enabled: true
      fsGroup: 1001
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

# Synapse settings
settings:
  uid: "991"
  gid: "991"
  report_stats: "no"

# Homeserver configuration
homeserver:
  # Disable workers for single-instance homelab
  send_federation: true
  instance_map: {}
  federation_sender_instances: []
  outbound_federation_restricted_to: []

  redis:
    enabled: false

  server_name: "matrix.apps.home"
  public_baseurl: "https://matrix.apps.home/"
  serve_client_wellknown: true

  enable_registration: true
  enable_registration_without_verification: true

  registration_shared_secret: "speed-force-9000"

  suppress_key_server_warning: true

  listeners:
    - port: 8008
      tls: false
      type: http
      x_forwarded: true
      resources:
        - names: [client, federation]
          compress: false
