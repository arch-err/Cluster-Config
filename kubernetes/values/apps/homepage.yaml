# homepage — chart: jameswynn/homepage v2.1.0 (gethomepage)
# https://artifacthub.io/packages/helm/jameswynn/homepage

# Pin app image tag for reproducibility (chart default tracks v1.2.0 at chart 2.1.0)
image:
  tag: v1.2.0

# Next.js host validation — must list every Host header the app will see.
# Without this, requests fail with "Host validation failed for: <host>" and the UI
# shows app-errors. Comma-separated, no scheme, no port unless non-default.
env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "homepage.apps.home"

# Disable chart's built-in ingress — platform chart's HTTPRoute handles routing
ingress:
  main:
    enabled: false

# RBAC: ServiceAccount with cluster-wide read on Gateway API + core resources.
# Required for auto-discovery to enumerate HTTPRoutes across all namespaces.
serviceAccount:
  create: true
  name: homepage
enableRbac: true

# Cluster-wide kubernetes integration:
#   - mode=cluster: in-cluster service account (uses RBAC above)
#   - gateway=true: discover Gateway API HTTPRoutes (not just classic Ingress)
config:
  kubernetes:
    mode: cluster
    ingress: false   # we don't use classic Ingress — only HTTPRoute
    gateway: true
    services: true   # also discover Service-level annotations as a fallback

  # Layout: groups are auto-built from gethomepage.dev/group annotations on routes.
  # Empty services.yaml means: render only what's annotated.
  services: []

  # Cross-link to the infrastructure dashboard.
  bookmarks:
    - Other dashboards:
        - Infrastructure Homepage:
            - abbr: II
              href: https://homepage.infra.home

  widgets: []

  settings:
    title: Apps
    theme: dark
    color: slate
    headerStyle: clean
    hideVersion: true
    statusStyle: dot
    cardBlur: sm
    background:
      image: https://raw.githubusercontent.com/arch-err/Cluster-Config/v2/kubernetes/assets/blue_distortion_2.jpg
      blur: sm
      opacity: 80
      brightness: 60

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Restricted PSS compliance — chart ships no securityContext by default.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # homepage writes a logs dir; flip to true if it doesn't
  capabilities:
    drop:
      - ALL
