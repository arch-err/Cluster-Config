# homepage — chart: jameswynn/homepage v2.1.0 (gethomepage)
# https://artifacthub.io/packages/helm/jameswynn/homepage

# Pin app image tag for reproducibility (chart default tracks v1.2.0 at chart 2.1.0)
image:
  tag: v1.2.0

# Next.js host validation — must list every Host header the app will see.
# Without this, requests fail with "Host validation failed for: <host>" and the UI
# shows app-errors. Comma-separated, no scheme, no port unless non-default.
env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "homepage.apps.home"
  - name: LOG_LEVEL
    value: debug

# Disable chart's built-in ingress — platform chart's HTTPRoute handles routing
ingress:
  main:
    enabled: false

# RBAC: ServiceAccount with cluster-wide read on Gateway API + core resources.
# Required for auto-discovery to enumerate HTTPRoutes across all namespaces.
serviceAccount:
  create: true
  name: homepage
enableRbac: true

# Chart's default ClusterRole grants httproutes/pods/nodes/ingresses but NOT
# services or workloads. Without these, kubernetes auto-discovery returns 0
# services even when annotations are correct. Add them.
extraClusterRoles:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]

# Cluster-wide kubernetes integration:
#   - mode=cluster: in-cluster service account (uses RBAC above)
#   - gateway=true: discover Gateway API HTTPRoutes (not just classic Ingress)
config:
  kubernetes:
    mode: cluster
    # Bare minimum per docs. Adding ingress/gateway/services/instance flags broke
    # discovery silently — gethomepage v1.2.0 emits no log when those keys exist.
    # Re-add ONE flag at a time after verifying baseline discovery works.

  # Auto-discovered services land in groups matching their `gethomepage.dev/group`
  # annotation. Each group MUST be declared (empty) here for routes to appear —
  # auto-discovery appends to existing groups rather than creating new ones.
  # Add an empty `<Group>:` entry below for every group used by an apps-side route.
  services:
    - Media:
        - Immich (manual test):
            href: https://immich.apps.home
            description: Manual entry to validate services.yaml loading
    - Tools: []
    - Comms: []
    - Infra: []

  # Cross-link to the infra dashboard.
  bookmarks:
    - Other dashboards:
        - Infrastructure Homepage:
            - abbr: II
              href: https://homepage.infra.home

  widgets: []

  settings:
    title: Apps
    theme: dark
    color: slate
    headerStyle: clean
    hideVersion: true
    statusStyle: dot
    cardBlur: sm
    background:
      image: https://raw.githubusercontent.com/arch-err/Cluster-Config/v2/kubernetes/assets/blue_distortion_2.jpg
      blur: sm
      opacity: 80
      brightness: 60

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Restricted PSS compliance — chart ships no securityContext by default.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # homepage writes a logs dir; flip to true if it doesn't
  capabilities:
    drop:
      - ALL
