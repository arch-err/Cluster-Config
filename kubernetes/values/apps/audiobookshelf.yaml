# audiobookshelf — chart: christianhuth/audiobookshelf v2.2.0
# https://artifacthub.io/packages/helm/christianhuth/audiobookshelf

# Image: chart default is 2.34.0; pinning here for reproducibility
image:
  tag: "2.34.0"

# Disable chart's built-in ingress + route — we use the platform chart's HTTPRoute
ingress:
  enabled: false
route:
  main:
    enabled: false

# Three PVCs on kadalu.replica2 (cluster default storageClass)
audiobookshelf:
  config:
    persistence:
      enabled: true
      resources:
        requests:
          storage: 1Gi
  library:
    persistence:
      enabled: true
      resources:
        requests:
          storage: 100Gi  # bump as your library grows; expandable on kadalu
  metadata:
    persistence:
      enabled: true
      resources:
        requests:
          storage: 5Gi
  backup:
    persistence:
      enabled: true
      resources:
        requests:
          storage: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
