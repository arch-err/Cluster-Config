# audiobookshelf — self-hosted audiobook + podcast server
# Chart: arch-err/audiobookshelf

image:
  tag: "2.16.0"  # pin specific version (override here if you want to bump)

# Three PVCs on kadalu.replica2 (cluster default)
persistence:
  config:
    size: 1Gi
  metadata:
    size: 5Gi
  audiobooks:
    size: 100Gi  # bump if your library outgrows this; PVCs are expandable on kadalu

env:
  TZ: Europe/Stockholm
  PORT: "80"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
