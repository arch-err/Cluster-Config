# home-assistant-oauth2 — chart: oauth2-proxy/oauth2-proxy v10.4.3
# Forward-auth proxy fronting home-assistant. Mirrors calibre-web-oauth2 /
# arr-oauth2-readarr. Consumes `home-assistant-oidc-client` (rendered by the
# home-assistant Application's oidc:* block in apps.yaml; pocket-id client
# id=`home-assistant`, restricted to apps_users + administrators at the IDP
# level on top of the oauth2-proxy --allowed-group flags below).
#
# HA itself must trust X-Forwarded-* — handled via configuration.yaml
# (http.use_x_forwarded_for: true, trusted_proxies includes cluster pod CIDR)
# rendered by the home-assistant values file's seed ConfigMap + init copy.
#
# /api/* is bypass-routed so HA's REST API + WebSocket (long-lived token auth)
# keeps working for future mobile-app / automation use cases. The webhook
# endpoint (/api/webhook/*) explicitly accepts unauthenticated POSTs by HA
# design — bypassing OIDC here matches HA's threat model (webhook ids are the
# auth).
#
# COOKIE SECRET: sourced from SopsSecret `home-assistant-oauth2-cookie` in
# the home-assistant ns (kubernetes/secrets/apps/home-assistant-oauth2-cookie.yaml).

fullnameOverride: oauth2-home-assistant

image:
  tag: "v7.15.2"

proxyVarsAsSecrets: false

config:
  clientID: ""
  clientSecret: ""
  cookieSecret: ""
  emailDomains: ["*"]

extraArgs:
  - --provider=oidc
  - --provider-display-name=Pocket ID
  - --skip-provider-button=true
  - --code-challenge-method=S256
  - --insecure-oidc-allow-unverified-email=true
  - --skip-oidc-discovery=false
  - --http-address=0.0.0.0:4180
  - --reverse-proxy=true
  - --real-client-ip-header=X-Forwarded-For
  # Single upstream — home-assistant in-cluster service (home-assistant ns).
  - --upstream=http://home-assistant.home-assistant.svc.cluster.local:8123
  - --cookie-domain=ha.apps.home
  - --cookie-secure=true
  - --cookie-samesite=lax
  - --cookie-name=_home_assistant_oauth2_proxy
  - --allowed-group=apps_users
  - --allowed-group=administrators
  # HA REST API + WebSocket use long-lived tokens — bypass OIDC for /api/*
  # so future mobile-app + automation flows keep working without sitting
  # behind the browser OAuth dance.
  - --skip-auth-route=^/api/
  - --pass-user-headers=true
  - --set-xauthrequest=true
  - --pass-access-token=false
  - --email-domain=*
  - --provider-ca-file=/etc/ssl/home-ca/ca.crt

# OIDC creds from the platform-rendered Secret (home-assistant Application's
# oidc:* block in apps.yaml).
extraEnv:
  - name: OAUTH2_PROXY_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: home-assistant-oidc-client
        key: client_id
  - name: OAUTH2_PROXY_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: home-assistant-oidc-client
        key: client_secret
  - name: OAUTH2_PROXY_OIDC_ISSUER_URL
    valueFrom:
      secretKeyRef:
        name: home-assistant-oidc-client
        key: issuer_url
  # Distinct cookie secret per sibling oauth2-proxy release. From SopsSecret
  # `home-assistant-oauth2-cookie` (same ns).
  - name: OAUTH2_PROXY_COOKIE_SECRET
    valueFrom:
      secretKeyRef:
        name: home-assistant-oauth2-cookie
        key: cookie-secret

extraVolumes:
  - name: home-ca
    configMap:
      name: home-ca-bundle
extraVolumeMounts:
  - name: home-ca
    mountPath: /etc/ssl/home-ca
    readOnly: true

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi

replicaCount: 1

podDisruptionBudget:
  enabled: false

gatewayApi:
  enabled: false
ingress:
  enabled: false
