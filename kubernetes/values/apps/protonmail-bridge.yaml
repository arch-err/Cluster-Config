# protonmail-bridge — chart: bjw-s/app-template v4.6.2 (generic container wrapper)
# Internal-only Proton Mail Bridge for cluster workloads (n8n later). Exposes
# IMAP + SMTP on a ClusterIP only; no HTTPRoute, no OIDC, no off-cluster access.
#
# SECURITY MODEL:
# - Namespace is baseline-PSS (headless Bridge image stores profile/keychain under
#   /root and binds low localhost ports internally) and has a default-deny ingress
#   NetworkPolicy rendered by extras.protonmail-bridge.
# - This Service is intentionally unreachable until an explicit NetworkPolicy
#   allow rule is added for a consumer namespace (e.g. n8n).
# - One-time Proton login / bridge setup is manual via kubectl exec.
#
# STORAGE:
# Bridge config/session state plus pass/gpg keychain are persisted so restarts do
# not require re-login. Not critical user data, but kept on kadalu.replica2-retain
# per operator choice.
#
# NOTE: docker.io/shenxn/protonmail-bridge is the commonly used headless wrapper
# around Proton Mail Bridge. If we standardize on a different image later, keep
# the Service ports and PVC intent stable for consumers.

controllers:
  main:
    strategy: Recreate
    containers:
      app:
        image:
          repository: docker.io/shenxn/protonmail-bridge
          tag: latest
        command:
          - /bin/bash
          - -lc
          - |
            set -euo pipefail
            if [ ! -d /root/.password-store ]; then
              gpg --generate-key --batch /protonmail/gpgparams
              pass init pass-key
            fi
            exec /protonmail/entrypoint.sh
        probes:
          # Disabled until the one-time Proton login is completed. Before login,
          # Bridge starts its CLI but does not expose usable IMAP/SMTP sockets;
          # liveness probes would restart the manual setup session.
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          readOnlyRootFilesystem: false

service:
  main:
    controller: main
    ports:
      imap:
        port: 1143
        targetPort: 143
        protocol: TCP
      smtp:
        port: 1025
        targetPort: 25
        protocol: TCP

persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: kadalu.replica2-retain
    advancedMounts:
      main:
        app:
          - path: /root
