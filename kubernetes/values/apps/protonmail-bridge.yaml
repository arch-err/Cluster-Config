# protonmail-bridge — chart: bjw-s/app-template v4.6.2 (generic container wrapper)
# Internal-only Proton Mail Bridge for cluster workloads (n8n later). Exposes
# IMAP + SMTP on a ClusterIP only; no HTTPRoute, no OIDC, no off-cluster access.
#
# SECURITY MODEL:
# - Namespace is baseline-PSS (headless Bridge image stores profile under /root)
#   and has a default-deny ingress NetworkPolicy rendered by extras.protonmail-bridge.
# - This Service is intentionally unreachable until an explicit NetworkPolicy
#   allow rule is added for a consumer namespace (e.g. n8n).
# - One-time Proton login / bridge setup is manual via kubectl exec.
#
# STORAGE:
# Bridge config/session state is persisted so restarts do not require re-login.
# Not critical user data, but kept on kadalu.replica2-retain per operator choice.
#
# NOTE: ghcr.io/shenxn/protonmail-bridge is the commonly used headless wrapper
# around Proton Mail Bridge. If we standardize on a different image later, keep
# the Service ports and PVC intent stable for consumers.

controllers:
  main:
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/shenxn/protonmail-bridge
          tag: latest
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 1143
              initialDelaySeconds: 30
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 1143
              initialDelaySeconds: 10
              periodSeconds: 15
          startup:
            enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault

service:
  main:
    controller: main
    ports:
      imap:
        port: 1143
        targetPort: 1143
        protocol: TCP
      smtp:
        port: 1025
        targetPort: 1025
        protocol: TCP

persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: kadalu.replica2-retain
    advancedMounts:
      main:
        app:
          - path: /root/.config/protonmail/bridge
