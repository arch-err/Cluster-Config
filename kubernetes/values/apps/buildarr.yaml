# buildarr — chart: bjw-s/app-template v4.6.2 (deployment, daemon mode)
# Declarative Prowlarr config manager. Replaces the prowlarr-bootstrap CronJob
# (curl+jq apk-add hack that broke under restricted PSS — non-root can't apk).
#
# Upstream: https://buildarr.github.io/  Image: callum027/buildarr (Docker Hub).
# Bundled plugins: sonarr / radarr / prowlarr / jellyseerr. We use ONLY the
# prowlarr plugin (manages Prowlarr indexers + downstream app links). Configarr
# still owns Readarr's quality profiles + qBit download client (separate
# release; different surface area — buildarr has no readarr plugin).
#
# Mode: `buildarr daemon`. Single Deployment. Performs initial config apply on
# startup, then re-applies daily at 03:00. SIGHUP forces an immediate run, and
# `kubectl rollout restart deploy/buildarr` is the convenient force-resync.
#
# Secrets:
#   Buildarr has NO native env-var substitution. Pattern (per upstream
#   "Separating secret and non-secret configuration" doc): write a tiny
#   buildarr-secrets.yml at runtime from env vars (init container reads
#   arr-api-keys SopsSecret), main config `includes:` it. Both files live in
#   an emptyDir mounted at /config; the secrets file never hits disk on a
#   node for longer than the pod lifetime.
#
# What this enforces:
#   - 3 public torrent indexers (1337x, torrentgalaxyclone, ebookbay) via
#     Prowlarr's Cardigann definitions. baseUrl pinned per indexer.
#   - 1 downstream Application: Readarr, sync_level=full-sync, with the same
#     audiobook+book Newznab category set the bash script used (mapped to
#     buildarr's category-name strings — see ReadarrApplication defaults in
#     buildarr_prowlarr/config/settings/apps/applications.py).

# fsGroup so the shared /config emptyDir is gid-1000 writable (init renders
# secrets, main reads + writes secrets.json cache).
defaultPodOptions:
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  main:
    type: deployment
    replicas: 1
    strategy: Recreate  # buildarr is a singleton; no rolling concurrency
    initContainers:
      # Render buildarr-secrets.yml from arr-api-keys SopsSecret. Mirrors the
      # configarr pattern. emptyDir at /config is shared with the main
      # container; the rendered file is mode 0400 owned by uid 1000 (PUID).
      render-secrets:
        image:
          repository: busybox
          tag: "1.37"
        command:
          - sh
          - -c
          - |
            set -eu
            cat > /config/buildarr-secrets.yml <<EOF
            prowlarr:
              api_key: ${PROWLARR_APIKEY}
              settings:
                apps:
                  applications:
                    definitions:
                      Readarr:
                        api_key: ${READARR_APIKEY}
            EOF
            chmod 0400 /config/buildarr-secrets.yml
        env:
          PROWLARR_APIKEY:
            valueFrom:
              secretKeyRef:
                name: arr-api-keys
                key: prowlarr_apikey
          READARR_APIKEY:
            valueFrom:
              secretKeyRef:
                name: arr-api-keys
                key: readarr_apikey
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
    containers:
      app:
        image:
          repository: callum027/buildarr
          # Pin tag — `latest` floats with bundled plugin versions. 0.7.8 is
          # the most recent published image; bundled buildarr-prowlarr is
          # >=0.5 (supports the prowlarr v1 API + Readarr application type).
          tag: "0.7.8"
        # IMPORTANT: bypass the image's /bootstrap.sh entrypoint. It runs
        # `addgroup`/`adduser` as root then drops via su-exec — incompatible
        # with restricted PSS (which forbids starting as root). Call the
        # buildarr binary directly; restricted PSS is happy, no chown needed.
        command:
          - /usr/local/bin/buildarr
        args:
          - daemon
          - /config/buildarr.yml
        env:
          TZ: Europe/Stockholm
          BUILDARR_LOG_LEVEL: INFO
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        # Restricted PSS compliant. Entrypoint bypassed (see command: above);
        # buildarr binary itself is fine running under any uid as long as
        # /config is writable. emptyDir created by kubelet defaults to mode
        # 0755 root:root but with fsGroup applied (pod-level securityContext
        # below) it's writable to gid 1000.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # buildarr writes secrets.json + state under /config
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault

persistence:
  # /config — shared between init (writes secrets) and main (reads config +
  # secrets, writes its own secrets.json cache). emptyDir is correct: state
  # is recoverable from declared YAML, no need to survive restarts. Buildarr
  # re-derives secrets.json on first run after any restart.
  config:
    type: emptyDir
    advancedMounts:
      main:
        render-secrets:
          - path: /config
        app:
          - path: /config
  # buildarr.yml — declared config, ConfigMap-mounted at /config/buildarr.yml.
  buildarr-config:
    type: configMap
    identifier: config
    advancedMounts:
      main:
        app:
          - path: /config/buildarr.yml
            subPath: buildarr.yml
            readOnly: true

# Declared config. Single-file form (includes the runtime-rendered
# buildarr-secrets.yml). Adding indexers = append a block under
# settings.indexers.indexers.definitions; redeploy.
configMaps:
  config:
    enabled: true
    data:
      buildarr.yml: |
        ---
        # Pull in api_key values rendered by the init container. Per upstream
        # "Separating secret and non-secret configuration" pattern.
        includes:
          - buildarr-secrets.yml

        buildarr:
          # Don't watch_config — config.yml is ConfigMap-mounted (immutable
          # snapshot per pod lifetime); watch_config would just spin.
          watch_config: false
          update_days:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
          update_times:
            - "03:00"

        prowlarr:
          hostname: prowlarr.arr.svc.cluster.local
          port: 9696
          protocol: http
          # api_key supplied by buildarr-secrets.yml (above).
          settings:
            # No indexers block declared. Verified (2026-05-07): all three
            # public indexers from the original prowlarr-bootstrap script
            # (1337x, torrentgalaxyclone, ebookbay) fail Prowlarr's mandatory
            # connection test on create from inside this cluster's egress:
            #   - 1337x.to → CloudFlare challenge (HTML JS check)
            #   - ebb.la   → curl exit-60 (cert/host issue)
            #   - torrentgalaxy.one → redirects to torrentgalaxy.info/get-posts/
            #     (Prowlarr rejects redirect on create)
            # Prowlarr enforces the connection test server-side; buildarr's
            # bundled prowlarr API client (0.5.3) does NOT pass `forceSave=true`,
            # so `buildarr daemon` cannot create these declaratively.
            # FUTURE FIX: deploy a FlareSolverr indexer-proxy in the arr ns and
            # configure Prowlarr to route challenged indexers through it (a
            # `proxies:` block here once configured). Or upstream a forceSave
            # option to buildarr-prowlarr. Until then: indexers are UI-managed.
            apps:
              applications:
                # Same caution: don't delete unmanaged apps. Sonarr/Radarr/Lidarr
                # added later via UI/configarr stay.
                delete_unmanaged: false
                definitions:
                  Readarr:
                    type: readarr
                    prowlarr_url: http://prowlarr.arr.svc.cluster.local:9696
                    base_url: http://readarr.arr.svc.cluster.local:8787
                    sync_level: full-sync
                    # api_key supplied by buildarr-secrets.yml.
                    # Categories: buildarr uses category NAME strings, mapped
                    # internally to the Newznab integer IDs (3030, 7000-7060)
                    # the bash CronJob declared. ReadarrApplication's defaults
                    # already cover Audio/Audiobook + all Books/* — listing
                    # explicitly here for self-documentation + drift-resistance.
                    sync_categories:
                      - Audio/Audiobook
                      - Books/Mags
                      - Books/EBook
                      - Books/Comics
                      - Books/Technical
                      - Books/Other
                      - Books/Foreign
