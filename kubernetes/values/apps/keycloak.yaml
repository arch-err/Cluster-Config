# Keycloak configuration

# Production mode
production: true

# Proxy settings (TLS terminated at gateway)
proxy: edge

# Admin user
auth:
  adminUser: admin
  # adminPassword set via secrets

# PostgreSQL
postgresql:
  enabled: true
  auth:
    # password set via secrets
    database: keycloak

# Resources
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi
