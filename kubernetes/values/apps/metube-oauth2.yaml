# metube-oauth2 — chart: oauth2-proxy/oauth2-proxy v10.4.3
# Forward-auth proxy fronting metube. Mirrors syncthing-oauth2.
# Consumes `metube-oidc-client` (rendered by the metube Application's
# oidc:* block in apps.yaml; pocket-id client id=`metube`, restricted to
# apps_users + administrators at the IDP level on top of the oauth2-proxy
# --allowed-group flags below).
#
# metube has zero native auth — this proxy is the ONLY gate. No api/* bypass
# needed; the UI is single-purpose and there's no mobile-app integration.
#
# COOKIE SECRET: sourced from SopsSecret `metube-oauth2-cookie` in the
# metube ns (kubernetes/secrets/apps/metube-oauth2-cookie.yaml).

fullnameOverride: oauth2-metube

image:
  tag: "v7.15.2"

proxyVarsAsSecrets: false

config:
  clientID: ""
  clientSecret: ""
  cookieSecret: ""
  emailDomains: ["*"]

extraArgs:
  - --provider=oidc
  - --provider-display-name=Pocket ID
  - --skip-provider-button=true
  - --code-challenge-method=S256
  - --insecure-oidc-allow-unverified-email=true
  - --skip-oidc-discovery=false
  - --http-address=0.0.0.0:4180
  - --reverse-proxy=true
  - --real-client-ip-header=X-Forwarded-For
  # Single upstream — metube in-cluster service (metube ns).
  - --upstream=http://metube.metube.svc.cluster.local:8081
  - --cookie-domain=metube.apps.home
  - --cookie-secure=true
  - --cookie-samesite=lax
  - --cookie-name=_metube_oauth2_proxy
  - --allowed-group=apps_users
  - --allowed-group=administrators
  - --pass-user-headers=true
  - --set-xauthrequest=true
  - --pass-access-token=false
  - --email-domain=*
  - --provider-ca-file=/etc/ssl/home-ca/ca.crt

# OIDC creds from the platform-rendered Secret (metube Application's
# oidc:* block in apps.yaml).
extraEnv:
  - name: OAUTH2_PROXY_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: metube-oidc-client
        key: client_id
  - name: OAUTH2_PROXY_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: metube-oidc-client
        key: client_secret
  - name: OAUTH2_PROXY_OIDC_ISSUER_URL
    valueFrom:
      secretKeyRef:
        name: metube-oidc-client
        key: issuer_url
  - name: OAUTH2_PROXY_COOKIE_SECRET
    valueFrom:
      secretKeyRef:
        name: metube-oauth2-cookie
        key: cookie-secret

extraVolumes:
  - name: home-ca
    configMap:
      name: home-ca-bundle
extraVolumeMounts:
  - name: home-ca
    mountPath: /etc/ssl/home-ca
    readOnly: true

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi

replicaCount: 1

podDisruptionBudget:
  enabled: false

gatewayApi:
  enabled: false
ingress:
  enabled: false
