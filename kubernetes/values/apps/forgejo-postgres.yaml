# forgejo-postgres — chart: bjw-s/app-template v4.6.2 (generic container wrapper)
# BYODB postgres 16 for forgejo (phase 1 of the forgejo platform — see
# kubernetes/manual/forgejo/PLAN.md). Internal-only; no HTTPRoute, no OIDC,
# no homepage card. Mirrors the bjw-s wrap pattern used by other apps in
# this repo (booklore, podsync, etc.).
#
# ─── Why BYODB instead of a bundled subchart ────────────────────────────────
# forgejo's helm chart bundles bitnami/postgresql but we want explicit PVC +
# securityContext + PSS control. Same trade as immich's `immich-postgres`
# Deployment in extras (booklore-mariadb too). Diff vs those: rendered as a
# proper Application via bjw-s app-template (so it shows up as its own
# ArgoCD app), not as a raw Deployment under extras.
#
# ─── Storage ────────────────────────────────────────────────────────────────
# /var/lib/postgresql/data (subPath=pgdata) — RWO PVC 20Gi on
# kadalu.replica2-retain (CRITICAL tier — forgejo's git metadata + actions
# DB is load-bearing user data; PV reclaim policy Retain by default on this
# SC). See docs/pvc-reclaim-policy.md.
#
# ─── PSS ────────────────────────────────────────────────────────────────────
# Restricted-PSS clean — uid 999 (postgres image default), drop ALL caps,
# RuntimeDefault seccomp, runAsNonRoot. No root init container; relying on
# fsGroup=999 + fsGroupChangePolicy=OnRootMismatch to grant group ownership
# of the mounted PVC. NOTE: existing cluster precedent (immich-postgres,
# booklore-mariadb) uses a root-uid chown init under baseline PSS because
# kadalu PVCs come root-owned; if first-boot of this pod fails with a
# permission error on /var/lib/postgresql/data, the fallback is to drop
# the ns to baseline PSS and add a chown initContainer (see extras booklore
# mariadb Deployment for the canonical shape).
#
# ─── Secret ─────────────────────────────────────────────────────────────────
# `forgejo-db` SopsSecret (kubernetes/secrets/apps/forgejo-db.yaml) provides
# POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB. Consumed via envFrom so
# the same secret can be referenced by the phase-2 forgejo app to compose
# its DSN.

controllers:
  main:
    # Single-writer postgres on RWO PVC — Recreate avoids races on the data
    # dir during rollouts. Same posture as every other stateful app here.
    strategy: Recreate
    containers:
      app:
        image:
          repository: docker.io/library/postgres
          tag: "16.6-alpine"
        envFrom:
          - secretRef:
              name: forgejo-db
        env:
          # Use a subdir under the mount as PGDATA so kubelet's fsGroup
          # ownership applied to the mount root doesn't shadow postgres's
          # 0700 requirement on the data dir itself.
          PGDATA: /var/lib/postgresql/data/pgdata
          POSTGRES_INITDB_ARGS: "--data-checksums"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["pg_isready", "-U", "forgejo", "-d", "forgejo"]
              initialDelaySeconds: 30
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["pg_isready", "-U", "forgejo", "-d", "forgejo"]
              initialDelaySeconds: 10
              periodSeconds: 10
          startup:
            enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # postgres writes to /tmp + /run
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault

defaultPodOptions:
  securityContext:
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

service:
  main:
    controller: main
    ports:
      postgres:
        port: 5432
        targetPort: 5432

# RECLAIM: PVC uses kadalu.replica2-retain SC — underlying PV inherits
# Retain reclaim from the SC default. See docs/pvc-reclaim-policy.md.
persistence:
  data:
    enabled: true
    accessMode: ReadWriteOnce
    size: 20Gi
    storageClass: kadalu.replica2-retain
    advancedMounts:
      main:
        app:
          - path: /var/lib/postgresql/data
  # /dev/shm sized up — postgres uses POSIX shm for parallel query workers
  # and the alpine container default (64Mi) is tight under load.
  dshm:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 256Mi
    advancedMounts:
      main:
        app:
          - path: /dev/shm
