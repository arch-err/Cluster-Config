# jellyfin-oauth2 — chart: oauth2-proxy/oauth2-proxy v10.4.3
# Forward-auth proxy fronting jellyfin. Mirrors calibre-web-oauth2 +
# syncthing-oauth2. Consumes `jellyfin-oidc-client` Secret (rendered by
# the jellyfin Application's oidc:* block in apps.yaml; pocket-id client
# id=`jellyfin`, restricted to apps_users + administrators at the IDP).
#
# ─── Mobile / TV app compatibility ────────────────────────────────────────────
# Jellyfin's native clients (Android, iOS, Roku, Apple TV, etc.) authenticate
# to Jellyfin directly with a `MediaBrowser` Authorization header / X-Emby-Token,
# NOT via OIDC. They CANNOT use oauth2-proxy. Every non-/web/ path is
# `--skip-auth-route`'d so the apps talk to Jellyfin's REST API + WebSocket
# without the proxy in the way. Browser UI traffic (/web/) is the only thing
# that hits OIDC.
#
# Strategy: positive skip list. Jellyfin's docs list its REST API path roots —
# every one of them is enumerated below (case-insensitive via `(?i)`).
# `/web/` and `/oauth2/` (the proxy's own callback) are NOT in the skip list.
# Root `/` redirects to `/web/index.html` → handled by oauth2-proxy normally.
#
# COOKIE SECRET: SopsSecret `jellyfin-oauth2-cookie` in the jellyfin ns
# (kubernetes/secrets/apps/jellyfin-oauth2-cookie.yaml).

fullnameOverride: oauth2-jellyfin

image:
  tag: "v7.15.2"

proxyVarsAsSecrets: false

config:
  clientID: ""
  clientSecret: ""
  cookieSecret: ""
  emailDomains: ["*"]

extraArgs:
  - --provider=oidc
  - --provider-display-name=Pocket ID
  - --skip-provider-button=true
  - --code-challenge-method=S256
  - --insecure-oidc-allow-unverified-email=true
  - --skip-oidc-discovery=false
  - --http-address=0.0.0.0:4180
  - --reverse-proxy=true
  - --real-client-ip-header=X-Forwarded-For
  # Single upstream — jellyfin in-cluster service.
  - --upstream=http://jellyfin.jellyfin.svc.cluster.local:8096
  - --cookie-domain=jellyfin.apps.home
  - --cookie-secure=true
  - --cookie-samesite=lax
  - --cookie-name=_jellyfin_oauth2_proxy
  - --allowed-group=apps_users
  - --allowed-group=administrators
  # ── Skip-auth-route: every Jellyfin REST API + WebSocket path.
  # Mobile / TV apps hit these directly with `MediaBrowser` token auth.
  # `(?i)` = case-insensitive match (Jellyfin's routes are case-insensitive).
  # Only `/web/` (browser UI) and `/oauth2/` (proxy callback) remain gated.
  - --skip-auth-route=(?i)^/socket
  - --skip-auth-route=(?i)^/system
  - --skip-auth-route=(?i)^/users
  - --skip-auth-route=(?i)^/items
  - --skip-auth-route=(?i)^/sessions
  - --skip-auth-route=(?i)^/audio
  - --skip-auth-route=(?i)^/videos
  - --skip-auth-route=(?i)^/shows
  - --skip-auth-route=(?i)^/movies
  - --skip-auth-route=(?i)^/search
  - --skip-auth-route=(?i)^/plugins
  - --skip-auth-route=(?i)^/persons
  - --skip-auth-route=(?i)^/genres
  - --skip-auth-route=(?i)^/library
  - --skip-auth-route=(?i)^/libraries
  - --skip-auth-route=(?i)^/mediasegments
  - --skip-auth-route=(?i)^/studios
  - --skip-auth-route=(?i)^/playlists
  - --skip-auth-route=(?i)^/health
  - --skip-auth-route=(?i)^/branding
  - --skip-auth-route=(?i)^/quickconnect
  - --skip-auth-route=(?i)^/devices
  - --skip-auth-route=(?i)^/playback
  - --skip-auth-route=(?i)^/playstate
  - --skip-auth-route=(?i)^/userviews
  - --skip-auth-route=(?i)^/channels
  - --skip-auth-route=(?i)^/livetv
  - --skip-auth-route=(?i)^/subtitles
  - --skip-auth-route=(?i)^/images
  - --skip-auth-route=(?i)^/artists
  - --skip-auth-route=(?i)^/albums
  - --skip-auth-route=(?i)^/songs
  - --skip-auth-route=(?i)^/dlna
  - --skip-auth-route=(?i)^/displaypreferences
  - --skip-auth-route=(?i)^/notifications
  - --skip-auth-route=(?i)^/packages
  - --skip-auth-route=(?i)^/repositories
  - --skip-auth-route=(?i)^/scheduledtasks
  - --skip-auth-route=(?i)^/syncplay
  - --skip-auth-route=(?i)^/tags
  - --skip-auth-route=(?i)^/years
  - --skip-auth-route=(?i)^/trailers
  - --skip-auth-route=(?i)^/collections
  - --skip-auth-route=(?i)^/clientlog
  - --skip-auth-route=(?i)^/keepalive
  - --skip-auth-route=(?i)^/startup
  - --skip-auth-route=(?i)^/environment
  - --skip-auth-route=(?i)^/featureupdates
  - --skip-auth-route=(?i)^/auth
  - --pass-user-headers=true
  - --set-xauthrequest=true
  - --pass-access-token=false
  - --email-domain=*
  - --provider-ca-file=/etc/ssl/home-ca/ca.crt

# OIDC creds from the platform-rendered Secret (jellyfin Application's
# oidc:* block in apps.yaml).
extraEnv:
  - name: OAUTH2_PROXY_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: jellyfin-oidc-client
        key: client_id
  - name: OAUTH2_PROXY_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: jellyfin-oidc-client
        key: client_secret
  - name: OAUTH2_PROXY_OIDC_ISSUER_URL
    valueFrom:
      secretKeyRef:
        name: jellyfin-oidc-client
        key: issuer_url
  # Cookie secret per sibling oauth2-proxy release. From SopsSecret
  # `jellyfin-oauth2-cookie` (same ns).
  - name: OAUTH2_PROXY_COOKIE_SECRET
    valueFrom:
      secretKeyRef:
        name: jellyfin-oauth2-cookie
        key: cookie-secret

extraVolumes:
  - name: home-ca
    configMap:
      name: home-ca-bundle
extraVolumeMounts:
  - name: home-ca
    mountPath: /etc/ssl/home-ca
    readOnly: true

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi

replicaCount: 1

podDisruptionBudget:
  enabled: false

gatewayApi:
  enabled: false
ingress:
  enabled: false
