# Home Assistant configuration
# Note: Namespace is exempted from restricted PSS in Talos config

# Persistence for Home Assistant config
persistence:
  enabled: true
  storageClass: kadalu.replica2
  size: 10Gi
  accessMode: ReadWriteOnce

# Service configuration
service:
  type: ClusterIP
  port: 8123

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Home Assistant configuration (injected into configuration.yaml)
configuration:
  enabled: true
  forceInit: true
  trusted_proxies:
    - 10.244.0.0/16
  # Custom templateConfig to include http section (chart only adds it with ingress.enabled)
  templateConfig: |-
    # Loads default set of integrations. Do not remove.
    default_config:

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        {{- range .Values.configuration.trusted_proxies }}
        - {{ . }}
        {{- end }}

    # Load frontend themes from the themes folder
    frontend:
      themes: !include_dir_merge_named themes

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
