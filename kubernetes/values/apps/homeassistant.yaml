# Home Assistant configuration
# Note: Namespace is exempted from restricted PSS in Talos config

# Use Deployment without persistence for now
controller:
  type: Deployment

# Persistence disabled until Kadalu storage is fixed
persistence:
  enabled: false

# Service configuration
service:
  type: ClusterIP
  port: 8123

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
