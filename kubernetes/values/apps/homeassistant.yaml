# Home Assistant configuration
# Note: Namespace is exempted from restricted PSS in Talos config

# Use StatefulSet for persistent storage
controller:
  type: StatefulSet

# Persistence for Home Assistant config
persistence:
  enabled: true
  storageClass: kadalu.replica2
  size: 10Gi
  accessMode: ReadWriteOnce

# Service configuration
service:
  type: ClusterIP
  port: 8123

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Home Assistant configuration (injected into configuration.yaml)
configuration:
  enabled: true
  forceInit: true
  trusted_proxies:
    - 10.244.0.0/16
