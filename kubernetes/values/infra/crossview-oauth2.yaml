# crossview-oauth2 — chart: oauth2-proxy/oauth2-proxy v10.4.3
# Forward-auth proxy fronting crossview at crossview.infra.home. Mirrors
# arr-oauth2-prowlarr (infra-tier, admin-only) — same chart version, same
# flag set, same home-ca trust mount, same SopsSecret cookie pattern.
#
# Consumes the `crossview-oidc-client` Secret rendered by the crossview
# Application's oidc:* block in infra.yaml (pocket-id client id=`crossview`,
# allowedGroups=[administrators] at the IDP).
#
# UPSTREAM: crossview svc (this ns) :80 → app :3001. oauth2-proxy passes
# X-Forwarded-User downstream; crossview reads it as the trusted-header user
# (AUTH_MODE=header in crossview.yaml).
#
# COOKIE SECRET: SopsSecret `crossview-oauth2-cookie` in this ns
# (kubernetes/secrets/infra/crossview-oauth2-cookie.yaml).
#
# /api/* IS NOT BYPASS-ROUTED. Unlike the *arr stack (mobile apps + X-Api-Key
# flows), crossview is a UI-only tool — every browser hit must traverse
# oauth2-proxy. Out-of-cluster automation would talk to the K8s apiserver
# directly or via kubectl, not via this UI.

fullnameOverride: crossview-oauth2

image:
  tag: "v7.15.2"

# Don't render the chart's auto-Secret — we drive everything via extraEnv.
proxyVarsAsSecrets: false

config:
  clientID: ""
  clientSecret: ""
  cookieSecret: ""
  emailDomains: ["*"]

# oauth2-proxy flag set. Mirror arr-oauth2-prowlarr exactly (infra-tier, same
# cookie-domain, same group restriction).
extraArgs:
  - --provider=oidc
  - --provider-display-name=Pocket ID
  - --skip-provider-button=true
  - --code-challenge-method=S256
  - --insecure-oidc-allow-unverified-email=true
  - --skip-oidc-discovery=false
  - --http-address=0.0.0.0:4180
  - --reverse-proxy=true
  - --real-client-ip-header=X-Forwarded-For
  # Single upstream — crossview chart's main Service. The chart names it
  # `<fullname>-service` (so `crossview-service`), NOT bare `<fullname>`.
  # Verified via helm template @ 4.3.0.
  - --upstream=http://crossview-service.crossview.svc.cluster.local:80
  - --cookie-domain=.infra.home
  - --cookie-secure=true
  - --cookie-samesite=lax
  - --cookie-name=_crossview_oauth2_proxy
  # Infra-tier — admin-only. Defense-in-depth on top of pocket-id's
  # groupRestriction.allowedGroups=[administrators] in infra.yaml.
  - --allowed-group=administrators
  # Pass identity downstream so crossview's AUTH_MODE=header trusts the
  # authenticated user.
  - --pass-user-headers=true
  - --set-xauthrequest=true
  - --pass-access-token=false
  - --email-domain=*
  # home-ca trust for back-channel calls to auth.apps.home (OIDC discovery,
  # token, userinfo). Mounted via extraVolumes below.
  - --provider-ca-file=/etc/ssl/home-ca/ca.crt

# OIDC creds from the platform-rendered Secret (crossview Application's oidc:*
# block in infra.yaml). Cookie secret from SopsSecret `crossview-oauth2-cookie`.
extraEnv:
  - name: OAUTH2_PROXY_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: crossview-oidc-client
        key: client_id
  - name: OAUTH2_PROXY_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: crossview-oidc-client
        key: client_secret
  - name: OAUTH2_PROXY_OIDC_ISSUER_URL
    valueFrom:
      secretKeyRef:
        name: crossview-oidc-client
        key: issuer_url
  - name: OAUTH2_PROXY_COOKIE_SECRET
    valueFrom:
      secretKeyRef:
        name: crossview-oauth2-cookie
        key: cookie-secret

extraVolumes:
  - name: home-ca
    configMap:
      name: home-ca-bundle
extraVolumeMounts:
  - name: home-ca
    mountPath: /etc/ssl/home-ca
    readOnly: true

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi

replicaCount: 1

podDisruptionBudget:
  enabled: false

# Platform chart owns the HTTPRoute.
gatewayApi:
  enabled: false
ingress:
  enabled: false
