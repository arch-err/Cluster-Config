# homepage-infra — chart: jameswynn/homepage v2.1.0 (gethomepage)
# https://artifacthub.io/packages/helm/jameswynn/homepage
#
# Second homepage instance dedicated to infrastructure services.
# Filters to routes annotated with `gethomepage.dev/instance.infra`.

# Bump app to current upstream. Chart default v1.2.0 doesn't support `instanceName`
# filtering (added in later versions); needed to scope each homepage to its gateway.
image:
  tag: v1.12.3

# Next.js host validation — must list every Host header the app will see.
env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "homepage.infra.home"

# Disable chart's built-in ingress — platform chart's HTTPRoute handles routing
ingress:
  main:
    enabled: false

# RBAC: ServiceAccount with cluster-wide read on Gateway API + core resources.
# Distinct SA name from the apps-side homepage to avoid RBAC collision; same policy.
serviceAccount:
  create: true
  name: homepage-infra
enableRbac: true

# Cluster-wide kubernetes integration:
#   - mode=cluster: in-cluster service account (uses RBAC above)
#   - gateway=true: discover Gateway API HTTPRoutes (not just classic Ingress)
config:
  kubernetes:
    mode: cluster
    ingress: false   # we don't use classic Ingress — only HTTPRoute
    gateway: true
    services: true   # also discover Service-level annotations as a fallback

  # Layout: groups are auto-built from gethomepage.dev/group annotations on routes.
  # Static entries below are merged with annotation-discovered services.
  # The admin dashboard sets `dashboard: false` in infra.yaml (no auto-discovery
  # annotations rendered), so it gets a static card here for discoverability.
  services:
    - Cluster:
        - Admin Dashboard:
            href: https://admin.infra.home
            description: Admin panel — k8s/grafana/argocd widgets
            icon: mdi-shield-account

  # Cross-link to the apps dashboard.
  bookmarks:
    - Other dashboards:
        - Apps Homepage:
            - abbr: AH
              href: https://homepage.apps.home

  widgets: []

  settings:
    title: Infrastructure
    instanceName: infra   # scopes auto-discovery to `gethomepage.dev/instance.infra`
    theme: dark
    color: slate
    headerStyle: clean
    hideVersion: true
    statusStyle: dot
    cardBlur: sm
    background:
      image: https://raw.githubusercontent.com/arch-err/Cluster-Config/v2/kubernetes/assets/mono_dark_distortion_1.jpg
      blur: sm
      opacity: 80
      brightness: 60

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Restricted PSS compliance — chart ships no securityContext by default.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # homepage writes a logs dir; flip to true if it doesn't
  capabilities:
    drop:
      - ALL
