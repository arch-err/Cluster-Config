# ArgoCD configuration
server:
  ingress:
    enabled: false  # Using Gateway API instead

# OIDC SSO not yet wired — authentik torn down, pocket-id pending admin enrollment.
# Re-add a `dex.config:` connector under configs.cm + dex.envFrom secret here once
# pocket-id has an OIDC client + group for ArgoCD configured via UI.

configs:
  params:
    server.insecure: true  # TLS terminated at gateway

  cm:
    url: https://argocd.infra.home

    # Enable web terminal (exec into pods from UI)
    exec.enabled: "true"
    exec.shells: "bash,sh,zsh"

    # Enable helm-secrets plugin
    helm.valuesFileSchemes: >-
      secrets+age-import, secrets+age-import-kubernetes,
      secrets, secrets+literal,
      https

    # Override resource exclusions - allow EndpointSlice (we manage external services)
    resource.exclusions: |
      - apiGroups:
          - ''
        kinds:
          - Endpoints
      - apiGroups:
          - coordination.k8s.io
        kinds:
          - Lease
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
          - CiliumEndpoint
          - CiliumEndpointSlice

  # RBAC — group→role mappings (re-add once an external IDP is wired and groups
  # flow into ArgoCD via OIDC). For now ArgoCD uses local admin only.
  # rbac:
  #   policy.csv: |
  #     g, ArgoCD Admins, role:admin
