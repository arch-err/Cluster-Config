# Mimir — Prometheus-compatible TSDB (monolithic mode for homelab)
# Chart: grafana/mimir-distributed

# Single binary instead of microservices (much simpler for homelab scale)
deploymentMode: monolithic

# Disable bundled MinIO; use filesystem storage on kadalu
minio:
  enabled: false

# Disable Enterprise features
enterprise:
  enabled: false

# Monolithic deployment config
monolithic:
  replicas: 1
  persistentVolume:
    storageClass: kadalu.replica2
    size: 30Gi

# Mimir's runtime config — filesystem-backed storage
mimir:
  structuredConfig:
    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /data
    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks
      storage_prefix: blocks
    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/ruler
    alertmanager_storage:
      backend: filesystem
      filesystem:
        dir: /data/alertmanager
    # Disable multi-tenancy for homelab
    multitenancy_enabled: false
    limits:
      ingestion_rate: 100000
      ingestion_burst_size: 1000000
      max_global_series_per_user: 1000000

# Disable components not used in monolithic mode
distributor:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
query_frontend:
  replicas: 0
query_scheduler:
  replicas: 0
store_gateway:
  replicas: 0
compactor:
  replicas: 0
ruler:
  replicas: 0
alertmanager:
  replicas: 0
overrides_exporter:
  replicas: 0
nginx:
  enabled: false
gateway:
  enabled: false
