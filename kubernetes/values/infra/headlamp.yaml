# Headlamp — kubernetes GUI on the infra gateway, OIDC via pocket-id.
# Chart: headlamp/headlamp 0.41.x (https://kubernetes-sigs.github.io/headlamp/)
# Image: ghcr.io/headlamp-k8s/headlamp:v0.41.0
#
# AUTH MODEL
#   Headlamp redirects unauthenticated users to pocket-id, gets back an
#   id_token, and forwards that token's Bearer in `Authorization` to the
#   kube-apiserver on every request — i.e. it impersonates the logged-in
#   user. So cluster RBAC (not the pod's ServiceAccount) decides what each
#   user can see/do. The pod's own ClusterRoleBinding (chart default:
#   cluster-admin) is downgraded to `view` so an attacker who breaks out of
#   the OIDC flow can at most read.
#   Per-user authorization is via cluster RBAC bindings against the user's
#   pocket-id `sub` (or group claim) — done manually post-first-login. The
#   ntfy-on-completion message includes the exact `kubectl create
#   clusterrolebinding` command the user runs after their first login.
#
# OIDC SECRET TRANSLATION
#   The platform's oidc-bootstrap Job emits the Secret `headlamp-oidc-client`
#   with keys client_id / client_secret / issuer_url (snake_case). The
#   headlamp chart however expects a Secret whose KEYS are the env-var names
#   it consumes (OIDC_CLIENT_ID / OIDC_CLIENT_SECRET / OIDC_ISSUER_URL /
#   OIDC_SCOPES / OIDC_USE_PKCE) — because it loads the Secret via
#   `envFrom: secretRef`, so each key becomes an env var of the same name,
#   and the container args reference $(OIDC_CLIENT_ID) etc.
#   We bridge the two with a small translator Job (extraManifests below)
#   that reads `headlamp-oidc-client` and writes `headlamp-oidc-env` in the
#   shape the chart wants. Idempotent on re-syncs.
#
# TRUST
#   Headlamp's Go binary makes back-channel calls to pocket-id's discovery /
#   token / jwks endpoints over `https://auth.apps.home`, signed by our
#   home-ca. We mount the cluster-wide trust-manager Bundle (`home-ca-bundle`
#   ConfigMap, broadcast to every ns by extras.trustManagerBundle) and point
#   Go's `SSL_CERT_FILE` at it via the chart's config.extraArgs (chart has
#   no env-from-secret hook in its schema; SSL_CERT_FILE override at runtime
#   isn't doable that way — we instead patch via a single extra manifest
#   that adds the env via a strategic merge on the deployment if needed).
#   In practice though, the alpine image's CA bundle plus `SSL_CERT_DIR`
#   trick aren't applicable. The cleanest fix: tell Go to honor an extra CA
#   by mounting the bundle at `/etc/ssl/certs/ca-certificates.crt` (Debian
#   default Go reads). Headlamp's image is debian-slim → Go's runtime trust
#   reads from that file. We mount the home-ca-bundle ConfigMap there.
#
#   NOTE: the home-ca-bundle is a single PEM with our root CA only (not the
#   full system CA chain). Mounting it at the system path replaces the
#   system trust → Headlamp would lose trust for any other public TLS
#   endpoint it might reach (none expected — it only talks to the kube
#   apiserver via in-cluster ServiceAccount + pocket-id over HTTPS). We're
#   ok with that here.

image:
  registry: ghcr.io
  repository: headlamp-k8s/headlamp
  tag: v0.41.0
  pullPolicy: IfNotPresent

replicaCount: 1

# Service is ClusterIP:80 → containerPort 4466 (chart default). Platform-chart
# HTTPRoute (kubernetes/infra.yaml component → route block) wires
# headlamp.infra.home → service `headlamp` port 80 → container 4466.
service:
  type: ClusterIP
  port: 80

# Routing owned by the platform-chart HTTPRoute, not the chart's own.
ingress:
  enabled: false
httpRoute:
  enabled: false

# Pod's own SA + ClusterRoleBinding. Chart default is cluster-admin; we
# downgrade to `view`. See AUTH MODEL header.
serviceAccount:
  create: true
clusterRoleBinding:
  create: true
  clusterRoleName: view

# OIDC — externalSecret mode. We point at `headlamp-oidc-env` (translated
# from `headlamp-oidc-client` by the Job below). Chart loads it via
# `envFrom: secretRef` and substitutes its keys into the container args.
config:
  inCluster: true
  oidc:
    secret:
      create: false
    # Required by pocket-id's registered OIDC client (pkceEnabled defaults
    # to true in oidc-bootstrap.yaml). Without this Headlamp doesn't send a
    # code_verifier on the token exchange and pocket-id rejects with
    # "Invalid code verifier" (same gotcha grafana hit).
    usePKCE: true
    externalSecret:
      enabled: true
      name: headlamp-oidc-env

# Mount the cluster-wide home-ca-bundle ConfigMap so Headlamp's Go binary
# trusts auth.apps.home certs on the back-channel. We mount it over
# /etc/ssl/certs (the Debian default cert dir Go reads).
volumes:
  - name: home-ca
    configMap:
      name: home-ca-bundle
      items:
        - key: ca.crt
          path: ca-certificates.crt
  # Writable scratch dir — required because we set readOnlyRootFilesystem.
  # Chart auto-adds this when neither user volumes nor user volumeMounts are
  # set; once we provide our own list, the auto-mount is suppressed and we
  # must add it explicitly.
  - name: headlamp-tmp
    emptyDir:
      sizeLimit: 64Mi
volumeMounts:
  - name: home-ca
    mountPath: /etc/ssl/certs
    readOnly: true
  - name: headlamp-tmp
    mountPath: /tmp

# securityContext: pinned to restricted-PSS-compliant. The chart's defaults
# (runAsNonRoot, runAsUser=100, runAsGroup=101) are good but it leaves
# allowPrivilegeEscalation, capabilities.drop, and seccompProfile unset —
# restricted PSS rejects on all three. We don't baseline-label the ns
# because Headlamp doesn't actually need anything beyond restricted.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # Chart's deployment template auto-mounts an emptyDir at /tmp when this
  # is true, so the binary still has a scratch dir.
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

podDisruptionBudget:
  enabled: false

# extraManifests — translator Job + RBAC.
#   Reads the bootstrap-emitted Secret `headlamp-oidc-client` and writes
#   `headlamp-oidc-env` in the exact shape (key names == env var names) the
#   chart consumes via envFrom. Idempotent (kubectl apply). Sync-wave 12 so
#   it runs after the bootstrap Job (wave 11). Static name + Replace=true
#   so spec drift recreates; ttlSecondsAfterFinished cleans completed.
extraManifests:
  # ─── Translator Job's ServiceAccount ─────────────────────────────────────
  - |
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: headlamp-oidc-translate
      namespace: headlamp
      annotations:
        argocd.argoproj.io/sync-wave: "11"
  # ─── Role: read source Secret + create/update target Secret ──────────────
  - |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: headlamp-oidc-translate
      namespace: headlamp
      annotations:
        argocd.argoproj.io/sync-wave: "11"
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["headlamp-oidc-client", "headlamp-oidc-env"]
        verbs: ["get", "update", "patch"]
      # `create` cannot use resourceNames; SA only has Role on this single
      # ns, secrets resource — narrowest practical scope.
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["create"]
  - |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: headlamp-oidc-translate
      namespace: headlamp
      annotations:
        argocd.argoproj.io/sync-wave: "11"
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: headlamp-oidc-translate
    subjects:
      - kind: ServiceAccount
        name: headlamp-oidc-translate
        namespace: headlamp
  # ─── Translator script (ConfigMap) ───────────────────────────────────────
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: headlamp-oidc-translate
      namespace: headlamp
      annotations:
        argocd.argoproj.io/sync-wave: "11"
    data:
      translate.sh: |
        #!/usr/bin/env bash
        # Read snake_case keys from headlamp-oidc-client and write
        # SCREAMING_SNAKE keys to headlamp-oidc-env. Idempotent.
        set -euo pipefail
        echo "[translate] reading headlamp-oidc-client"
        for i in $(seq 1 30); do
          if kubectl -n headlamp get secret headlamp-oidc-client \
               -o jsonpath='{.data.client_id}' >/dev/null 2>&1; then
            break
          fi
          echo "[translate] waiting for bootstrap Secret..."
          sleep 5
          [ "$i" = "30" ] && {
            echo "[translate] timeout waiting for headlamp-oidc-client" >&2
            exit 1
          }
        done
        CID=$(kubectl -n headlamp get secret headlamp-oidc-client -o jsonpath='{.data.client_id}'    | base64 -d)
        CSE=$(kubectl -n headlamp get secret headlamp-oidc-client -o jsonpath='{.data.client_secret}' | base64 -d)
        ISS=$(kubectl -n headlamp get secret headlamp-oidc-client -o jsonpath='{.data.issuer_url}'   | base64 -d)
        : "${CID:?empty client_id from bootstrap secret}"
        : "${CSE:?empty client_secret from bootstrap secret}"
        : "${ISS:?empty issuer_url from bootstrap secret}"
        cat >/tmp/env-secret.yaml <<EOF
        apiVersion: v1
        kind: Secret
        metadata:
          name: headlamp-oidc-env
          namespace: headlamp
          labels:
            app.kubernetes.io/managed-by: extra-manifests
            app.kubernetes.io/component: oidc-env-translator
        type: Opaque
        stringData:
          OIDC_CLIENT_ID: "${CID}"
          OIDC_CLIENT_SECRET: "${CSE}"
          OIDC_ISSUER_URL: "${ISS}"
          OIDC_SCOPES: "openid profile email groups"
          OIDC_USE_PKCE: "true"
        EOF
        kubectl apply -f /tmp/env-secret.yaml
        echo "[translate] done — headlamp-oidc-env populated"
  # ─── The translator Job itself ───────────────────────────────────────────
  - |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: headlamp-oidc-translate
      namespace: headlamp
      annotations:
        argocd.argoproj.io/sync-wave: "12"
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
        argocd.argoproj.io/hook: PostSync
        # BeforeHookCreation deletes any existing Job (with its server-set
        # spec.selector) before creating a new one, sidestepping the
        # "Replace=true on completed Jobs is immutable" bug noted in
        # state/active-agents.md ABS-v2 entry.
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    spec:
      ttlSecondsAfterFinished: 600
      backoffLimit: 5
      template:
        spec:
          serviceAccountName: headlamp-oidc-translate
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: translate
              image: docker.io/alpine/k8s:1.32.0@sha256:4c28b0f0c6accfa07fa449493ea936291e4ff1270500571d73f75bb406676c3b
              command: ["/bin/bash", "/scripts/translate.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: HOME
                  value: /home/nonroot
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/nonroot
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: headlamp-oidc-translate
                defaultMode: 0755
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
            - name: home
              emptyDir:
                sizeLimit: 16Mi
