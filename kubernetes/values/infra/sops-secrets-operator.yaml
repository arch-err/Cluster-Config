# SOPS Secrets Operator configuration
# Decrypts SopsSecret CRs and creates regular Secrets

# The operator looks for age key in a secret
# This is deployed manually via: just deploy-age-key
gpg:
  enabled: false

age:
  enabled: true
  # Secret containing the age private key
  # Created by: just deploy-age-key
  secretName: sops-age-key
  secretKey: keys.txt

# Resource limits
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# Single replica is fine for home lab
replicaCount: 1
