# Eclipse Che instance declaration.
# Chart: bjw-s-labs/app-template v4.6.2, used only for raw resources.
# The official eclipse-che chart installs the operator/CRDs separately as
# `eclipse-che-operator`; this release declares the CheCluster CR.

controllers: {}
service: {}

rawResources:
  checluster:
    forceRename: eclipse-che
    apiVersion: org.eclipse.che/v2
    kind: CheCluster
    labels:
      app.kubernetes.io/part-of: che.eclipse.org
    spec:
      spec:
        components:
          pluginRegistry:
            disableInternalRegistry: true
          devfileRegistry:
            disableInternalRegistry: true
            externalDevfileRegistries:
              - url: https://registry.devfile.io
        devEnvironments:
          storage:
            pvcStrategy: per-user
          defaultNamespace:
            template: <username>-che
            autoProvision: true
          secondsOfInactivityBeforeIdling: 1800
          secondsOfRunBeforeIdling: -1
          startTimeoutSeconds: 600
        networking:
          domain: infra.home
          hostname: che.infra.home
          annotations: {}
          labels:
            gateway.networking.k8s.io/exposed-by: infra
        containerRegistry: {}
        gitServices: {}
