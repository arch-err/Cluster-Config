# Dedicated bulk PVCs on Disk B, mounted by Talos at /var/mnt/bulk on node 2.
# This is single-node storage: availability comes from backups and application
# replication, not from the StorageClass itself.

storageClass:
  create: true
  name: local-bulk
  provisionerName: arch-err.io/local-bulk
  defaultClass: false
  defaultVolumeType: hostPath
  reclaimPolicy: Retain
  volumeBindingMode: WaitForFirstConsumer
  allowedTopologies:
    - matchLabelExpressions:
        - key: kubernetes.io/hostname
          values:
            - node-2

nodePathMap:
  - node: node-2
    paths:
      - /var/mnt/bulk

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

configmap:
  name: local-bulk-config
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod:
    name: helper-pod
    priorityClassName: system-node-critical
