# Grafana — dashboards UI
# Chart: grafana/grafana
# Dashboards via git-sync sidecar from arch-err/grafana-dashboards

# Persistence for grafana DB (sqlite by default)
persistence:
  enabled: true
  storageClassName: kadalu.replica2
  size: 5Gi

# SQLite + RWX kadalu volume = two pods can't safely share. RollingUpdate spawns
# a new pod while the old one still holds the DB open, and the new pod sees
# stale/out-of-sync state across replica2 (most visibly: "data key not found"
# during datasource provisioning when the encrypted secrets row has been
# updated by the running pod but its data_keys row hasn't yet propagated to
# the other node's replica). Recreate guarantees the old pod is gone first.
deploymentStrategy:
  type: Recreate

# Admin: chart auto-generates random 40-char password if adminPassword is unset.
# Retrieve with:
#   kubectl get secret grafana -n monitoring -o jsonpath='{.data.admin-password}' | base64 -d
# On re-install, argocd preserves the existing Secret (helm only creates if missing),
# so the password persists across syncs unless the Secret is manually deleted.
adminUser: admin

# Disable the dashboard ConfigMap sidecar — we use git-sync instead
sidecar:
  dashboards:
    enabled: false
  datasources:
    enabled: false  # We provision via values below

# Datasources — declarative, baked into helm values
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus  # Stable UID so dashboards can reference by uid
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc
        isDefault: true
        jsonData:
          httpMethod: POST
          timeInterval: 30s
      - name: Loki
        uid: loki  # Stable UID so dashboards can reference by uid
        type: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
        jsonData:
          maxLines: 1000

# Dashboard provider — points at the git-sync mount + subfolder in the repo
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: git
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/git/kubernetes/extras/grafana-dashboards
          foldersFromFilesStructure: true

# Git-sync sidecar pulls Cluster-Config every 30s; we mount the dashboards subfolder
extraContainers: |
  - name: git-sync
    image: registry.k8s.io/git-sync/git-sync:v4.4.0
    args:
      - --repo=https://github.com/arch-err/Cluster-Config
      - --ref=v2
      - --root=/dashboards
      - --period=30s
      - --link=current
    volumeMounts:
      - name: dashboards-git
        mountPath: /dashboards
    securityContext:
      runAsUser: 65533
      runAsNonRoot: true

# Init container: clone once before grafana starts (so dashboards exist on first boot)
extraInitContainers:
  - name: git-sync-init
    image: registry.k8s.io/git-sync/git-sync:v4.4.0
    args:
      - --repo=https://github.com/arch-err/Cluster-Config
      - --ref=v2
      - --root=/dashboards
      - --one-time
      - --link=current
    volumeMounts:
      - name: dashboards-git
        mountPath: /dashboards
    securityContext:
      runAsUser: 65533
      runAsNonRoot: true

extraVolumes:
  - name: dashboards-git
    emptyDir: {}

extraVolumeMounts:
  - name: dashboards-git
    mountPath: /var/lib/grafana/dashboards/git
    subPath: current

# OIDC client Secret (auto-created by platform chart's oidc-bootstrap Job in
# the monitoring ns; keys: client_id, client_secret, issuer_url). File-mounted
# so client_secret is never inlined in values.yaml; grafana.ini reads via
# $__file{...} interpolation below.
extraSecretMounts:
  - name: grafana-oidc-client
    secretName: grafana-oidc-client
    defaultMode: 0440
    mountPath: /etc/secrets/oidc
    readOnly: true

# Grafana config
grafana.ini:
  server:
    root_url: https://grafana.infra.home
  analytics:
    reporting_enabled: false
    check_for_updates: false
  log:
    mode: console
  auth.anonymous:
    enabled: false
  # Disable username/password form + auto-redirect to OIDC. Local admin still
  # accessible via ?disableAutoLogin query param + /login path:
  #   https://grafana.infra.home/login?disableAutoLogin=true
  # The form is hidden but the local admin user still exists — use that URL
  # if pocket-id is down or SSO is mid-rotation. admin password retrieval:
  #   kubectl -n monitoring get secret grafana -o jsonpath='{.data.admin-password}' | base64 -d
  auth:
    disable_login_form: true
    oauth_auto_login: true
  # Pocket-ID OIDC. Endpoints come from
  # https://auth.apps.home/.well-known/openid-configuration — exact URLs, not
  # guessed. Client_id/secret file-mounted from grafana-oidc-client Secret
  # (auto-rendered by platform chart's oidc-bootstrap Job, see infra.yaml
  # grafana entry's oidc:* block).
  auth.generic_oauth:
    enabled: true
    name: Pocket ID
    icon: signin
    allow_sign_up: true
    auto_login: false
    client_id: $__file{/etc/secrets/oidc/client_id}
    client_secret: $__file{/etc/secrets/oidc/client_secret}
    scopes: openid profile email groups
    # PKCE is required by the pocket-id client (pkceEnabled: true on the
    # registered OIDC client). Without this grafana doesn't send a
    # code_verifier on the token exchange and pocket-id rejects with
    # "Invalid code verifier".
    use_pkce: true
    # Browser-facing endpoint — public hostname.
    auth_url: https://auth.apps.home/authorize
    # Back-channel endpoints — in-cluster service URL bypasses the gateway,
    # avoiding (a) external DNS for *.apps.home which the cluster only resolves
    # via the CoreDNS hosts block, and (b) TLS verification against the
    # internal home-ca which grafana's pod has no trust bundle for. The token
    # `iss` claim still matches https://auth.apps.home so id_token validation
    # passes. Pocket-id serves the same OIDC endpoints over plain HTTP on its
    # ClusterIP service (same pattern the platform's oidc-bootstrap Job uses).
    token_url: http://pocket-id.pocket-id.svc.cluster.local/api/oidc/token
    api_url: http://pocket-id.pocket-id.svc.cluster.local/api/oidc/userinfo
    # Only Administrators → GrafanaAdmin for now. Other groups fall through to
    # grafana's default "Viewer". Access restriction at the pocket-id side:
    # set the OIDC client's "allowed user groups" to Administrators in the
    # pocket-id UI (manual step, see kubernetes/manual/pocket-id/README.md).
    role_attribute_path: contains(groups[*], 'Administrators') && 'GrafanaAdmin'
    role_attribute_strict: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
