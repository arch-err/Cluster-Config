# crossview — chart: bjw-s/app-template v4.6.2 (generic container wrapper)
# Crossplane resource dashboard. Upstream: https://github.com/crossplane-contrib/crossview
# Image: ghcr.io/crossplane-contrib/crossview:v4.3.0 (Go binary).
#
# ─────────────────────────────────────────────────────────────────────────────
# CHART MIGRATION (2026-05-14): crossplane-contrib/crossview v4.3.0 → bjw-s
# app-template v4.6.2.
#
# WHY: the upstream Crossview chart only exposes `app.extraEnv` — no
# `extraVolumes` / `extraInitContainers` hook. Crossview (Go binary)
# OIDC token-exchange against pocket-id (https://auth.apps.home, home-CA
# signed) fails `x509: certificate signed by unknown authority` because
# Go's TLS stack uses the system CA bundle and has no env-var override
# besides SSL_CERT_FILE — which REPLACES (does not extend) the system
# bundle. So we need to merge alpine system CAs + home-ca's ca.crt into
# a single file and point SSL_CERT_FILE at it. Upstream chart wouldn't
# let us add the init container or extra volume mounts to do that
# without live `kubectl patch` (which ArgoCD reverts).
#
# bjw-s app-template gives us full control over volumes, init containers,
# and env injection. Pattern mirrors readarr.yaml (alpine init-container
# that concats system bundle + home-ca → /merged-ca/ca.crt, main app reads
# SSL_CERT_FILE=/merged-ca/ca.crt). Postgres folded into a second
# `controllers.postgres` block so the whole stack lives in one Helm release.
#
# WHAT THE USER LOSES + MUST RE-DO IN UI AFTER THIS LANDS:
#   - Nothing visible: first SSO login auto-provisions admin per Crossview
#     docs. The bundled postgres is emptyDir (pilot mode — same as before),
#     so any locally-created accounts / sessions are flushed on every pod
#     restart and auto-recreated on next SSO login.
# ─────────────────────────────────────────────────────────────────────────────

controllers:
  # ════════════════════════════════════════════════════════════════════════════
  # Crossview app (Go binary) — main UI + API
  # ════════════════════════════════════════════════════════════════════════════
  main:
    # Recreate to avoid two pods racing on the (in-memory) sqlite-equivalent
    # session store during rollout.
    strategy: Recreate
    initContainers:
      # ──────────────────────────────────────────────────────────────────────
      # 01-ca-bundle-merge — concat alpine system bundle + home-ca/ca.crt
      # ──────────────────────────────────────────────────────────────────────
      # Go's SSL_CERT_FILE REPLACES the system bundle (unlike .NET / Node
      # which extend). So we have to merge first. Result is mounted on the
      # main container at /merged-ca/ca.crt (read-only via emptyDir).
      01-ca-bundle-merge:
        image:
          repository: docker.io/library/alpine
          tag: "3.20"
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            cat /etc/ssl/certs/ca-certificates.crt /home-ca/ca.crt \
              > /merged-ca/ca.crt
            echo "[ca-bundle-merge] wrote /merged-ca/ca.crt ($(wc -l < /merged-ca/ca.crt) lines)"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
      # ──────────────────────────────────────────────────────────────────────
      # 02-wait-for-db — block app start until postgres TCP is up.
      # Mirrors the wait-loop the upstream chart's deployment.yaml renders;
      # uses `nc -z` instead of `psql` to avoid pulling the postgres client.
      # ──────────────────────────────────────────────────────────────────────
      02-wait-for-db:
        image:
          repository: docker.io/library/busybox
          tag: "1.36"
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            until nc -z crossview-postgres 5432; do
              echo "[wait-for-db] crossview-postgres:5432 not ready, sleeping 2s"
              sleep 2
            done
            echo "[wait-for-db] postgres reachable"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
    containers:
      app:
        image:
          repository: ghcr.io/crossplane-contrib/crossview
          # Chart appVersion v4.3.0 → image tag v4.3.0 (verified live).
          tag: "v4.3.0"
        env:
          # Trust home-ca for pocket-id OIDC. Go's SSL_CERT_FILE REPLACES
          # (does not augment) the system bundle — the init container above
          # builds a merged file containing system CAs + home-ca; this
          # points the Go TLS stack at it.
          SSL_CERT_FILE: /merged-ca/ca.crt

          # Core server config
          PORT: "3001"
          LOG_LEVEL: "info"

          # Database — bundled postgres in the `postgres` controller below.
          # Service name `crossview-postgres` preserved for compatibility
          # (the upstream chart used it; nothing else points at it but keep
          # the name stable in case of imperative debugging muscle memory).
          DB_ENABLED: "true"
          DB_HOST: "crossview-postgres"
          DB_PORT: "5432"
          DB_NAME: "crossview"
          DB_USER: "postgres"
          DB_SSL_MODE: "disable"
          DB_SSL_ROOT_CERT: ""
          DB_SSL_CERT: ""
          DB_SSL_KEY: ""
          DB_PASS:
            valueFrom:
              secretKeyRef:
                name: crossview-extra-secrets
                key: dbpassword

          # CORS — must match the public ingress URL.
          CORS_ORIGIN: "https://crossview.infra.home"

          # Auth — native session backed by OIDC (per upstream docs/SSO_SETUP.md).
          AUTH_MODE: "session"
          AUTH_TRUSTED_HEADER: "X-Auth-User"
          AUTH_CREATE_USERS: "true"
          AUTH_DEFAULT_ROLE: "viewer"

          # OIDC against pocket-id. Endpoints are the real pocket-id paths
          # (NOT Keycloak-style /protocol/openid-connect/*); verified against
          # /.well-known/openid-configuration in prior session.
          OIDC_ENABLED: "true"
          OIDC_ISSUER: "https://auth.apps.home"
          OIDC_CLIENT_ID: "crossview"
          OIDC_AUTHORIZATION_URL: "https://auth.apps.home/authorize"
          OIDC_TOKEN_URL: "https://auth.apps.home/api/oidc/token"
          OIDC_USERINFO_URL: "https://auth.apps.home/api/oidc/userinfo"
          OIDC_CALLBACK_URL: "https://crossview.infra.home/api/auth/oidc/callback"
          OIDC_SCOPE: "openid profile email"
          OIDC_USERNAME_ATTRIBUTE: "preferred_username"
          OIDC_EMAIL_ATTRIBUTE: "email"
          OIDC_FIRSTNAME_ATTRIBUTE: "given_name"
          OIDC_LASTNAME_ATTRIBUTE: "family_name"
          OIDC_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                # Rendered by the platform chart's oidc:* block in infra.yaml.
                name: crossview-oidc-client
                key: client_secret

          # Session cookie signing key (separate from OIDC secret).
          SESSION_SECRET:
            valueFrom:
              secretKeyRef:
                name: crossview-extra-secrets
                key: sessionsecret
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 3001
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 3001
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 3
          startup:
            enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        # Restricted-PSS clean. Crossview image is non-root (uid 1000 verified
        # on live pod from the upstream chart deployment); lock down explicitly.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
    serviceAccount:
      # Reference the SA rendered below (rbac.bindings binds it to the
      # cluster-read ClusterRole).
      identifier: crossview

  # ════════════════════════════════════════════════════════════════════════════
  # Bundled postgres — pilot mode, emptyDir
  # ════════════════════════════════════════════════════════════════════════════
  # Mirrors what the upstream chart's templates/postgres-deployment.yaml
  # rendered (verified via live deploy crossview-postgres). emptyDir means
  # local accounts + sessions are flushed on pod restart; OIDC users
  # auto-recreate on next login. Promote to kadalu-backed PV with init-chown
  # (immich pattern) when user mgmt graduates from pilot.
  postgres:
    strategy: Recreate
    containers:
      app:
        image:
          repository: docker.io/library/postgres
          # postgres:16 (Debian-based, NOT -alpine): alpine's postgres user
          # is uid 70, which collides with our runAsUser=999. Debian image's
          # postgres user IS uid 999 by default.
          tag: "16"
        env:
          POSTGRES_DB: "crossview"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: crossview-extra-secrets
                key: dbpassword
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["pg_isready", "-U", "postgres"]
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["pg_isready", "-U", "postgres"]
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 3
          startup:
            enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault

# fsGroup applies to the merged-ca emptyDir + the postgres data dir.
defaultPodOptions:
  securityContext:
    fsGroupChangePolicy: OnRootMismatch

# ──────────────────────────────────────────────────────────────────────────────
# SERVICES
# ──────────────────────────────────────────────────────────────────────────────
# - `app` service: forward port 80 → 3001 on the main controller. NAME
#   intentionally NOT `crossview-service` — bjw-s renders `<release>-<key>`,
#   so `app` → `crossview-app`. infra.yaml's route block updated to match.
# - `postgres` service: ClusterIP 5432, NAME `crossview-postgres` (forceRename)
#   to preserve the DB_HOST env above + match what the upstream chart had.
service:
  app:
    controller: main
    forceRename: crossview-app
    ports:
      http:
        port: 80
        targetPort: 3001
  postgres:
    controller: postgres
    forceRename: crossview-postgres
    ports:
      postgres:
        port: 5432
        targetPort: 5432

# ──────────────────────────────────────────────────────────────────────────────
# PERSISTENCE
# ──────────────────────────────────────────────────────────────────────────────
persistence:
  # home-ca trust bundle (broadcast by trust-manager into every ns as the
  # `home-ca-bundle` ConfigMap, key ca.crt — verified live). Read-only mount
  # consumed by the 01-ca-bundle-merge init container only.
  home-ca:
    enabled: true
    type: configMap
    name: home-ca-bundle
    advancedMounts:
      main:
        01-ca-bundle-merge:
          - path: /home-ca
            readOnly: true
  # emptyDir holding the merged CA bundle the init container produces.
  # Written by 01-ca-bundle-merge, read by the main app via SSL_CERT_FILE.
  merged-ca:
    type: emptyDir
    advancedMounts:
      main:
        01-ca-bundle-merge:
          - path: /merged-ca
          - path: /merged-ca
        app:
          - path: /merged-ca
            readOnly: true
  # Writable scratch for postgres socket (matches what the upstream chart's
  # postgres deployment had; postgres needs /var/run/postgresql writable).
  postgres-socket:
    type: emptyDir
    advancedMounts:
      postgres:
        app:
          - path: /var/run/postgresql
  # Postgres data dir — pilot-mode emptyDir (see header). When promoting to
  # kadalu, flip this to type: persistentVolumeClaim and add the immich
  # init-chown pattern.
  postgres-data:
    type: emptyDir
    advancedMounts:
      postgres:
        app:
          - path: /var/lib/postgresql/data

# ──────────────────────────────────────────────────────────────────────────────
# SERVICE ACCOUNT + RBAC
# ──────────────────────────────────────────────────────────────────────────────
# Crossview's UI traverses Crossplane resources cluster-wide. Rules MIRROR
# the upstream chart's templates/rbac.yaml (verified via
# `kubectl get clusterrole crossview-role -o yaml` against the live chart).
serviceAccount:
  crossview:
    enabled: true
rbac:
  roles:
    crossview-read:
      enabled: true
      type: ClusterRole
      rules:
        - apiGroups: [""]
          resources:
            - namespaces
            - pods
            - services
            - configmaps
            - secrets
            - events
            - nodes
            - persistentvolumes
            - persistentvolumeclaims
          verbs: [get, list, watch]
        - apiGroups: [apiextensions.k8s.io]
          resources: [customresourcedefinitions]
          verbs: [get, list, watch]
        - apiGroups: [apiextensions.crossplane.io]
          resources:
            - managedresourceactivationpolicies
            - managedresourcedefinitions
          verbs: [get, list, watch]
        - apiGroups: ["*"]
          resources: ["*"]
          verbs: [get, list, watch]
  bindings:
    crossview-read:
      enabled: true
      type: ClusterRoleBinding
      roleRef:
        identifier: crossview-read
      subjects:
        - identifier: crossview
