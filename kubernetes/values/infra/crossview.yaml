# crossview — chart: crossplane-contrib/crossview chart v4.3.0
# Helm repo: https://crossplane-contrib.github.io/crossview
# Chart source: https://github.com/crossplane-contrib/crossview (helm/crossview/)
#
# AUTH: native OIDC against pocket-id. NO oauth2-proxy fronting.
#   - Crossview's own OIDC client (per docs/SSO_SETUP.md) hits
#     /api/auth/oidc/callback on its own ingress host.
#   - First SSO user becomes admin automatically (per Crossview README).
#     Subsequent SSO users are auto-provisioned as regular users.
#   - Group restriction enforced AT THE IDP via platform oidc:
#     groupRestriction.allowedGroups=[administrators] in infra.yaml.
#
# POSTGRES — pilot mode (emptyDir):
#   - database.persistence.enabled=false → bundled pg uses emptyDir.
#     Kadalu CSI doesn't honor fsGroup cleanly for non-root pods, and the
#     chart's bundled pg doesn't ship an init-chown container. Sessions
#     and local user list lost on pod restart; OIDC users auto-recreate
#     on next login (createUsers=true). Promote to kadalu-PV + init-chown
#     (immich pattern) once user mgmt is settled.

# Namespace handled by the platform extras template, not this chart.
global:
  namespace: crossview
  createNamespace: false

image:
  repository: ghcr.io/crossplane-contrib/crossview
  # Chart 4.3.0 appVersion is v4.3.0. The chart's artifacthub annotation
  # claims `v4.3.0-rc.7` but that tag does not exist on ghcr.io (verified via
  # `oras repo tags`). Actual stable tag published is `v4.3.0`.
  tag: "v4.3.0"
  pullPolicy: IfNotPresent

app:
  name: crossview
  port: 3001
  replicas: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

service:
  type: ClusterIP
  port: 80
  targetPort: 3001
  sessionAffinity: None

# Platform chart owns the HTTPRoute.
ingress:
  enabled: false

# ──────────────────────────────────────────────────────────────────────────
# BUNDLED POSTGRES (pilot mode — emptyDir, see header)
# ──────────────────────────────────────────────────────────────────────────
database:
  enabled: true
  image:
    repository: postgres
    # Debian-based 16 (not -alpine): the alpine image's postgres user is uid 70,
    # which collides with our containerSecurityContext.runAsUser=999. Debian
    # postgres image uses uid 999 by default — matches.
    tag: "16"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  persistence:
    enabled: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

# ──────────────────────────────────────────────────────────────────────────
# CROSSVIEW CONFIG (env-mapped via chart's configmap.yaml)
# ──────────────────────────────────────────────────────────────────────────
config:
  database:
    enabled: true
    # host defaults to <release>-postgres if empty. Release name == "crossview"
    # → host resolves to crossview-postgres.crossview.svc.cluster.local:5432.
    host: ""
    port: 5432
    database: crossview
    username: postgres
    ssl:
      mode: disable
      rootCert: ""
      cert: ""
      key: ""
  server:
    port: 3001
    auth:
      # Native session auth backed by OIDC (per docs/SSO_SETUP.md). The chart
      # configmap.yaml renders AUTH_MODE → server.auth.mode.
      mode: session
    log:
      level: info
    cors:
      # Public ingress URL — used as post-SSO redirect destination.
      # MUST be the actual host or users get redirected to localhost.
      origin: https://crossview.infra.home
      credentials: true
    session:
      cookie:
        secure: true
        httpOnly: true
        maxAge: 86400000   # 1d
  # Native OIDC against pocket-id. Client ID = "crossview" (platform-rendered).
  # Pocket-id does NOT use Keycloak-style /protocol/openid-connect/* paths —
  # its real endpoints are /authorize, /api/oidc/token, /api/oidc/userinfo
  # (from /.well-known/openid-configuration). Crossview's go-oidc lib doesn't
  # auto-discover when issuer is set without explicit URLs, so set them.
  sso:
    oidc:
      enabled: true
      issuer: https://auth.apps.home
      clientId: crossview
      authorizationURL: https://auth.apps.home/authorize
      tokenURL: https://auth.apps.home/api/oidc/token
      userInfoURL: https://auth.apps.home/api/oidc/userinfo
      callbackURL: https://crossview.infra.home/api/auth/oidc/callback
      scope: openid profile email
      usernameAttribute: preferred_username
      emailAttribute: email
      firstNameAttribute: given_name
      lastNameAttribute: family_name
    saml:
      enabled: false

# ──────────────────────────────────────────────────────────────────────────
# SECRETS
# - dbPassword + sessionSecret from SopsSecret crossview-secrets
#   (kubernetes/secrets/infra/crossview-secrets.yaml).
# - OIDCClientSecret from platform-rendered crossview-oidc-client secret
#   (rendered by the oidc:* block in infra.yaml; bootstrap Job in pocket-id ns).
# ──────────────────────────────────────────────────────────────────────────
secrets:
  # adminUsername/adminPassword unused once OIDC is the only login path, but
  # the chart's secret template requires non-empty values to render env vars.
  # First SSO user becomes admin per Crossview docs — these never get used.
  adminUsername: "admin"
  adminPassword: "ChangeMeUnusedWithOIDC"
  # NOTE: SopsSecret renders Secret `crossview-extra-secrets` (NOT crossview-secrets)
  # because the chart's own secret template creates `crossview-secrets` for the
  # admin{Username,Password} inline strings. Two different secrets, no name
  # collision.
  dbPassword:
    secretKeyRef:
      name: crossview-extra-secrets
      key: dbpassword
  sessionSecret:
    secretKeyRef:
      name: crossview-extra-secrets
      key: sessionsecret
  OIDCClientSecret:
    secretKeyRef:
      name: crossview-oidc-client
      key: client_secret
  SAMLCert: ""

# ──────────────────────────────────────────────────────────────────────────
# RBAC + SA — chart-default cluster-wide read for crossplane resource traversal
# ──────────────────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: crossview-sa
rbac:
  create: true
  clusterRole:
    name: crossview-role
  clusterRoleBinding:
    name: crossview-binding

autoscaling:
  enabled: false
