# homepage-admin — chart: jameswynn/homepage v2.1.0 (gethomepage)
# https://artifacthub.io/packages/helm/jameswynn/homepage
#
# Third homepage instance, dedicated to admin/observability use.
# Differentiators vs. homepage / homepage-infra:
#   - widgets: kubernetes cluster overview, resources, prometheus targets
#   - bookmarks: deep links into argocd / grafana / prometheus / loki UIs
#   - shows ALL services across both gateways via gethomepage.dev/instance.admin
# Lives at admin.infra.home; LAN-gated only (no OIDC v1 — follow-up).

image:
  tag: v1.12.3

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "admin.infra.home"

# Pull HOMEPAGE_VAR_GRAFANA_USERNAME / HOMEPAGE_VAR_GRAFANA_PASSWORD /
# HOMEPAGE_VAR_ARGOCD_TOKEN from the SopsSecret `homepage-admin-credentials`
# (kubernetes/secrets/infra/homepage-admin-credentials.yaml). gethomepage
# substitutes ONLY env vars whose name starts with HOMEPAGE_VAR_ or
# HOMEPAGE_FILE_, so the keys in that Secret are pre-prefixed.
# https://gethomepage.dev/installation/docker/#using-environment-secrets
envFrom:
  - secretRef:
      name: homepage-admin-credentials

ingress:
  main:
    enabled: false

# Distinct SA name to avoid RBAC collision with homepage / homepage-infra.
# Chart's enableRbac:true ships a ClusterRole granting read on namespaces,
# pods, nodes, ingresses, gateways, httproutes, metrics.k8s.io, CRDs — all
# the kubernetes/resources widgets need. Verified against existing
# homepage-infra ClusterRole.
serviceAccount:
  create: true
  name: homepage-admin
enableRbac: true

config:
  kubernetes:
    mode: cluster
    ingress: false
    gateway: true
    services: true

  # Admin uses its own instance filter. The platform chart annotates every
  # dashboard-visible HTTPRoute with both its gateway instance and
  # `gethomepage.dev/instance.admin`, so admin sees apps + infra while the
  # gateway dashboards remain scoped.
  #
  # Live service-card widgets for Grafana + ArgoCD. Credentials come from
  # the homepage-admin-credentials SopsSecret via envFrom (above).
  #   - Grafana basic-auth still works on /api/* even with disable_login_form:true.
  #   - ArgoCD widget uses the apiKey-only `homepage-widget` local account
  #     (defined in kubernetes/values/infra/argocd.yaml). Token gen is
  #     manual one-time — see that file's comment block. Until the user
  #     runs that command + edits the Secret, the ArgoCD card will show
  #     "auth failed".
  # NOTE: groups below are PROVISIONAL — comprehensive link inventory of every
  # app we run, bucketed into sensible-but-rough categories. Easy to regroup.
  # Grafana + ArgoCD keep their live widgets (creds via envFrom).
  services:
    - Gateways:
        - Apps Gateway:
            href: https://homepage.apps.home
            description: Apps dashboard (homepage)
            icon: mdi-view-dashboard
        - Infra Gateway:
            href: https://homepage.infra.home
            description: Infra dashboard (homepage)
            icon: mdi-view-dashboard-variant
    - Observability:
        - Grafana:
            href: https://grafana.infra.home
            description: Dashboards, logs, metrics
            icon: grafana.png
            widget:
              type: grafana
              url: https://grafana.infra.home
              username: "{{HOMEPAGE_VAR_GRAFANA_USERNAME}}"
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
        - Hubble:
            href: https://hubble.infra.home
            description: Cilium network observability
            icon: cilium.png
    - GitOps:
        - ArgoCD:
            href: https://argocd.infra.home/auth/login
            description: Cluster GitOps controller
            icon: argocd.png
            widget:
              type: argocd
              url: https://argocd.infra.home
              key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"

    - Security:
        - Pocket ID:
            href: https://auth.apps.home
            description: OIDC identity provider
            icon: pocket-id.png
        - Vaultwarden:
            href: https://vaultwarden.apps.home
            description: Password manager
            icon: vaultwarden.svg
        - Agent Vault:
            href: https://agent-vault.apps.home
            description: Agent secrets store
            icon: infisical.svg

    - Media:
        - Jellyfin:
            href: https://jellyfin.apps.home
            description: Movies & TV streaming
            icon: jellyfin.svg
        - Navidrome:
            href: https://navidrome.apps.home
            description: Music streaming server
            icon: navidrome.svg
        - Audiobookshelf:
            href: https://audiobookshelf.apps.home
            description: Audiobooks & podcasts
            icon: audiobookshelf.svg
        - Immich:
            href: https://immich.apps.home
            description: Photo & video library
            icon: immich.svg
        - MeTube:
            href: https://metube.apps.home
            description: yt-dlp web downloader
            icon: metube.png
        - BookLore:
            href: https://booklore.apps.home
            description: Ebook library manager
            icon: si-bookstack.svg
        - Calibre-Web:
            href: https://calibre.apps.home
            description: Ebook reader & catalogue
            icon: calibre-web.svg
        - qBittorrent:
            href: https://qbittorrent.infra.home
            description: Torrent client
            icon: qbittorrent.png

    - Docs & Notes:
        - Papra:
            href: https://papra.apps.home
            description: Document management
            icon: papra.png
        - Excalidash:
            href: https://excalidash.apps.home
            description: Whiteboard / diagrams
            icon: excalidraw.svg

    - Tools:
        - IT Tools:
            href: https://it-tools.apps.home
            description: Dev/sysadmin utilities
            icon: it-tools.png
        - CyberChef:
            href: https://cyberchef.apps.home
            description: Data transform workbench
            icon: cyberchef.png
        - Syncthing:
            href: https://syncthing.apps.home
            description: File sync
            icon: syncthing.svg
        - Stirling PDF:
            href: https://stirling-pdf.apps.home
            description: PDF toolkit
            icon: stirling-pdf.png

    - Comms:
        - Matrix:
            href: https://matrix.apps.home
            description: Matrix homeserver
            icon: matrix.svg
        - Hookshot:
            href: https://hookshot.apps.home
            description: Matrix bridge / webhooks
            icon: mdi-bridge
        - ntfy:
            href: https://ntfy.apps.home
            description: Push notifications
            icon: ntfy.svg

    - Smart Home:
        - Home Assistant:
            href: https://ha.apps.home
            description: Home automation
            icon: home-assistant.svg
        - Zigbee2MQTT:
            href: https://zigbee2mqtt.infra.home
            description: Zigbee device gateway
            icon: zigbee2mqtt.png

  bookmarks:
    - Observability:
        - Prometheus:
            - abbr: PR
              href: https://prometheus.infra.home

  # Top-of-page info widgets. Order matters — rendered left-to-right.
  # See https://gethomepage.dev/widgets/info/ for the catalogue.
  widgets:
    # Cluster-wide CPU / mem rollup — lifted straight from the kubernetes-widget
    # response (which the kubernetes info widget below also drives). No on-host
    # disk path because pods can't see node disks without privileged mounts.
    - resources:
        label: Cluster
        cpu: true
        memory: true
        expanded: true

    # Cluster + per-node CPU/mem from metrics.k8s.io.
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    # Prometheus targets up/down/total. URL is in-cluster — no auth required
    # since we don't expose prometheus-server ClusterIP externally.
    # Service name from `kubectl -n monitoring get svc | grep prometheus-server`.
    - prometheus:
        url: http://prometheus-server.monitoring.svc.cluster.local

  settings:
    title: Admin
    instanceName: admin
    theme: dark
    color: zinc
    headerStyle: clean
    hideVersion: true
    statusStyle: dot
    # Native glass feel (no custom.css — keeps it robust). cardBlur is the only
    # built-in knob for the frosted-backdrop look on the translucent .service-card
    # tiles; max it out. The bg below is dimmed so the light cards pop against it.
    cardBlur: xl
    background:
      image: https://raw.githubusercontent.com/arch-err/Cluster-Config/v2/kubernetes/assets/glaze_2.png
      # Crisp silk behind the frosted cards; brightness/opacity dialed down so the
      # translucent tiles read with more contrast against the dark silk.
      brightness: 50
      opacity: 65

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Restricted PSS compliance (homepage-admin ns inherits the cluster's
# restricted default; same as homepage / homepage-infra).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
