# bookinfo — chart: bjw-s/app-template v4.6.2 (generic container wrapper)
# Self-hosted BookInfo / readarr metadata mirror.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY
# ─────────────────────────────────────────────────────────────────────────────
# Readarr's binary historically hits `https://api.bookinfo.club/` for all
# metadata lookups (author search, book lookup, cover art). The upstream
# domain has been dead since ~2024 (the Readarr project was archived). Every
# search in readarr's UI failed with:
#   HttpRequestException: Name does not resolve (api.bookinfo.club:443)
# An earlier session tried hostAliases → the community CF mirror at
# api.bookinfo.pro; that hit an SNI mismatch (CF's cert doesn't cover
# api.bookinfo.club) and was reverted (commit 36a7cbf).
#
# This deployment replaces the dead upstream with a local instance running
# `blampe/rreading-glasses` — the canonical community fork (Goodreads-backed
# metadata-as-a-service). Architecture:
#
#   readarr pod
#     └── HTTPS GET https://api.bookinfo.club/...
#           └── DNS: CoreDNS `rewrite name exact api.bookinfo.club
#                            bookinfo-tls.bookinfo.svc.cluster.local`
#                 → in-cluster ClusterIP svc resolves
#           └── TLS: bookinfo-tls Service :443 hits the nginx-tls sidecar in
#                    the bookinfo pod. The sidecar's cert (cert-manager,
#                    home-ca ClusterIssuer) has SAN api.bookinfo.club —
#                    SNI matches, no cert errors. readarr trusts home-ca
#                    via its mounted home-ca-bundle (see values/apps/readarr.yaml).
#           └── nginx terminates TLS, proxy_pass http://127.0.0.1:8788/
#                 → rreading-glasses on the same pod responds.
#
# A second route exists for human use on the infra gateway:
#   bookinfo.infra.home → bookinfo Service :80 (plain HTTP) → :8788
# Used for poking the API directly + the homepage card on infra.home.
#
# ─────────────────────────────────────────────────────────────────────────────
# IMAGE / FORK SOURCE
# ─────────────────────────────────────────────────────────────────────────────
# Upstream repo: https://github.com/blampe/rreading-glasses
# Image:         docker.io/blampe/rreading-glasses:latest (Goodreads variant)
# Alt tag:       blampe/rreading-glasses:hardcover (Hardcover, requires API
#                key; not used here — Goodreads coverage is wider for this
#                user's library).
# Listens on:    :8788 HTTP
# Backend:       Postgres (any version) — persistent k/v cache. Grows over
#                time (~few GB max for personal use). Provided by extras
#                block: PVC `bookinfo-postgres` + Deployment `bookinfo-postgres`
#                + Service `bookinfo-postgres` in this ns.
#
# RESTORATION (if data wipes):
#   The postgres PVC is just a metadata cache — first hit on each book/author
#   triggers an upstream Goodreads scrape, response gets cached. No user
#   content lives here. Safe to wipe + repopulate naturally.
#
# ─────────────────────────────────────────────────────────────────────────────

controllers:
  main:
    strategy: Recreate     # pod owns no PVC; extras-postgres is independent
    containers:
      app:
        image:
          repository: docker.io/blampe/rreading-glasses
          # Pinned by digest at first run. Use `latest` initially per upstream
          # README guidance (active dev, no semver tags published yet —
          # verify before bumping).
          tag: latest
        # Upstream entrypoint is /main + serve subcommand + flags.
        command: ["/main"]
        args:
          - serve
          - --upstream=www.goodreads.com
          - --verbose
        env:
          POSTGRES_HOST: bookinfo-postgres
          POSTGRES_DATABASE: bookinfo
          POSTGRES_USER: bookinfo
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: bookinfo-db
                key: DB_PASSWORD
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8788
              initialDelaySeconds: 20
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8788
              initialDelaySeconds: 5
              periodSeconds: 10
          startup:
            enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi   # upstream sets 128m; doubled for headroom
        # Restricted-PSS clean. The image runs as a non-root user by default
        # (alpine-based; verified via inspection). Lock down explicitly.
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault

      # ─────────────────────────────────────────────────────────────────────
      # nginx-tls SIDECAR — terminates TLS for `api.bookinfo.club`
      # ─────────────────────────────────────────────────────────────────────
      # Serves on :8443 (sidecar) so the main container doesn't need
      # NET_BIND_SERVICE for :443. The bookinfo-tls Service maps :443 → :8443.
      # Cert is issued by cert-manager via the home-ca ClusterIssuer with
      # SAN=api.bookinfo.club; rendered into Secret `bookinfo-api-tls` in
      # this ns; mounted at /etc/nginx/tls.
      tls:
        image:
          repository: docker.io/library/nginx
          tag: "1.27-alpine"
        env:
          NGINX_ENTRYPOINT_QUIET_LOGS: "1"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8443
              initialDelaySeconds: 10
              periodSeconds: 20
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8443
              initialDelaySeconds: 3
              periodSeconds: 10
          startup:
            enabled: false
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        # nginx:alpine has its entrypoint write /etc/nginx/conf.d/* + chown
        # /var/cache/nginx; with readOnlyRootFilesystem we provide explicit
        # emptyDirs for those paths (see persistence below). Drop ALL caps;
        # nginx binds :8443 (>1024) so NET_BIND_SERVICE is unnecessary.
        securityContext:
          runAsNonRoot: true
          runAsUser: 101            # nginx user in the alpine image
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault

# Two services — apps gateway never sees this app (infra-tier only):
#   - main : ClusterIP :80 → app:8788 (HTTP). Backs the bookinfo.infra.home
#            HTTPRoute (terminated at the infra gateway with the wildcard
#            *.infra.home cert). Human-facing API + homepage card.
#   - tls  : ClusterIP :443 → tls:8443 (HTTPS, home-ca cert covering
#            api.bookinfo.club). Backs the readarr→bookinfo path. CoreDNS
#            rewrites `api.bookinfo.club` → this Service's FQDN.
service:
  main:
    controller: main
    ports:
      http:
        port: 80
        targetPort: 8788
  tls:
    controller: main
    ports:
      https:
        port: 443
        targetPort: 8443

persistence:
  # nginx config — rendered as a ConfigMap (extras.bookinfo block) and
  # mounted read-only at /etc/nginx/conf.d.
  nginx-conf:
    enabled: true
    type: configMap
    name: bookinfo-nginx
    advancedMounts:
      main:
        tls:
          - path: /etc/nginx/conf.d
            readOnly: true
  # cert-manager-rendered Secret with the home-ca-issued SAN=api.bookinfo.club
  # cert. Created by extras.bookinfo block (Certificate resource).
  api-tls:
    enabled: true
    type: secret
    name: bookinfo-api-tls
    advancedMounts:
      main:
        tls:
          - path: /etc/nginx/tls
            readOnly: true
  # nginx writable scratch dirs — readOnlyRootFilesystem requires explicit
  # emptyDirs for nginx's runtime paths.
  nginx-cache:
    type: emptyDir
    advancedMounts:
      main:
        tls:
          - path: /var/cache/nginx
  nginx-run:
    type: emptyDir
    advancedMounts:
      main:
        tls:
          - path: /var/run

# fsGroup for the cert Secret so the nginx user can read /etc/nginx/tls/tls.key.
defaultPodOptions:
  securityContext:
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
