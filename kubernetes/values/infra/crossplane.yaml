# crossplane — chart: crossplane-stable/crossplane v2.2.1
# https://artifacthub.io/packages/helm/crossplane/crossplane
#
# Crossplane core controller + rbac-manager + CRDs in the `crossplane-system`
# namespace. Pure control-plane machinery — no HTTPRoute, no homepage card.
# Crossview (sibling release) is the human-facing UI fronted by oauth2-proxy.
#
# Chart defaults are restricted-PSS clean out of the box:
#   - container runAsUser/runAsGroup=65532
#   - allowPrivilegeEscalation=false
#   - readOnlyRootFilesystem=true
# So `crossplane-system` ns can stay at the cluster default (restricted) —
# no PSS label needed. Verified against chart values @ release-2.2.
#
# NO PROVIDERS installed yet — out of scope for this commit. Future work:
# decide which providers (cloudflare, aws, kubernetes-self, helm) and add
# them as Provider CRs once the user reviews the surface area.

# Single-replica for a home cluster (default). Bump to 2 with a leader-elect
# anti-affinity once the cluster ever hosts production-grade workloads.
replicas: 1

# Pin the image tag to match the chart's appVersion (the chart's appVersion
# field is v2.2.1 → image tag v2.2.1). Disabling `latest` digest drift.
image:
  repository: xpkg.crossplane.io/crossplane/crossplane
  tag: "v2.2.1"
  pullPolicy: IfNotPresent

# Keep the rbac-manager — Crossplane needs the cluster-wide RBAC it generates
# to grant providers access to their managed resources. Disabling it breaks
# every provider install. Default is true; explicit here for clarity.
rbacManager:
  deploy: true
  replicas: 1

# Modest resource floor for a 3-node home cluster. Bump if reconcile latency
# becomes noticeable once providers are added.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Belt-and-suspenders: full restricted-PSS container securityContext.
#
# The chart's values.yaml defaults `securityContextCrossplane:` to ONLY four
# fields (runAsUser/Group, allowPrivEsc=false, readOnlyRootFs=true) — that's
# NOT enough to pass restricted PSS on Talos (`with` merges, not unions with
# implicit defaults). Verified live: pod admission rejects with
#   "violates PodSecurity 'restricted:latest': unrestricted capabilities
#    (containers must set securityContext.capabilities.drop=['ALL']),
#    runAsNonRoot != true, seccompProfile..."
# So we must include drop:[ALL], runAsNonRoot:true, and a seccompProfile.
# Applied to BOTH the crossplane-init initContainer AND the main container
# (the chart's deployment.yaml uses one block for both via `with`).
securityContextCrossplane:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

securityContextRBACManager:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# Metrics endpoint — kept on by default. Future work: wire a ServiceMonitor
# (or scrape via prometheus-additional-scrape-configs) into the monitoring ns.
metrics:
  enabled: true

# No webhooks/secrets/extra config needed for the bare-core install. Providers
# (added later) will bring their own ProviderConfigs + credentials.
