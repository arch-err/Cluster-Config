# Cilium configuration for Talos + Gateway API

# Kubernetes API server
k8sServiceHost: 10.10.10.170
k8sServicePort: 6443

# Enable kube-proxy replacement
kubeProxyReplacement: true

# IPAM configuration
ipam:
  mode: kubernetes

# Talos-specific cgroup configuration
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Security context for Talos
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Gateway API support
gatewayAPI:
  enabled: true
  # Honor `appProtocol` on Service ports (e.g. `kubernetes.io/h2c`,
  # `kubernetes.io/ws`). Required for GRPCRoute → h2c upstream so envoy
  # forces HTTP/2 cleartext to the backend instead of mirroring the
  # downstream protocol. Without this flag, GRPCRoute backends served by
  # apps that cmux/mux on a single port (argocd-server in `--insecure`
  # mode is the canonical case) get HTTP/1.1 traffic and 404 with
  # `grpc-message: 404 page not found` even though routing succeeded.
  enableAppProtocol: true

# L2 announcements for LoadBalancer services
l2announcements:
  enabled: true

# External IPs support
externalIPs:
  enabled: true

# Native routing (no tunneling) - required for DSR
routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.244.0.0/16

# eBPF load balancing
loadBalancer:
  mode: snat
  algorithm: maglev

# BPF settings
bpf:
  masquerade: true
  # Enable host routing to reach pods from node
  hostLegacyRouting: false

# Enable socket-level load balancing for host
socketLB:
  enabled: true
  hostNamespaceOnly: false

# Operator configuration
operator:
  replicas: 1

# Hubble observability
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload

# Rollout configuration
rollOutCiliumPods: true
priorityClassName: system-node-critical
