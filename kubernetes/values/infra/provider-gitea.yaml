# provider-gitea — chart: bjw-s-labs/app-template v4.6.2 (raw-resources wrap)
# https://artifacthub.io/packages/helm/bjw-s-labs/app-template
#
# Crossplane provider for managing Forgejo/Gitea resources declaratively.
# Wires up against the in-cluster forgejo at https://git.apps.home using the
# cluster-bootstrap admin token from Secret `crossplane-system/forgejo-admin-token`
# (minted by phase 3.5's admin-bootstrap Job).
#
# WHY app-template wrap (not a native chart or platform raw-manifest pattern):
#   - provider-gitea has no upstream Helm chart; the install path is plain
#     Crossplane CRs (Provider + DeploymentRuntimeConfig + ProviderConfig)
#   - the platform chart's `components:` expects a Helm-chart-shaped source,
#     so we hijack bjw-s app-template's `rawResources` to emit the three CRs
#     as a thin shim. `controllers: {}` (default) → no Deployment, no
#     ServiceAccount, no Service rendered — only the rawResources surface
#   - mirrors the precedent set by crossview (also wrapped in app-template
#     when the upstream chart's surface was insufficient)
#
# UPSTREAM PROJECT STATE (read before bumping):
#   provider-gitea has migrated authorship: the original repo at
#   github.com/crossplane-contrib/provider-gitea does NOT exist anymore — the
#   active fork is github.com/rossigee/provider-gitea (referenced as
#   "crossplane-contrib/provider-gitea" in some upstream docs / install.yaml
#   examples but published only to ghcr.io/rossigee/* in practice).
#
#   v0.7.0 / v0.8.x stripped the controller `Setup()` function down to
#   `return nil` while a "v2-only framework" refactor is in progress (see
#   the upstream README "Current Status: Framework Ready — Controllers
#   Required"). Those releases install cleanly and HEALTHY but DO NOT
#   reconcile any managed resource — they're framework-only stubs.
#
#   The last release with working controllers wired into Setup() is v0.6.x.
#   The only image tag actually published to ghcr.io/rossigee/provider-gitea
#   is `v0.6.0-final` — that's the pin we use here. When upstream re-lands
#   the controllers (post-v2 refactor) bump this AFTER smoke-testing an
#   Organization MR reconciles.
#
#   Resource kinds available at v0.6.x (verified against the package/crds
#   tree at tag v0.6.2):
#     - Repository, Organization, OrganizationSettings, OrganizationMember,
#       OrganizationSecret, Team, User, AdminUser, UserKey
#     - Webhook, DeployKey, BranchProtection, RepositoryCollaborator,
#       RepositoryKey, RepositorySecret, Label, GitHook
#     - Issue, PullRequest, Release
#     - Action, Runner, AccessToken
#   All in apiGroup `<kind-lowercase>.gitea.crossplane.io/v1alpha1` (each
#   resource family has its own group). ProviderConfig is
#   `gitea.crossplane.io/v1beta1` (cluster-scoped).
#
# TLS TRUST PATH:
#   Forgejo presents a cert signed by home-ca (cluster's private root,
#   managed by trust-manager via the home-ca-bundle Bundle in
#   platform/templates/extras.yaml — namespaceSelector: {} → propagated to
#   all namespaces including crossplane-system). The provider's Go HTTP
#   client must trust home-ca, otherwise it will fail with
#   "x509: certificate signed by unknown authority" on every API call.
#
#   The provider image is alpine-based, runs as uid 65532, ENTRYPOINT
#   /usr/local/bin/provider. We mount the home-ca-bundle ConfigMap to
#   /etc/ssl/certs/ca-certificates.crt (subPath: ca.crt) AND set
#   SSL_CERT_FILE as belt-and-suspenders — Go's crypto/x509 default cert
#   loader honors both the alpine system bundle path and the env var.
#   ProviderConfig stays `insecure: false`.
#
# SECRET DEPENDENCY:
#   ProviderConfig credentials come from Secret crossplane-system/forgejo-admin-token
#   (key: token), minted by the platform's forgejo-admin-bootstrap Job and
#   already present in-cluster (phase 3.5). The SA + RoleBinding scoping
#   the Job's writes to that single secret already exist.

# No workload controllers — this release only emits cluster-scoped Crossplane CRs.
controllers: {}
service: {}
serviceAccount: {}

rawResources:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Provider CR — pulls the provider package, references the runtime
  #    config so the controller Pod gets the CA bundle mount + env var.
  # ─────────────────────────────────────────────────────────────────────
  provider:
    forceRename: provider-gitea
    apiVersion: pkg.crossplane.io/v1
    kind: Provider
    annotations:
      argocd.argoproj.io/sync-wave: "3"  # after crossplane core (wave 2)
    # NB: bjw-s app-template's rawResource template inlines whatever lives
    # under `spec:` directly as top-level YAML keys on the rendered object.
    # To produce a resource with its own `spec:` block (Provider, ProviderConfig)
    # we therefore nest a second `spec:` here. DeploymentRuntimeConfig has the
    # same shape. Verified by `helm template` round-trip.
    spec:
      spec:
        # Pinned to the last release with working controllers wired into
        # Setup() — see header. v0.7.0+ are framework-only stubs that won't
        # reconcile MRs. Bump only after verifying controllers are back.
        package: ghcr.io/rossigee/provider-gitea:v0.6.0-final
        runtimeConfigRef:
          apiVersion: pkg.crossplane.io/v1beta1
          kind: DeploymentRuntimeConfig
          name: provider-gitea

  # ─────────────────────────────────────────────────────────────────────
  # 2. DeploymentRuntimeConfig — injects home-ca trust into the provider
  #    Pod. ConfigMap key ca.crt → mounted as the alpine ca-certificates
  #    bundle; SSL_CERT_FILE env var as the explicit Go fallback.
  # ─────────────────────────────────────────────────────────────────────
  runtimeConfig:
    forceRename: provider-gitea
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    annotations:
      argocd.argoproj.io/sync-wave: "3"
    spec:
      spec:
        deploymentTemplate:
          spec:
            selector: {}
            template:
              spec:
                # crossplane-system ns runs at restricted PSS (cluster default).
                # Provider image already runs as uid 65532 (see Dockerfile),
                # but the chart-default pod spec leaves capabilities + seccomp
                # unset → admission rejects with "unrestricted capabilities"
                # and "seccompProfile not set". Same pattern as the crossplane
                # core chart's securityContextCrossplane block. Applied here
                # because DRC overrides the default package-manager-rendered
                # Pod spec wholesale for fields we touch.
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: package-runtime
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: [ALL]
                      seccompProfile:
                        type: RuntimeDefault
                    env:
                      # Go crypto/x509 reads this first if set, before the
                      # platform default certificate file list.
                      - name: SSL_CERT_FILE
                        value: /etc/ssl/certs/ca-certificates.crt
                    volumeMounts:
                      - name: home-ca-bundle
                        # Replace the alpine bundle entirely with the home-ca
                        # cert. The provider only ever talks to forgejo
                        # (in-cluster, home-ca-signed) so we don't need public
                        # CAs. If a future need for upstream HTTPS appears
                        # (e.g. mirror sync), switch to a concatenated bundle
                        # via an initContainer that cats system + home roots.
                        mountPath: /etc/ssl/certs/ca-certificates.crt
                        subPath: ca.crt
                        readOnly: true
                volumes:
                  - name: home-ca-bundle
                    configMap:
                      name: home-ca-bundle
                      items:
                        - key: ca.crt
                          path: ca.crt

  # ─────────────────────────────────────────────────────────────────────
  # 3. ProviderConfig `default` — the credentials + endpoint binding all
  #    Gitea MRs use by default (providerConfigRef.name: default).
  # ─────────────────────────────────────────────────────────────────────
  providerConfig:
    forceRename: default
    apiVersion: gitea.crossplane.io/v1beta1
    kind: ProviderConfig
    annotations:
      # After the Provider+DRC have brought up the controller pod and the
      # gitea.crossplane.io/v1beta1 ProviderConfig CRD is registered.
      argocd.argoproj.io/sync-wave: "5"
      argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    spec:
      spec:
        baseURL: https://git.apps.home
        insecure: false
        credentials:
          source: Secret
          secretRef:
            namespace: crossplane-system
            name: forgejo-admin-token
            key: token
