#!/usr/bin/env -S helm upgrade --install argocd argo/argo-cd -n argocd --create-namespace -f argocd.yaml
# This includes extraObjects that create the root ArgoCD Applications:
#   - infra: platform chart with infra.yaml (cert-manager, gateways, external services, etc.)
#   - apps: platform chart with apps.yaml (user applications)

server:
  ingress:
    enabled: false  # Using Gateway API instead

configs:
  params:
    server.insecure: true  # TLS terminated at gateway

  cm:
    # Enable web terminal (exec into pods from UI)
    exec.enabled: "true"
    exec.shells: "bash,sh,zsh"

    # Enable helm-secrets plugin
    helm.valuesFileSchemes: >-
      secrets+age-import, secrets+age-import-kubernetes,
      secrets+literal,
      https

    # Override resource exclusions - allow EndpointSlice (we manage external services)
    resource.exclusions: |
      - apiGroups:
          - ''
        kinds:
          - Endpoints
      - apiGroups:
          - coordination.k8s.io
        kinds:
          - Lease
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
          - CiliumEndpoint
          - CiliumEndpointSlice

# Bootstrap Applications - ArgoCD creates these on first install
extraObjects:
  # Infrastructure root app
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: infra
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/arch-err/Cluster-Config.git
        targetRevision: v2
        path: kubernetes/platform
        helm:
          valueFiles:
            - ../infra.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

  # User applications root app
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: apps
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/arch-err/Cluster-Config.git
        targetRevision: v2
        path: kubernetes/platform
        helm:
          valueFiles:
            - ../apps.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

  # Infrastructure secrets (SopsSecrets managed by sops-secrets-operator)
  # Syncs after cert-manager creates its namespace (wave 2 > cert-manager default wave)
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: infra-secrets
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "2"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/arch-err/Cluster-Config.git
        targetRevision: v2
        path: kubernetes/secrets/infra
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

  # Application secrets (SopsSecrets for user applications)
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: apps-secrets
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/arch-err/Cluster-Config.git
        targetRevision: v2
        path: kubernetes/secrets/apps
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
