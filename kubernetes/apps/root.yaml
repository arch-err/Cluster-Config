# ArgoCD App of Apps - Root Application
# This is the bootstrap application that manages all other applications
# Apply this after ArgoCD is installed: kubectl apply -f kubernetes/apps/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # TODO: Update with your actual Git repo URL
    repoURL: https://github.com/arch-err/Cluster-Config
    targetRevision: HEAD
    path: kubernetes/apps
    directory:
      recurse: true
      exclude: "root.yaml"  # Don't include self
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
