# Infrastructure configuration
# This file configures the 'infra' instance of the platform chart

repoURL: https://github.com/arch-err/Cluster-Config.git
targetRevision: v2
valuesPath: kubernetes/values/infra

# ══════════════════════════════════════════════════════════════════════════════
# COMPONENTS (generates ArgoCD Applications)
# ══════════════════════════════════════════════════════════════════════════════
components:
  - name: cilium
    namespace: kube-system
    chart:
      repo: https://helm.cilium.io
      name: cilium
      version: 1.19.x
    route:
      # Behind a tiny caddy basic-auth proxy (see extras.hubbleAuth) so LAN
      # drive-by attackers can't read the cluster network topology + flows.
      hostname: hubble.infra.home
      service: hubble-auth
      port: 8080
      gateway: infra
      dashboard:
        enabled: true
        name: Hubble
        group: Network
        icon: cilium.svg
        app: hubble-ui  # workload name differs from route name

  - name: cert-manager
    namespace: cert-manager
    chart:
      repo: https://charts.jetstack.io
      name: cert-manager
      version: 1.16.x
    extraArgs:
      - installCRDs=true

  # trust-manager — broadcasts the home-ca CA cert into a ConfigMap in every
  # namespace via the home-ca-bundle Bundle CR (see extras.trustManagerBundle).
  # Lives in cert-manager ns alongside cert-manager itself per upstream guidance.
  - name: trust-manager
    namespace: cert-manager
    chart:
      repo: https://charts.jetstack.io
      name: trust-manager
      version: v0.22.x
    syncWave: "1"  # after cert-manager (default wave 0) is up

  - name: argocd
    namespace: argocd
    chart:
      repo: https://argoproj.github.io/argo-helm
      name: argo-cd
    syncWave: "-1"  # ArgoCD manages itself, sync early
    route:
      hostname: argocd.infra.home
      service: argocd-server
      port: 80
      gateway: infra
      # argocd CLI uses gRPC-web (POST /<svc>.<Service>/<Method>); Cilium's
      # HTTPRoute returns 404 on those paths even though the web UI's REST
      # /api/* works. A sibling GRPCRoute (emitted by the platform template
      # when `grpc: true`) catches all gRPC traffic and routes it to the same
      # argocd-server backend, unblocking `argocd login --sso --grpc-web`.
      # grpcPort: 443 targets the service port whose appProtocol is set to
      # `kubernetes.io/h2c` in values/infra/argocd.yaml — required so envoy
      # speaks HTTP/2 cleartext upstream, otherwise argocd-server's HTTP mux
      # (not gRPC mux) handles the request and 404s.
      grpc: true
      grpcPort: 443
      dashboard:
        enabled: true
        group: GitOps
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/argo-cd.png
      # Override the homepage link target so clicking argocd from the dashboard
      # initiates SSO directly. /auth/login auto-redirects to pocket-id when
      # called with no query string. Avoids the chooser-screen click.
      annotations:
        gethomepage.dev/href: https://argocd.infra.home/auth/login
    oidc:
      enabled: true
      callbackUrls:
        # Web UI redirect.
        - https://argocd.infra.home/auth/callback
        # CLI PKCE redirect — argocd-cli uses /pkce/verify.
        - https://argocd.infra.home/pkce/verify
      scopes: [openid, profile, email, groups]
      # secretName defaults to "argocd-oidc-client" — see values/infra/argocd.yaml
      # for the labeler Job (extraObjects) that adds app.kubernetes.io/part-of=argocd
      # so argocd-server reads it via $argocd-oidc-client:client_id syntax.

  - name: sops-secrets-operator
    namespace: sops-secrets-operator
    chart:
      repo: https://isindir.github.io/sops-secrets-operator
      name: sops-secrets-operator
    syncWave: "-2"  # Before ArgoCD, so secrets are ready

  - name: kadalu
    namespace: kadalu
    chart:
      repo: https://arch-err.github.io/charts
      name: kadalu
      version: 1.3.0
    syncWave: "1"  # After base infra, before storage consumers

  # ════════════════════════════════════════════════════════════════════════════
  # MONITORING / OBSERVABILITY (Grafana Labs LGM stack)
  # ════════════════════════════════════════════════════════════════════════════

  - name: metrics-server
    namespace: kube-system
    chart:
      repo: https://kubernetes-sigs.github.io/metrics-server/
      name: metrics-server
      version: 3.12.x
    syncWave: "1"

  - name: kube-state-metrics
    namespace: monitoring
    chart:
      repo: https://prometheus-community.github.io/helm-charts
      name: kube-state-metrics
      version: 5.27.x
    syncWave: "2"

  - name: prometheus-node-exporter
    namespace: monitoring
    chart:
      repo: https://prometheus-community.github.io/helm-charts
      name: prometheus-node-exporter
      version: 4.39.x
    syncWave: "2"

  - name: prometheus
    namespace: monitoring
    chart:
      repo: https://prometheus-community.github.io/helm-charts
      name: prometheus
      version: 27.x
    syncWave: "2"

  - name: loki
    namespace: monitoring
    chart:
      repo: https://grafana.github.io/helm-charts
      name: loki
      version: 6.21.x
    syncWave: "2"

  - name: alloy
    namespace: monitoring
    chart:
      repo: https://grafana.github.io/helm-charts
      name: alloy
      version: 0.10.x
    syncWave: "3"  # After mimir+loki are reachable

  - name: grafana
    namespace: monitoring
    chart:
      repo: https://grafana.github.io/helm-charts
      name: grafana
      version: 8.7.x
    syncWave: "3"  # After datasources are reachable
    route:
      hostname: grafana.infra.home
      gateway: infra
      service: grafana
      port: 80
      dashboard:
        enabled: true
        group: Observability
        icon: grafana.svg
        app: grafana
    oidc:
      enabled: true
      callbackUrls:
        - https://grafana.infra.home/login/generic_oauth
      scopes: [openid, profile, email, groups]
      # secretName defaults to "grafana-oidc-client"

  # ════════════════════════════════════════════════════════════════════════════
  # BOOKINFO — self-hosted readarr metadata mirror (replaces dead api.bookinfo.club)
  # ════════════════════════════════════════════════════════════════════════════
  # Image: docker.io/blampe/rreading-glasses (Goodreads variant). Two services
  # in one pod: rreading-glasses on :8788 (HTTP) + nginx-tls sidecar on :8443
  # presenting a home-ca-issued cert with SAN=api.bookinfo.club. CoreDNS
  # rewrites that hostname to the in-cluster ClusterIP svc so readarr's
  # hardcoded outbound URL Just Works without any UI configuration. The
  # bookinfo.infra.home route below is for human use (homepage card + API
  # debug); readarr's path is via the rewrite + home-ca trust, NOT this route.
  - name: bookinfo
    namespace: bookinfo
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"  # after extras (ns + postgres + cert + nginx cm) settle
    route:
      hostname: bookinfo.infra.home
      gateway: infra
      # bjw-s/app-template suffixes service names when multiple service blocks
      # exist (`bookinfo-main` for HTTP, `bookinfo-tls` for the api.bookinfo.club
      # HTTPS ingress consumed via CoreDNS rewrite). HTTPRoute hits the HTTP one.
      service: bookinfo-main
      port: 80
      dashboard:
        name: BookInfo
        group: Tools
        icon: readarr.svg
        description: readarr metadata mirror (rreading-glasses)
        app: bookinfo

  # ════════════════════════════════════════════════════════════════════════════
  # CROSSPLANE + CROSSVIEW — control-plane core + UI dashboard
  # ════════════════════════════════════════════════════════════════════════════
  # Crossplane core (CRDs + RBAC manager) in `crossplane-system` ns.
  # Pure machinery — no HTTPRoute, no dashboard card. Restricted-PSS clean
  # (chart defaults: uid 65532, drop ALL caps, allowPrivEsc=false,
  # readOnlyRootFs=true). Pinned to chart 2.2.1 (latest stable; rc.0 releases
  # available but staying on stable for the home cluster).
  # NO providers installed yet (provider-cloudflare, provider-kubernetes etc.) —
  # follow-up discussion needed on which to add.
  - name: crossplane
    namespace: crossplane-system
    chart:
      repo: https://charts.crossplane.io/stable
      name: crossplane
      version: 2.2.1
    syncWave: "2"  # before crossview, which depends on crossplane CRDs existing
                   # (crossview's RBAC binds to apiextensions.crossplane.io/*)

  # Crossview — Crossplane UI dashboard. Helm chart 4.3.0 (latest stable from
  # crossplane-contrib/crossview OCI registry; 4.4.0-rc.1 is a release candidate
  # at 2026-05-08, staying on stable). The actively-maintained UI in the
  # crossplane-contrib org. App tag pinned to v4.3.0 in values/infra/crossview.yaml.
  #
  # AUTH: oauth2-proxy sidecar release `crossview-oauth2` (same ns) gates the
  # HTTPRoute → crossview svc :80 → app :3001. Crossview itself trusts the
  # X-Forwarded-User header (AUTH_MODE=header). pocket-id OIDC client
  # `crossview` is admin-group-restricted at the IDP (declarative below) on
  # top of oauth2-proxy's --allowed-group=administrators (defense in depth).
  #
  # POSTGRES: bundled pg image with emptyDir persistence (pilot mode — local
  # accounts lost on pod restart; OIDC users auto-recreate via header mode).
  # Mirrors the paperless-ngx pilot pattern. Promote to a kadalu-backed PV
  # with an init-chown container (immich pattern) when user mgmt is settled.
  - name: crossview
    namespace: crossview
    chart:
      repo: oci://ghcr.io/crossplane-contrib/crossview-chart
      name: crossview
      version: 4.3.0
    syncWave: "3"  # after crossplane CRDs (wave 2) + extras (ns) settle
    route:
      hostname: crossview.infra.home
      gateway: infra
      service: crossview-oauth2   # oauth2-proxy fronting; passes X-Forwarded-User
      port: 80
      dashboard:
        name: Crossview
        group: GitOps
        icon: crossplane.svg
        description: Crossplane resource dashboard (admin)
        app: crossview
    # Per-app OIDC client (pocket-id id=`crossview`). Secret rendered into the
    # `crossview` ns as `crossview-oidc-client`; consumed by the crossview-oauth2
    # release. Single callback for the oauth2-proxy redirect.
    oidc:
      enabled: true
      callbackUrls:
        - https://crossview.infra.home/oauth2/callback
      scopes: [openid, profile, email, groups]
      # Infra-tier — administrators only. apps_users get 403 at the IDP.
      groupRestriction:
        allowedGroups: [administrators]

  # oauth2-proxy fronting crossview. Mirrors arr-oauth2-prowlarr (infra-tier).
  - name: crossview-oauth2
    namespace: crossview
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    syncWave: "3"
    # Consumes `crossview-oidc-client` Secret rendered by the crossview
    # Application's oidc:* block above. No oidc:* block here — this IS the proxy.

  # ════════════════════════════════════════════════════════════════════════════
  # DASHBOARD + CATCH-ALL (infra-side homepage + error-pages)
  # ════════════════════════════════════════════════════════════════════════════

  - name: homepage-infra
    namespace: homepage-infra
    chart:
      repo: https://jameswynn.github.io/helm-charts
      name: homepage
      version: 2.1.0
    route:
      hostname: homepage.infra.home
      gateway: infra
      service: homepage-infra
      port: 3000
      dashboard: false   # don't link to ourselves

  # Third homepage release — admin panel at admin.infra.home with
  # kubernetes/resources/prometheus widgets + admin-tooling bookmarks.
  # Shows all services across both gateways. LAN-gated v1; OIDC follow-up.
  - name: homepage-admin
    namespace: homepage-admin
    chart:
      repo: https://jameswynn.github.io/helm-charts
      name: homepage
      version: 2.1.0
    route:
      hostname: admin.infra.home
      gateway: infra
      service: homepage-admin
      port: 3000
      dashboard: false   # don't link to ourselves

  # Catch-all backend for *.infra.home — any hostname that doesn't match a more
  # specific HTTPRoute falls through here. Wildcard hostname; Gateway API spec
  # gives precedence to more-specific HTTPRoutes, so existing infra is unaffected.
  - name: error-pages-infra
    namespace: error-pages-infra
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "5"  # after the real infra; doesn't matter much, but explicit
    route:
      hostname: "*.infra.home"
      gateway: infra
      service: error-pages-infra
      port: 80
      dashboard: false   # never on the dashboard

# ══════════════════════════════════════════════════════════════════════════════
# EXTRAS (raw resources managed directly)
# ══════════════════════════════════════════════════════════════════════════════
extras:
  sopsSecretsOperator: true
  gateways: true
  certIssuers: true
  trustManagerBundle: true   # broadcasts home-ca to all ns as ConfigMap home-ca-bundle
  externalServices: true
  kadalu: true
  monitoring: true
  hubbleAuth: true
  # bookinfo — ns + postgres + cert-manager Certificate (SAN=api.bookinfo.club,
  # ClusterIssuer=home-ca) + nginx-tls ConfigMap. See platform/templates/extras.yaml
  # `BOOKINFO` block + values/infra/bookinfo.yaml for the architecture writeup.
  bookinfo:
    postgresSize: 5Gi
  # crossview — restricted-PSS namespace only (no PVCs/postgres at this layer;
  # the chart's bundled postgres uses emptyDir in pilot mode — see
  # values/infra/crossview.yaml header for the trade-off).
  crossview:
    enabled: true

# Gateway configuration
gateway:
  pool:
    start: "10.10.10.200"
    stop: "10.10.10.220"
  infra:
    ip: "10.10.10.201"
    domain: infra.home
    tlsSecret: wildcard-infra-home-tls
  apps:
    ip: "10.10.10.200"
    domain: apps.home
    tlsSecret: wildcard-apps-home-tls
    # TLS passthrough listeners on the apps gateway. SNI-routed on port 443.
    # Use for backends that mint their own TLS (e.g. agent-vault forward proxy).
    passthroughs:
      - name: agent-vault-proxy
        hostname: agent-vault-proxy.apps.home

# External services (TLS passthrough to Docker host via SNI routing)
# These stay on *.home - K8s passes through to Docker's Traefik
external:
  dockerHost: "10.10.10.160"
  services:
    - name: homeassistant
      hostname: homeassistant.home
    - name: vault
      hostname: vault.home
    - name: ntfy
      hostname: ntfy.home
    - name: happy-api
      hostname: happy.home
    - name: happy-app
      hostname: app.happy.home
    - name: claude-notify
      hostname: claude-notify.home
    - name: matrix
      hostname: matrix.home
    - name: syncthing
      hostname: syncthing.home

# Kadalu distributed storage configuration
kadalu:
  device: /dev/sda  # 4TB external drives on node-1 and node-2
  nodes:
    primary: node-1
    secondary: node-2
    tiebreaker: node-3
