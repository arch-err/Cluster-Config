# Infrastructure configuration
# This file configures the 'infra' instance of the platform chart

repoURL: https://github.com/arch-err/Cluster-Config.git
targetRevision: v2
valuesPath: kubernetes/values/infra

# ══════════════════════════════════════════════════════════════════════════════
# COMPONENTS (generates ArgoCD Applications)
# ══════════════════════════════════════════════════════════════════════════════
components:
  - name: cilium
    namespace: kube-system
    chart:
      repo: https://helm.cilium.io
      name: cilium
      version: 1.19.x
    route:
      # Behind a tiny caddy basic-auth proxy (see extras.hubbleAuth) so LAN
      # drive-by attackers can't read the cluster network topology + flows.
      hostname: hubble.infra.home
      service: hubble-auth
      port: 8080
      gateway: infra
      dashboard:
        enabled: true
        name: Hubble
        group: Network
        icon: cilium.svg
        app: hubble-ui  # workload name differs from route name

  - name: cert-manager
    namespace: cert-manager
    chart:
      repo: https://charts.jetstack.io
      name: cert-manager
      version: 1.16.x
    extraArgs:
      - installCRDs=true

  # trust-manager — broadcasts the home-ca CA cert into a ConfigMap in every
  # namespace via the home-ca-bundle Bundle CR (see extras.trustManagerBundle).
  # Lives in cert-manager ns alongside cert-manager itself per upstream guidance.
  - name: trust-manager
    namespace: cert-manager
    chart:
      repo: https://charts.jetstack.io
      name: trust-manager
      version: v0.22.x
    syncWave: "1"  # after cert-manager (default wave 0) is up

  # CloudNativePG — cluster-wide postgres operator. Owns the Cluster /
  # Backup / ScheduledBackup / Pooler CRDs. Future stateful apps get their DB
  # via a cnpg Cluster CR rendered by the platform chart's `db:` block
  # (follow-up phase — operator only at this layer). Chart creates its own
  # `cnpg-system` ns. Restricted-PSS clean by default (verified in
  # values/infra/cnpg.yaml header).
  - name: cnpg
    namespace: cnpg-system
    chart:
      repo: https://cloudnative-pg.github.io/charts
      name: cloudnative-pg
      version: 0.28.2

  - name: argocd
    namespace: argocd
    chart:
      repo: https://argoproj.github.io/argo-helm
      name: argo-cd
    syncWave: "-1"  # ArgoCD manages itself, sync early
    route:
      hostname: argocd.infra.home
      service: argocd-server
      port: 80
      gateway: infra
      # argocd CLI uses gRPC-web (POST /<svc>.<Service>/<Method>); Cilium's
      # HTTPRoute returns 404 on those paths even though the web UI's REST
      # /api/* works. A sibling GRPCRoute (emitted by the platform template
      # when `grpc: true`) catches all gRPC traffic and routes it to the same
      # argocd-server backend, unblocking `argocd login --sso --grpc-web`.
      # grpcPort: 443 targets the service port whose appProtocol is set to
      # `kubernetes.io/h2c` in values/infra/argocd.yaml — required so envoy
      # speaks HTTP/2 cleartext upstream, otherwise argocd-server's HTTP mux
      # (not gRPC mux) handles the request and 404s.
      grpc: true
      grpcPort: 443
      dashboard:
        enabled: true
        group: GitOps
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/argo-cd.png
      # Override the homepage link target so clicking argocd from the dashboard
      # initiates SSO directly. /auth/login auto-redirects to pocket-id when
      # called with no query string. Avoids the chooser-screen click.
      annotations:
        gethomepage.dev/href: https://argocd.infra.home/auth/login
    oidc:
      enabled: true
      callbackUrls:
        # Web UI redirect.
        - https://argocd.infra.home/auth/callback
        # CLI PKCE redirect — argocd-cli uses /pkce/verify.
        - https://argocd.infra.home/pkce/verify
        # argocd CLI SSO login (`argocd login --sso`) opens a local browser
        # callback handler on :8085. Pocket-id rejects with "invalid callback
        # URL" without this. Port 8085 is argocd-cli's default; override via
        # `--sso-port <N>` requires a matching entry here.
        - http://localhost:8085/auth/callback
      scopes: [openid, profile, email, groups]
      # secretName defaults to "argocd-oidc-client" — see values/infra/argocd.yaml
      # for the labeler Job (extraObjects) that adds app.kubernetes.io/part-of=argocd
      # so argocd-server reads it via $argocd-oidc-client:client_id syntax.

  - name: sops-secrets-operator
    namespace: sops-secrets-operator
    chart:
      repo: https://isindir.github.io/sops-secrets-operator
      name: sops-secrets-operator
    syncWave: "-2"  # Before ArgoCD, so secrets are ready

  - name: kadalu
    namespace: kadalu
    chart:
      repo: https://arch-err.github.io/charts
      name: kadalu
      version: 1.3.0
    syncWave: "1"  # After base infra, before storage consumers

  # ════════════════════════════════════════════════════════════════════════════
  # MONITORING / OBSERVABILITY (Grafana Labs LGM stack)
  # ════════════════════════════════════════════════════════════════════════════

  - name: metrics-server
    namespace: kube-system
    chart:
      repo: https://kubernetes-sigs.github.io/metrics-server/
      name: metrics-server
      version: 3.12.x
    syncWave: "1"

  - name: kube-state-metrics
    namespace: monitoring
    chart:
      repo: https://prometheus-community.github.io/helm-charts
      name: kube-state-metrics
      version: 5.27.x
    syncWave: "2"

  - name: prometheus-node-exporter
    namespace: monitoring
    chart:
      repo: https://prometheus-community.github.io/helm-charts
      name: prometheus-node-exporter
      version: 4.39.x
    syncWave: "2"

  - name: prometheus
    namespace: monitoring
    chart:
      repo: https://prometheus-community.github.io/helm-charts
      name: prometheus
      version: 27.x
    syncWave: "2"

  - name: loki
    namespace: monitoring
    chart:
      repo: https://grafana.github.io/helm-charts
      name: loki
      version: 6.21.x
    syncWave: "2"

  - name: alloy
    namespace: monitoring
    chart:
      repo: https://grafana.github.io/helm-charts
      name: alloy
      version: 0.10.x
    syncWave: "3"  # After mimir+loki are reachable

  - name: grafana
    namespace: monitoring
    chart:
      repo: https://grafana.github.io/helm-charts
      name: grafana
      version: 8.7.x
    syncWave: "3"  # After datasources are reachable
    route:
      hostname: grafana.infra.home
      gateway: infra
      service: grafana
      port: 80
      dashboard:
        enabled: true
        group: Observability
        icon: grafana.svg
        app: grafana
    oidc:
      enabled: true
      callbackUrls:
        - https://grafana.infra.home/login/generic_oauth
      scopes: [openid, profile, email, groups]
      # secretName defaults to "grafana-oidc-client"

  # ════════════════════════════════════════════════════════════════════════════
  # DASHBOARD + CATCH-ALL (infra-side homepage + error-pages)
  # ════════════════════════════════════════════════════════════════════════════

  - name: homepage-infra
    namespace: homepage-infra
    chart:
      repo: https://jameswynn.github.io/helm-charts
      name: homepage
      version: 2.1.0
    route:
      hostname: homepage.infra.home
      gateway: infra
      service: homepage-infra
      port: 3000
      dashboard: false   # don't link to ourselves

  # Third homepage release — admin panel at admin.infra.home with
  # kubernetes/resources/prometheus widgets + admin-tooling bookmarks.
  # Shows all services across both gateways. LAN-gated v1; OIDC follow-up.
  - name: homepage-admin
    namespace: homepage-admin
    chart:
      repo: https://jameswynn.github.io/helm-charts
      name: homepage
      version: 2.1.0
    route:
      hostname: admin.infra.home
      gateway: infra
      service: homepage-admin
      port: 3000
      dashboard: false   # don't link to ourselves

  # Catch-all backend for *.infra.home — any hostname that doesn't match a more
  # specific HTTPRoute falls through here. Wildcard hostname; Gateway API spec
  # gives precedence to more-specific HTTPRoutes, so existing infra is unaffected.
  - name: error-pages-infra
    namespace: error-pages-infra
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "5"  # after the real infra; doesn't matter much, but explicit
    route:
      hostname: "*.infra.home"
      gateway: infra
      service: error-pages-infra
      port: 80
      dashboard: false   # never on the dashboard

# ══════════════════════════════════════════════════════════════════════════════
# EXTRAS (raw resources managed directly)
# ══════════════════════════════════════════════════════════════════════════════
extras:
  sopsSecretsOperator: true
  gateways: true
  certIssuers: true
  trustManagerBundle: true   # broadcasts home-ca to all ns as ConfigMap home-ca-bundle
  externalServices: true
  kadalu: true
  monitoring: true
  hubbleAuth: true
  # generic-device-plugin (squat) — a privileged DaemonSet, pinned to node-1,
  # that advertises the ConBee II Zigbee dongle as the schedulable resource
  # `devic.es/zigbee`. Lets zigbee2mqtt request the device WITHOUT being
  # privileged itself — privilege is confined to this one small auditable DS
  # (mirrors the qbittorrent privileged precedent). Authorized 2026-05-30.
  # Runs in kube-system (system ns, no PSS enforcement). See the
  # genericDevicePlugin block in platform/templates/extras.yaml.
  genericDevicePlugin:
    enabled: true
    image: ghcr.io/squat/generic-device-plugin:0.2.0
    node: node-1
    # The ConBee II stable by-id path on node-1 (driver cdc_acm, base kernel).
    # Glob tolerates the hourly USB re-enumeration (the by-id symlink is
    # stable; ttyACM0 underneath may renumber).
    deviceGlob: "/dev/serial/by-id/usb-dresden_elektronik_ingenieurtechnik_GmbH_ConBee_II_DE2694940-if00"

# Gateway configuration
gateway:
  pool:
    start: "10.10.10.200"
    stop: "10.10.10.220"
  infra:
    ip: "10.10.10.201"
    domain: infra.home
    tlsSecret: wildcard-infra-home-tls
  apps:
    ip: "10.10.10.200"
    domain: apps.home
    tlsSecret: wildcard-apps-home-tls
    # TLS passthrough listeners on the apps gateway. SNI-routed on port 443.
    # Use for backends that mint their own TLS (e.g. agent-vault forward proxy).
    passthroughs:
      - name: agent-vault-proxy
        hostname: agent-vault-proxy.apps.home

# External services (TLS passthrough to Docker host via SNI routing)
# These stay on *.home - K8s passes through to Docker's Traefik
external:
  dockerHost: "10.10.10.160"
  services:
    - name: homeassistant
      hostname: homeassistant.home
    - name: vault
      hostname: vault.home
    - name: ntfy
      hostname: ntfy.home
    - name: happy-api
      hostname: happy.home
    - name: happy-app
      hostname: app.happy.home
    - name: claude-notify
      hostname: claude-notify.home
    - name: matrix
      hostname: matrix.home
    - name: syncthing
      hostname: syncthing.home

# Kadalu distributed storage configuration
kadalu:
  device: /dev/sda  # 4TB external drives on node-1 and node-2
  nodes:
    primary: node-1
    secondary: node-2
    tiebreaker: node-3
