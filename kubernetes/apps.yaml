# User Applications configuration
# This file configures the 'apps' instance of the platform chart

repoURL: https://github.com/arch-err/Cluster-Config.git
targetRevision: v2
valuesPath: kubernetes/values/apps

# ══════════════════════════════════════════════════════════════════════════════
# GATEWAY (apps gateway configuration)
# ══════════════════════════════════════════════════════════════════════════════
gateway:
  apps:
    ip: "10.10.10.200"
    domain: apps.home
    tlsSecret: wildcard-apps-home-tls

# ══════════════════════════════════════════════════════════════════════════════
# COMPONENTS (generates ArgoCD Applications)
# ══════════════════════════════════════════════════════════════════════════════
components:
  - name: matrix
    namespace: matrix
    chart:
      repo: https://halkeye.github.io/helm-charts
      name: synapse
    route:
      hostname: matrix.apps.home
      gateway: apps
      service: matrix-synapse
      port: 8443

  - name: hookshot
    namespace: matrix
    chart:
      repo: https://arch-err.github.io/charts
      name: hookshot
    route:
      hostname: hookshot.apps.home
      gateway: apps
      service: hookshot
      port: 9000

  - name: audiobookshelf
    namespace: audiobookshelf
    chart:
      repo: https://charts.christianhuth.de
      name: audiobookshelf
      version: 2.2.0
    route:
      hostname: audiobookshelf.apps.home
      gateway: apps
      service: audiobookshelf
      port: 8080

  - name: agent-vault
    namespace: agent-vault
    chart:
      repo: https://arch-err.github.io/charts
      name: agent-vault
      version: 0.1.1
    # UI HTTPRoute (port 14321) — proxy port (14322) is exposed via the
    # passthrough listener on the apps gateway, see chart's tlsRoute.
    route:
      hostname: agent-vault.apps.home
      gateway: apps
      service: agent-vault
      port: 14321

  - name: immich
    namespace: immich
    chart:
      repo: https://immich-app.github.io/immich-charts
      name: immich
      version: 0.11.1
    syncWave: "3"  # after extras (ns/PVC/postgres) settle
    route:
      hostname: immich.apps.home
      gateway: apps
      service: immich-server
      port: 2283

# ══════════════════════════════════════════════════════════════════════════════
# EXTRAS (raw resources for apps that need pre-deploy infra)
# ══════════════════════════════════════════════════════════════════════════════
extras:
  immich:
    librarySize: 1Ti
    postgresSize: 20Gi
