# User Applications configuration
# This file configures the 'apps' instance of the platform chart

repoURL: https://github.com/arch-err/Cluster-Config.git
targetRevision: v2
valuesPath: kubernetes/values/apps

# ══════════════════════════════════════════════════════════════════════════════
# GATEWAY (apps gateway configuration)
# ══════════════════════════════════════════════════════════════════════════════
gateway:
  apps:
    ip: "10.10.10.200"
    domain: apps.home
    tlsSecret: wildcard-apps-home-tls

# ══════════════════════════════════════════════════════════════════════════════
# EXTRAS (additional resources deployed by the platform chart)
# ══════════════════════════════════════════════════════════════════════════════
extras:
  authentik: true  # Deploys namespace and blueprints ConfigMap

# ══════════════════════════════════════════════════════════════════════════════
# COMPONENTS (generates ArgoCD Applications)
# ══════════════════════════════════════════════════════════════════════════════
components:
  - name: authentik
    namespace: authentik
    chart:
      repo: https://charts.goauthentik.io
      name: authentik
    route:
      hostname: authentik.apps.home
      gateway: apps
      service: authentik-server
      port: 80

  - name: homeassistant
    namespace: homeassistant
    chart:
      repo: https://pajikos.github.io/home-assistant-helm-chart
      name: home-assistant
    route:
      hostname: homeassistant.apps.home
      gateway: apps
      service: homeassistant-home-assistant
      port: 8123

  - name: matrix
    namespace: matrix
    chart:
      repo: https://halkeye.github.io/helm-charts
      name: synapse
    route:
      hostname: matrix.apps.home
      gateway: apps
      service: matrix-synapse
      port: 8443

  - name: hookshot
    namespace: matrix
    chart:
      repo: https://arch-err.github.io/charts
      name: hookshot
    route:
      hostname: hookshot.apps.home
      gateway: apps
      service: hookshot
      port: 9000

  # Example apps (uncomment when ready):
  #
  # - name: homepage
  #   namespace: homepage
  #   chart:
  #     repo: https://jameswynn.github.io/helm-charts
  #     name: homepage
  #   route:
  #     hostname: home.apps.home
  #     gateway: apps
  #     port: 3000
  #
  # - name: grafana
  #   namespace: monitoring
  #   chart:
  #     repo: https://grafana.github.io/helm-charts
  #     name: grafana
  #   route:
  #     hostname: grafana.apps.home
  #     gateway: apps
  #     port: 3000

  - name: plane
    namespace: plane
    chart:
      repo: https://helm.plane.so/
      name: plane-ce
    route:
      hostname: plane.apps.home
      gateway: apps
      rules:
        - path: /api
          service: plane-api
          port: 8000
        - path: /auth
          service: plane-api
          port: 8000
        - path: /live
          service: plane-live
          port: 3000
        - path: /spaces
          service: plane-space
          port: 3000
        - path: /god-mode
          service: plane-admin
          port: 3000
        - path: /
          service: plane-web
          port: 3000
