# User Applications configuration
# This file configures the 'apps' instance of the platform chart

repoURL: https://github.com/arch-err/Cluster-Config.git
targetRevision: v2
valuesPath: kubernetes/values/apps

# ══════════════════════════════════════════════════════════════════════════════
# GATEWAY (apps gateway configuration)
# ══════════════════════════════════════════════════════════════════════════════
gateway:
  apps:
    ip: "10.10.10.200"
    domain: apps.home
    tlsSecret: wildcard-apps-home-tls

# ══════════════════════════════════════════════════════════════════════════════
# COMPONENTS (generates ArgoCD Applications)
# ══════════════════════════════════════════════════════════════════════════════
components:
  - name: matrix
    namespace: matrix
    chart:
      repo: https://halkeye.github.io/helm-charts
      name: synapse
    route:
      hostname: matrix.apps.home
      gateway: apps
      service: matrix-synapse
      port: 8443
      dashboard:
        group: Comms
        icon: matrix.svg
        app: matrix-synapse  # workload name differs from route name

  # hookshot is a backend bridge — keep it off the dashboard
  - name: hookshot
    namespace: matrix
    chart:
      repo: https://arch-err.github.io/charts
      name: hookshot
    route:
      hostname: hookshot.apps.home
      gateway: apps
      service: hookshot
      port: 9000
      dashboard: false

  - name: audiobookshelf
    namespace: audiobookshelf
    chart:
      repo: https://charts.christianhuth.de
      name: audiobookshelf
      version: 2.2.0
    route:
      hostname: audiobookshelf.apps.home
      gateway: apps
      service: audiobookshelf
      port: 8080
      timeout: 30m  # large audiobook uploads via API
      dashboard:
        group: Media
        description: Audiobooks + podcasts
    # OIDC: audiobookshelf has no env / config-file hooks for OIDC — it must
    # be configured via the admin UI. We bootstrap the pocket-id client here
    # so the client_id/secret/issuer are ready in the
    # `audiobookshelf-oidc-client` Secret; user pastes them into the UI
    # (Settings -> Authentication -> OpenID Connect Authentication).
    oidc:
      enabled: true
      callbackUrls:
        - https://audiobookshelf.apps.home/auth/openid/callback
        - https://audiobookshelf.apps.home/auth/openid/mobile-redirect
      scopes: [openid, profile, email, groups]

  # audiobookshelf-v2 — parallel green/blue alongside the existing
  # `audiobookshelf` release. Mounts the shared kadalu media-library volume
  # (so ABS sees the arr stack's downloads). OIDC bootstrap is fully
  # declarative via the `audiobookshelf-v2-oidc-seed` Job (extras block):
  # /init → /login → PATCH /api/auth-settings.
  - name: audiobookshelf-v2
    namespace: audiobookshelf-v2
    chart:
      repo: https://charts.christianhuth.de
      name: audiobookshelf
      version: 2.2.0
    syncWave: "3"  # after extras (ns + media-library twin PV) settle
    route:
      hostname: audiobookshelf-v2.apps.home
      gateway: apps
      service: audiobookshelf-v2
      port: 8080
      timeout: 30m  # large audiobook uploads via API
      dashboard:
        name: AudiobookShelf v2
        group: Media
        icon: audiobookshelf.svg
        description: Audiobooks + podcasts (parallel install w/ media-library mount)
    oidc:
      enabled: true
      callbackUrls:
        - https://audiobookshelf-v2.apps.home/auth/openid/callback
        - https://audiobookshelf-v2.apps.home/auth/openid/mobile-redirect
      scopes: [openid, profile, email, groups]

  - name: agent-vault
    namespace: agent-vault
    chart:
      repo: https://arch-err.github.io/charts
      name: agent-vault
      version: 0.1.1
    # UI HTTPRoute (port 14321) — proxy port (14322) is exposed via the
    # passthrough listener on the apps gateway, see chart's tlsRoute.
    route:
      hostname: agent-vault.apps.home
      gateway: apps
      service: agent-vault
      port: 14321
      dashboard:
        name: Agent Vault
        group: Tools
        icon: infisical.svg
        description: Secrets vault for agents

  - name: immich
    namespace: immich
    chart:
      repo: https://immich-app.github.io/immich-charts
      name: immich
      version: 0.11.1
    syncWave: "3"  # after extras (ns/PVC/postgres) settle
    route:
      hostname: immich.apps.home
      gateway: apps
      service: immich-server
      port: 2283
      timeout: 30m  # large photo/video uploads
      dashboard:
        group: Media
        description: Photos + memories
        app: immich-server  # workload name differs from route name
    oidc:
      enabled: true
      callbackUrls:
        - https://immich.apps.home/auth/login
        - https://immich.apps.home/user-settings
        - app.immich:///oauth-callback
      scopes: [openid, profile, email, groups]

  - name: ntfy
    namespace: ntfy
    chart:
      repo: https://repo.helmforge.dev
      name: ntfy
      version: 1.1.8
    route:
      hostname: ntfy.apps.home
      gateway: apps
      service: ntfy
      port: 80
      dashboard:
        group: Tools
        icon: ntfy.svg
        description: Push notifications
        app: ntfy

  - name: homepage
    namespace: homepage
    chart:
      repo: https://jameswynn.github.io/helm-charts
      name: homepage
      version: 2.1.0
    route:
      hostname: homepage.apps.home
      gateway: apps
      service: homepage
      port: 3000
      dashboard: false   # don't link to ourselves

  - name: pocket-id
    namespace: pocket-id
    chart:
      repo: https://anza-labs.github.io/charts
      name: pocket-id
      version: 2.1.1
    route:
      hostname: auth.apps.home
      gateway: apps
      service: pocket-id
      port: 80
      dashboard:
        name: Pocket ID
        group: Tools
        icon: pocket-id.png
        description: Passkey-only OIDC provider
        app: pocket-id

  - name: excalidash
    namespace: excalidash
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    route:
      hostname: excalidash.apps.home
      gateway: apps
      service: excalidash
      port: 80
      dashboard:
        group: Tools
        icon: excalidraw.svg
        description: Excalidraw dashboard + collab
        app: excalidash

  - name: it-tools
    namespace: it-tools
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    route:
      hostname: it-tools.apps.home
      gateway: apps
      service: it-tools
      port: 80
      dashboard:
        name: IT Tools
        group: Tools
        icon: it-tools.png
        description: Handy dev tools collection
        app: it-tools

  - name: cyberchef
    namespace: cyberchef
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    route:
      hostname: cyberchef.apps.home
      gateway: apps
      service: cyberchef
      port: 80
      dashboard:
        name: CyberChef
        group: Tools
        icon: cyberchef.png
        description: Cyber Swiss Army Knife — encode/decode/crypto
        app: cyberchef

  - name: stirling-pdf
    namespace: stirling-pdf
    chart:
      repo: https://stirling-tools.github.io/Stirling-PDF-chart
      name: stirling-pdf-chart
      version: 3.1.0
    route:
      hostname: stirling-pdf.apps.home
      gateway: apps
      service: stirling-pdf
      port: 8080
      dashboard:
        name: Stirling PDF
        group: Tools
        icon: stirling-pdf.png
        description: Web PDF toolbox

  # paperless-ngx — pilot install. Bundled bitnami pg + redis (emptyDir; pilot
  # data loss on restart is acceptable). Future prod work: shared volumes for
  # external file-manager access, proper backups, SMTP. NS is baseline-PSS
  # (extras.paperless-ngx) — paperless image's supervisord and bitnami init
  # bits don't pass restricted PSS.
  - name: paperless-ngx
    namespace: paperless-ngx
    chart:
      repo: https://charts.gabe565.com
      name: paperless-ngx
      version: 0.24.1
    syncWave: "3"  # after extras (ns label) settle
    route:
      hostname: paperless.apps.home
      gateway: apps
      service: paperless-ngx
      port: 8000
      dashboard:
        name: Paperless
        group: Documents
        icon: paperless-ngx.png
        description: Document mgmt + OCR
    oidc:
      enabled: true
      callbackUrls:
        - https://paperless.apps.home/accounts/oidc/pocket-id/login/callback/
      scopes: [openid, profile, email, groups]

  # ──────────────────────────────────────────────────────────────────────────
  # ARR STACK — 3 apps in one shared `arr` ns (extras.arr provides ns + PVCs).
  # qBittorrent egress is forced through gluetun (Mullvad WireGuard) sidecar
  # with FIREWALL=on killswitch. wg config is a SopsSecret with REPLACE_ME
  # placeholders — gluetun crashloops dormant until user populates it.
  # ──────────────────────────────────────────────────────────────────────────
  - name: prowlarr
    namespace: arr
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"  # after extras (ns + shared PVCs) settle
    # HTTPRoute points at the oauth2-prowlarr service (same `arr` ns), NOT
    # directly at the prowlarr workload. The oauth2-proxy sidecar release
    # (`arr-oauth2-prowlarr` component) gates this route with pocket-id OIDC
    # then forwards to prowlarr:9696 internally. /api/* is bypass-routed in
    # the oauth2-proxy config so X-Api-Key flows (mobile, cross-arr) keep
    # working. Prowlarr itself must be set to AuthenticationMethod=External
    # via UI (Settings → General → Authentication) — manual one-time step.
    route:
      hostname: prowlarr.apps.home
      gateway: apps
      service: oauth2-prowlarr
      port: 80
      # No dashboard entry — Prowlarr is infra-tier (consumed by readarr/
      # sonarr/radarr APIs, not by humans). Hidden from apps homepage so
      # apps_users never see it. Pairs with arr-oauth2-prowlarr's
      # --allowed-group=administrators (apps_users get 403 even if they
      # type the URL). Admins bookmark https://prowlarr.apps.home/.

  - name: readarr
    namespace: arr
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"
    # See prowlarr above — same pattern. Auth-gated via oauth2-readarr in
    # the same ns; AuthenticationMethod=External manual UI step required.
    route:
      hostname: readarr.apps.home
      gateway: apps
      service: oauth2-readarr
      port: 80
      dashboard:
        group: Media
        icon: readarr.svg
        description: Audiobook manager (Sonarr-for-books)
        app: readarr

  # Declarative *arr config split across two tools (different surface areas):
  #   - configarr → Readarr quality profiles + qBit download client (CronJob)
  #   - buildarr  → Prowlarr indexers + downstream-app (Readarr) link (daemon)
  # No bash-cronjob anymore — the curl+jq+apk-add prowlarr-bootstrap CronJob
  # was replaced by buildarr (apk-add-as-non-root broke under restricted PSS).
  # Configarr has no prowlarr block; buildarr has no readarr plugin — they're
  # complementary, not redundant.
  - name: configarr
    namespace: arr
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "4"  # after extras (ns) + arr-api-keys SopsSecret + readarr

  # buildarr — declarative Prowlarr indexer + downstream-app (Readarr) sync.
  # Daemon mode (single Deployment): apply on startup + daily at 03:00. Force
  # re-sync via `kubectl rollout restart deploy/buildarr` (or SIGHUP). No
  # HTTPRoute (no UI). Add Sonarr/Radarr/Lidarr to the applications block
  # in buildarr.yaml when those *arrs ship — buildarr has plugins for all three.
  - name: buildarr
    namespace: arr
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "4"  # after prowlarr (Prowlarr API must be reachable)

  # ──────────────────────────────────────────────────────────────────────────
  # ARR OAUTH2-PROXY pair — pocket-id OIDC forward-auth gateway in front of
  # the *arr stack. Two releases (one per *arr) sharing a single OIDC client
  # registered by the prowlarr sibling; cookie domain `.apps.home` + matching
  # cookie-secret + matching cookie-name → one login covers both subdomains.
  # /api/* is skip-auth-route'd so X-Api-Key flows (LunaSea, cross-arr sync)
  # bypass OIDC and hit *arr's own API-key check directly. See values files
  # for full rationale; the prowlarr sibling owns the oidc:* block (its
  # callbackUrls list covers BOTH subdomains, so the readarr sibling reuses
  # the same `arr-oauth2-prowlarr-oidc-client` Secret). No HTTPRoute on
  # either release — they're internal services consumed by the *arr routes
  # via `route.service` indirection (prowlarr→oauth2-prowlarr, etc.).
  # ──────────────────────────────────────────────────────────────────────────
  - name: arr-oauth2-prowlarr
    namespace: arr
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    syncWave: "3"
    oidc:
      enabled: true
      # callbackUrls cover BOTH *arr subdomains so the sibling release
      # (arr-oauth2-readarr) can reuse this same OIDC client without needing
      # its own oidc:* block. Cookie + client + cookie-secret all match
      # across the two releases → one login = SSO across both.
      callbackUrls:
        - https://prowlarr.apps.home/oauth2/callback
        - https://readarr.apps.home/oauth2/callback
      scopes: [openid, profile, email, groups]

  - name: arr-oauth2-readarr
    namespace: arr
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    syncWave: "3"
    # No oidc:* block — reuses the `arr-oauth2-prowlarr-oidc-client` Secret
    # from the sibling release (same ns). See arr-oauth2-readarr.yaml.

  # qbittorrent lives in its OWN namespace (privileged PSS — gluetun NET_ADMIN)
  # and is exposed only via the INFRA gateway (not apps), so the WebUI is
  # reachable only from LAN-privileged devices. Cross-ns sharing of media
  # PVCs into the `arr` ns is via an in-cluster NFS bridge (see extras.arr).
  - name: qbittorrent
    namespace: qbittorrent
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "4"  # after extras (ns + PVCs + nfs-server) settle
    route:
      hostname: qbittorrent.infra.home
      gateway: infra
      service: qbittorrent
      port: 8080
      dashboard:
        enabled: true   # gateway:infra defaults to hidden; opt in explicitly
        name: qBittorrent
        group: Media
        icon: qbittorrent.svg
        description: Torrent client (via Mullvad VPN)
        app: qbittorrent

  # Catch-all backend for *.apps.home — any hostname that doesn't match a more
  # specific HTTPRoute falls through here. Wildcard hostname; Gateway API spec
  # gives precedence to more-specific HTTPRoutes, so existing apps are unaffected.
  - name: error-pages
    namespace: error-pages
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "5"  # after the real apps; doesn't matter much, but explicit
    route:
      hostname: "*.apps.home"
      gateway: apps
      service: error-pages
      port: 80
      dashboard: false   # never on the dashboard

# ══════════════════════════════════════════════════════════════════════════════
# EXTRAS (raw resources for apps that need pre-deploy infra)
# ══════════════════════════════════════════════════════════════════════════════
extras:
  immich:
    librarySize: 1Ti
    postgresSize: 20Gi
  # paperless-ngx pilot: namespace only (baseline PSS — paperless image's
  # supervisord runs as root then drops, and the bundled bitnami subcharts'
  # init paths don't all pass restricted PSS).
  paperless-ngx:
    enabled: true
  # stirling-pdf: namespace only (baseline PSS — image's entrypoint runs as
  # root to set up tessdata + /usr/local/bin/diagnostics symlinks before
  # dropping to uid 1000, which restricted PSS rejects).
  stirling-pdf:
    enabled: true
  # arr stack — split-architecture:
  #   `arr` ns (baseline PSS): prowlarr + readarr (linuxserver s6-overlay)
  #   `qbittorrent` ns (privileged PSS, authorized): qBit+gluetun (NET_ADMIN)
  #     owns two RWX kadalu PVCs + an nfs-server bridge re-exporting them
  #     into `arr` ns as NFS PVs (single export per mount → hardlinks intact).
  arr:
    downloadsSize: 200Gi
    librarySize: 1500Gi
  # audiobookshelf-v2 — green/blue parallel install. Renders:
  #   - audiobookshelf-v2 namespace (default restricted PSS, like the existing
  #     audiobookshelf ns)
  #   - third twin-PV/PVC for `media-library` in audiobookshelf-v2 ns,
  #     pointing at the SAME kadalu subvol path the arr stack uses
  #     (subvol/ar/lb/media-library). RWX semantics + hardlinks intact.
  #   - declarative OIDC seed Job: hits /init → /login → PATCH /api/auth-settings
  audiobookshelf-v2:
    enabled: true
    librarySize: 1500Gi  # mirror extras.arr.librarySize — same backing subvol
