# User Applications configuration
# This file configures the 'apps' instance of the platform chart

repoURL: https://github.com/arch-err/Cluster-Config.git
targetRevision: v2
valuesPath: kubernetes/values/apps

# ══════════════════════════════════════════════════════════════════════════════
# GATEWAY (apps gateway configuration)
# ══════════════════════════════════════════════════════════════════════════════
gateway:
  apps:
    ip: "10.10.10.200"
    domain: apps.home
    tlsSecret: wildcard-apps-home-tls

# ══════════════════════════════════════════════════════════════════════════════
# COMPONENTS (generates ArgoCD Applications)
# ══════════════════════════════════════════════════════════════════════════════
components:
  - name: matrix
    namespace: matrix
    chart:
      repo: https://halkeye.github.io/helm-charts
      name: synapse
    route:
      hostname: matrix.apps.home
      gateway: apps
      service: matrix-synapse
      port: 8443
      dashboard:
        group: Comms
        icon: matrix.svg
        app: matrix-synapse  # workload name differs from route name

  # hookshot is a backend bridge — keep it off the dashboard
  - name: hookshot
    namespace: matrix
    chart:
      repo: https://arch-err.github.io/charts
      name: hookshot
    route:
      hostname: hookshot.apps.home
      gateway: apps
      service: hookshot
      port: 9000
      dashboard: false

  # audiobookshelf-v2 — replaced the legacy `audiobookshelf` release
  # (christianhuth/audiobookshelf v2.2.0) on 2026-05-10. Mounts the shared
  # kadalu media-library volume (so ABS sees the arr stack's downloads).
  # The component name is locked to `audiobookshelf-v2` (ns / deployment /
  # PVCs / ArgoCD app — renaming any of those would force a destructive
  # PVC recreate). Hostname + OIDC client carry clean prod names:
  #   - hostname:  audiobookshelf.apps.home
  #   - OIDC client_id: audiobookshelf (via oidc.clientId override)
  # OIDC: pocket-id client bootstrapped declaratively below; user pastes
  # client_id/secret/issuer from the audiobookshelf-oidc-client Secret
  # into Settings → Authentication → OpenID Connect (no auto-seed Job —
  # see revert e4f743d for why).
  - name: audiobookshelf-v2
    namespace: audiobookshelf-v2
    chart:
      # Migrated 2026-05-07 from christianhuth/audiobookshelf v2.2.0 →
      # bjw-s/app-template v4.6.2. christianhuth's chart silently ignored
      # extraEnv/extraVolumes — couldn't mount home-ca-bundle for OIDC
      # discovery, even the NODE_TLS_REJECT_UNAUTHORIZED hack didn't apply.
      # app-template exposes env + persistence + container securityContext
      # directly. config/metadata/backup PVCs were wiped on cutover (user
      # authorized); media-library RWX PVC retained via existingClaim.
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"  # after extras (ns + media-library twin PV) settle
    route:
      hostname: audiobookshelf.apps.home
      gateway: apps
      service: audiobookshelf-v2
      port: 8080
      timeout: 30m  # large audiobook uploads via API
      dashboard:
        name: AudiobookShelf
        group: Media
        icon: audiobookshelf.svg
        description: Audiobooks + podcasts
    oidc:
      enabled: true
      # Clean OIDC client_id, decoupled from the legacy component name.
      # Drives the pocket-id client id + the rendered Secret name
      # (audiobookshelf-oidc-client). The old `audiobookshelf-v2` pocket-id
      # client is external state — delete it via the pocket-id admin UI/API
      # after this lands (ArgoCD only prunes the k8s-side bootstrap
      # resources, not the pocket-id-side client doc).
      clientId: audiobookshelf
      # advplyr/audiobookshelf image bakes ROUTER_BASE_PATH=/audiobookshelf
      # into its Dockerfile, which prefixes ABS's callback path. Empty-string
      # env override is silently ignored (Node || falls through). Easier to
      # accept the prefix and register both forms — root form kept in case
      # the image ever drops the bake-in.
      callbackUrls:
        - https://audiobookshelf.apps.home/audiobookshelf/auth/openid/callback
        - https://audiobookshelf.apps.home/audiobookshelf/auth/openid/mobile-redirect
        - https://audiobookshelf.apps.home/auth/openid/callback
        - https://audiobookshelf.apps.home/auth/openid/mobile-redirect
      scopes: [openid, profile, email, groups]
      groupRestriction:
        allowedGroups: [apps_users, administrators]

  - name: agent-vault
    namespace: agent-vault
    chart:
      repo: https://arch-err.github.io/charts
      name: agent-vault
      version: 0.1.1
    # UI HTTPRoute (port 14321) — proxy port (14322) is exposed via the
    # passthrough listener on the apps gateway, see chart's tlsRoute.
    route:
      hostname: agent-vault.apps.home
      gateway: apps
      service: agent-vault
      port: 14321
      dashboard:
        name: Agent Vault
        group: Tools
        icon: infisical.svg
        description: Secrets vault for agents

  - name: immich
    namespace: immich
    chart:
      repo: https://immich-app.github.io/immich-charts
      name: immich
      version: 0.11.1
    syncWave: "3"  # after extras (ns/PVC/postgres) settle
    route:
      hostname: immich.apps.home
      gateway: apps
      service: immich-server
      port: 2283
      timeout: 30m  # large photo/video uploads
      dashboard:
        group: Media
        description: Photos + memories
        app: immich-server  # workload name differs from route name
    oidc:
      enabled: true
      callbackUrls:
        - https://immich.apps.home/auth/login
        - https://immich.apps.home/user-settings
        - app.immich:///oauth-callback
      scopes: [openid, profile, email, groups]

  - name: ntfy
    namespace: ntfy
    chart:
      repo: https://repo.helmforge.dev
      name: ntfy
      version: 1.1.8
    route:
      hostname: ntfy.apps.home
      gateway: apps
      service: ntfy
      port: 80
      dashboard:
        group: Tools
        icon: ntfy.svg
        description: Push notifications
        app: ntfy

  - name: homepage
    namespace: homepage
    chart:
      repo: https://jameswynn.github.io/helm-charts
      name: homepage
      version: 2.1.0
    route:
      hostname: homepage.apps.home
      gateway: apps
      service: homepage
      port: 3000
      dashboard: false   # don't link to ourselves

  - name: pocket-id
    namespace: pocket-id
    chart:
      repo: https://anza-labs.github.io/charts
      name: pocket-id
      version: 2.1.1
    route:
      hostname: auth.apps.home
      gateway: apps
      service: pocket-id
      port: 80
      dashboard:
        name: Pocket ID
        group: Tools
        icon: pocket-id.png
        description: Passkey-only OIDC provider
        app: pocket-id

  - name: excalidash
    namespace: excalidash
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    # HTTPRoute points straight at the excalidash frontend service (NO oauth2-
    # proxy sidecar): ExcaliDash speaks OIDC natively (AUTH_MODE=oidc_enforced),
    # so pocket-id is the only sign-in path with no double login. Mirrors the
    # papra native-OIDC shape. See values/apps/excalidash.yaml for the OIDC_* env.
    route:
      hostname: excalidash.apps.home
      gateway: apps
      service: excalidash
      port: 80
      dashboard:
        group: Tools
        icon: excalidraw.svg
        description: Excalidraw dashboard + collab
        app: excalidash
    # Per-app OIDC client (pocket-id id=`excalidash`). The bootstrap Job renders
    # Secret `excalidash-oidc-client` into the excalidash ns with keys
    # client_id / client_secret / issuer_url; the backend consumes them directly
    # via OIDC_CLIENT_ID/SECRET + OIDC_ISSUER_URL env (values file). Callback is
    # the upstream-fixed /api/auth/oidc/callback. apps_users + administrators
    # allowed at the IDP level (administrators additionally map to the ExcaliDash
    # ADMIN role via OIDC_ADMIN_GROUPS in the values file).
    oidc:
      enabled: true
      callbackUrls:
        - https://excalidash.apps.home/api/auth/oidc/callback
      scopes: [openid, profile, email, groups]
      groupRestriction:
        allowedGroups: [apps_users, administrators]

  - name: it-tools
    namespace: it-tools
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    route:
      hostname: it-tools.apps.home
      gateway: apps
      service: it-tools
      port: 80
      dashboard:
        name: IT Tools
        group: Tools
        icon: it-tools.png
        description: Handy dev tools collection
        app: it-tools

  - name: cyberchef
    namespace: cyberchef
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    route:
      hostname: cyberchef.apps.home
      gateway: apps
      service: cyberchef
      port: 80
      dashboard:
        name: CyberChef
        group: Tools
        icon: cyberchef.png
        description: Cyber Swiss Army Knife — encode/decode/crypto
        app: cyberchef

  - name: stirling-pdf
    namespace: stirling-pdf
    chart:
      repo: https://stirling-tools.github.io/Stirling-PDF-chart
      name: stirling-pdf-chart
      version: 3.1.0
    route:
      hostname: stirling-pdf.apps.home
      gateway: apps
      service: stirling-pdf
      port: 8080
      dashboard:
        name: Stirling PDF
        group: Tools
        icon: stirling-pdf.png
        description: Web PDF toolbox

  # ──────────────────────────────────────────────────────────────────────────
  # PAPRA — minimal self-hosted document management. Replaces the paperless-ngx
  # POC (decommissioned in the same commit). Sqlite metadata + plain-file
  # storage (originals at /app/app-data/documents/<orgId>/...; nuking the db
  # leaves files trivially readable on disk). Built-in tesseract.js OCR.
  #
  # Auth: NATIVE OIDC via better-auth's generic-oauth plugin (no oauth2-proxy
  # sidecar). Pocket-id is the only sign-in path (native email/password is
  # disabled in the values file). Provider id = `pocket-id` (drives the
  # callback URL the platform's oidc-bootstrap registers in pocket-id).
  # See values/apps/papra.yaml for the AUTH_PROVIDERS_CUSTOMS wiring.
  # ──────────────────────────────────────────────────────────────────────────
  - name: papra
    namespace: papra
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    route:
      hostname: papra.apps.home
      gateway: apps
      service: papra
      port: 1221
      timeout: 30m  # large document uploads + OCR backlogs
      dashboard:
        name: Papra
        group: Documents
        icon: papra.png
        description: Minimal document archive (OCR, plain-file storage)
        app: papra
    # Per-app OIDC client (pocket-id id=`papra`). Secret rendered into the
    # `papra` ns as `papra-oidc-client`; consumed by papra directly via the
    # AUTH_PROVIDERS_CUSTOMS env (assembled at container start from the
    # secret's client_id/client_secret/issuer_url keys — see values file).
    # Better-auth's generic-oauth callback path: /api/auth/oauth2/callback/<id>.
    # apps_users + administrators allowed at the IDP level (gf eventually uses
    # this too; for now just admins until UI is dialled in).
    oidc:
      enabled: true
      callbackUrls:
        - https://papra.apps.home/api/auth/oauth2/callback/pocket-id
      scopes: [openid, profile, email, groups]
      groupRestriction:
        allowedGroups: [apps_users, administrators]

  - name: pingvin-share
    namespace: pingvin-share
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"  # after OIDC client secret + Retain PVC settle
    route:
      hostname: pingvin.apps.home
      gateway: apps
      service: pingvin-share
      port: 3000
      timeout: 30m  # large file uploads
      dashboard:
        name: Pingvin Share
        group: Files
        icon: pingvin-share.png
        description: File sharing / transfer links
        app: pingvin-share
    oidc:
      enabled: true
      clientId: pingvin-share
      # Pingvin Share X's OIDC client does not send PKCE code_challenge /
      # code_verifier (see upstream GenericOidcProvider), so Pocket ID must not
      # require PKCE for this confidential client.
      pkceEnabled: false
      callbackUrls:
        - https://pingvin.apps.home/api/oauth/callback/oidc
      scopes: [openid, profile, email, groups]
      groupRestriction:
        allowedGroups: [apps_users, administrators]

  # qbittorrent lives in its OWN namespace (privileged PSS — gluetun NET_ADMIN)
  # and is exposed only via the INFRA gateway (not apps), so the WebUI is
  # reachable only from LAN-privileged devices. Its media-downloads /
  # media-library RWX kadalu PVs are rendered by extras.arr and shared with
  # the media apps (jellyfin, navidrome, audiobookshelf-v2, metube) via their
  # own twin PVs on the same kadalu subvol.
  - name: qbittorrent
    namespace: qbittorrent
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "4"  # after extras (ns + PVCs + nfs-server) settle
    route:
      hostname: qbittorrent.infra.home
      gateway: infra
      service: qbittorrent
      port: 8080
      dashboard:
        enabled: true   # gateway:infra defaults to hidden; opt in explicitly
        name: qBittorrent
        group: Media
        icon: qbittorrent.svg
        description: Torrent client (via Mullvad VPN)
        app: qbittorrent

  # ──────────────────────────────────────────────────────────────────────────
  # CALIBRE-WEB (Calibre-Web-Automated, CWA fork) — ebook library server.
  # Web UI in Safari is the entire UX (gf reads on iPad: browse → tap EPUB →
  # iOS share-sheet → Copy to Books). Auth via oauth2-proxy sidecar release
  # (calibre-web-oauth2) consuming the per-app pocket-id client below.
  # extras.calibre-web renders the baseline-PSS namespace (linuxserver-style
  # s6-overlay needs SETUID/SETGID/CHOWN to drop to PUID:PGID).
  # ──────────────────────────────────────────────────────────────────────────
  - name: calibre-web
    namespace: calibre-web
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"  # after extras (ns label) settle
    # HTTPRoute points at oauth2-calibre-web Service (same ns), NOT directly
    # at the calibre-web workload. /api/* + /opds + /kobo/ bypass-routed in
    # the oauth2-proxy config so api-key + ereader-feed flows keep working.
    # CWA must be set to trust X-Forwarded-User (Admin → Configure Advanced
    # → "Allow Reverse Proxy Authentication") via UI — manual one-time step.
    route:
      hostname: calibre.apps.home
      gateway: apps
      service: oauth2-calibre-web
      port: 80
      timeout: 30m  # bulk EPUB upload + cover-fetch can take a while
      dashboard:
        name: Calibre
        group: Media
        icon: calibre-web.svg
        description: Ebook library (CWA)
        app: calibre-web
    # Per-app OIDC client (pocket-id id=`calibre-web`). Secret rendered into
    # the `calibre-web` ns as `calibre-web-oidc-client`; consumed by the
    # calibre-web-oauth2 release. apps_users + administrators allowed at the
    # IDP level (gf is in apps_users) on top of oauth2-proxy --allowed-group.
    oidc:
      enabled: true
      callbackUrls:
        - https://calibre.apps.home/oauth2/callback
      scopes: [openid, profile, email, groups]
      groupRestriction:
        allowedGroups: [apps_users, administrators]

  # oauth2-proxy fronting calibre-web. Same pattern as arr-oauth2-readarr.
  # Lives in the same ns as calibre-web so the OIDC-client Secret + HTTPRoute
  # backendRef are co-located.
  - name: calibre-web-oauth2
    namespace: calibre-web
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    syncWave: "3"
    # Consumes `calibre-web-oidc-client` Secret rendered by the calibre-web
    # Application's oidc:* block. No oidc:* block here — this IS the proxy.

  # ──────────────────────────────────────────────────────────────────────────
  # BOOKLORE — second self-hosted ebook UI deployed ALONGSIDE calibre-web.
  # Reads the SAME physical book files via a parallel kadalu static PV
  # (extras.booklore.calibreLibrarySubvolPath points at the exact subvol the
  # calibre-web `calibre-library` PVC binds to). Mounted READ-ONLY +
  # DISK_TYPE=NETWORK so booklore can't write/reorganize files calibre owns.
  #
  # Booklore is a Spring Boot app w/ MariaDB (no sqlite fallback) — the
  # MariaDB Deployment + PVC live in extras.booklore (mirrors immich-postgres
  # shape: chown init + non-root mariadb runtime). MariaDB password in
  # SopsSecret `booklore-db` (kubernetes/secrets/apps/booklore-db.yaml).
  #
  # Auth: oauth2-proxy + pocket-id (booklore has native OIDC but it's
  # admin-UI-configured, not env-var-wired). Booklore trusts X-Remote-User
  # headers via REMOTE_AUTH_ENABLED=true. Mirrors calibre-web exactly.
  # ──────────────────────────────────────────────────────────────────────────
  - name: booklore
    namespace: booklore
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"  # after extras (ns + bridged PV + mariadb) settle
    # HTTPRoute points at the oauth2-booklore Service (NOT directly at the
    # booklore workload). No /api bypass yet — OPDS/Kobo auth wiring deferred
    # until first user needs it.
    route:
      hostname: booklore.apps.home
      gateway: apps
      service: oauth2-booklore
      port: 80
      timeout: 30m  # bulk metadata scan / cover-fetch can take a while
      dashboard:
        name: Booklore
        group: Media
        icon: si-bookstack.svg
        description: Ebook library (booklore — evaluating alongside calibre-web)
        app: booklore
    # Per-app OIDC client (pocket-id id=`booklore`). Secret rendered into the
    # `booklore` ns as `booklore-oidc-client`; consumed by the booklore-oauth2
    # release. apps_users + administrators allowed at the IDP level (gf eligible)
    # on top of oauth2-proxy --allowed-group.
    oidc:
      enabled: true
      callbackUrls:
        - https://booklore.apps.home/oauth2/callback
        # Native booklore Spring OIDC client uses /oauth2-callback (one word).
        # Kept alongside the oauth2-proxy /oauth2/callback so both paths work.
        - https://booklore.apps.home/oauth2-callback
      scopes: [openid, profile, email, groups]
      groupRestriction:
        allowedGroups: [apps_users, administrators]

  # oauth2-proxy fronting booklore. Same pattern as calibre-web-oauth2.
  # Lives in the same ns as booklore so the OIDC-client Secret + HTTPRoute
  # backendRef are co-located.
  - name: booklore-oauth2
    namespace: booklore
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    syncWave: "3"
    # Consumes `booklore-oidc-client` Secret rendered by the booklore
    # Application's oidc:* block. No oidc:* block here — this IS the proxy.

  # ──────────────────────────────────────────────────────────────────────────
  # SYNCTHING — self-hosted continuous file sync. Replaces the laptop's
  # /srv/syncthing instance (data migration is a separate follow-up; this is
  # a clean deploy). Admin UI gated by oauth2-proxy + pocket-id OIDC; native
  # GUI auth disabled. Sync protocol (22000/tcp+udp) exposed via NodePort
  # 30022 — peers reach it via <node-ip>:30022 directly, NOT via the L7
  # gateway. UDP local-discovery (21027) intentionally omitted; global
  # discovery + relays cover peer discovery.
  # ──────────────────────────────────────────────────────────────────────────
  - name: syncthing
    namespace: syncthing
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    # HTTPRoute points at oauth2-syncthing Service (same ns), NOT directly
    # at the syncthing workload. Sync ports (22000) live on a separate
    # NodePort Service (`syncthing-sync`) outside the gateway entirely.
    route:
      hostname: syncthing.apps.home
      gateway: apps
      service: oauth2-syncthing
      port: 80
      dashboard:
        name: Syncthing
        group: Files
        icon: syncthing.svg
        description: Continuous file sync (admin UI)
        app: syncthing
    # Per-app OIDC client (pocket-id id=`syncthing`). Secret rendered into
    # the `syncthing` ns as `syncthing-oidc-client`; consumed by the
    # syncthing-oauth2 release. apps_users + administrators allowed at the
    # IDP level on top of oauth2-proxy --allowed-group.
    oidc:
      enabled: true
      callbackUrls:
        - https://syncthing.apps.home/oauth2/callback
      scopes: [openid, profile, email, groups]
      groupRestriction:
        allowedGroups: [apps_users, administrators]

  # oauth2-proxy fronting syncthing. Same pattern as calibre-web-oauth2.
  # Lives in the same ns as syncthing so the OIDC-client Secret + HTTPRoute
  # backendRef are co-located.
  - name: syncthing-oauth2
    namespace: syncthing
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    # Consumes `syncthing-oidc-client` Secret rendered by the syncthing
    # Application's oidc:* block. No oidc:* block here — this IS the proxy.

  # ──────────────────────────────────────────────────────────────────────────
  # HOME-ASSISTANT — smart-home hub. First migration step off the laptop.
  # Pure network integrations only for now; future-proofing for USB dongles +
  # hostNetwork (multicast) is inlined as commented hooks in the values file.
  # Auth via NATIVE OIDC (hass-oidc-auth custom integration) — pocket-id as a
  # first-class HA auth provider on HA's own login screen. The oauth2-proxy
  # front-door was removed in Phase 2 (single SSO, mobile app + REST API work,
  # break-glass local admin preserved). extras.home-assistant renders the
  # baseline-PSS namespace (HA image is s6-overlay; /init starts as root).
  # ──────────────────────────────────────────────────────────────────────────
  - name: home-assistant
    namespace: home-assistant
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"  # after extras (ns label) settle
    # HTTPRoute points straight at the home-assistant workload (port 8123) —
    # no proxy in the path. HA owns auth via the hass-oidc-auth integration.
    # HA still trusts X-Forwarded-* from the cilium gateway via configuration.
    # yaml (trusted_proxies includes the cilium pod CIDR) — rendered by the
    # seed ConfigMap + init container; see values/apps/home-assistant.yaml.
    route:
      hostname: ha.apps.home
      gateway: apps
      service: home-assistant
      port: 8123
      dashboard:
        name: Home Assistant
        group: Smart Home
        icon: home-assistant.svg
        description: Smart-home hub
        app: home-assistant
    # Per-app OIDC client (pocket-id id=`home-assistant`). Secret rendered
    # into the `home-assistant` ns as `home-assistant-oidc-client`; consumed
    # by the native hass-oidc-auth integration. apps_users + administrators
    # allowed at the IDP level.
    # Phase 2 (cutover): client is PUBLIC (hass-oidc-auth recommends a public
    # PKCE client — no client_secret). Only the native callback is registered
    # now; the oauth2-proxy callback was pruned with the proxy.
    oidc:
      enabled: true
      public: true                 # public PKCE client (no client_secret)
      pkceEnabled: true
      callbackUrls:
        - https://ha.apps.home/auth/oidc/callback   # native hass-oidc-auth
      scopes: [openid, profile, email, groups]
      groupRestriction:
        allowedGroups: [apps_users, administrators]

  # ──────────────────────────────────────────────────────────────────────────
  # VAULTWARDEN — self-hosted Bitwarden-compatible password manager. Replaces
  # the laptop's docker-compose instance at /srv/vaultwarden (data migration
  # is a separate follow-up; this is a clean deploy).
  #
  # Auth: end-user UI uses vaultwarden's native account flow (email + master
  # password) — NO oauth2-proxy (would break Bitwarden client integration via
  # /identity/connect/*). /admin panel is gated by ADMIN_TOKEN env var (argon2id
  # PHC hash from SopsSecret vaultwarden-admin-token, plaintext lives in the
  # same secret as ADMIN_TOKEN_PLAINTEXT for retrieval).
  #
  # SSO migration path: vaultwarden/server:<ver>-sso (experimental upstream)
  # adds native OIDC. Not used here — first deploy is plain admin-token.
  # ──────────────────────────────────────────────────────────────────────────
  - name: vaultwarden
    namespace: vaultwarden
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    route:
      hostname: vaultwarden.apps.home
      gateway: apps
      service: vaultwarden
      port: 80
      timeout: 30m  # vault attachment uploads + send-large-files can be slow
      dashboard:
        name: Vaultwarden
        group: Security
        icon: vaultwarden.svg
        description: Password manager (Bitwarden-compatible)
        app: vaultwarden

  # ──────────────────────────────────────────────────────────────────────────
  # METUBE — yt-dlp web UI. Downloads land in media-library/YouTube/ on the
  # shared kadalu subvol (subPath=YouTube on the PVC), visible to ABS-v2 at
  # /library/YouTube and to Jellyfin at /media/YouTube. Auth via oauth2-proxy
  # sidecar release (metube-oauth2) consuming the per-app pocket-id client
  # below. extras.metube renders the ns + twin media-library PV/PVC pair.
  # ──────────────────────────────────────────────────────────────────────────
  - name: metube
    namespace: metube
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"  # after extras (ns + media-library twin PV) settle
    # HTTPRoute points at oauth2-metube Service (same ns), NOT directly at
    # the metube workload. metube has zero native auth — oauth2-proxy is the
    # only gate. No /api/* bypass needed (no mobile-app integration).
    route:
      hostname: metube.apps.home
      gateway: apps
      service: oauth2-metube
      port: 80
      timeout: 30m  # long yt-dlp downloads (HD videos) shouldn't trip route timeout
      dashboard:
        name: Metube
        group: Media
        icon: metube.png
        description: yt-dlp web UI (YouTube downloader)
        app: metube
    # Per-app OIDC client (pocket-id id=`metube`). Secret rendered into the
    # `metube` ns as `metube-oidc-client`; consumed by the metube-oauth2
    # release. apps_users + administrators allowed at the IDP level on top
    # of oauth2-proxy --allowed-group.
    oidc:
      enabled: true
      callbackUrls:
        - https://metube.apps.home/oauth2/callback
      scopes: [openid, profile, email, groups]
      groupRestriction:
        allowedGroups: [apps_users, administrators]

  # oauth2-proxy fronting metube. Same pattern as syncthing-oauth2.
  # Lives in the same ns as metube so the OIDC-client Secret + HTTPRoute
  # backendRef are co-located.
  - name: metube-oauth2
    namespace: metube
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    syncWave: "3"
    # Consumes `metube-oidc-client` Secret rendered by the metube
    # Application's oidc:* block. No oidc:* block here — this IS the proxy.

  # ──────────────────────────────────────────────────────────────────────────
  # JELLYFIN — video media server. Streams movies + TV shows from the shared
  # kadalu media-library volume (same backing subvol/ar/lb/media-library as
  # arr / audiobookshelf-v2 / qbittorrent / metube). Auth via the native
  # jellyfin-plugin-sso (configured against pocket-id) for browser/web OIDC;
  # mobile/TV native apps continue to use Jellyfin's own MediaBrowser token
  # auth. extras.jellyfin renders the ns + twin media-library PV/PVC pair.
  # ──────────────────────────────────────────────────────────────────────────
  - name: jellyfin
    namespace: jellyfin
    chart:
      repo: https://jellyfin.github.io/jellyfin-helm
      name: jellyfin
      version: 3.2.0
    syncWave: "3"  # after extras (ns + media-library twin PV) settle
    # HTTPRoute points directly at the jellyfin workload Service. The SSO
    # plugin handles OIDC per-user-click inside Jellyfin; no proxy gating.
    route:
      hostname: jellyfin.apps.home
      gateway: apps
      service: jellyfin
      port: 8096
      timeout: 30m  # large library scans + media uploads via API
      dashboard:
        name: Jellyfin
        group: Media
        icon: jellyfin.svg
        description: Video media server (movies + TV)
        app: jellyfin
    # Per-app OIDC client (pocket-id id=`jellyfin`). Secret rendered into the
    # `jellyfin` ns as `jellyfin-oidc-client`; consumed by the SSO plugin.
    # apps_users + administrators allowed at the IDP level.
    oidc:
      enabled: true
      callbackUrls:
        # SSO-Auth plugin (jellyfin-plugin-sso) callback. Provider name in the
        # plugin config = `PocketID` (case-sensitive — last path segment).
        - https://jellyfin.apps.home/sso/OID/redirect/PocketID
      scopes: [openid, profile, email, groups]
      groupRestriction:
        allowedGroups: [apps_users, administrators]

  # ──────────────────────────────────────────────────────────────────────────
  # NAVIDROME — music server (Subsonic API-compatible). Streams from the
  # shared kadalu media-library volume (same backing subvol as arr / ABS-v2
  # / jellyfin / metube), mounted READ-ONLY at /music with subPath=music.
  #
  # AUTH: TWO orthogonal surfaces.
  #   - Web UI is fronted by oauth2-proxy (navidrome-oauth2 below) — Navidrome
  #     has NO native OIDC (verified against v0.61.2 source), but it has an
  #     ExtAuth header-trust mode (ND_EXTAUTH_USERHEADER + TRUSTEDSOURCES).
  #     oauth2-proxy sets X-Forwarded-User, Navidrome trusts it.
  #   - Subsonic API (/rest/*) is bypassed in oauth2-proxy — mobile clients
  #     (Symfonium, Amperfy, DSub, play:Sub) auth with username+password
  #     against Navidrome's native user DB. User MUST create a Navidrome
  #     account via the web UI's admin panel for each mobile device.
  # See values/apps/navidrome.yaml + navidrome-oauth2.yaml for the full
  # rationale + the env var matrix.
  #
  # extras.navidrome renders the ns + twin media-library PV/PVC pair.
  # ──────────────────────────────────────────────────────────────────────────
  - name: navidrome
    namespace: navidrome
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"  # after extras (ns + media-library twin PV) settle
    # HTTPRoute points at oauth2-navidrome Service (same ns), NOT directly at
    # the navidrome workload. /rest/* (Subsonic API for mobile clients) and
    # /share/* (public share links) are skip-auth-route'd in the oauth2-proxy
    # so they reach Navidrome directly — Navidrome enforces its own auth on
    # those paths via its native user DB.
    route:
      hostname: navidrome.apps.home
      gateway: apps
      service: oauth2-navidrome
      port: 80
      timeout: 30m  # large library scans + long-running transcode requests
      dashboard:
        name: Navidrome
        group: Media
        icon: navidrome.svg
        description: Music server (Subsonic API)
        app: navidrome
    # Per-app OIDC client (pocket-id id=`navidrome`). Secret rendered into
    # the `navidrome` ns as `navidrome-oidc-client`; consumed by the
    # navidrome-oauth2 release. apps_users + administrators allowed at the
    # IDP level on top of oauth2-proxy's --allowed-group (defense in depth).
    oidc:
      enabled: true
      callbackUrls:
        - https://navidrome.apps.home/oauth2/callback
      scopes: [openid, profile, email, groups]
      groupRestriction:
        allowedGroups: [apps_users, administrators]

  # oauth2-proxy fronting navidrome. Same pattern as calibre-web-oauth2 /
  # metube-oauth2 / jellyfin-oauth2. Lives in the same ns as navidrome so
  # the OIDC-client Secret + HTTPRoute backendRef are co-located.
  - name: navidrome-oauth2
    namespace: navidrome
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    syncWave: "3"
    # Consumes `navidrome-oidc-client` Secret rendered by the navidrome
    # Application's oidc:* block. No oidc:* block here — this IS the proxy.

  # ──────────────────────────────────────────────────────────────────────────
  # SAMBA — standalone NAS-style SMB share. crazy-max samba image, single
  # share `data`, single user `j`. Replaced the earlier filebrowser-Quantum
  # + samba combo on 2026-05-28 — user dropped Quantum entirely; samba now
  # lives in its OWN ns with its OWN PVC (samba-data, 100Gi RWX
  # kadalu.replica2-retain, rendered by extras.samba). No web UI.
  #
  # Auth: SMB password for J only, from SopsSecret `samba-config`.
  #
  # SMB exposure: no route block (SMB is L4, not HTTP — gateway can't carry
  # it). Service is LoadBalancer on dedicated VIP 10.10.10.205 via cilium L2
  # (default-pool 10.10.10.200-220). LAN-only; UniFi FW restricts inbound
  # to user's laptop. Decided 2026-05-28.
  # ──────────────────────────────────────────────────────────────────────────
  - name: samba
    namespace: samba
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"  # after extras (ns + PVC + config secret) settle
    # NO route, NO oidc — SMB is L4. Service is LoadBalancer @ 10.10.10.205
    # via cilium L2 (see values/apps/samba.yaml). LAN-only, UniFi FW scoped.

  # ──────────────────────────────────────────────────────────────────────────
  # MATTERMOST — Team Edition chat UI for the "Hermes Agent" instances, served
  # at agents.apps.home (apps gateway). Stateful (chat history): cnpg postgres
  # (db: block below, mirrors grafana-db) + a Retain file PVC (extras.mattermost)
  # for uploads + on-disk config. AUTH: LOCAL ACCOUNTS ONLY — pocket-id OIDC is
  # NOT viable on Team Edition (its GitLab-OAuth shim needs a numeric int64 user
  # `id` that pocket-id cannot emit; full rationale in values/apps/mattermost
  # .yaml header). NO oauth2-proxy front door (chat needs real per-user
  # identity; user declined a gate). See values/apps/mattermost.yaml.
  #   syncWave 4: the cnpg Cluster CR renders at wave 0 and must reconcile (and
  #   mint mattermost-db-app) before the app pod starts — wave 4 > the db's 0
  #   and > extras (ns+PVC). Mattermost's entrypoint also DB-connect-retries.
  # ──────────────────────────────────────────────────────────────────────────
  - name: mattermost
    namespace: mattermost
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "4"  # after extras (ns + file PVC) + the cnpg Cluster settle
    # cnpg postgres backend (mirrors grafana-db). Renders Cluster `mattermost-db`
    # in this ns (db-postgres.yaml) + mints Secret `mattermost-db-app`
    # (username/password/host/dbname/...); values/apps/mattermost.yaml wires
    # MM_PASSWORD to it + the entrypoint builds the DSN. DB+owner = `mattermost`,
    # rw service = mattermost-db-rw. Retain SC so an ArgoCD prune can't wipe it.
    db:
      enabled: true
      version: "16"
      instances: 1
      storage:
        size: 10Gi
        storageClass: kadalu.replica2-retain
    route:
      hostname: agents.apps.home
      gateway: apps
      service: mattermost
      port: 8065
      # WebSocket realtime (/api/v4/websocket) + file uploads can be long-lived;
      # bump the request timeout off the gateway default.
      timeout: 1h
      dashboard:
        name: Mattermost
        group: Comms
        icon: si-mattermost.svg
        description: Chat UI for the Hermes Agent instances
        app: mattermost
    # NO oidc: block — Team Edition can't do pocket-id SSO (see header). Local
    # accounts only; no oauth2-proxy. First signup → System Admin.

  # ──────────────────────────────────────────────────────────────────────────
  # MOSQUITTO — internal MQTT broker (eclipse-mosquitto 2.x). The private bus
  # for the Zigbee2MQTT ⇄ Home Assistant integration: Z2M publishes device
  # state, HA's MQTT integration subscribes. ClusterIP on :1883 only — NO
  # route (MQTT is L4, not HTTP), NOT exposed off-cluster. Auth via password
  # file (allow_anonymous false); users zigbee2mqtt + homeassistant. extras
  # .mosquitto renders the (restricted-PSS) ns. See values/apps/mosquitto.yaml.
  # ──────────────────────────────────────────────────────────────────────────
  - name: mosquitto
    namespace: mqtt
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"  # after extras (ns) + apps-secrets (mosquitto-auth) settle
    # NO route, NO oidc — internal MQTT bus on ClusterIP :1883.

  # ──────────────────────────────────────────────────────────────────────────
  # ZIGBEE2MQTT — Zigbee coordinator bridge. Owns the ConBee II dongle (the
  # device is injected by the generic-device-plugin DaemonSet via the
  # devic.es/zigbee resource request in values; pod stays NON-privileged).
  # Pinned to node-1 (the dongle's node). Publishes to mosquitto; HA consumes
  # over MQTT (HA is NOT pinned, does NOT get the device). The sensitive
  # frontend (permit-join, network reset, re-pair) is gated behind oauth2-proxy
  # + pocket-id; route → oauth2-zigbee2mqtt Service. extras.zigbee2mqtt renders
  # the (baseline-PSS) ns + the Retain data PVC holding the irreplaceable
  # Zigbee network identity (coordinator backup / pan_id / network key).
  # See values/apps/zigbee2mqtt.yaml.
  # ──────────────────────────────────────────────────────────────────────────
  - name: zigbee2mqtt
    namespace: zigbee2mqtt
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"  # after extras (ns + Retain PVC) + the mqtt-client secret
    # HTTPRoute points at the oauth2-zigbee2mqtt Service (same ns), NOT directly
    # at the Z2M workload — the frontend can permit-join / reset the mesh, so
    # it is never exposed ungated.
    route:
      hostname: zigbee2mqtt.infra.home
      gateway: infra
      service: oauth2-zigbee2mqtt
      port: 80
      dashboard:
        enabled: true   # gateway:infra defaults to hidden; opt in explicitly
        name: Zigbee2MQTT
        group: Home
        icon: zigbee2mqtt.svg
        description: Zigbee coordinator bridge (ConBee II)
        app: zigbee2mqtt
    # Per-app OIDC client (pocket-id id=`zigbee2mqtt`). Secret rendered into the
    # `zigbee2mqtt` ns as `zigbee2mqtt-oidc-client`; consumed by the
    # zigbee2mqtt-oauth2 release. infra_users + administrators allowed at the IDP
    # level on top of oauth2-proxy --allowed-group — operator tooling lives on
    # the infra tier (mirrors qbittorrent/grafana/argocd).
    oidc:
      enabled: true
      callbackUrls:
        - https://zigbee2mqtt.infra.home/oauth2/callback
      scopes: [openid, profile, email, groups]
      groupRestriction:
        allowedGroups: [infra_users, administrators]

  # oauth2-proxy fronting zigbee2mqtt's frontend. Same pattern as
  # calibre-web-oauth2. Lives in the zigbee2mqtt ns so the OIDC-client Secret +
  # HTTPRoute backendRef are co-located.
  - name: zigbee2mqtt-oauth2
    namespace: zigbee2mqtt
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    syncWave: "3"
    # Consumes `zigbee2mqtt-oidc-client` Secret rendered by the zigbee2mqtt
    # Application's oidc:* block. No oidc:* block here — this IS the proxy.

  # ──────────────────────────────────────────────────────────────────────────
  # HERMES — the "Hermes Agent" harness + web dashboard, running OFF the
  # cluster on a plain server at http://10.10.10.160:9119 (uvicorn-served Vite
  # SPA with an embedded WebSocket chat). It has NO native auth — it hands a
  # session token to anyone — so oauth2-proxy is the SOLE auth gate.
  #
  # There is NO in-cluster workload: the only k8s-side component is the
  # oauth2-proxy (this `hermes-oauth2` component IS the proxy). The proxy's
  # upstream is a SELECTORLESS Service `hermes-backend` whose EndpointSlice
  # hard-codes the external box 10.10.10.160:9119 — both rendered by
  # extras.hermes (platform/templates/extras.yaml).
  #
  # This component carries BOTH the route (→ oauth2-hermes svc:80, infra
  # gateway) AND the oidc:* block (pocket-id client id=`hermes`, secret
  # `hermes-oidc-client` — overridden off the component name so the proxy's
  # values reference clean `hermes-*` names). Exposed on the INFRA gateway
  # (operator tooling tier; infra_users + administrators). Mirrors the
  # zigbee2mqtt oauth2-proxy + pocket-id pattern, the only difference being the
  # external selectorless backend.
  #
  # DNS: *.infra.home is synthesized by CoreDNS's `template ANY A infra.home`
  # plugin → infra gateway 10.10.10.201 (see kubernetes/manual/coredns). No
  # explicit hermes record needed.
  #
  # WebSocket: oauth2-proxy forwards Upgrade handshakes natively
  # (--proxy-websockets=true) + flushes immediately (--flush-interval=-1) — the
  # embedded chat survives the proxy. See values/apps/hermes-oauth2.yaml.
  # ──────────────────────────────────────────────────────────────────────────
  - name: hermes-oauth2
    namespace: hermes
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    syncWave: "3"  # after extras (ns + selectorless svc/EndpointSlice) settle
    # HTTPRoute → the oauth2-hermes Service (same ns), NOT the external box
    # directly — oauth2-proxy is the only gate. Host on the INFRA gateway.
    route:
      hostname: hermes.infra.home
      gateway: infra
      service: oauth2-hermes
      port: 80
      dashboard:
        enabled: true   # gateway:infra defaults to hidden; opt in explicitly
        name: Hermes
        group: Tools
        icon: si-robotframework.svg
        description: Hermes Agent harness + dashboard (off-cluster)
        app: oauth2-hermes
    # Per-app OIDC client (pocket-id id=`hermes`). clientId + secretName
    # overrides decouple the pocket-id client + rendered Secret name from this
    # component's `hermes-oauth2` name → Secret `hermes-oidc-client`, consumed
    # by the oauth2-proxy (values/apps/hermes-oauth2.yaml). infra_users +
    # administrators allowed at the IDP level on top of --allowed-group.
    oidc:
      enabled: true
      clientId: hermes
      secretName: hermes-oidc-client
      callbackUrls:
        - https://hermes.infra.home/oauth2/callback
      scopes: [openid, profile, email, groups]
      groupRestriction:
        allowedGroups: [infra_users, administrators]

  # ──────────────────────────────────────────────────────────────────────────
  # PROTONMAIL-BRIDGE — internal-only IMAP/SMTP bridge for Proton Mail. This is
  # for cluster workloads (n8n later) to read/send mail through Proton without
  # exposing the mailbox protocols off-cluster. Namespace carries default-deny
  # ingress NetworkPolicy in extras.protonmail-bridge; add explicit allow rules
  # for n8n once it exists. One-time Proton login is manual via kubectl exec.
  # ──────────────────────────────────────────────────────────────────────────
  - name: protonmail-bridge
    namespace: protonmail-bridge
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"  # after extras (ns + NetworkPolicy) settle
    # NO route, NO oidc — IMAP/SMTP are internal L4 protocols, not a web UI.

  # Catch-all backend for *.apps.home — any hostname that doesn't match a more
  # specific HTTPRoute falls through here. Wildcard hostname; Gateway API spec
  # gives precedence to more-specific HTTPRoutes, so existing apps are unaffected.
  - name: error-pages
    namespace: error-pages
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "5"  # after the real apps; doesn't matter much, but explicit
    route:
      hostname: "*.apps.home"
      gateway: apps
      service: error-pages
      port: 80
      dashboard: false   # never on the dashboard

# ══════════════════════════════════════════════════════════════════════════════
# EXTRAS (raw resources for apps that need pre-deploy infra)
# ══════════════════════════════════════════════════════════════════════════════
extras:
  immich:
    librarySize: 1Ti
    postgresSize: 20Gi
  # stirling-pdf: namespace only (baseline PSS — image's entrypoint runs as
  # root to set up tessdata + /usr/local/bin/diagnostics symlinks before
  # dropping to uid 1000, which restricted PSS rejects).
  stirling-pdf:
    enabled: true
  # qbittorrent + shared media kadalu PVs. The unused *arr stack
  # (prowlarr/readarr/etc.) was removed 2026-05-29; this `arr` key is kept
  # only because it gates the qbittorrent ns (privileged PSS, authorized:
  # qBit+gluetun NET_ADMIN) and sizes the shared media-downloads /
  # media-library RWX kadalu PVs that qbittorrent and the media apps share.
  arr:
    downloadsSize: 200Gi
    librarySize: 1500Gi
  # audiobookshelf-v2 — green/blue parallel install. Renders:
  #   - audiobookshelf-v2 namespace (default restricted PSS, like the existing
  #     audiobookshelf ns)
  #   - third twin-PV/PVC for `media-library` in audiobookshelf-v2 ns,
  #     pointing at the SAME kadalu subvol path the arr stack uses
  #     (subvol/ar/lb/media-library). RWX semantics + hardlinks intact.
  #   - declarative OIDC seed Job: hits /init → /login → PATCH /api/auth-settings
  audiobookshelf-v2:
    enabled: true
    librarySize: 1500Gi  # mirror extras.arr.librarySize — same backing subvol
  # calibre-web (CWA): namespace only (baseline PSS — linuxserver image's
  # s6-overlay starts as root, drops to PUID:PGID via s6-applyuidgid which
  # needs SETUID/SETGID/CHOWN; restricted PSS rejects that init step).
  calibre-web:
    enabled: true
  # booklore: ns (baseline PSS — su-exec drop needs SETUID/SETGID, same as
  # calibre-web) + bridged static kadalu PV pointing at the SAME subvol as
  # calibre-web's `calibre-library` PVC (RWX, Retain, claimRef'd in the
  # booklore ns) + MariaDB Deployment+PVC+Service (booklore needs MariaDB,
  # no sqlite fallback). Mounted READ-ONLY at /books in the booklore pod,
  # alongside DISK_TYPE=NETWORK as defense-in-depth: calibre-web stays the
  # only writer to the underlying library, booklore is pure-reader.
  #
  # calibreLibrarySubvolPath is hard-coded to the exact subvol that
  # calibre-web's dynamically-provisioned PV
  # (pvc-152292a5-bf6b-4235-bb85-04f864b1c7d1) bound to on 2026-05-09.
  # Verify before any change to calibre-web's storage:
  #   kubectl get pv $(kubectl -n calibre-web get pvc calibre-web-calibre-library \
  #     -o jsonpath='{.spec.volumeName}') -o jsonpath='{.spec.csi.volumeAttributes.path}'
  booklore:
    librarySize: 50Gi  # mirror calibre-web's calibre-library PVC size
    mariadbSize: 5Gi
    calibreLibrarySubvolPath: subvol/bc/1c/pvc-152292a5-bf6b-4235-bb85-04f864b1c7d1
  # home-assistant: namespace only (baseline PSS — HA's s6-overlay /init runs
  # as root to supervise the python process; restricted PSS rejects that
  # init flow). Flip to privileged later when adding USB dongles or
  # hostNetwork for multicast/SSDP.
  home-assistant:
    enabled: true
  # metube — ns (default restricted PSS, metube image runs uid 1000 non-root)
  # + a fourth twin-PV/PVC for `media-library` in the metube ns pointing at
  # the SAME kadalu subvol path the arr stack / audiobookshelf-v2 use.
  # metube mounts it with subPath=YouTube so downloads land in
  # media-library/YouTube/* on the backing volume.
  metube:
    librarySize: 1500Gi  # mirror extras.arr.librarySize — same backing subvol
  # jellyfin — ns (default restricted PSS — chart-supported non-root via
  # securityContext override to uid 1000 in values/apps/jellyfin.yaml; the
  # shared /media mount is 0777 on the kadalu side so no init-chown needed)
  # + a fifth twin-PV/PVC for `media-library` in the jellyfin ns pointing at
  # the SAME kadalu subvol path the arr stack / audiobookshelf-v2 / metube use.
  jellyfin:
    librarySize: 1500Gi  # mirror extras.arr.librarySize — same backing subvol
  # navidrome — ns (default restricted PSS — deluan/navidrome is a single
  # static Go binary, runs uid 1000 cleanly) + a sixth twin-PV/PVC for
  # `media-library` in the navidrome ns pointing at the SAME kadalu subvol
  # path the arr / ABS-v2 / metube / jellyfin twin PVs use. Navidrome mounts
  # with subPath=music READ-ONLY → it only scans media-library/music/* and
  # never writes (no risk to files written by other apps as different uids).
  navidrome:
    librarySize: 1500Gi  # mirror extras.arr.librarySize — same backing subvol
  # samba — standalone NAS-style SMB share. Renders:
  #   - samba namespace (BASELINE PSS — smbd binds :445 + drops privs
  #     per-connection, needs runAsUser=0 + NET_BIND_SERVICE which
  #     restricted PSS rejects).
  #   - samba-data PVC: 100Gi RWX kadalu.replica2-retain — mounted at
  #     /share in the smbd pod. Retain reclaim via SC.
  # Replaced extras.filebrowser on 2026-05-28 (Quantum dropped).
  samba:
    enabled: true
    dataSize: 100Gi
  # mattermost — renders:
  #   - mattermost namespace (BASELINE PSS — the file PVC's chown init container
  #     runs as root to chown /mattermost/data + /config to uid 2000 on Kadalu;
  #     fsGroup alone fails on GlusterFS. Restricted PSS rejects runAsUser=0).
  #   - mattermost-data PVC: 20Gi RWO kadalu.replica2-retain — uploads/avatars
  #     (subPath data) + on-disk config.json (subPath config). CRITICAL user
  #     data → Retain reclaim via SC so an ArgoCD prune can't wipe chat files.
  # (The postgres PVC is owned by the cnpg Cluster from the db: block, also on
  #  kadalu.replica2-retain.) See values/apps/mattermost.yaml.
  mattermost:
    enabled: true
    dataSize: 20Gi
  # mosquitto — namespace only (restricted PSS — eclipse-mosquitto runs as
  # non-root uid 1883). The data PVC is chart-managed (default kadalu.replica2,
  # SKIP-tier: retained MQTT state is rebuilt by clients on reconnect).
  mosquitto:
    enabled: true
  # protonmail-bridge — namespace + default-deny ingress NetworkPolicy. The
  # Bridge pod exposes IMAP/SMTP only on ClusterIP; allow rules for n8n will be
  # added once n8n's namespace/labels are known. Namespace is baseline PSS
  # because the headless Bridge image stores its profile under /root. Config/
  # session PVC is chart-managed on kadalu.replica2-retain (non-critical but
  # convenient to keep).
  protonmail-bridge:
    enabled: true
  # zigbee2mqtt — namespace (baseline PSS) + the Retain data PVC. Baseline
  # because the koenkk/zigbee2mqtt image's s6-overlay /init starts as root to
  # set up /app/data perms before dropping to the run user; restricted PSS
  # rejects that init flow (same trade as calibre-web / home-assistant). The
  # data PVC holds the IRREPLACEABLE Zigbee network identity (coordinator
  # backup, pan_id, network key, device pairings) → kadalu.replica2-retain SC
  # so an ArgoCD prune can't wipe it. CRITICAL-tier.
  zigbee2mqtt:
    enabled: true
    dataSize: 1Gi
  # hermes — selectorless Service + EndpointSlice pointing at the OFF-CLUSTER
  # "Hermes Agent" box (10.10.10.160:9119). No in-cluster workload; the
  # oauth2-hermes proxy (hermes-oauth2 component) dials this Service, which
  # resolves to the external box via the manually-managed EndpointSlice.
  # Renders the hermes ns (restricted PSS — oauth2-proxy runs non-root).
  hermes:
    enabled: true
    address: "10.10.10.160"
    port: 9119
