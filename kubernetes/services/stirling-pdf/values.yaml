# stirling-pdf — chart: stirling-pdf/stirling-pdf-chart v3.1.0 (appVersion 2.5.1)
# https://github.com/Stirling-Tools/Stirling-PDF-chart
# Locally-hosted web PDF tool (split, merge, OCR, convert, etc.)

# Clean service name: stirling-pdf (instead of stirling-pdf-stirling-pdf-chart)
fullnameOverride: stirling-pdf

# Pin image tag to chart's appVersion for reproducibility
image:
  registry: docker.stirlingpdf.com
  repository: stirlingtools/stirling-pdf
  tag: "2.5.1"
  pullPolicy: IfNotPresent

# Disable chart's built-in ingress — platform chart handles routing via HTTPRoute
ingress:
  enabled: false

# ClusterIP only; clear externalTrafficPolicy (Local is irrelevant for ClusterIP)
service:
  type: ClusterIP
  externalTrafficPolicy: ""
  externalPort: 8080

# Persist application configuration; uploaded files and bundled OCR assets are ephemeral.
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 2Gi
  storageClass: local-bulk

# This chart declares the PVC volume but requires an explicit mount.
deployment:
  extraVolumeMounts:
    - name: storage-volume
      mountPath: /configs

# NOTE: no securityContext / containerSecurityContext overrides.
# The image's entrypoint must start as root to set up tessdata and the
# /usr/local/bin/diagnostics symlinks before dropping to uid 1000 (the
# bundled stirling-pdf user) internally. We rely on the namespace's
# baseline PSS label (set in resources/stirling-pdf.yaml) plus the
# image's own privilege-drop rather than a forced runAsNonRoot pod-spec.
# fsGroup still useful so the PVC is group-writable for uid 1000.
securityContext:
  enabled: true
  fsGroup: 1000

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 2Gi

# The pinned chart has no startup probe; allow Java/LibreOffice to finish booting.
probes:
  liveness:
    initialDelaySeconds: 180
    timeoutSeconds: 5
  readiness:
    timeoutSeconds: 5

# Branding + sane defaults; login disabled (single-user homelab, behind LAN)
envs:
  - name: UI_APPNAME
    value: "Stirling PDF"
  - name: SYSTEM_DEFAULTLOCALE
    value: "en-GB"
  - name: SECURITY_ENABLELOGIN
    value: "false"
