owner: apps
enabled: false
components:
  - name: kivra-sync
    namespace: kivra-sync
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"
    route:
      hostname: kivra-sync.infra.home
      gateway: infra
      service: oauth2-kivra-sync
      port: 80
      timeout: 30m
      dashboard:
        enabled: true
        name: Kivra Sync
        group: Documents
        icon: si-kivra.svg
        description: Pull Kivra receipts/letters for Papra import
        app: kivra-sync
    oidc:
      enabled: true
      callbackUrls:
        - https://kivra-sync.infra.home/oauth2/callback
      scopes:
        - openid
        - profile
        - email
        - groups
      groupRestriction:
        allowedGroups:
          - infra_users
          - administrators
    valuesFile: values.yaml
  - name: kivra-sync-oauth2
    namespace: kivra-sync
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    syncWave: "3"
    valuesFile: oauth2-proxy.values.yaml
extras:
  kivra-sync:
    enabled: true
