# homepage-public — public static service directory at apps.3rr.dev

image:
  tag: v2.4.0@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "apps.3rr.dev"

ingress:
  main:
    enabled: false

# This instance has no Kubernetes integration or in-cluster credentials.
enableRbac: false
serviceAccount:
  create: false
automountServiceAccountToken: false
enableServiceLinks: false

configMaps:
  custom-css:
    enabled: true
    data:
      custom.css: |
        #footer {
          display: none !important;
        }

persistence:
  custom-css:
    enabled: true
    type: configMap
    name: homepage-public-custom-css
    mountPath: /app/config/custom.css
    subPath: custom.css
    readOnly: true

config:
  kubernetes:
    mode: disable

  services:
    - Services:
        - Forgejo:
            href: https://forgejo.3rr.dev
            description: Git hosting
            icon: forgejo.png
        - Pocket ID:
            href: https://auth.3rr.dev
            description: Identity and passkeys
            icon: pocket-id.png
        - CyberChef:
            href: https://cyberchef.3rr.dev
            description: Data transform workbench
            icon: cyberchef.png

  bookmarks: []
  widgets: []

  settings:
    title: Apps
    theme: dark
    color: slate
    headerStyle: clean
    hideVersion: true
    statusStyle: dot
    cardBlur: sm
    background:
      image: https://raw.githubusercontent.com/arch-err/Cluster-Config/main/kubernetes/services/homepage/assets/mono-dark-distortion-2-green-2560.webp
      blur: sm
      opacity: 80
      brightness: 60

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
