# homepage-public — public static service directory at apps.3rr.dev

image:
  tag: v2.4.0@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "apps.3rr.dev"

ingress:
  main:
    enabled: false

# This instance has no Kubernetes integration or in-cluster credentials.
enableRbac: false
serviceAccount:
  create: false
automountServiceAccountToken: false
enableServiceLinks: false

# Homepage ships a statically generated default page. Revalidate it against the
# mounted config after the local server starts so first-time visitors do not see
# the image's sample services. This only calls the same container over loopback.
lifecycle:
  postStart:
    exec:
      command:
        - /bin/sh
        - -c
        - |
          attempts=0
          until wget -qO- http://127.0.0.1:3000/api/revalidate >/dev/null; do
            attempts=$((attempts + 1))
            [ "$attempts" -ge 60 ] && exit 1
            sleep 1
          done

configMaps:
  custom-css:
    enabled: true
    data:
      custom.css: |
        #footer {
          display: none !important;
        }

persistence:
  custom-css:
    enabled: true
    type: configMap
    name: homepage-public-custom-css
    mountPath: /app/config/custom.css
    subPath: custom.css
    readOnly: true
  tmp:
    enabled: true
    type: emptyDir
    mountPath: /tmp
  next-pages:
    enabled: true
    type: emptyDir
    mountPath: /app/.next/server/pages

# Next.js ISR rewrites the prerendered page. Seed only that writable directory
# from the image so the rest of the container filesystem can remain read-only.
initContainers:
  seed-next-pages:
    image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
    imagePullPolicy: IfNotPresent
    command:
      - /bin/sh
      - -c
      - cp -R /app/.next/server/pages/. /work/pages/
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    volumeMounts:
      - name: next-pages
        mountPath: /work/pages

probes:
  liveness:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /api/healthcheck
        port: 3000
        scheme: HTTP
        httpHeaders:
          - name: Host
            value: apps.3rr.dev
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
  readiness:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /api/healthcheck
        port: 3000
        scheme: HTTP
        httpHeaders:
          - name: Host
            value: apps.3rr.dev
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
  startup:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /api/healthcheck
        port: 3000
        scheme: HTTP
        httpHeaders:
          - name: Host
            value: apps.3rr.dev
      periodSeconds: 5
      timeoutSeconds: 1
      failureThreshold: 30

config:
  kubernetes:
    mode: disable

  services:
    - Services:
        - Forgejo:
            href: https://forgejo.3rr.dev
            target: _self
            description: Git hosting
            icon: forgejo.png
        - Pocket ID:
            href: https://auth.3rr.dev
            target: _self
            description: Identity and passkeys
            icon: pocket-id.png
        - CyberChef:
            href: https://cyberchef.3rr.dev
            target: _self
            description: Data transform workbench
            icon: cyberchef.png

    - MyrCTF 2026:
        - Grafana:
            href: https://myrctf-grafana.3rr.dev
            target: _self
            description: Public CTF monitoring
            icon: grafana.png
            widget:
              # The built-in Grafana widget requires server-admin credentials.
              # Only expose Grafana's already-public, unauthenticated health API.
              type: customapi
              url: http://myrctf-grafana.myrctf-monitoring.svc.cluster.local:80/api/health
              refreshInterval: 300000
              mappings:
                - field: database
                  label: Database
                - field: version
                  label: Version
        - CTFd:
            href: https://ctf.myriaden.se
            target: _self
            description: MyrCTF competition platform
            icon: https://avatars.githubusercontent.com/u/201907573?s=200&v=4
        - GitHub:
            href: https://github.com/MyrCTFO
            target: _self
            description: MyrCTF organization
            icon: github.png

  bookmarks: []
  widgets: []

  settings:
    title: Apps
    theme: dark
    color: slate
    target: _self
    headerStyle: clean
    hideVersion: true
    disableUpdateCheck: true
    statusStyle: dot
    cardBlur: sm
    background:
      image: https://raw.githubusercontent.com/arch-err/Cluster-Config/main/kubernetes/services/homepage/assets/mono-dark-distortion-2-green-2560.webp
      blur: sm
      opacity: 80
      brightness: 60

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
