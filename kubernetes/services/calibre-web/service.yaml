owner: apps
enabled: true
components:
  - name: calibre-web
    namespace: calibre-web
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"
    route:
      hostname: calibre.apps.home
      gateway: apps
      service: oauth2-calibre-web
      port: 80
      timeout: 30m
      dashboard:
        name: Calibre
        group: Media
        icon: calibre-web.svg
        description: Ebook library (CWA)
        app: calibre-web
    oidc:
      enabled: true
      callbackUrls:
        - https://calibre.apps.home/oauth2/callback
      scopes:
        - openid
        - profile
        - email
        - groups
      groupRestriction:
        allowedGroups:
          - apps_users
          - administrators
    valuesFile: values.yaml
  - name: calibre-web-oauth2
    namespace: calibre-web
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    syncWave: "3"
    valuesFile: oauth2-proxy.values.yaml
extras:
  calibre-web:
    enabled: true
