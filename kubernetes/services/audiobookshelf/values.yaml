# audiobookshelf — chart: bjw-s/app-template v4.6.2 (generic container wrapper)
# Audiobooks + podcasts. Self-hosted. Upstream: https://www.audiobookshelf.org/
# Image: docker.io/advplyr/audiobookshelf — runs as uid 1000 (`node`),
# restricted-PSS clean (verified live: runAsNonRoot, drop ALL caps, RuntimeDefault).
#
# Hostname: https://audiobookshelf.apps.home
# OIDC client_id: audiobookshelf (Secret: audiobookshelf-oidc-client)
#
# Note: the component name in apps.yaml is still `audiobookshelf-v2` (locks
# the namespace / deployment / PVCs / ArgoCD app to legacy names — renaming
# would force a destructive PVC recreate). The clean prod names live on the
# user-facing surfaces only (hostname + OIDC client_id, via oidc.clientId).
#
# ─────────────────────────────────────────────────────────────────────────────
# CHART MIGRATION (2026-05-07): christianhuth/audiobookshelf v2.2.0 → bjw-s
# /app-template v4.6.2.
#
# WHY: christianhuth's chart silently ignores `extraEnv` / `extraVolumes` —
# zero references in templates despite advertising the keys in values.yaml.
# That blocked mounting `home-ca-bundle` (so OIDC discovery against
# https://auth.apps.home failed cert verification) AND broke even the
# fallback `NODE_TLS_REJECT_UNAUTHORIZED=0` hack. bjw-s/app-template's
# generic wrapper exposes everything we need (env, persistence types, raw
# container securityContext) without chart middleware.
#
# CONFIG/METADATA/BACKUP PVCS WIPED on migration (user-authorized). The
# previous chart's PVCs (`audiobookshelf-v2-config`, `-metadata`, `-backup`)
# were deleted as part of the cutover; this chart provisions fresh ones via
# the standard persistence: blocks below. The shared `media-library` PVC
# (RWX kadalu, bound to static PV `audiobookshelf-v2-media-library` — same
# subvol as readarr/qbittorrent) is REUSED via existingClaim — books +
# podcasts data survive intact.
#
# WHAT THE USER LOSES + MUST RE-DO IN UI AFTER THIS LANDS:
#   - Admin user (gone with /config sqlite). Open the UI → create root user.
#   - OIDC settings — paste from `audiobookshelf-oidc-client` Secret in
#     this ns:
#       Issuer URL  = stringData/issuer_url   (https://auth.apps.home/.well-known/openid-configuration)
#       Client ID   = stringData/client_id    (audiobookshelf)
#       Client Sec. = stringData/client_secret
#     Auto-discovery NOW WORKS (NODE_EXTRA_CA_CERTS resolves the home-ca
#     chain). Toggle "Match existing users by email", scopes
#     `openid profile email groups`.
#   - Libraries:
#       Books     → /library/library
#       Podcasts  → /library/_podcasts (see PODCASTS section below)
#   - ntfy webhook for podcast episodes (see step 4 of PODCASTS checklist).
#
# Once the user has done the above, none of the prior automated OIDC seed
# Job behaviour is needed — the seed Job lives in extras and is parked /
# disabled separately (out of scope for this migration).
# ─────────────────────────────────────────────────────────────────────────────
#
# ─────────────────────────────────────────────────────────────────────────────
# PODCASTS LIBRARY — manual UI setup (re-doc after migration)
# ─────────────────────────────────────────────────────────────────────────────
# Podcasts live at `/library/_podcasts/` — a SUBDIR of the same shared
# media-library kadalu volume mounted at /library. Leading underscore makes
# it sort to the top in the UI and makes readarr ignore it. **No separate
# `/podcasts` mount** — by design, single shared 1500Gi kadalu subvol w/
# subdir convention; storage isolation between books and podcasts is
# theoretical when both are on the same backing PV.
#
# UI CHECKLIST (do once after this commit lands; re-do if rebuilt):
#   1. Settings → Libraries → New
#        Name: `Podcasts`
#        Media type: `Podcasts`
#        Folder path: `/library/_podcasts`
#   2. Open the new lib's settings → set
#        `Max Episodes To Keep` = `15`
#   3. Settings → Schedules
#        `Check for new podcast episodes every` = `6h` (cron `0 */6 * * *`).
#   4. Settings → Notifications → New webhook
#        URL: `https://ntfy.apps.home/podcasts`
#        Method: POST
#        Content-Type: `text/plain`
#        Trigger event: `onPodcastEpisodeDownloaded`
#        Body template:
#          `New episode: {{episodeDownload.episodeDisplayTitle}} — {{episodeDownload.podcastTitle}}`
#   5. Settings → Item Metadata
#        Search source: leave default `iTunes`. Flip to `Podcast Index` if
#        niche shows aren't found.
# ─────────────────────────────────────────────────────────────────────────────

controllers:
  main:
    # sqlite in /config on kadalu.replica2 — Recreate avoids old/new pod
    # racing on the same db file during rollout (mirrors grafana fix).
    strategy: Recreate
    containers:
      app:
        image:
          repository: docker.io/advplyr/audiobookshelf
          tag: "2.34.0"
        env:
          # ABS / Node native CA injection. With trust-manager broadcasting
          # `home-ca-bundle` into every ns and the configMap mounted at
          # /etc/ssl/home-ca below, Node's TLS stack reads ca.crt at startup
          # and trusts pocket-id at https://auth.apps.home for OIDC
          # discovery + token + userinfo. Replaces the old
          # NODE_TLS_REJECT_UNAUTHORIZED=0 hack (which the previous chart
          # silently dropped anyway).
          NODE_EXTRA_CA_CERTS: /etc/ssl/home-ca/ca.crt
          # ABS listens on :8080.
          PORT: "8080"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8080
              initialDelaySeconds: 30
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8080
              initialDelaySeconds: 10
              periodSeconds: 15
          startup:
            enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        # Restricted-PSS clean. The advplyr/audiobookshelf:2.34.0 image runs
        # as uid 1000 (`node`) by default. Lock down explicitly.
        # readOnlyRootFilesystem=true matches the previous chart's posture
        # (verified live); ABS only writes to /config /metadata /backups
        # /library /tmp — all explicit volumes below.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault

# fsGroup for the chart-managed PVCs so uid 1000 can write into them on
# first create. media-library is a static PV (RWX); its mount-time perms
# are governed by the kadalu CSI subvol bits, already 0777 (verified live).
#
# hostAliases — workaround for Alpine/musl getaddrinfo + CoreDNS quirk:
# CoreDNS's `template ANY A apps.home` synthesizes auth.apps.home →
# 10.10.10.200 but `fallthrough` lets the `kubernetes` plugin emit a
# trailing NXDOMAIN; musl's getaddrinfo (which Node 20 uses for both
# `dns.lookup` and `undici` fetch) sees the NXDOMAIN and ignores the
# answer. Result: ABS's Node `fetch()` calls to https://auth.apps.home
# fail ENOTFOUND despite glibc-based apps (paperless/python) succeeding.
# Hardcoding /etc/hosts via hostAliases sidesteps the resolver entirely.
# 10.10.10.200 = apps gateway VIP, what the CoreDNS template would have
# returned anyway.
defaultPodOptions:
  hostAliases:
    - ip: 10.10.10.200
      hostnames:
        - auth.apps.home
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  main:
    controller: main
    ports:
      http:
        port: 8080
        targetPort: 8080

# RECLAIM: PVs patched to Retain on 2026-05-17 — see docs/pvc-reclaim-policy.md
persistence:
  # ABS sqlite + ffmpeg/ffprobe binaries live here. Small.
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: local-bulk
    advancedMounts:
      main:
        app:
          - path: /config
  # Cover art, RSS caches, log files, transcoder streams. Grew slowly on
  # the previous install — 5Gi is comfortable.
  metadata:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: local-bulk
    advancedMounts:
      main:
        app:
          - path: /metadata
  # ABS in-app DB backups (separate from k8s-level backups, which are not a
  # thing yet for this cluster). 5Gi keeps ~weeks of zipped sqlite dumps.
  backup:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: local-bulk
    advancedMounts:
      main:
        app:
          - path: /backups
  # Shared kadalu media-library — static RWX PV bound to the existing
  # `media-library` PVC in this ns (provisioned by extras.audiobookshelf-v2
  # block; subvol/ar/lb/media-library on hostvol replica2 — SAME backing
  # data as readarr/qbittorrent in arr ns). DO NOT touch this PVC during
  # chart migration; existingClaim re-uses it as-is.
  library:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-library
    advancedMounts:
      main:
        app:
          - path: /library
  # readOnlyRootFilesystem=true → ABS needs a writable /tmp for transcoder
  # work files + scratch.
  tmp:
    type: emptyDir
    advancedMounts:
      main:
        app:
          - path: /tmp
  # home-ca trust bundle, broadcast by trust-manager into every ns as the
  # `home-ca-bundle` ConfigMap (key: ca.crt — verified live). Read-only
  # mount at /etc/ssl/home-ca; NODE_EXTRA_CA_CERTS env above points at the
  # ca.crt file so Node's TLS stack picks it up at startup. This is what
  # makes OIDC discovery against https://auth.apps.home succeed without
  # disabling cert verification.
  home-ca:
    enabled: true
    type: configMap
    name: home-ca-bundle
    advancedMounts:
      main:
        app:
          - path: /etc/ssl/home-ca
            readOnly: true
