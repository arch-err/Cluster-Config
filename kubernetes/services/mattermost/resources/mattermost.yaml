{{- if .Values.extras.mattermost }}
{{- $mm := .Values.extras.mattermost }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: mattermost
  labels:
    # baseline — file-PVC chown init needs runAsUser=0 on Kadalu.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Mattermost file storage — uploads/avatars + on-disk config.json (two subPath
# mounts off this one claim). CRITICAL user data: Retain SC so a component-
# removal prune does NOT wipe the underlying brick.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mattermost-data
  namespace: mattermost
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: kadalu.replica2-retain
  resources:
    requests:
      storage: {{ $mm.dataSize | default "20Gi" }}
{{- end }}
