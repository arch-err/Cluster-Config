{{- if .Values.extras.mosquitto }}
---
# mqtt namespace — default restricted PSS. eclipse-mosquitto 2.x runs as
# non-root uid 1883 and only writes to /mosquitto/data + /log (explicit
# volumes), so restricted is clean (no baseline flip needed). Holds the
# mosquitto broker + its mosquitto-auth Secret (password file).
apiVersion: v1
kind: Namespace
metadata:
  name: mqtt
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}
