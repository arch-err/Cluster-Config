apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
    name: mosquitto-auth
    namespace: mqtt
spec:
    secretTemplates:
        # The mosquitto password file (PBKDF2 $7$ hashes, mosquitto_passwd format).
        # Mounted read-only at /mosquitto/config/passwd in the broker pod;
        # referenced by `password_file` in mosquitto.conf. Two users:
        #   zigbee2mqtt   — the Z2M radio bridge
        #   homeassistant — HA's MQTT integration
        # The matching plaintext client passwords live in per-consumer-ns
        # SopsSecrets (mqtt-client in zigbee2mqtt + home-assistant ns) since a
        # Secret can only be consumed from its own namespace.
