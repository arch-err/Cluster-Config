# Matrix Synapse — S.T.A.R. Labs Comms
# Chart: halkeye/synapse

# Single instance — no workers
replicaCounts:
  master: 1
  generic_worker: 0
  federation_sender: 0

# Use latest Synapse image (chart default v1.111.0 is too old for sliding sync)
image:
  tag: latest

# Disable chart ingress — Gateway API handles TLS
ingress:
  enabled: false

# Skip extra python modules — they require pip/apt at build time
extra_python_modules: []

# Persistence for Synapse data + sqlite db
# RECLAIM: PVs patched to Retain on 2026-05-17 — see docs/pvc-reclaim-policy.md
persistence:
  enabled: true
  storageClassName: kadalu.replica2
  accessModes:
    - ReadWriteOnce
  size: 5Gi

# SQLite — no external DB needed for homelab scale
database:
  mode: sqlite

# Disable subcharts
postgresql:
  enabled: false

redis:
  enabled: false

# Synapse settings
settings:
  uid: "991"
  gid: "991"
  report_stats: "no"

# Homeserver configuration
homeserver:
  send_federation: true
  instance_map: {}
  federation_sender_instances: []
  outbound_federation_restricted_to: []

  redis:
    enabled: false

  server_name: "matrix.apps.home"
  public_baseurl: "https://matrix.apps.home/"
  serve_client_wellknown: true

  enable_registration: true
  enable_registration_without_verification: true

  registration_shared_secret: "speed-force-9000"

  suppress_key_server_warning: true

  app_service_config_files:
    - /data/hookshot-registration.yml

  experimental_features:
    msc3575_enabled: true

  listeners:
    - port: 8008
      tls: false
      type: http
      x_forwarded: true
      resources:
        - names: [client, federation]
          compress: false

# Hookshot appservice registration — mounted as /data/hookshot-registration.yml
extraConfigs:
  hookshot-registration.yml:
    id: matrix-hookshot
    as_token: "38d1239056de14d9de8f41ef0a1b9ba47cd5487e28bfb3c147458ae2d7fca14a"
    hs_token: "1c3385bc0a7329fa419a4b887a5ceb70a2b5f39a19742aa84a10f1679129bbd5"
    url: "http://hookshot:9993"
    sender_localpart: hookshot
    rate_limited: false
    namespaces:
      users:
        - regex: "@_hookshot_.*:matrix\\.apps\\.home"
          exclusive: true
      rooms: []
      aliases: []
