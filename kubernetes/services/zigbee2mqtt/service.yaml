owner: apps
enabled: false
components:
  - name: zigbee2mqtt
    namespace: zigbee2mqtt
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"
    route:
      hostname: zigbee2mqtt.infra.home
      gateway: infra
      service: oauth2-zigbee2mqtt
      port: 80
      dashboard:
        enabled: true
        name: Zigbee2MQTT
        group: Home
        icon: zigbee2mqtt.svg
        description: Zigbee coordinator bridge (ConBee II)
        app: zigbee2mqtt
    oidc:
      enabled: true
      callbackUrls:
        - https://zigbee2mqtt.infra.home/oauth2/callback
      scopes:
        - openid
        - profile
        - email
        - groups
      groupRestriction:
        allowedGroups:
          - infra_users
          - administrators
    valuesFile: values.yaml
  - name: zigbee2mqtt-oauth2
    namespace: zigbee2mqtt
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    syncWave: "3"
    valuesFile: oauth2-proxy.values.yaml
extras:
  zigbee2mqtt:
    enabled: true
    dataSize: 1Gi
