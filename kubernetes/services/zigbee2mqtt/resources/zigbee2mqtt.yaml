{{- if .Values.extras.zigbee2mqtt }}
{{- $z2m := .Values.extras.zigbee2mqtt }}
---
# zigbee2mqtt namespace — baseline PSS. The koenkk/zigbee2mqtt image uses
# s6-overlay; /init starts as root to set up /app/data perms before dropping
# to the run user — restricted PSS rejects that init flow (same trade as
# calibre-web / home-assistant). The pod is NON-privileged; the ConBee dongle
# is injected by the generic-device-plugin via the devic.es/zigbee resource
# request, NOT via a privileged securityContext.
apiVersion: v1
kind: Namespace
metadata:
  name: zigbee2mqtt
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# zigbee2mqtt data PVC — holds the IRREPLACEABLE Zigbee network identity:
# coordinator_backup.json, the pan_id + network key, and every device
# pairing. Losing it = re-pair every device + re-key the mesh. CRITICAL-tier
# → kadalu.replica2-retain SC so an ArgoCD prune (component removed from
# apps.yaml) leaves the underlying brick intact (Retain reclaim).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt-data
  namespace: zigbee2mqtt
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: kadalu.replica2-retain
  resources:
    requests:
      storage: {{ $z2m.dataSize | default "1Gi" }}
{{- end }}
