{{- if .Values.extras.booklore }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: booklore
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Bridged kadalu PV — points at the same subvol the calibre-web
# `calibre-library` PVC is bound to. Kadalu's static CSI accepts multiple
# PVs per subvol so this co-exists with the dynamically-provisioned PV
# already attached to calibre-web. RWX so the same backing data can be
# read by both apps' pods on any node.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: booklore-calibre-library
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  capacity:
    storage: {{ .Values.extras.booklore.librarySize | default "50Gi" }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /var/mnt/bulk/calibre-library
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [node-2]
  claimRef:
    name: booklore-calibre-library
    namespace: booklore
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booklore-calibre-library
  namespace: booklore
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ .Values.extras.booklore.librarySize | default "50Gi" }}
  volumeName: booklore-calibre-library
---
# Booklore app-data PVC — booklore's own state (settings, processed files;
# the metadata DB lives in MariaDB below, not here). CRITICAL — Retain SC.
# Pre-rendered here instead of chart-provisioned because bjw-s app-template
# v4.6.2's persistence schema rejects storageClassName at top level.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booklore-data
  namespace: booklore
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-bulk
  resources:
    requests:
      storage: {{ .Values.extras.booklore.dataSize | default "2Gi" }}
---
# MariaDB data PVC — booklore's metadata store. CRITICAL-tier (catalog
# state + smart-shelf rules + per-user reading progress). Retain SC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booklore-mariadb
  namespace: booklore
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-bulk
  resources:
    requests:
      storage: {{ .Values.extras.booklore.mariadbSize | default "5Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: booklore-mariadb
  namespace: booklore
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: booklore-mariadb
  ports:
    - name: mariadb
      port: 3306
      targetPort: 3306
---
# MariaDB Deployment — mirrors immich-postgres pattern: chown init container
# (kadalu PVCs come root-owned; fsGroup alone isn't enough for mariadb's
# strict dir-mode checks) + non-root mariadb runtime (uid 999 per mariadb
# Dockerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booklore-mariadb
  namespace: booklore
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: booklore-mariadb
  template:
    metadata:
      labels:
        app: booklore-mariadb
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        - name: chown-data
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/mysql
              chown -R 999:999 /var/lib/mysql
              chmod 700 /var/lib/mysql
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      containers:
        - name: mariadb
          image: docker.io/library/mariadb:11.4.5
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: mariadb
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: booklore
            - name: MARIADB_USER
              value: booklore
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: booklore-db
                  key: DB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: booklore-db
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          # First-boot mariadb-install-db on kadalu storage takes ~2-3 min.
          # `healthcheck.sh --connect` requires an unauthenticated `mysql`
          # user, which MariaDB 11.4 no longer creates by default → use a
          # tcpSocket probe (mariadbd binds 3306 only after init finishes).
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: booklore-mariadb
---
# media-library — additional static kadalu PV/PVC pair pointing at the SAME
# subvol path the arr stack / audiobookshelf-v2 / metube / jellyfin /
# navidrome twin PVs use (extras.arr → subvol/ar/lb/media-library). Kadalu
# supports multi-PV-per-subvol; this is just one more sibling. Booklore
# mounts it with subPath=books-j and subPath=books-e (see
# values/apps/booklore.yaml) so per-user ebook folders land under the same
# tree ABS already uses for audiobooks.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: booklore-media-library
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  capacity:
    storage: {{ .Values.extras.booklore.mediaLibrarySize | default "1500Gi" }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /var/mnt/bulk/media-library
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [node-2]
  claimRef:
    name: booklore-media-library
    namespace: booklore
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booklore-media-library
  namespace: booklore
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ .Values.extras.booklore.mediaLibrarySize | default "1500Gi" }}
  volumeName: booklore-media-library
{{- end }}
