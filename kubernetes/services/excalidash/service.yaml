owner: apps
enabled: true
components:
  - name: excalidash
    namespace: excalidash
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    route:
      hostname: excalidash.apps.home
      gateway: apps
      service: excalidash
      port: 80
      dashboard:
        group: Tools
        icon: excalidraw.svg
        description: Excalidraw dashboard + collab
        app: excalidash
    oidc:
      enabled: true
      callbackUrls:
        - https://excalidash.apps.home/api/auth/oidc/callback
      scopes:
        - openid
        - profile
        - email
        - groups
      groupRestriction:
        allowedGroups:
          - apps_users
          - administrators
    valuesFile: values.yaml
