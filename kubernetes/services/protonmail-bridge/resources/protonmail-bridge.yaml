{{- if index .Values.extras "protonmail-bridge" }}
---
# protonmail-bridge namespace — baseline PSS because the headless Bridge image
# stores its profile under /root. The namespace is still internal-only: ingress
# is locked down by default and opened explicitly for consumers (n8n later) once
# their namespace/labels are known.
apiVersion: v1
kind: Namespace
metadata:
  name: protonmail-bridge
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: protonmail-bridge
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
{{- end }}
