{{- if .Values.extras.navidrome }}
{{- $nd := .Values.extras.navidrome }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: navidrome
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# media-library — static node-local PV/PVC alias pointing at the shared media
# directory on Disk B. Sibling applications receive their own PV/PVC objects
# backed by this same path because claims cannot cross namespaces.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-media-library
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  capacity:
    storage: {{ $nd.librarySize | default "1500Gi" }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /var/mnt/bulk/media-library
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [node-2]
  claimRef:
    name: media-library
    namespace: navidrome
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: navidrome
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ $nd.librarySize | default "1500Gi" }}
  volumeName: navidrome-media-library
{{- end }}
