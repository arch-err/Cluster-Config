owner: apps
enabled: true
components:
  - name: navidrome
    namespace: navidrome
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "3"
    route:
      hostname: navidrome.apps.home
      gateway: apps
      service: oauth2-navidrome
      port: 80
      timeout: 30m
      dashboard:
        name: Navidrome
        group: Media
        icon: navidrome.svg
        description: Music server (Subsonic API)
        app: navidrome
    oidc:
      enabled: true
      callbackUrls:
        - https://navidrome.apps.home/oauth2/callback
      scopes:
        - openid
        - profile
        - email
        - groups
      groupRestriction:
        allowedGroups:
          - apps_users
          - administrators
    valuesFile: values.yaml
  - name: navidrome-oauth2
    namespace: navidrome
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    syncWave: "3"
    valuesFile: oauth2-proxy.values.yaml
extras:
  navidrome:
    librarySize: 1500Gi
