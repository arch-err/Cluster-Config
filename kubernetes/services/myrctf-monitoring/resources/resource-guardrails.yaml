apiVersion: v1
kind: LimitRange
metadata:
  name: myrctf-monitoring-defaults
  namespace: myrctf-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "2"
        memory: 2Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: myrctf-monitoring-guardrails
  namespace: myrctf-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hard:
    # Allows a controlled rolling replacement while preventing an accidental
    # values change from consuming the cluster without Git review.
    count/pods: "20"
    count/services: "20"
    count/secrets: "50"
    count/configmaps: "30"
    persistentvolumeclaims: "8"
    requests.storage: 120Gi
    requests.cpu: "3"
    requests.memory: 5Gi
    limits.cpu: "6"
    limits.memory: 8Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
