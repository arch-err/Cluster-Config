apiVersion: v1
kind: ConfigMap
metadata:
  name: myrctf-cockpit-dashboards
  namespace: myrctf-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  pipeline-health.json: |-
    {"uid":"ctfd-pipeline","title":"Pipeline health","tags":["myrctf","cockpit"],"timezone":"utc","schemaVersion":39,"refresh":"15s","time":{"from":"now-6h","to":"now"},"panels":[{"id":1,"type":"stat","title":"Replication lag","datasource":{"type":"prometheus","uid":"myrctf-mimir"},"targets":[{"refId":"A","expr":"max(ctfd_cockpit_ingest_replication_lag_seconds)"}],"fieldConfig":{"defaults":{"unit":"s"}},"gridPos":{"x":0,"y":0,"w":6,"h":5}},{"id":2,"type":"stat","title":"Last successful ingest","datasource":{"type":"prometheus","uid":"myrctf-mimir"},"targets":[{"refId":"A","expr":"max(ctfd_cockpit_ingest_last_success_timestamp_seconds)"}],"fieldConfig":{"defaults":{"unit":"dateTimeFromNow"}},"gridPos":{"x":6,"y":0,"w":6,"h":5}},{"id":3,"type":"timeseries","title":"Accepted and rejected batches","datasource":{"type":"prometheus","uid":"myrctf-mimir"},"targets":[{"refId":"A","expr":"sum by (endpoint) (rate(ctfd_cockpit_ingest_requests_total[5m]))","legendFormat":"accepted"},{"refId":"B","expr":"sum(rate(ctfd_cockpit_ingest_rejected_batches_total[5m]))","legendFormat":"rejected"}],"gridPos":{"x":0,"y":5,"w":12,"h":8}},{"id":4,"type":"table","title":"Durable checkpoints","datasource":{"type":"postgres","uid":"ctfd-cockpit-postgres"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT source, entity, checkpoint, last_source_timestamp, last_ingested_at FROM cockpit.ctfd_sync_state ORDER BY source, entity"}],"gridPos":{"x":12,"y":0,"w":12,"h":13}}]}
  live-submissions.json: |-
    {"uid":"ctfd-live-submissions","title":"Live submission feed","tags":["myrctf","cockpit","sensitive"],"timezone":"utc","schemaVersion":39,"refresh":"5s","time":{"from":"now-1h","to":"now"},"panels":[{"id":1,"type":"table","title":"Submissions (sensitive)","datasource":{"type":"postgres","uid":"ctfd-cockpit-postgres"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT submitted_at AS time, submission_id, result, attempted_value, username, team_name, challenge_name, source_ip, points FROM cockpit.live_submission_feed WHERE $__timeFilter(submitted_at) ORDER BY submitted_at DESC LIMIT 500"}],"options":{"showHeader":true},"gridPos":{"x":0,"y":0,"w":24,"h":18}}]}
  users-teams.json: |-
    {"uid":"ctfd-users-teams","title":"User and team lookup","tags":["myrctf","cockpit","sensitive"],"timezone":"utc","schemaVersion":39,"refresh":"30s","time":{"from":"now-30d","to":"now"},"templating":{"list":[{"name":"search","type":"textbox","label":"Name/email contains","query":"","current":{"text":"","value":""}}]},"panels":[{"id":1,"type":"table","title":"Users","datasource":{"type":"postgres","uid":"ctfd-cockpit-postgres"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT source_id AS user_id, username, email, team_id, verified, hidden, banned, registered_at, payload->>'affiliation' AS affiliation, payload->'fields' AS custom_fields FROM cockpit.ctfd_users WHERE deleted_at IS NULL AND (username ILIKE '%' || ${search:sqlstring} || '%' OR email ILIKE '%' || ${search:sqlstring} || '%') ORDER BY source_id LIMIT 500"}],"gridPos":{"x":0,"y":0,"w":24,"h":9}},{"id":2,"type":"table","title":"Teams","datasource":{"type":"postgres","uid":"ctfd-cockpit-postgres"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT source_id AS team_id, name, email, hidden, banned, registered_at, payload->>'affiliation' AS affiliation FROM cockpit.ctfd_teams WHERE deleted_at IS NULL AND (name ILIKE '%' || ${search:sqlstring} || '%' OR email ILIKE '%' || ${search:sqlstring} || '%') ORDER BY source_id LIMIT 500"}],"gridPos":{"x":0,"y":9,"w":24,"h":9}}]}
  challenges.json: |-
    {"uid":"ctfd-challenges","title":"Challenge overview","tags":["myrctf","cockpit"],"timezone":"utc","schemaVersion":39,"refresh":"30s","time":{"from":"now-30d","to":"now"},"panels":[{"id":1,"type":"table","title":"Challenge funnel","datasource":{"type":"postgres","uid":"ctfd-cockpit-postgres"},"targets":[{"refId":"A","format":"table","rawSql":"SELECT c.source_id AS challenge_id, c.name, c.category, c.value, count(s.source_id) AS attempts, count(s.source_id) FILTER (WHERE lower(s.result) IN ('correct','solve')) AS correct, count(DISTINCT s.team_id) FILTER (WHERE lower(s.result) IN ('correct','solve')) AS solving_teams, round(count(s.source_id)::numeric / NULLIF(count(s.source_id) FILTER (WHERE lower(s.result) IN ('correct','solve')),0),2) AS attempts_per_solve, min(s.submitted_at) FILTER (WHERE lower(s.result) IN ('correct','solve')) AS first_solve_at FROM cockpit.ctfd_challenges c LEFT JOIN cockpit.ctfd_submissions s ON s.source=c.source AND s.challenge_id=c.source_id AND s.deleted_at IS NULL WHERE c.deleted_at IS NULL GROUP BY c.source_id,c.name,c.category,c.value ORDER BY c.category,c.name"}],"gridPos":{"x":0,"y":0,"w":24,"h":13}},{"id":2,"type":"timeseries","title":"Submissions by result","datasource":{"type":"postgres","uid":"ctfd-cockpit-postgres"},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT $__timeGroupAlias(submitted_at,'5m'), count(*) AS value, result AS metric FROM cockpit.ctfd_submissions WHERE deleted_at IS NULL AND $__timeFilter(submitted_at) GROUP BY 1,result ORDER BY 1"}],"gridPos":{"x":0,"y":13,"w":24,"h":8}}]}
