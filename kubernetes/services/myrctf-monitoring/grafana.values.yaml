fullnameOverride: myrctf-grafana

replicas: 1

admin:
  existingSecret: myrctf-grafana-admin
  userKey: admin-user
  passwordKey: admin-password

persistence:
  enabled: true
  storageClassName: local-path-retain
  accessModes: [ReadWriteOnce]
  size: 5Gi
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm

initChownData:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: [ALL]

envValueFrom:
  COCKPIT_DB_USER:
    secretKeyRef:
      name: ctfd-cockpit-grafana-db
      key: username
  COCKPIT_DB_PASSWORD:
    secretKeyRef:
      name: ctfd-cockpit-grafana-db
      key: password

sidecar:
  dashboards:
    enabled: false
  datasources:
    enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: CTFd Cockpit
        uid: ctfd-cockpit-postgres
        type: postgres
        access: proxy
        url: ctfd-cockpit-db-r.myrctf-monitoring.svc.cluster.local:5432
        user: $__env{COCKPIT_DB_USER}
        isDefault: true
        editable: false
        jsonData:
          database: ctfd_cockpit
          sslmode: verify-full
          tlsConfigurationMethod: file-path
          sslRootCertFile: /etc/grafana/certs/postgres/ca.crt
          maxOpenConns: 10
          maxIdleConns: 2
          maxIdleConnsAuto: true
          connMaxLifetime: 300
          postgresVersion: 1600
          timescaledb: false
        secureJsonData:
          password: $__env{COCKPIT_DB_PASSWORD}
      - name: MyrCTF Mimir
        uid: myrctf-mimir
        type: prometheus
        access: proxy
        url: http://myrctf-mimir:8080/prometheus
        editable: false
        jsonData:
          httpHeaderName1: X-Scope-OrgID
          prometheusType: Mimir
          prometheusVersion: 2.17.3
        secureJsonData:
          httpHeaderValue1: myrctf-analytics
      - name: MyrCTF Loki
        uid: myrctf-loki
        type: loki
        access: proxy
        url: http://myrctf-loki:3100
        editable: false
        jsonData:
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: myrctf-operations
      - name: MyrCTF Tempo
        uid: myrctf-tempo
        type: tempo
        access: proxy
        url: http://myrctf-tempo:3200
        editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: ctfd-cockpit
        orgId: 1
        folder: CTFd Cockpit
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/ctfd-cockpit

dashboardsConfigMaps:
  ctfd-cockpit: myrctf-cockpit-dashboards

alerting:
  rules.yaml:
    apiVersion: 1
    groups:
      - orgId: 1
        name: CTFd Cockpit pipeline
        folder: CTFd Cockpit
        interval: 1m
        rules:
          - uid: cockpit-replication-lag
            title: CTFd Cockpit replication lag
            condition: C
            for: 5m
            noDataState: Alerting
            execErrState: Error
            annotations: {summary: "Cockpit replication lag exceeds five minutes"}
            data:
              - refId: A
                datasourceUid: myrctf-mimir
                relativeTimeRange: {from: 600, to: 0}
                model: {expr: "max(ctfd_cockpit_ingest_replication_lag_seconds) > 300", instant: true, refId: A}
              - refId: C
                datasourceUid: __expr__
                model: {type: threshold, expression: A, conditions: [{type: query, evaluator: {type: gt, params: [0]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}}], refId: C}
          - uid: cockpit-no-ingest
            title: No successful CTFd Cockpit ingestion
            condition: C
            for: 5m
            noDataState: Alerting
            execErrState: Error
            annotations: {summary: "No successful Cockpit batch in ten minutes"}
            data:
              - refId: A
                datasourceUid: myrctf-mimir
                relativeTimeRange: {from: 1200, to: 0}
                model: {expr: "time() - max(ctfd_cockpit_ingest_last_success_timestamp_seconds) > 600", instant: true, refId: A}
              - refId: C
                datasourceUid: __expr__
                model: {type: threshold, expression: A, conditions: [{type: query, evaluator: {type: gt, params: [0]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}}], refId: C}
          - uid: cockpit-rejected
            title: CTFd Cockpit rejected batches
            condition: C
            for: 0s
            noDataState: OK
            execErrState: Error
            annotations: {summary: "Cockpit rejected one or more batches"}
            data:
              - refId: A
                datasourceUid: myrctf-mimir
                relativeTimeRange: {from: 300, to: 0}
                model: {expr: "sum(increase(ctfd_cockpit_ingest_rejected_batches_total[5m])) > 0", instant: true, refId: A}
              - refId: C
                datasourceUid: __expr__
                model: {type: threshold, expression: A, conditions: [{type: query, evaluator: {type: gt, params: [0]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}}], refId: C}
          - uid: cockpit-postgres-down
            title: CTFd Cockpit PostgreSQL unavailable
            condition: C
            for: 2m
            noDataState: Alerting
            execErrState: Error
            annotations: {summary: "The Cockpit CNPG primary is unavailable"}
            data:
              - refId: A
                datasourceUid: myrctf-mimir
                relativeTimeRange: {from: 300, to: 0}
                model: {expr: "max(up{job=\"ctfd-cockpit-cnpg\"}) < 1", instant: true, refId: A}
              - refId: C
                datasourceUid: __expr__
                model: {type: threshold, expression: A, conditions: [{type: query, evaluator: {type: gt, params: [0]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}}], refId: C}
          - uid: cockpit-errors
            title: CTFd Cockpit ingestion error spike
            condition: C
            for: 3m
            noDataState: OK
            execErrState: Error
            annotations: {summary: "Cockpit database error rate exceeds 0.1/s"}
            data:
              - refId: A
                datasourceUid: myrctf-mimir
                relativeTimeRange: {from: 300, to: 0}
                model: {expr: "sum(rate(ctfd_cockpit_ingest_db_errors_total[5m])) > 0.1", instant: true, refId: A}
              - refId: C
                datasourceUid: __expr__
                model: {type: threshold, expression: A, conditions: [{type: query, evaluator: {type: gt, params: [0]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}}], refId: C}

extraSecretMounts:
  - name: myrctf-grafana-oidc
    secretName: myrctf-grafana-oidc
    defaultMode: 0440
    mountPath: /etc/secrets/oidc
    readOnly: true
  - name: ctfd-cockpit-postgres-ca
    secretName: ctfd-cockpit-db-ca
    defaultMode: 0440
    mountPath: /etc/grafana/certs/postgres
    readOnly: true

grafana.ini:
  server:
    domain: myrctf-grafana.3rr.dev
    root_url: https://myrctf-grafana.3rr.dev
    enforce_domain: true
  analytics:
    reporting_enabled: false
    check_for_updates: false
  security:
    disable_gravatar: true
  auth:
    disable_login_form: true
    oauth_auto_login: true
    oauth_allow_insecure_email_lookup: false
  auth.basic:
    enabled: false
  auth.anonymous:
    enabled: false
  auth.generic_oauth:
    enabled: true
    name: Pocket ID
    icon: signin
    allow_sign_up: true
    auto_login: true
    client_id: $__file{/etc/secrets/oidc/client_id}
    client_secret: $__file{/etc/secrets/oidc/client_secret}
    scopes: openid profile email groups
    email_attribute_name: "email:primary"
    groups_attribute_path: groups
    allowed_groups: myrctf-monitoring
    role_attribute_path: "contains(groups[*], 'myrctf-monitoring') && 'Admin' || 'None'"
    role_attribute_strict: true
    allow_assign_grafana_admin: false
    skip_org_role_sync: false
    use_pkce: true
    auth_url: https://auth.3rr.dev/authorize
    token_url: https://auth.3rr.dev/api/oidc/token
    api_url: https://auth.3rr.dev/api/oidc/userinfo

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

serviceAccount:
  automountServiceAccountToken: false

testFramework:
  enabled: false
