owner: apps
enabled: true
components:
  - name: papra
    namespace: papra
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    route:
      hostname: papra.apps.home
      gateway: apps
      service: papra
      port: 1221
      timeout: 30m
      dashboard:
        name: Papra
        group: Documents
        icon: papra.png
        description: Minimal document archive (OCR, plain-file storage)
        app: papra
    oidc:
      enabled: true
      callbackUrls:
        - https://papra.apps.home/api/auth/oauth2/callback/pocket-id
      scopes:
        - openid
        - profile
        - email
        - groups
      groupRestriction:
        allowedGroups:
          - apps_users
          - administrators
    valuesFile: values.yaml
