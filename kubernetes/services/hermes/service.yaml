owner: apps
enabled: false
components:
  - name: hermes-oauth2
    namespace: hermes
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    syncWave: "3"
    route:
      hostname: hermes.infra.home
      gateway: infra
      service: oauth2-hermes
      port: 80
      dashboard:
        enabled: true
        name: Hermes
        group: Tools
        icon: si-robotframework.svg
        description: Hermes Agent harness + dashboard (off-cluster)
        app: oauth2-hermes
    oidc:
      enabled: true
      clientId: hermes
      secretName: hermes-oidc-client
      callbackUrls:
        - https://hermes.infra.home/oauth2/callback
      scopes:
        - openid
        - profile
        - email
        - groups
      groupRestriction:
        allowedGroups:
          - infra_users
          - administrators
    valuesFile: oauth2-proxy.values.yaml
extras:
  hermes:
    enabled: true
    address: 10.10.10.160
    port: 9119
