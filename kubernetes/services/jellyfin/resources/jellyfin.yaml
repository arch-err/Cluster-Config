{{- if .Values.extras.jellyfin }}
{{- $jf := .Values.extras.jellyfin }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# media-library — static node-local PV/PVC alias pointing at the shared media
# directory on Disk B.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media-library
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  capacity:
    storage: {{ $jf.librarySize | default "1500Gi" }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /var/mnt/bulk/media-library
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [node-2]
  claimRef:
    name: media-library
    namespace: jellyfin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: jellyfin
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ $jf.librarySize | default "1500Gi" }}
  volumeName: jellyfin-media-library
{{- end }}
