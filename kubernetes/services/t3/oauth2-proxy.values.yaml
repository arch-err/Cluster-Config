# oauth2-proxy is the sole public gate for the off-cluster T3 web UI.
fullnameOverride: oauth2-t3

image:
  tag: "v7.15.2"

proxyVarsAsSecrets: false

config:
  clientID: ""
  clientSecret: ""
  cookieSecret: ""
  emailDomains: ["*"]

extraArgs:
  - --provider=oidc
  - --provider-display-name=Pocket ID
  - --skip-provider-button=true
  - --code-challenge-method=S256
  - --insecure-oidc-allow-unverified-email=true
  - --skip-oidc-discovery=false
  - --http-address=0.0.0.0:4180
  - --reverse-proxy=true
  - --real-client-ip-header=X-Forwarded-For
  - --upstream=http://t3-backend.t3.svc.cluster.local:3773
  - --proxy-websockets=true
  - --flush-interval=-1s
  - --cookie-domain=t3.infra.home
  - --cookie-secure=true
  - --cookie-samesite=lax
  - --cookie-name=_t3_oauth2_proxy
  - --allowed-group=infra_users
  - --allowed-group=administrators
  - --pass-user-headers=true
  - --set-xauthrequest=true
  - --pass-access-token=false
  - --email-domain=*
  - --provider-ca-file=/etc/ssl/home-ca/ca.crt

extraEnv:
  - name: OAUTH2_PROXY_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: t3-oidc-client
        key: client_id
  - name: OAUTH2_PROXY_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: t3-oidc-client
        key: client_secret
  - name: OAUTH2_PROXY_OIDC_ISSUER_URL
    valueFrom:
      secretKeyRef:
        name: t3-oidc-client
        key: issuer_url
  - name: OAUTH2_PROXY_COOKIE_SECRET
    valueFrom:
      secretKeyRef:
        name: t3-oauth2-cookie
        key: cookie-secret

extraVolumes:
  - name: home-ca
    configMap:
      name: home-ca-bundle
extraVolumeMounts:
  - name: home-ca
    mountPath: /etc/ssl/home-ca
    readOnly: true

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi

replicaCount: 1

podDisruptionBudget:
  enabled: false

gatewayApi:
  enabled: false
ingress:
  enabled: false
