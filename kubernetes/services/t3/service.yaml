owner: apps
enabled: false
components:
  - name: t3-oauth2
    namespace: t3
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    syncWave: "3"
    route:
      hostname: t3.infra.home
      gateway: infra
      service: oauth2-t3
      port: 80
      dashboard:
        enabled: true
        name: T3
        group: Tools
        icon: si-openaigym.svg
        description: T3 coding workspace (off-cluster)
        app: oauth2-t3
    oidc:
      enabled: true
      clientId: t3
      secretName: t3-oidc-client
      callbackUrls:
        - https://t3.infra.home/oauth2/callback
      scopes:
        - openid
        - profile
        - email
        - groups
      groupRestriction:
        allowedGroups:
          - infra_users
          - administrators
    valuesFile: oauth2-proxy.values.yaml
extras:
  t3:
    enabled: true
    address: 10.10.10.160
    port: 3773
