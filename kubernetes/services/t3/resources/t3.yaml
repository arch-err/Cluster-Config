{{- if .Values.extras.t3 }}
{{- $t3 := .Values.extras.t3 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: t3
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Selectorless Service backed by the manually-managed EndpointSlice below.
apiVersion: v1
kind: Service
metadata:
  name: t3-backend
  namespace: t3
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $t3.port | default 3773 }}
      targetPort: {{ $t3.port | default 3773 }}
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: t3-backend
  namespace: t3
  labels:
    kubernetes.io/service-name: t3-backend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
addressType: IPv4
endpoints:
  - addresses:
      - {{ $t3.address | default "10.10.10.160" }}
    conditions:
      ready: true
ports:
  - name: http
    port: {{ $t3.port | default 3773 }}
    protocol: TCP
{{- end }}
