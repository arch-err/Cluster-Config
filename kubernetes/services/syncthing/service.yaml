owner: apps
enabled: false
components:
  - name: syncthing
    namespace: syncthing
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    route:
      hostname: syncthing.apps.home
      gateway: apps
      service: oauth2-syncthing
      port: 80
      dashboard:
        name: Syncthing
        group: Files
        icon: syncthing.svg
        description: Continuous file sync (admin UI)
        app: syncthing
    oidc:
      enabled: true
      callbackUrls:
        - https://syncthing.apps.home/oauth2/callback
      scopes:
        - openid
        - profile
        - email
        - groups
      groupRestriction:
        allowedGroups:
          - apps_users
          - administrators
    valuesFile: values.yaml
  - name: syncthing-oauth2
    namespace: syncthing
    chart:
      repo: https://oauth2-proxy.github.io/manifests
      name: oauth2-proxy
      version: 10.4.3
    valuesFile: oauth2-proxy.values.yaml
