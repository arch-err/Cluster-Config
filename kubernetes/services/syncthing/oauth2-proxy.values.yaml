# syncthing-oauth2 — chart: oauth2-proxy/oauth2-proxy v10.4.3
# Forward-auth proxy fronting syncthing's admin UI. Mirrors calibre-web-oauth2.
# Consumes `syncthing-oidc-client` (rendered by the syncthing Application's
# oidc:* block in apps.yaml; pocket-id client id=`syncthing`, restricted to
# apps_users + administrators at the IDP level on top of the oauth2-proxy
# --allowed-group flags below).
#
# Syncthing's native GUI auth is disabled (STGUIADDRESS=0.0.0.0:8384, no
# guiUser/guiPasswordHash) so this proxy is the ONLY gate to the admin UI.
# The sync protocol port (22000) bypasses this entirely — peers don't auth
# via OIDC, they auth via syncthing's own device IDs.
#
# COOKIE SECRET: sourced from SopsSecret `syncthing-oauth2-cookie` in the
# syncthing ns (kubernetes/secrets/apps/syncthing-oauth2-cookie.yaml).

fullnameOverride: oauth2-syncthing

image:
  tag: "v7.15.2"

proxyVarsAsSecrets: false

config:
  clientID: ""
  clientSecret: ""
  cookieSecret: ""
  emailDomains: ["*"]

extraArgs:
  - --provider=oidc
  - --provider-display-name=Pocket ID
  - --skip-provider-button=true
  - --code-challenge-method=S256
  - --insecure-oidc-allow-unverified-email=true
  - --skip-oidc-discovery=false
  - --http-address=0.0.0.0:4180
  - --reverse-proxy=true
  - --real-client-ip-header=X-Forwarded-For
  # Single upstream — syncthing admin UI in-cluster service (syncthing ns).
  # Service is named `syncthing-main` because bjw-s app-template suffixes
  # service names when >1 service is declared (we have main + sync NodePort).
  - --upstream=http://syncthing-main.syncthing.svc.cluster.local:8384
  - --cookie-domain=syncthing.apps.home
  - --cookie-secure=true
  - --cookie-samesite=lax
  - --cookie-name=_syncthing_oauth2_proxy
  - --allowed-group=apps_users
  - --allowed-group=administrators
  - --pass-user-headers=true
  - --set-xauthrequest=true
  - --pass-access-token=false
  - --email-domain=*
  - --provider-ca-file=/etc/ssl/home-ca/ca.crt

# OIDC creds from the platform-rendered Secret (syncthing Application's
# oidc:* block in apps.yaml).
extraEnv:
  - name: OAUTH2_PROXY_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: syncthing-oidc-client
        key: client_id
  - name: OAUTH2_PROXY_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: syncthing-oidc-client
        key: client_secret
  - name: OAUTH2_PROXY_OIDC_ISSUER_URL
    valueFrom:
      secretKeyRef:
        name: syncthing-oidc-client
        key: issuer_url
  - name: OAUTH2_PROXY_COOKIE_SECRET
    valueFrom:
      secretKeyRef:
        name: syncthing-oauth2-cookie
        key: cookie-secret

extraVolumes:
  - name: home-ca
    configMap:
      name: home-ca-bundle
extraVolumeMounts:
  - name: home-ca
    mountPath: /etc/ssl/home-ca
    readOnly: true

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi

replicaCount: 1

podDisruptionBudget:
  enabled: false

gatewayApi:
  enabled: false
ingress:
  enabled: false
