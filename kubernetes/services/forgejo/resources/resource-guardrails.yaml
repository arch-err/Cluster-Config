apiVersion: v1
kind: ResourceQuota
metadata:
  name: forgejo-guardrails
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  hard:
    # Leave headroom for a controlled rollout or recovery pod without letting
    # this Internet-facing namespace grow without an explicit Git change.
    count/pods: "8"
    count/services: "10"
    count/secrets: "40"
    count/configmaps: "20"
    persistentvolumeclaims: "4"
    requests.storage: 100Gi
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    # Public traffic must use the isolated Gateway; SSH must use local-git-mux.
    services.loadbalancers: "0"
    services.nodeports: "0"
