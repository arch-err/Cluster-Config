owner: apps
enabled: true
components:
  - name: forgejo
    namespace: forgejo
    chart:
      repo: code.forgejo.org/forgejo-helm
      name: forgejo
      version: "17.1.6"
    # Database and OIDC credentials must exist before the app initializes.
    syncWave: "12"
    valuesFile: values.yaml
    db:
      enabled: true
      version: "16"
      instances: 1
      inheritedLabels:
        public-edge.3rr.dev/profile: cnpg
      storage:
        size: 10Gi
        storageClass: local-bulk
    route:
      syncWave: "13"
      hostname: git.apps.home
      gateway: apps
      service: forgejo-http
      port: 3000
      dashboard:
        enabled: false
    oidc:
      enabled: true
      callbackUrls:
        - https://forgejo.3rr.dev/user/oauth2/pocket-id/callback
      scopes: [openid, profile, email, groups]
      groupRestriction:
        allowedGroups: [forgejo_users]
