owner: apps
enabled: false
components:
  - name: kanban
    namespace: kanban
    chart:
      repo: https://bjw-s-labs.github.io/helm-charts
      name: app-template
      version: 4.6.2
    syncWave: "4"
    db:
      enabled: true
      version: "16"
      instances: 1
      storage:
        size: 10Gi
        storageClass: kadalu.replica2-retain
    route:
      hostname: kanban.apps.home
      gateway: apps
      service: kanban
      port: 3000
      dashboard:
        name: Kanban
        group: Tools
        icon: si-trello.svg
        description: Kan / kan.bn project boards
        app: kanban
    oidc:
      enabled: true
      callbackUrls:
        - https://kanban.apps.home/api/auth/oauth2/callback/oidc
      scopes:
        - openid
        - profile
        - email
        - groups
      groupRestriction:
        allowedGroups:
          - apps_users
          - administrators
    valuesFile: values.yaml
extras:
  kanban:
    enabled: true
